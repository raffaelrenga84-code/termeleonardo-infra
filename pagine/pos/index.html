    c.oninput = () => { cerca = c.value; const pos = c.selectionStart; disegna(); const n = $('cerca'); n.focus(); n.setSelectionRange(pos, pos); };
    /* col fuoco sulla casella sparisce tutto tranne lei e i risultati; al
       fuoco perso si aspetta un attimo, cosi' il tocco su un articolo
       arriva prima che la pagina si riassesti sotto il dito */
    c.onfocus = () => { cercaFocus = true; const o = app.querySelector('.ordine'); if (o) o.classList.add('ricerca'); };
    c.onblur = () => { cercaFocus = false; setTimeout(() => { if (cercaFocus) return; const o = app.querySelector('.ordine'); if (o) o.classList.remove('ricerca'); }, 300); };
    const cercaVia = $('cercaVia');
    if (cercaVia) cercaVia.onclick = () => { cerca = ''; cercaFocus = false; disegna(); };
    /* tocco: l'articolo va sulla comanda. Tocco lungo: prezzo e
       disponibilita', per chi puo' (capo sala e amministrazione). Dopo un
       tocco lungo il dito che si alza non deve anche ordinare. */
    app.querySelectorAll('.articolo').forEach((b) => {
      const a = MENU.articoli.find((x) => x.id === b.dataset.a);
      b.onclick = () => {
        if (b.dataset.lungo) { b.removeAttribute('data-lungo'); return; }
        if (a && a.esaurito) return puoDisponibilita ? pannelloArticolo(a) : alert(`${a.nome}: esaurito.`);
        aggiungiArticolo(a);
      };
      if (puoDisponibilita) toccoLungo(b, () => { b.dataset.lungo = '1'; pannelloArticolo(a); });
    });
    app.querySelectorAll('.riga').forEach((r) => toccoLungo(r, () => pannelloRiga(r.dataset.r)));
    $('invia').onclick = invia;
    $('vai').onclick = vai;
    $('chiudi').onclick = chiudi;
    if ($('totaleRiga')) $('totaleRiga').onclick = () => { comandaAperta = !comandaAperta; disegna(); };
    if ($('comanda')) $('comanda').scrollTop = $('comanda').scrollHeight;
    /* «menu sopra fallo scomparire se scrollo in giu'» (la proprieta', 4
       settembre 2026): sul palmare, scendendo fra gli articoli, portata
       e ricerca si nascondono; risalendo tornano. Sul PC c'e' posto. */
    const g = app.querySelector('.griglia');
    g.scrollTop = scorso;
    let ultimo = g.scrollTop;
    /* Con isteresi: si decide dopo un tratto di dito, non a ogni pixel;
       il rimbalzo di iOS (scrollTop sotto zero o oltre il fondo) non
       conta; e quando le righe in cima spariscono la griglia sale di
       altrettanto, quindi si scorre indietro della stessa misura e quel
       che era sotto il dito ci resta («ogni tanto ha dei problemi», la
       proprieta', 5 settembre 2026). */
    let accumulo = 0, ignora = false;
    const altezzaCima = () => ['.portate', '.conti', '.cercaRiga'].reduce((t, s) => t + ((app.querySelector(s) || {}).offsetHeight || 0), 0);
    g.onscroll = () => {
      if (ignora) { ignora = false; ultimo = g.scrollTop; return; }
      const y = g.scrollTop, massimo = Math.max(0, g.scrollHeight - g.clientHeight);
      if (window.innerWidth >= 900 || cerca || y < 0 || y > massimo) { ultimo = Math.max(0, Math.min(y, massimo)); return; }
      const delta = y - ultimo; ultimo = y;
      accumulo = (delta > 0) === (accumulo > 0) ? accumulo + delta : delta;
      const nascondi = !compatta && accumulo > 70 && y > 120;
      const mostra = compatta && (accumulo < -40 || y < 30);
      if (!nascondi && !mostra) return;
      const ordineEl = app.querySelector('.ordine');
      if (nascondi) {
        const h = altezzaCima();
        compatta = true; ordineEl.classList.add('compatta');
        ignora = true; g.scrollTop = Math.max(0, y - h);
      } else {
        compatta = false; ordineEl.classList.remove('compatta');
        ignora = true; g.scrollTop = y + altezzaCima();
      }
      ultimo = g.scrollTop; accumulo = 0;
    };
  };

  /* Prezzo e disponibilita' da qui, col tocco lungo su un articolo: e' il
     gesto della sala, quando un piatto finisce o il prezzo del giorno
     cambia, e non si va in back office col vassoio in mano («non posso
     modificare i prezzi», la proprieta', 4 settembre 2026).
     «Esaurito» lo segna il capo sala; il prezzo di listino solo
     l'amministrazione. Il menu' vive nel cloud: serve la linea. */
  const puoDisponibilita = !!CAMERIERE && CAMERIERE.ruolo !== 'cameriere';
  const puoListino = !!CAMERIERE && CAMERIERE.ruolo === 'amministrazione';
  const pannelloArticolo = (a) => {
    if (!a) return;
    const velo = document.createElement('div'); velo.className = 'velo';
    velo.innerHTML = `<div class="pannello">
      <h3>${esc(a.nome)}</h3>
      <p class="mini">${esc((categoriaDi(a.categoria) || {}).nome || '')}${a.prezzo_libero ? ' · prezzo libero' : ` · a listino ${euro(a.prezzo_cent)}`}</p>
      ${puoListino && !a.prezzo_libero ? `<label>Prezzo di listino (euro)</label><input id="paPrezzo" inputmode="decimal" value="${(Number(a.prezzo_cent) / 100).toFixed(2).replace('.', ',')}" />
        <label>Perché cambia il prezzo</label><input id="paMotivo" maxlength="200" placeholder="es. aumento fornitore, prezzo sbagliato" />`
        : '<p class="mini">Il prezzo di listino lo cambia l’amministrazione, da qui o dal back office.</p>'}
      <label>In questo momento</label>
      <div class="chips"><button data-esa="0" class="${a.esaurito ? '' : 'attiva'}">C’è</button><button data-esa="1" class="${a.esaurito ? 'attiva' : ''}">Esaurito</button></div>
      <div class="due"><button class="bottone sec" id="paChiudi">Annulla</button><button class="bottone" id="paOk">Salva</button></div></div>`;
    document.body.appendChild(velo);
    let esaurito = !!a.esaurito;
    const via = () => velo.remove();
    velo.onclick = (ev) => { if (ev.target === velo) via(); };
    velo.querySelectorAll('[data-esa]').forEach((b) => b.onclick = () => {
      esaurito = b.dataset.esa === '1';
      velo.querySelectorAll('[data-esa]').forEach((x) => x.classList.toggle('attiva', (x.dataset.esa === '1') === esaurito));
    });
    velo.querySelector('#paChiudi').onclick = via;
    velo.querySelector('#paOk').onclick = async () => {
      const corpo = { articolo: a.id, esaurito };
      const campo = velo.querySelector('#paPrezzo');
      if (campo) {
        const n = Number(String(campo.value).replace(',', '.'));
        if (!isFinite(n) || n < 0) return alert('Prezzo non valido.');
        corpo.prezzo_cent = Math.round(n * 100);
        /* cambiare il listino lascia traccia: senza il perché non parte */
        corpo.motivo = velo.querySelector('#paMotivo').value.trim();
        if (corpo.prezzo_cent !== Number(a.prezzo_cent) && corpo.motivo.length < 3) {
          const c = velo.querySelector('#paMotivo');
          c.style.borderColor = 'var(--allarme)'; c.placeholder = 'Scriva perché cambia il prezzo'; c.focus();
          return;
        }
      }
      try {
        const j = await chiama('articolo-cambia', { method: 'POST', body: JSON.stringify(corpo), cloud: true });
        Object.assign(a, j.articolo);
        MENU.articoli = MENU.articoli.map((x) => x.id === a.id ? { ...x, ...j.articolo } : x);
        localStorage.setItem('posMenu', JSON.stringify(MENU));
        via(); disegna();
      } catch (e) { alert(e instanceof TypeError ? 'Serve la linea: prezzi e disponibilità si cambiano sul server dell’hotel.' : e.message); }
    };
  };

  const aggiungiArticolo = async (a) => {
    if (!a) return;
    const opz = { quantita: quantitaPronta, portata: portataForzata || portataArticolo(a) };
    if (a.prezzo_libero) {
      /* col cancelletto, come sul POS di prima: prezzo battuto sul tastierino */
      const p = await chiediNumero(`${a.nome}: prezzo in euro`, { decimale: true });
      if (!p) return;
      opz.prezzoManualeCent = Math.round(p * 100);
    }
    ordine = aggiungi(ordine, { ...a, portata: portataArticolo(a) }, opz);
    quantitaPronta = 1;
    if (navigator.vibrate) navigator.vibrate(15);
    disegna();
    /* il riquadro toccato lampeggia: si vede che e' entrato, anche senza
       guardare il riepilogo in fondo */
    const toccato = $('app').querySelector(`.articolo[data-a="${a.id}"]`);
    if (toccato) { toccato.classList.add('aggiunto'); setTimeout(() => toccato.classList.remove('aggiunto'), 350); }
  };

  /* il pannello di una riga: quantita', nota, variante, prezzo a mano, togli o storna */
  const pannelloRiga = (id) => {
    const nuova = ordine.righe.find((r) => r.id === id);
    const vecchia = dalServer.find((r) => r.id === id);
    const r = nuova || vecchia;
    if (!r) return;
    const a = MENU.articoli.find((x) => x.id === r.articolo) || {};
    const cat = categoriaDi(a.categoria) || {};
    const varianti = MENU.varianti.filter((v) => v.articolo === a.id || (v.categoria && v.categoria === a.categoria));
    const puoPrezzo = CAMERIERE && CAMERIERE.ruolo !== 'cameriere';
    const puoStorno = CAMERIERE && (CAMERIERE.ruolo !== 'cameriere' || CAMERIERE.storni);
    const velo = document.createElement('div'); velo.className = 'velo';
    velo.innerHTML = `<div class="pannello">
      <h3>${esc(r.nome)}</h3>
      ${nuova ? `<label>Quantità</label><div class="piumeno"><button id="pMeno">−</button><output id="pQ">${r.quantita}</output><button id="pPiu">+</button></div>
      <div id="pPer"></div>
      <label>Nota per la cucina</label><textarea id="pNota" rows="2">${esc(r.nota || '')}</textarea>
      <div class="chips">${(cat.note_rapide && cat.note_rapide.length ? cat.note_rapide : ['Senza glutine', 'Senza lattosio', 'Allergia', 'Caldo', 'Freddo', 'Con ghiaccio', 'Senza ghiaccio']).map((n) => `<button data-nota="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      ${varianti.length ? `<label>Variante</label><div class="chips">${varianti.map((v) => `<button data-v="${esc(v.id)}" class="${r.variante_id === v.id ? 'attiva' : ''}">${esc(v.nome)}${v.supplemento_cent ? ` +${euro(v.supplemento_cent)}` : ''}</button>`).join('')}</div>` : ''}
      <label>Portata</label><div class="chips">${PORTATE.map((p) => `<button data-p="${p}" class="${r.portata === p ? 'attiva' : ''}">${NOMI_PORTATE[p]}</button>`).join('')}</div>
      ${nuova && (MENU.locali || []).length > 1 ? `<label>Dove si prepara</label>
      <div class="chips">${[{ id: '', nome: 'Qui' }, ...MENU.locali].map((l) => `<button data-dove="${esc(l.id)}" class="${(r.locale_stampa || '') === l.id ? 'attiva' : ''}">${esc(l.nome)}</button>`).join('')}</div>
      <p class="mini">Scegliendo un altro locale il biglietto esce là, e ci scrive dove portarlo.</p>` : ''}
      ${puoPrezzo ? `<label>Prezzo a mano (euro, vuoto = listino)</label><input id="pPrezzo" inputmode="decimal" value="${r.prezzo_manuale_cent != null ? (r.prezzo_manuale_cent / 100).toFixed(2).replace('.', ',') : ''}" />
      <label>Perché cambia il prezzo (se non lo dice già la nota)</label><input id="pMotivoPrezzo" maxlength="200" placeholder="es. omaggio direzione, piatto rifatto" value="${esc(r.motivo_prezzo || '')}" />` : ''}
      <div class="due"><button class="bottone sec" id="pTogli">Togli</button><button class="bottone" id="pOk">Fatto</button></div>`
      : `<p class="mini">Riga già inviata${r.stato === 'partita' ? ' e partita' : ', in attesa'}.</p>
      ${r.stato !== 'stornata' ? `<label>Sposta su un altro conto di questo tavolo</label>
      <div class="chips">${fratelli.map((f) => `<button data-sposta="${esc(f.id)}">${esc(nomeConto2(f))}</button>`).join('')}<button data-sposta="nuovo">+ Conto nuovo</button></div>` : ''}
      ${puoStorno && r.stato !== 'stornata' ? `<label>Motivo dello storno</label><input id="pMotivo" placeholder="es. cambiato idea, errore" />
      <div class="due"><button class="bottone sec" id="pChiudi">Annulla</button><button class="bottone" id="pStorna" style="background:var(--allarme)">Storna</button></div>`
      : `<div class="due"><button class="bottone sec" id="pChiudi">Chiudi</button></div>`}`}
    </div>`;
    document.body.appendChild(velo);
    const chiudiPannello = () => velo.remove();
    velo.onclick = (ev) => { if (ev.target === velo) chiudiPannello(); };
    if (nuova) {
      let q = r.quantita, varianteId = r.variante_id, portata = r.portata, dove = r.locale_stampa || '';
      velo.querySelectorAll('[data-dove]').forEach((b) => b.onclick = () => {
        dove = b.dataset.dove;
        velo.querySelectorAll('[data-dove]').forEach((x) => x.classList.toggle('attiva', x.dataset.dove === dove));
      });
      /* «tre piadine, una senza formaggio»: con piu' di una, si sceglie a
         quante vale la nota (e la variante, la portata, il prezzo). Zero =
         a tutte, come sempre. */
      let perQuante = 0;
      const disegnaPer = () => {
        const p = velo.querySelector('#pPer');
        if (perQuante >= q) perQuante = 0;
        p.innerHTML = q > 1 ? `<label>La nota vale per</label><div class="chips"><button data-per="0" class="${perQuante ? '' : 'attiva'}">Tutte e ${q}</button>${Array.from({ length: q - 1 }, (_, i) => `<button data-per="${i + 1}" class="${perQuante === i + 1 ? 'attiva' : ''}">${i + 1}</button>`).join('')}</div>` : '';
        p.querySelectorAll('[data-per]').forEach((b) => b.onclick = () => { perQuante = Number(b.dataset.per); disegnaPer(); });
      };
      disegnaPer();
      velo.querySelector('#pMeno').onclick = () => { q = Math.max(1, q - 1); velo.querySelector('#pQ').textContent = q; disegnaPer(); };
      velo.querySelector('#pPiu').onclick = () => { q += 1; velo.querySelector('#pQ').textContent = q; disegnaPer(); };
      velo.querySelectorAll('[data-nota]').forEach((b) => b.onclick = () => { const t = velo.querySelector('#pNota'); t.value = (t.value ? t.value + ', ' : '') + b.dataset.nota; });
      velo.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { varianteId = varianteId === b.dataset.v ? null : b.dataset.v; velo.querySelectorAll('[data-v]').forEach((x) => x.classList.toggle('attiva', x.dataset.v === varianteId)); });
      velo.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { portata = b.dataset.p; velo.querySelectorAll('[data-p]').forEach((x) => x.classList.toggle('attiva', x.dataset.p === portata)); });
      velo.querySelector('#pTogli').onclick = () => { ordine = togli(ordine, id); chiudiPannello(); disegna(); };
      velo.querySelector('#pOk').onclick = () => {
        const v = varianti.find((x) => x.id === varianteId);
        const campi = { quantita: q, nota: velo.querySelector('#pNota').value.trim() || null, variante_id: varianteId, variante: v ? v.nome : null, portata, locale_stampa: dove || null };
        const pz = puoPrezzo ? velo.querySelector('#pPrezzo').value.trim() : '';
        campi.prezzo_manuale_cent = pz ? Math.round(Number(pz.replace(',', '.')) * 100) : (a.prezzo_libero ? r.prezzo_manuale_cent : null);
        campi.prezzo_cent = campi.prezzo_manuale_cent != null ? campi.prezzo_manuale_cent : (a.prezzo_cent || 0) + (v ? v.supplemento_cent : 0);
        /* prezzo diverso dal listino: senza il perché non si va avanti
           (la proprietà, 4 settembre 2026). Lo ricontrolla anche il
           server: la regola sta lì, questa è solo la porta. */
        const listino = (a.prezzo_cent || 0) + (v ? v.supplemento_cent : 0);
        const cambiaPrezzo = !a.prezzo_libero && campi.prezzo_manuale_cent != null && campi.prezzo_manuale_cent !== listino;
        campi.motivo_prezzo = puoPrezzo ? velo.querySelector('#pMotivoPrezzo').value.trim() : '';
        /* «se c'è una nota già non serve che il cameriere deve aggiungere
           la spiegazione» (la proprietà, 4 settembre 2026): la pasta senza
           glutine dice già da sé perché costa diverso. */
        const spiegato = campi.motivo_prezzo.length >= 3 || (campi.nota || '').trim().length >= 3;
        if (cambiaPrezzo && !spiegato) {
          const c = velo.querySelector('#pMotivoPrezzo');
          c.style.borderColor = 'var(--allarme)'; c.focus();
          c.insertAdjacentHTML('afterend', '<p class="mini" style="color:var(--allarme);margin:4px 0 0;">Scriva perché cambia il prezzo, o metta la nota.</p>');
          return;
        }
        if (perQuante > 0 && perQuante < q) {
          /* la riga si divide: quelle di prima restano com'erano, la nota
             (variante, portata, prezzo) va solo alla parte scelta */
          const d = dividi(cambia(ordine, id, { quantita: q }), id, perQuante);
          ordine = cambia(d.ordine, d.nuova, { ...campi, quantita: perQuante });
        } else {
          ordine = cambia(ordine, id, campi);
        }
        chiudiPannello(); disegna();
      };
    } else {
      velo.querySelectorAll('[data-sposta]').forEach((b) => b.onclick = () => {
        const dove = b.dataset.sposta;
        chiudiPannello();
        sposta(id, dove === 'nuovo' ? { nuovo: true, coperti: 1 } : { conto: dove });
      });
      const pc = velo.querySelector('#pChiudi'); if (pc) pc.onclick = chiudiPannello;
      const ps = velo.querySelector('#pStorna');
      if (ps) ps.onclick = async () => {
        /* senza motivo non si storna: è merce che esce e non si paga */
        const motivo = velo.querySelector('#pMotivo').value.trim();
        if (motivo.length < 3) {
          const c = velo.querySelector('#pMotivo');
          c.style.borderColor = 'var(--allarme)'; c.focus();
          c.placeholder = 'Scriva il motivo dello storno';
          return;
        }
        try {
          const j = await scrivi('storna', { riga: id, motivo });
          if (!j.offline) dalServer = dalServer.map((x) => x.id === id ? j.riga : x);
          chiudiPannello(); disegna();
        } catch (e) { alert(e.message); }
      };
    }
  };

  /* Invia: le righe nuove al server, poi l'invio (prima portata e bevande subito, il resto in attesa) */
  /* I conti aperti del tavolo, numerati in un ordine che non balla, e il
     passaggio dall'uno all'altro senza uscire: «aprire piu' conti dalla
     stessa schermata» (la proprieta', 5 settembre 2026). Le righe non
     inviate del conto che si lascia restano in BOZZE. */
  const contiDelTavolo = () => [conto, ...fratelli.filter((f) => f.id !== conto.id)].sort((a, b) => String(a.id).localeCompare(String(b.id)));
  /* Chiuso o tolto un conto, se il tavolo ha altri conti aperti si resta
     li', sul primo di quelli: «magari devo lavorare sugli altri conti
     aperti su quel tavolo» (la proprieta', 5 settembre 2026). Se era
     l'ultimo, si torna in sala. */
  const dopoChiuso = () => {
    const altri = fratelli.filter((f) => f.id !== conto.id);
    if (altri.length) apriContoPerId(altri[0].id); else schermataSala();
  };
  /* «+ Camera» nella riga dei conti: un altro conto in camera sullo stesso
     tavolo, con tessera o numero di camera come dal tavolo (la
     proprieta', 5 settembre 2026: «se invece e' un'altra camera?») */
  const pannelloNuovoInCamera = () => {
    const velo = document.createElement('div'); velo.className = 'velo';
    const via = () => velo.remove();
    let cop = 1;
    velo.innerHTML = `<div class="pannello">
      <h3>Nuovo conto in camera</h3>
      <label>Tessera o numero di camera</label>
      <div class="conFoto"><input id="pnCodice" inputmode="numeric" autocomplete="off" placeholder="passi la tessera, o scriva la camera" />${bottoneFotocamera('pnCodice')}</div>
      <label>Nome dell’ospite (facoltativo)</label>
      <input id="pnOspite" maxlength="40" autocomplete="off" />
      <label>Coperti</label>
      <div class="coperti">${[1,2,3,4,5,6].map((n) => `<button data-cop="${n}" class="${n === cop ? 'attivo' : ''}">${n}</button>`).join('')}</div>
      <p class="mini" id="pnEsito"></p>
      <div class="due"><button class="bottone sec" id="pnAnnulla">Annulla</button><button class="bottone" id="pnOk">Apri il conto</button></div></div>`;
    document.body.appendChild(velo);
    velo.onclick = (ev) => { if (ev.target === velo) via(); };
    velo.querySelectorAll('[data-cop]').forEach((b) => b.onclick = () => { cop = Number(b.dataset.cop); velo.querySelectorAll('[data-cop]').forEach((x) => x.classList.toggle('attivo', Number(x.dataset.cop) === cop)); });
    const esito = velo.querySelector('#pnEsito');
    const letto = leggiTesseraOCamera(velo, 'pnCodice', esito);
    velo.querySelector('#pnAnnulla').onclick = via;
    velo.querySelector('#pnOk').onclick = async () => {
      const s = await letto.conferma();
      if (!s.camera) { esito.textContent = 'Serve la camera: passi la tessera o scriva il numero.'; return; }
      try {
        const j = await scrivi('conto', { tavolo: conto.tavolo, tipo: 'camera', camera: s.camera, tessera: s.daTessera ? s.tessera : null, lingua: s.daTessera ? s.lingua : null, ospite: velo.querySelector('#pnOspite').value.trim() || null, coperti: cop });
        if (j.offline) return alert('Nessun server risponde: riprovi tra un momento.');
        via(); cambiaConto(j.conto.id);
      } catch (e) { esito.textContent = e.message; }
    };
  };
  const cambiaConto = async (id) => {
    salvaBozza();
    if (id === 'nuovo-camera') return pannelloNuovoInCamera();
    try {
      let verso = id;
      if (id === 'nuovo') {
        const j = await scrivi('conto', { tavolo: conto.tavolo, tipo: 'esterno', coperti: 1 });
        if (j.offline) return alert('Nessun server risponde: riprovi tra un momento.');
        verso = j.conto.id;
      }
      const j = await chiama('conto', { qs: `&id=${encodeURIComponent(verso)}` });
      schermataOrdine(j.conto, j.righe, j.fratelli || []);
    } catch (e) { alert(e.message); }
  };
  const invia = async () => {
    const nuove = daInviare(ordine);
    if (!nuove.length) return;
    $('invia').disabled = true;
    try {
      const corpo = nuove.map((r) => ({ id: r.id, articolo: r.articolo, quantita: r.quantita, variante_id: r.variante_id, variante: r.variante, nota: r.nota, portata: r.portata, prezzo_manuale_cent: r.prezzo_manuale_cent, motivo_prezzo: r.motivo_prezzo, locale_stampa: r.locale_stampa }));
      const j = await scrivi('righe', { conto: conto.id, righe: corpo });
      if (j.offline) { coda.metti({ azione: 'invia', corpo: { conto: conto.id } }); dalServer = [...dalServer, ...nuove.map((r) => ({ ...r, stato: 'inviata' }))]; ordine = creaOrdine(); disegna(); return; }
      const inv = await scrivi('invia', { conto: conto.id });
      ordine = creaOrdine();
      if (!inv.offline) await ricarica();
      else disegna();
    } catch (e) { alert(e.message); disegna(); }
  };
  const vai = async () => {
    const p = prossimaInAttesa();
    if (!p) return;
    $('vai').disabled = true;
    try { const j = await scrivi('vai', { conto: conto.id, portata: p }); if (!j.offline) await ricarica(); else disegna(); }
    catch (e) { alert(e.message); await ricarica(); }
  };
  /* LA FIRMA DELL'OSPITE SULL'ADDEBITO IN CAMERA.
     Si passa il palmare all'ospite: legge cosa ha preso, l'importo e la
     camera, e firma col dito, nella sua lingua (la dice Fidra quando si
     passa la tessera). Al check-out, davanti a chi dice «questo non l'ho
     preso», la reception apre l'addebito e mostra la firma.
     Non e' obbligatoria: se l'ospite si e' gia' alzato, «Senza firma»
     chiude lo stesso e nella coda si vede che manca. */
  const FIRMA_TESTI = {
    it: { titolo: 'Conto in camera', autorizza: 'Firmando autorizza l’addebito sul conto della camera', totale: 'Totale', qui: 'Firmi qui con il dito', cancella: 'Cancella', conferma: 'Confermo', manca: 'Manca la firma' },
    en: { titolo: 'Room charge', autorizza: 'By signing you authorise this charge to room', totale: 'Total', qui: 'Sign here with your finger', cancella: 'Clear', conferma: 'Confirm', manca: 'Signature missing' },
    de: { titolo: 'Zimmerrechnung', autorizza: 'Mit Ihrer Unterschrift genehmigen Sie die Belastung von Zimmer', totale: 'Gesamt', qui: 'Bitte hier mit dem Finger unterschreiben', cancella: 'Löschen', conferma: 'Bestätigen', manca: 'Unterschrift fehlt' },
    fr: { titolo: 'Note de chambre', autorizza: 'En signant, vous autorisez l’imputation sur la chambre', totale: 'Total', qui: 'Signez ici avec le doigt', cancella: 'Effacer', conferma: 'Confirmer', manca: 'Signature manquante' },
  };
  const firmaOspite = (totale) => {
    let lingua = FIRMA_TESTI[conto.lingua] ? conto.lingua : 'it';
    const velo = document.createElement('div'); velo.className = 'velo';
    const via = () => velo.remove();
    const chiudiCon = async (firma) => {
      try {
        const j = await scrivi('chiudi', { conto: conto.id, modo: 'camera', firma });
        if (j.offline) alert('Nessun server risponde: il conto si chiude appena torna la linea.');
        via(); dopoChiuso();
      } catch (e) { alert(e.message); }
    };
    const disegna = () => {
      const T = FIRMA_TESTI[lingua];
      const righe = [...dalServer.filter((r) => r.stato !== 'stornata'), ...ordine.righe];
      velo.innerHTML = `<div class="pannello firma">
        <div class="fmTesta"><div><h3>${esc(T.titolo)}</h3>
          <p class="mini">${esc(T.autorizza)} <b>${esc(String(conto.camera))}</b>.</p></div>
          <div class="chips">${Object.keys(FIRMA_TESTI).map((l) => `<button data-l="${l}" class="${l === lingua ? 'attiva' : ''}">${l.toUpperCase()}</button>`).join('')}</div></div>
        <div class="fmRighe">${righe.map((r) => `<div class="fmRiga"><span>${r.quantita}× ${esc(r.nome)}</span><span>${euro(r.quantita * r.prezzo_cent)}</span></div>`).join('')}</div>
        <div class="fmTotale"><span>${esc(T.totale)}</span><b>${euro(totale)}</b></div>
        <div class="fmFirma"><canvas id="fmTela" width="700" height="200"></canvas><span class="fmQui">${esc(T.qui)}</span></div>
        <p class="mini" id="fmEsito"></p>
        <div class="azioni" style="padding:0;background:none;">
          <button class="bottone sec" id="fmVia">Annulla</button>
          <button class="bottone sec" id="fmCancella">${esc(T.cancella)}</button>
          <button class="bottone" id="fmOk">${esc(T.conferma)}</button></div>
        <button class="bottone sec" id="fmSenza" style="margin-top:8px;">Senza firma (l’ospite non c’è)</button></div>`;
      const cv = velo.querySelector('#fmTela'), ctx = cv.getContext('2d');
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1A3626';
      let giu = false, tratti = 0;
      const punto = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) * cv.width / r.width, (ev.clientY - r.top) * cv.height / r.height]; };
      cv.addEventListener('pointerdown', (ev) => { giu = true; const [x, y] = punto(ev); ctx.beginPath(); ctx.moveTo(x, y); cv.setPointerCapture(ev.pointerId); });
      cv.addEventListener('pointermove', (ev) => { if (!giu) return; const [x, y] = punto(ev); ctx.lineTo(x, y); ctx.stroke(); tratti++; });
      ['pointerup', 'pointercancel'].forEach((n) => cv.addEventListener(n, () => { giu = false; }));
      velo.querySelectorAll('[data-l]').forEach((b) => b.onclick = () => { lingua = b.dataset.l; disegna(); });
      velo.querySelector('#fmCancella').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); tratti = 0; };
      velo.querySelector('#fmVia').onclick = via;
      velo.querySelector('#fmOk').onclick = () => {
        if (tratti < 5) { velo.querySelector('#fmEsito').textContent = T.manca; return; }
        chiudiCon(cv.toDataURL('image/png'));
      };
      velo.querySelector('#fmSenza').onclick = () => {
        if (confirm(`Chiudo ${euro(totale)} sulla camera ${conto.camera} senza firma?`)) chiudiCon(null);
      };
    };
    document.body.appendChild(velo);
    disegna();
  };

  /* La chiusura: contanti, carta, o in camera se il conto e' di una
     camera. «In camera» non e' un incasso — l'importo entra in una coda
     che la reception riporta nel conto camera di Fidra. */
  /* Il conto e' nato «esterno» ma paga la camera: si passa la tessera
     adesso, al momento di pagare, senza uscire e rientrare dall'altra
     parte (la proprieta', 5 settembre 2026). Il conto diventa «in camera»
     (conto-cambia) e poi va per la strada di sempre: la firma dell'ospite
     e la coda degli addebiti. */
  const pannelloCameraConto = (totale) => {
    const velo = document.createElement('div'); velo.className = 'velo';
    const via = () => velo.remove();
    velo.innerHTML = `<div class="pannello">
      <h3>Addebito in camera · ${euro(totale)}</h3>
      <label>Tessera o numero di camera</label>
      <div class="conFoto"><input id="pcCodice" inputmode="numeric" autocomplete="off" placeholder="passi la tessera, o scriva la camera" />${bottoneFotocamera('pcCodice')}</div>
      <p class="mini">Col lettore del palmare basta puntare la tessera. Tre cifre sono la camera scritta a mano.</p>
      <label>Nome dell’ospite (facoltativo)</label>
      <input id="pcOspite" maxlength="40" autocomplete="off" />
      <p class="mini" id="pcEsito"></p>
      <div class="due"><button class="bottone sec" id="pcAnnulla">Annulla</button><button class="bottone oro" id="pcOk">Addebita in camera</button></div></div>`;
    document.body.appendChild(velo);
    velo.onclick = (ev) => { if (ev.target === velo) via(); };
    const esito = velo.querySelector('#pcEsito');
    const letto = leggiTesseraOCamera(velo, 'pcCodice', esito);
    velo.querySelector('#pcAnnulla').onclick = via;
    velo.querySelector('#pcOk').onclick = async () => {
      const s = await letto.conferma();
      if (!s.camera) { esito.textContent = 'Serve la camera: passi la tessera o scriva il numero.'; return; }
      try {
        const j = await scrivi('conto-cambia', {
          conto: conto.id, camera: s.camera,
          tessera: s.daTessera ? s.tessera : null,
          lingua: s.daTessera ? s.lingua : null,
          ospite: velo.querySelector('#pcOspite').value.trim() || null,
        });
        if (j.offline) return alert('Nessun server risponde: riprovi tra un momento.');
        conto = j.conto;
        via(); firmaOspite(totale);
      } catch (e) { esito.textContent = e.message; }
    };
  };

  /* Dal 5 settembre 2026 si paga anche a pezzi: in parti uguali («dividere
     il conto fra persone al tavolo») o un importo a scelta; i contanti
     dicono il resto. Ogni pezzo e' un pagamento (azione «paga»), e il
     conto si chiude da solo quando i pezzi coprono il totale. */
  const chiudi = async () => {
    const tutte = [...dalServer.filter((r) => r.stato !== 'stornata'), ...ordine.righe];
    const totale = tutte.reduce((t, r) => t + r.quantita * r.prezzo_cent, 0);
    if (!totale) {
      /* dentro ci sono solo storni: niente da incassare, il conto si
         chiude a zero («non c'e' modo di chiuderlo», la proprieta', 5
         settembre 2026). Gli storni restano nella giornata. */
      /* e un conto senza niente dentro (aperto per sbaglio) si toglie da
         qui, senza andare a cercare il «⋯» del tavolo («mi restano aperti
         tavoli a zero senza possibilita di chiuderli», 5 settembre 2026) */
      const soliStorni = dalServer.some((r) => r.stato === 'stornata');
      const velo = document.createElement('div'); velo.className = 'velo';
      velo.innerHTML = `<div class="pannello"><h3>${soliStorni ? `Conto · ${euro(0)}` : 'Conto vuoto'}</h3>
        <p class="mini">${soliStorni ? 'Il conto è a zero: dentro ci sono solo storni. Si chiude senza incasso e il tavolo torna libero.' : 'Non c’è niente su questo conto. Lo tolgo? Il tavolo torna libero.'}</p>
        <div class="due"><button class="bottone sec" id="pzAnnulla">Annulla</button><button class="bottone" id="pzZero">${soliStorni ? 'Chiudi il conto a zero' : 'Togli il conto'}</button></div></div>`;
      document.body.appendChild(velo);
      const via = () => velo.remove();
      velo.onclick = (ev) => { if (ev.target === velo) via(); };
      velo.querySelector('#pzAnnulla').onclick = via;
      velo.querySelector('#pzZero').onclick = async () => {
        try {
          const j = await scrivi('conto-elimina', { conto: conto.id });
          if (j.offline) alert('Nessun server risponde: il conto si chiude appena torna la linea.');
          via(); dopoChiuso();
        } catch (e) { alert(e.message); }
      };
      return;
    }
    const inCamera = conto.tipo === 'camera' && String(conto.camera || '').trim();
    /* quanto e' gia' stato pagato lo sa il server */
    let pagamenti = [];
    try { const j = await chiama('conto', { qs: `&id=${encodeURIComponent(conto.id)}` }); pagamenti = j.pagamenti || []; } catch (e) { /* senza rete: si parte da zero */ }
    const pagato = () => pagamenti.reduce((t, p) => t + Number(p.importo_cent || 0), 0);
    const residuo = () => Math.max(0, totale - pagato());
    let parti = 1;           // in quante parti uguali si divide quel che resta
    let importo = null;      // oppure un importo scelto a mano, in centesimi
    const quote = (tot, n) => { const base = Math.floor(tot / n), avanzo = tot - base * n; return Array.from({ length: n }, (_, i) => base + (i < avanzo ? 1 : 0)); };
    const daPagareOra = () => importo != null ? Math.min(importo, residuo()) : quote(residuo(), parti)[0];
    const velo = document.createElement('div'); velo.className = 'velo';
    const via = () => velo.remove();
    const disegna = () => {
      velo.innerHTML = `<div class="pannello">
        <h3>Conto · ${euro(totale)}</h3>
        <p class="mini">${esc(titoloConto(conto))} · ${conto.coperti} coperti${pagato() ? ` · pagati ${euro(pagato())}, restano <b>${euro(residuo())}</b>` : ''}</p>
        <label>Quanto</label>
        <div class="chips">${[1, 2, 3, 4, 5, 6, 8].map((n) => `<button data-parti="${n}" class="${importo == null && parti === n ? 'attiva' : ''}">${n === 1 ? 'Tutto' : `in ${n}`}</button>`).join('')}<button id="pzAltro" class="${importo != null ? 'attiva' : ''}">Altro importo…</button></div>
        <div class="totale" style="margin:8px 0;"><span>Da pagare adesso${importo == null && parti > 1 ? ` (1 di ${parti})` : ''}</span><b>${euro(daPagareOra())}</b></div>
        <label>Come paga</label>
        <div class="due"><button class="bottone" data-modo="contanti">Contanti</button><button class="bottone" data-modo="carta">Carta</button></div>
        ${inCamera && !pagato() ? `<button class="bottone oro" data-modo="camera" style="margin-top:8px;">Tutto in camera ${esc(String(conto.camera))}</button>
          <p class="mini">Va in coda: la reception lo riporta sul conto camera in Fidra.</p>`
          : inCamera ? '' : (!pagato() ? '<button class="bottone sec" id="pzInCamera" style="margin-top:8px;">In camera… (con la tessera)</button>' : '')}
        <div class="due"><button class="bottone sec" id="pzChiudi">Annulla</button><span></span></div></div>`;
      velo.querySelector('#pzChiudi').onclick = via;
      const ic = velo.querySelector('#pzInCamera');
      if (ic) ic.onclick = () => { via(); pannelloCameraConto(totale); };
      velo.querySelectorAll('[data-parti]').forEach((b) => b.onclick = () => { parti = Number(b.dataset.parti); importo = null; disegna(); });
      velo.querySelector('#pzAltro').onclick = async () => {
        const n = await chiediNumero('Importo da pagare adesso (euro)', { decimale: true });
        if (n) { importo = Math.min(Math.round(n * 100), residuo()); disegna(); }
      };
      velo.querySelectorAll('[data-modo]').forEach((b) => b.onclick = async () => {
        const modo = b.dataset.modo;
        if (modo === 'camera') { via(); return firmaOspite(totale); }
        const cifra = daPagareOra();
        if (!cifra) return;
        let ricevuto = null;
        if (modo === 'contanti') {
          /* «dare resto»: quanto ha dato l'ospite; vuoto = la cifra giusta */
          const r = await chiediNumero(`Contanti ricevuti (dovuti ${euro(cifra)}; vuoto = giusti)`, { decimale: true });
          if (r) ricevuto = Math.round(r * 100);
          if (ricevuto != null && ricevuto < cifra) return alert(`Ne ha dati ${euro(ricevuto)}: mancano ${euro(cifra - ricevuto)}. Se paga solo una parte, usi «Altro importo…».`);
        }
        velo.querySelectorAll('[data-modo]').forEach((x) => x.disabled = true);
        try {
          const j = await scrivi('paga', { conto: conto.id, modo, importo_cent: cifra, ricevuto_cent: ricevuto });
          if (j.offline) { alert('Nessun server risponde: il pagamento si registra appena torna la linea.'); via(); return dopoChiuso(); }
          if (j.resto_cent) alert(`Resto da dare: ${euro(j.resto_cent)}`);
          if (j.chiuso) { via(); return dopoChiuso(); }
          pagamenti = [...pagamenti, j.pagamento];
          if (importo != null) importo = null; else if (parti > 1) parti -= 1;
          disegna();
        } catch (e) { alert(e.message); disegna(); }
      });
    };
    document.body.appendChild(velo);
    velo.onclick = (ev) => { if (ev.target === velo) via(); };
    disegna();
  };
  const ricarica = async () => {
    try { const j = await chiama('conto', { qs: `&id=${encodeURIComponent(conto.id)}` }); dalServer = j.righe; conto = j.conto; fratelli = j.fratelli || []; }
    catch { /* si resta con quello che si ha */ }
    disegna();
  };
  /* Al tavolo si paga separatamente: la riga passa a un altro conto dello
     stesso tavolo, o a uno nuovo aperto li' per li'. Non e' uno storno:
     in cucina non cambia niente, cambia solo chi paga. */
  const nomeConto2 = (c) => c.nome ? String(c.nome) : (c.tipo === 'camera' ? `Camera ${c.camera ?? ''}`.trim() : `Esterno · ${c.coperti} cop.`);
  const sposta = async (id, corpo) => {
    try {
      const j = await scrivi('sposta', { riga: id, ...corpo });
      if (j.offline) { alert('Nessun server risponde: riprovi tra un momento.'); return; }
      await ricarica();
    } catch (e) { alert(e.message); }
  };
  disegna();
  /* la fascia oraria puo' essere cambiata da quando si e' letto il menu':
     dopo dieci minuti si rilegge, e i prezzi in vista tornano quelli in
     vigore (sulla riga li applica comunque il server) */
  if (Date.now() - MENU_LETTO_IL > 10 * 60 * 1000) caricaMenu().then(() => disegna()).catch(() => {});
}

/* ---------- tessera o camera: un campo solo ----------
   «un unico campo sia per il numero di camera che per il numero di
   tessera» (la proprieta', 5 settembre 2026): le camere hanno tre cifre,
   le tessere di piu'. Fino a tre cifre e' la camera scritta a mano; da
   quattro in su e' una tessera, e si chiede a Fidra di che camera e'
   (legge e basta). Lo usano il conto in camera dal tavolo e l'addebito al
   momento di pagare. */
const CAMERA_CIFRE_MAX = 3;
function leggiTesseraOCamera(velo, idCampo, esito) {
  const stato = { tessera: '', camera: '', lingua: null, daTessera: false, ultimo: null };
  const campo = velo.querySelector('#' + idCampo);
  const leggi = async () => {
    const cifre = campo.value.replace(/\D/g, '');
    if (cifre === stato.ultimo) return;
    stato.ultimo = cifre;
    stato.tessera = ''; stato.lingua = null; stato.daTessera = false; stato.camera = '';
    if (!cifre) { esito.textContent = ''; return; }
    if (cifre.length <= CAMERA_CIFRE_MAX) { stato.camera = cifre; esito.textContent = `Camera ${cifre}, scritta a mano.`; return; }
    esito.textContent = 'Leggo la tessera…';
    try {
      const j = await chiama('tessera', { qs: `&codice=${encodeURIComponent(cifre)}`, cloud: true });
      stato.tessera = cifre; stato.camera = String(j.camera || ''); stato.daTessera = !!stato.camera;
      /* la lingua dell'ospite la sa Fidra: serve alla schermata della firma */
      stato.lingua = ['it', 'en', 'de', 'fr'].includes(j.lingua) ? j.lingua : null;
      esito.textContent = stato.camera ? `Tessera letta: camera ${stato.camera}.` : 'Tessera non riconosciuta: scriva il numero della camera.';
    } catch (e) { esito.textContent = e instanceof TypeError ? 'Serve la linea per leggere la tessera: scriva il numero della camera.' : e.message; }
  };
  campo.onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); leggi(); } };
  campo.onblur = leggi;
  setTimeout(() => campo.focus(), 50);
  /* al momento di confermare vale quello che c'e' nel campo, letto o no */
  stato.conferma = async () => { await leggi(); return stato; };
  return stato;
}

/* ---------- la tessera con la fotocamera ----------
   Se il palmare non ha il lettore, il codice a barre si legge con la
   fotocamera (BarcodeDetector di Chrome, «posso farla da fotocamera se il
   palmare e' sprovvisto?», la proprieta', 5 settembre 2026). Chrome da'
   la fotocamera solo alle pagine in https: dal PC del Bistrot, in http,
   il bottone non compare — li' resta il lettore di sistema del Sunmi, che
   scrive nel campo come una tastiera. */
const puoScansionare = () => window.isSecureContext && 'BarcodeDetector' in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !localStorage.getItem('posSenzaFotocamera');
const bottoneFotocamera = (idCampo) => puoScansionare() ? `<button type="button" class="foto" data-foto="${idCampo}" title="Leggi con la fotocamera">📷</button>` : '';
function scansiona() {
  const velo = document.createElement('div'); velo.className = 'velo';
  velo.innerHTML = `<div class="pannello" style="text-align:center;"><h3>Inquadri il codice della tessera</h3>
    <video id="fotoVideo" autoplay playsinline muted style="width:100%;max-height:50vh;border-radius:12px;background:#000;"></video>
    <div class="due"><button class="bottone sec" id="fotoChiudi">Annulla</button><span></span></div></div>`;
  document.body.appendChild(velo);
  let flusso = null, timer = null;
  const chiudi = () => { clearInterval(timer); if (flusso) flusso.getTracks().forEach((t) => t.stop()); velo.remove(); };
  return new Promise((risolvi) => {
    velo.querySelector('#fotoChiudi').onclick = () => { chiudi(); risolvi(null); };
    (async () => {
      try {
        flusso = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = velo.querySelector('#fotoVideo'); video.srcObject = flusso;
        const voluti = ['code_128', 'code_39', 'ean_13', 'ean_8', 'itf', 'codabar', 'qr_code'];
        const formati = (await BarcodeDetector.getSupportedFormats()).filter((f) => voluti.includes(f));
        /* Chrome c'e' ma il modulo dei codici no (sul Sunmi senza i servizi
           Google risponde con zero formati, e «Failed to construct
           BarcodeDetector», 5 settembre 2026): si dice, e il bottone non
           compare piu' su questo palmare — resta il lettore del Sunmi */
        if (!formati.length) {
          chiudi(); localStorage.setItem('posSenzaFotocamera', '1');
          alert('Questo palmare non legge i codici con la fotocamera: usi il lettore del palmare, che scrive nel campo da solo.');
          risolvi(null); return;
        }
        const lettore = new BarcodeDetector({ formats: formati });
        timer = setInterval(async () => {
          try {
            const codici = await lettore.detect(video);
            if (codici.length && codici[0].rawValue) { const v = codici[0].rawValue; chiudi(); risolvi(v); }
          } catch (e) { /* il fotogramma non e' pronto: si riprova */ }
        }, 300);
      } catch (e) { chiudi(); alert('Fotocamera non disponibile: ' + e.message); risolvi(null); }
    })();
  });
}
document.addEventListener('click', async (ev) => {
  const b = ev.target && ev.target.closest ? ev.target.closest('[data-foto]') : null;
  if (!b) return;
  const campo = document.getElementById(b.dataset.foto);
  const codice = await scansiona();
  if (codice && campo) { campo.value = codice; campo.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' })); }
});

/* ---------- il tastierino: quantita' e prezzi si battono, non si scrivono ----------
   Come sul POS che i camerieri conoscono: si digita la cifra e si conferma.
   Niente finestrelle di sistema, che sul palmare sono lente e coprono tutto. */
function chiediNumero(titolo, { decimale = false, valore = '' } = {}) {
  return new Promise((risolvi) => {
    let v = String(valore);
    const velo = document.createElement('div');
    velo.className = 'velo';
    const disegna = () => {
      velo.innerHTML = `<div class="pannello tastiera">
        <h3>${esc(titolo)}</h3>
        <output class="tastieraCifre">${esc(v || '0')}</output>
        <div class="tastierino">${[1,2,3,4,5,6,7,8,9].map((n) => `<button data-t="${n}">${n}</button>`).join('')}
          <button data-t="${decimale ? ',' : 'c'}">${decimale ? ',' : 'C'}</button><button data-t="0">0</button><button data-t="canc">←</button></div>
        <div class="due"><button class="bottone sec" data-t="esci">Annulla</button><button class="bottone" data-t="ok">Fatto</button></div></div>`;
      velo.querySelectorAll('[data-t]').forEach((b) => b.onclick = (ev) => {
        ev.stopPropagation();
        const k = b.dataset.t;
        if (k === 'esci') { velo.remove(); return risolvi(null); }
        if (k === 'ok') { velo.remove(); const n = Number(String(v).replace(',', '.')); return risolvi(Number.isFinite(n) && n > 0 ? n : null); }
        if (k === 'canc') v = v.slice(0, -1);
        else if (k === 'c') v = '';
        else if (k === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
        else v = (v === '0' ? '' : v) + k;
        disegna();
      });
    };
    velo.onclick = (ev) => { if (ev.target === velo) { velo.remove(); risolvi(null); } };
    document.body.appendChild(velo);
    disegna();
  });
}

/* ---------- il tocco lungo (450 ms) su un elemento ---------- */
function toccoLungo(el, fn) {
  if (!el) return;
  let t = null;
  const via = () => { clearTimeout(t); t = null; };
  el.addEventListener('pointerdown', (ev) => { via(); t = setTimeout(() => { t = null; if (navigator.vibrate) navigator.vibrate(30); fn(ev); }, 450); }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave', 'pointermove'].forEach((n) => el.addEventListener(n, (ev) => { if (n === 'pointermove' && t && Math.hypot(ev.movementX, ev.movementY) < 4) return; via(); }, { passive: true }));
  el.addEventListener('contextmenu', (ev) => ev.preventDefault());
}

/* ---------- avvio ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/pos/sw.js', { scope: '/pos' }).catch(() => {});

/* Sul palmare la tastiera copre meta' schermo, e coi pannelli in fondo
   il motivo dello storno si scriveva alla cieca (la proprieta', 4
   settembre 2026). Si aspetta che la tastiera sia salita, poi si porta
   il campo al centro di quel che resta. Vale per ogni campo di ogni
   pannello: un ascoltatore solo, qui. */
document.addEventListener('focusin', (ev) => {
  const campo = ev.target;
  if (!campo || !campo.closest || !campo.closest('.pannello')) return;
  setTimeout(() => campo.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
});
(async () => {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) { /* niente */ }
  if (SESSIONE && CAMERIERE) {
    try { await caricaMenu(); tocco(); schermataSala(); return; } catch { /* sessione scaduta: giu' */ }
  }
  accesso();
})();
