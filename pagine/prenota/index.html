<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1A3626" />
<meta name="robots" content="index,follow" />
<title>Prenotazione camere — Hotel Terme Leonardo</title>
<link rel="icon" href="/buoni/img/logo-quadrato.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
:root{
  --verde:#1A3626; --verde-medio:#3C5346; --acqua:#8FC4BC; --acqua-chiara:#E4F0EA;
  --oro:#C9A961; --crema:#F9F6F0; --grigio:#7B756A; --allarme:#C0392B;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--crema);color:#2A2E2B;
  font:15px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.testata{background:var(--acqua-chiara);padding:34px 20px 30px;text-align:center;position:relative;}
/* la lingua e' una scelta che si fa una volta: sta in un angolo, non in
   mezzo al percorso. Una select vera e non un menu finto: sui telefoni
   apre il selettore di sistema, che si usa meglio di qualunque tendina
   disegnata a mano */
.sceltaLingua{position:absolute;top:12px;right:12px;}
.sceltaLingua select{width:auto;margin:0;padding:6px 26px 6px 9px;font-size:14px;
  border-radius:8px;border:1px solid rgba(26,54,38,.15);background:rgba(255,255,255,.8);
  color:var(--verde-medio);cursor:pointer;}
.testata img{width:210px;max-width:60%;height:auto;display:block;margin:0 auto;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:34px;line-height:1.2;color:var(--verde);margin:20px 0 8px;}
.occhiello{font-size:11px;letter-spacing:3px;color:var(--oro);text-transform:uppercase;}
.sotto{color:var(--verde-medio);max-width:560px;margin:0 auto;}
main{max-width:640px;margin:0 auto;padding:26px 18px 60px;}
.riquadro{background:#fff;border:1px solid #E5E0D8;border-radius:14px;
  padding:22px;margin-bottom:18px;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:23px;
  color:var(--verde);margin:0 0 4px;}
.guida{color:var(--grigio);font-size:13.5px;margin-bottom:16px;}
/* niente maiuscoletto: le etichette si leggono come frasi, non come
   voci di un modulo da sportello */
label{display:block;font-size:13.5px;
  color:var(--verde-medio);font-weight:500;margin-top:15px;}
input,select,textarea{width:100%;margin-top:6px;padding:12px 13px;font:15px inherit;
  border:1px solid #DCD6CB;border-radius:9px;background:#FCFBF8;color:#2A2E2B;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acqua);border-color:transparent;}
textarea{min-height:80px;resize:vertical;}
.due{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tre{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:560px){.due,.tre{grid-template-columns:1fr 1fr;}}
/* SOTTO I 420px il prezzo va a capo sotto il nome della tariffa: su un
   telefono stretto «Matrimoniale Queen» e «380,00 €» sulla stessa riga
   spezzano tutti e due. */
@media(max-width:420px){
  .proposta .riga,.aggiungi .riga{display:block;}
  .proposta .prezzoBox,.aggiungi .prezzoBox{text-align:left;margin-top:6px;}
  .proposta .dettPrezzo,.aggiungi .dettPrezzo{text-align:left;}
}
.spunta{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:14.5px;
  color:var(--verde-medio);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;}
.spunta input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;}
.avviso{background:#FFF6E8;border-left:4px solid var(--oro);padding:13px 15px;
  border-radius:6px;font-size:13.5px;color:#6B4A22;margin-bottom:18px;line-height:1.6;}
.errore{margin-top:14px;background:#FDF0EE;border-left:4px solid var(--allarme);
  padding:13px 15px;border-radius:6px;color:#7A2E24;font-size:14px;line-height:1.6;}
.invia{width:100%;margin-top:22px;padding:16px;border:0;border-radius:999px;
  background:var(--verde);color:var(--crema);font:600 16px inherit;cursor:pointer;}
.invia:disabled{background:#B9BDB6;cursor:default;}
/* LA BARRA DELLA SCELTA. Sta in fondo al contenuto ma si appiccica al
   bordo basso della finestra: prima il pulsante era l'ultimo elemento
   dopo tutte le categorie, e chi aveva appena scelto una camera doveva
   scorrere il resto dell'elenco per scoprire come si andava avanti.
   Quando una scelta c'e', la barra la ripete: la stessa riga che
   l'ospite rivede sulla schermata dopo. */
.barraScelta{position:sticky;bottom:0;z-index:5;margin-top:22px;
  padding-bottom:12px;background:var(--crema);
  box-shadow:0 -12px 16px -10px rgba(42,46,43,.22);}
.barraScelta .scelto{background:#fff;border:1px solid var(--oro);
  border-radius:12px;padding:10px 14px;margin-bottom:10px;
  font-size:14px;text-align:center;}
.barraScelta .invia{margin-top:0;}
/* «Vedi anche le altre»: secondario, non deve competere col verde
   pieno del Continua. */
/* L'avviso del giorno stesso: giallo come gli altri avvisi, non rosso.
   Non e' un errore dell'ospite aver scelto oggi. */
.avvisoOggi{margin:12px 0 0;}
.avvisoCane{margin:10px 0 0;}
/* il campo del buono: casella e pulsante sulla stessa riga */
.rigaBuono{display:flex;gap:8px;align-items:stretch;}
.rigaBuono input{flex:1 1 auto;text-transform:uppercase;}
.rigaBuono .altre{width:auto;flex:0 0 auto;margin-top:0;padding:0 18px;}
.caparraBuono{margin-top:14px;background:#EAF3EE;border-left:4px solid var(--verde-medio);
  padding:13px 15px;border-radius:6px;font-size:14px;line-height:1.6;color:#1B4D4A;}
.iconaCane{margin-right:6px;}
/* la tassa sul passo dei dati: sobria, per non competere col riquadro
   della caparra che le sta sopra */
.tassaDati{color:var(--grigio);font-size:12.5px;margin-top:10px;line-height:1.55;}
/* La tassa di soggiorno: sta in cima all'elenco delle camere, dove i
   prezzi si confrontano. La regola della casa e' che si dice sempre
   quando si comunica un prezzo, e questa pagina i prezzi li comunica. */
.tassa{margin:0 0 14px;}
/* «Inclusi nel soggiorno»: un <details> vero, non un finto pannello a
   JavaScript. Si apre da tastiera, lo legge lo screen reader, e se il
   copione non parte resta comunque apribile. */
.inclusi{margin:0 0 16px;border:1px solid #E5E0D8;border-radius:10px;
  background:#FCFBF8;}
.inclusi>summary{cursor:pointer;padding:11px 14px;font-weight:600;
  color:var(--verde);font-size:14px;list-style-position:inside;}
.inclusi ul{margin:0;padding:0 16px 12px 30px;}
.inclusi li{color:var(--grigio);font-size:13px;line-height:1.65;}
/* il prezzo e la sua spiegazione, incolonnati a destra */
/* in riga resta il solo prezzo, che e' corto. La frase «totale · 2
   adulti × 190,00 € a persona» sta SOTTO, a tutta larghezza: in colonna
   non si stringeva e su un telefono schiacciava il nome della tariffa a
   tre parole per riga. */
.proposta .prezzoBox{text-align:right;flex:0 0 auto;}
.proposta .riga > div:first-child{min-width:0;}
.proposta .dettPrezzo{color:var(--grigio);font-size:11.5px;margin-top:4px;
  line-height:1.4;text-align:right;}
/* LA FAMIGLIA: la tariffa base e, attaccata sotto, la stessa offerta con
   la cena. Tratteggiata e non piena: e' un'aggiunta, non una terza
   tariffa da confrontare. */
.famiglia{margin-top:0;}
.famiglia + .famiglia{margin-top:10px;}
.famiglia .proposta{margin-top:0;}
.aggiungi{display:block;width:100%;text-align:left;background:#FDFBF3;
  border:1.5px dashed var(--oro);border-radius:10px;padding:10px 14px;
  margin-top:4px;cursor:pointer;font:inherit;color:inherit;}
.aggiungi.selezionata{border-style:solid;background:#FBF6E4;}
.aggiungi .riga{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.aggiungi .riga > div:first-child{min-width:0;}
.aggiungiTit{font-weight:600;color:var(--verde);font-size:13.5px;}
.aggiungiSotto{color:#6B4A22;font-size:12.5px;margin-top:1px;line-height:1.45;}
.aggiungi .prezzoPiu{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;
  color:var(--verde-medio);}
.aggiungi .dettPrezzo{color:var(--grigio);font-size:11.5px;margin-top:4px;line-height:1.4;text-align:right;}
.aggiungi .prezzoBox{text-align:right;flex:0 0 auto;}
/* la via delle camere separate: stessa forma del «vedi anche le altre»,
   ma e' un collegamento e non un pulsante, perche' porta via da qui */
.altre.separate{text-decoration:none;text-align:center;box-sizing:border-box;}
.altre{display:block;width:100%;margin-top:4px;padding:13px;background:none;
  border:1.5px solid var(--verde-medio);border-radius:999px;color:var(--verde);
  font:600 15px inherit;cursor:pointer;}
/* il cartello della serie: sopra tutto, perche' e' la prima cosa da
   sapere quando la pagina si riapre uguale a prima */
.cartello{max-width:640px;margin:18px auto -6px;padding:11px 15px;
  background:#EAF3EE;border-left:4px solid var(--verde-medio);border-radius:6px;
  font-size:13.5px;color:#1B4D4A;}
.fatta{text-align:center;padding:40px 22px;}
/* GLI INVITI. Transfer e trattamenti restano richieste loro, coi moduli
   che esistono gia': qui c'e' solo il collegamento, coi dati dell'ospite
   dentro l'indirizzo perche' non li ridigiti. Stanno sulla schermata e
   NON nell'email: l'ospite e' ancora qui, e la ricevuta e' gia' densa
   (prezzo, caparra, tassa di soggiorno, cane). */
.inviti{margin-top:30px;padding-top:22px;border-top:1px solid #E5E0D8;}
.invitiTit{color:var(--verde);font-weight:600;font-size:15px;margin-bottom:12px;}
.invito{display:block;padding:12px 16px;margin-top:8px;border:1.5px solid var(--verde-medio);
  border-radius:999px;color:var(--verde);text-decoration:none;font-weight:600;font-size:14px;}
.invitiNota{color:var(--grigio);font-size:12.5px;margin-top:10px;}
.fatta .rif{font-family:"Courier New",monospace;font-size:20px;color:var(--verde);
  letter-spacing:1px;margin-top:10px;}
.pie{text-align:center;color:var(--grigio);font-size:12.5px;padding:0 18px 40px;}
.pie a{color:var(--verde-medio);}

/* ---- passi: tre schermate in una pagina sola, un indicatore leggero ---- */
.passi{display:flex;justify-content:center;gap:8px;margin:0 auto 22px;max-width:640px;
  padding:0 18px;}
.passi span{flex:1;height:3px;border-radius:3px;background:#E5E0D8;}
.passi span.fatto,.passi span.attivo{background:var(--oro);}
.indietro{display:inline-block;background:none;border:0;padding:0;margin-bottom:6px;
  color:var(--verde-medio);font-size:13px;cursor:pointer;text-decoration:underline;}

/* ---- ospiti e bambini ---- */
.eta-bambini{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:10px;margin-top:10px;}
.eta-bambini div label{margin-top:0;}

/* ---- riepilogo della scelta fatta, ricordo per non farla ridigitare ---- */
.riepilogo{background:var(--acqua-chiara);border-radius:10px;padding:12px 15px;
  font-size:13.5px;color:var(--verde-medio);margin-bottom:18px;line-height:1.6;}
.riepilogo strong{color:var(--verde);}

/* ---- le camere proposte, raggruppate per camera: una scheda per proposta ---- */
.gruppoCamera{margin-bottom:16px;}
.gruppoCamera:last-child{margin-bottom:0;}
.gruppoCamera .foto{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;
  border-radius:10px;margin-bottom:8px;background:#F0EDE6;}
.gruppoCamera h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:19px;color:var(--verde);margin:0 0 2px;}
.gruppoCamera .descrizione{color:var(--grigio);font-size:13px;margin-bottom:8px;}
/* la riga con «fino a N adulti» a sinistra e la «i» a destra, all altezza
   del primo prezzo */
.gruppoCamera .rigaInfo{display:flex;justify-content:space-between;
  align-items:center;gap:10px;margin-bottom:8px;}
.gruppoCamera .maxAdulti{color:var(--grigio);font-size:12px;}
.infoInclusi{flex:0 0 auto;width:22px;height:22px;padding:0;border-radius:50%;
  border:1.5px solid var(--verde-medio);background:none;color:var(--verde-medio);
  font:600 12px Georgia,serif;line-height:1;cursor:pointer;}
.proposta{display:block;width:100%;text-align:left;background:#FCFBF8;
  border:1.5px solid #DCD6CB;border-radius:10px;padding:12px 14px;margin-top:8px;
  cursor:pointer;font:inherit;color:inherit;}
.proposta:first-of-type{margin-top:0;}
.proposta.selezionata{border-color:var(--oro);background:#FDFBF3;}
.proposta .riga{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.proposta .tariffa{font-weight:600;color:var(--verde);}
.proposta .trattamento{color:var(--verde-medio);font-size:13px;margin-top:1px;}
/* la riga che spiega un pacchetto: piu' spenta del trattamento, perche'
   e' un di piu' e non la formula */
.proposta .piano{color:var(--grigio);font-size:12.5px;margin-top:2px;}
.proposta .prezzo{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;
  color:var(--oro);white-space:nowrap;}

/* ---- condizioni di cancellazione: si stampano come arrivano dal server ---- */
.condizioni{margin-top:4px;border:1px solid #E5E0D8;border-radius:10px;
  background:#FCFBF8;padding:14px 16px;}
.condizioni .tit{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--oro);margin-bottom:8px;}
.condizioni ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;
  color:var(--verde-medio);}
.condizioni ul li{margin-bottom:4px;}
.condizioni .recesso{font-size:12px;color:var(--grigio);margin-top:10px;
  padding-top:10px;border-top:1px solid #E5E0D8;}
.caparra{background:var(--acqua-chiara);border-left:4px solid var(--acqua);
  padding:13px 15px;border-radius:6px;font-size:13.5px;color:var(--verde-medio);
  margin-top:16px;line-height:1.6;}
.obb{color:var(--allarme);font-weight:700;}
.legenda{color:var(--grigio);font-size:12.5px;margin-top:16px;text-align:right;}
</style>
</head>
<body>

<div class="testata">
  <div class="sceltaLingua" id="tLingue"></div>
  <a href="https://www.hoteltermeleonardo.com/" target="_blank" rel="noopener noreferrer"
    title="Vai al sito dell'hotel">
    <img src="/buoni/img/logo.svg" alt="Hotel Terme Leonardo" /></a>
  <div class="occhiello" style="margin-top:22px;" id="tOcchiello"></div>
  <h1 id="tTitolo"></h1>
  <p class="sotto" id="tSotto"></p>
</div>

<div class="passi" id="passi"></div>
<!-- IL CARTELLO DELLA SERIE. Chi aggiunge una camera a una richiesta
     gia' fatta si ritrova davanti una pagina identica a quella di
     prima: senza una riga che dica dove si trova, non lo capisce. -->
<div id="collegata"></div>
<main id="app"></main>

<div class="pie" id="tPie"></div>

<script type="module">
'use strict';
/* Tre schermate in un unico file — date e ospiti, le camere, i dati — come
   indicato nel brief: una pagina sola e' piu' facile da tenere sorella
   delle altre che una cascata di file quasi identici. La logica pura
   (centesimi->euro, corpo della richiesta, scelta della lingua) sta in
   logica.js, cosi' si prova anche senza aprire un browser: vedi
   logica.test.ts. */

/* PERCORSO ASSOLUTO, NON './logica.js'. Un modulo si risolve contro
   l'indirizzo che si vede nella barra, non contro il file servito. Questa
   pagina vive in due posti: arrivo-terme-leonardo.vercel.app/prenota/ e
   www.hoteltermeleonardo.com/it/prenota — quest'ultimo e' una riscrittura
   di vercel.json e nella barra resta /it/prenota, senza barra finale.
   Li' './logica.js' diventa /it/logica.js, che nessuna riscrittura copre:
   404, oppure l'index.html della SPA servito come text/html, che un modulo
   rifiuta. In entrambi i casi testata() e disegna() non partono mai e
   l'ospite vede il logo e una pagina bianca.
   '/prenota/logica.js' invece e' lo stesso su tutti e due i domini: sul
   primo e' il file vero, sul secondo lo copre la riscrittura
   /prenota/:percorso*. Vale comunque sia scritto l'indirizzo nella barra,
   ed e' la regola per ogni risorsa di queste pagine — la presidia
   percorsi-web.test.ts, cosi' non torna con la prossima pagina che
   qualcuno divide in due file. */
import { aPersonaCent, aPersonaNotteCent, componiCorpo, euroDaCentesimi, linguaScelta } from '/prenota/logica.js';
import { altFoto, fotoDi } from '/prenota/foto.js';
/* PERCORSO ASSOLUTO, stessa ragione di sopra. Con quale ordine si
   propongono le categorie: sta in un modulo suo perche' e' una regola
   commerciale, non un dettaglio di disegno — vedi ordine.js. */
import { adatte, daMostrare, ordinaGruppi, perPrezzo } from '/prenota/ordine.js';
/* PERCORSO ASSOLUTO, stessa ragione. Che cosa comprende il trattamento:
   le parole sono quelle della casa, vedi formule.js. */
import { formulaDi } from '/prenota/formule.js';
/* PERCORSO ASSOLUTO, stessa ragione. Che cosa comprende il soggiorno:
   l'elenco e' quello della Knowledge Base, vedi inclusi.js. */
import { inclusiIn } from '/prenota/inclusi.js';
/* PERCORSO ASSOLUTO, stessa ragione. Che cosa comprende un piano
   tariffario oltre al trattamento: vedi piani.js. */
import { massaggioDelPiano } from '/prenota/piani.js';
/* PERCORSO ASSOLUTO, stessa ragione. Il motore risponde sempre in
   italiano, qualunque lingua gli si chieda: vedi nomi.js. */
import { nomeTariffa, nomeTrattamento } from '/prenota/nomi.js';
/* PERCORSO ASSOLUTO, stessa ragione. Il supplemento del cane: sta in un
   modulo suo perche' e' un numero della casa, vedi cane.js. */
import { SUPPLEMENTO_CANE_CENT } from '/prenota/cane.js';
/* PERCORSO ASSOLUTO, stessa ragione. Che cosa succede alla caparra
   quando c'e' un buono: vedi buono.js. */
import { caparraDopoBuono, valoreInCentesimi } from '/prenota/buono.js';
/* PERCORSO ASSOLUTO, stessa ragione. Le tariffe che sono la stessa
   offerta con e senza cena si accorpano: vedi famiglie.js. */
import { accorpa } from '/prenota/famiglie.js';
/* PERCORSO ASSOLUTO, stessa ragione. L'indirizzo pubblico dei moduli
   transfer e trattamenti, coi dati dell'ospite gia' dentro. */
import { indirizzoModulo } from '/comune/percorso.js';
/* PERCORSO ASSOLUTO, stessa ragione. Dopo una certa ora il giorno stesso
   non si prenota da qui — il perche' sta in giorno-stesso.js. */
import { chiusoPerOggi, oraLimite } from '/prenota/giorno-stesso.js';
/* Lo stesso sistema del modulo transfer: l'asterisco sui campi
   obbligatori, l'elenco di cio' che manca DAVVERO, e il fuoco sul primo
   campo vuoto. Vive in un posto solo perche' le pagine sono tre. */
import { mancanti, nomiMancanti, segnaEtichette, segnaVuoti } from '/comune/obbligatori.js';

/* Stessa regola di sopra, stesso motivo: PERCORSO ASSOLUTO. `/comune/date.js`,
   mai un percorso relativo — vedi il commento di date.js per il dettaglio. */
import { adessoARoma, attivaDate, nottiFra, oggiISO } from '/comune/date.js';
/* IDEM PERCORSO ASSOLUTO: i parametri che i pulsanti delle email della
   reception scrivono nell'indirizzo (rif, nome, email, tel, arrivo,
   partenza, adulti, lang) — vedi il commento in cima a ospite-url.js per
   il perche' e il contratto (ripulisce, non fa escaping: tocca comunque
   a `esc()` qui sotto, come per ogni altro campo di questa pagina). */
import { normalizzaLingua, parametriOspite } from '/comune/ospite-url.js';

const FUNZIONE = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/richieste';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* la lingua guarda anche il PERCORSO, non solo `?l=`: sul dominio
   dell'hotel gli indirizzi sono /it/prenota, /de/buchen, /en/book,
   /fr/reserver e li' `?l=` non c'e'. Regole e precedenze in logica.js. */
let LNG = linguaScelta(location.pathname, normalizzaLingua(location.search), navigator.language);

/* Il ripiego per chi non ha un token: dati dell'ospite letti dall'indirizzo
   stesso, come li scrivono i pulsanti delle email della reception. Questa
   pagina non ha una precompilazione da token (nessun `?t=` qui): DA_URL e'
   la sola fonte, non un ripiego che qualcosa di piu' forte possa
   scavalcare — a differenza di richieste/index.html e
   richieste/transfer/index.html. */
const DA_URL = parametriOspite(location.search);
/* Una data passata non si propone come punto di partenza di una ricerca:
   il server la rifiuterebbe comunque (arrivo nel passato, valida.ts), e

/* ---------------- stato della pagina ---------------- */
let STATO = 'ricerca';           // 'ricerca' | 'camere' | 'dati' | 'fatta'
let RICERCA = null;              // { arrivo, partenza, adulti, bambini, eta_bambini }
let PROPOSTE = [];                // risposta di a=disponibilita
let CAPARRA_CENT = 0;
let CONDIZIONI = { righe: [], recesso: '' };
let SCELTA = null;                // la proposta scelta
let TUTTE_LE_CAMERE = false;      // l'ospite ha chiesto di vederle tutte
/* i contatti appena scritti, per non farli ridigitare sul modulo dopo:
   quando la schermata finale si disegna il modulo non c'e' piu' */
let OSPITE = null;
/* quello che l'ospite ha gia' DIGITATO nel modulo. Serve perche' da qui
   si puo' ancora cambiare tariffa, e ridisegnare la schermata
   cancellerebbe nome, email e telefono appena scritti: chi se li vede
   sparire non li riscrive, se ne va. */
let SCRITTI = null;
let NUMERO_FATTA = '';       // il numero appena assegnato, per legarci la camera dopo
/* il buono verificato: { codice, valore_cent } quando e' valido, una
   chiave d'errore quando non lo e', null quando non se n'e' parlato */
/* quante camere ha detto di volere: serve a scrivere «camera 2 di 3» sul
   cartello e a passarlo alla camera dopo. Zero = non l'ha detto. */
let CAMERE_TOTALI = Number(DA_URL.di) || 0;
let BUONO = null;
let BUONO_KO = '';
let VERIFICANDO_BUONO = false;
const FUNZIONE_BUONI = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/buoni';
let CERCANDO = false;
let INVIANDO = false;

function testata() {

  $('tPie').innerHTML = `Hotel Terme Leonardo &middot; Via Monteortone, 46, 35037 Monteortone di Abano Terme (PD) &middot;
    <a href="tel:+390499939200">+39 049 9939200</a> &middot;

function passi() {
  const ordine = ['ricerca','camere','dati'];
  const i = ordine.indexOf(STATO === 'fatta' ? 'dati' : STATO);
  $('passi').innerHTML = ordine.map((_, n) =>
    `<span class="${n < i ? 'fatto' : n === i ? 'attivo' : ''}"></span>`).join('');
}

/* L'avviso del giorno stesso si scrive ACCANTO ALLE DATE e non sotto il
   pulsante, perche' parla della data che l'ospite ha appena scelto. Sta
   qui fuori perche' lo chiamano in due: il cambio della data, che lo fa
   comparire subito, e il tentativo di ricerca, che lo ripete. */
function avvisoGiornoStesso() {
  const box = $('avvisoOggi');
  if (!box) return;
  const t = T[LNG];
  const arrivo = $('fArrivo') ? $('fArrivo').value : '';
  box.innerHTML = chiusoPerOggi(arrivo, adessoARoma())
    ? `<div class="avviso avvisoOggi">${esc(t.giornoStesso(oraLimite()))}</div>`
    : '';
}

/* QUANTE PERSONE STANNO IN UNA CAMERA. La piu' grande ne tiene quattro:
   sopra, servono per forza due camere. E gia' da tre conviene dirlo,
   perche' chi cerca per tre adulti spesso vuole camere separate.

   SI DICE PRIMA DI CERCARE, non dopo: arrivare a un elenco corto senza
   una spiegazione e' quello che fa chiudere la pagina. */
const PERSONE_PER_CAMERA = 4;

function avvisoPersone() {
  const box = $('avvisoPersone');
  if (!box) return;
  const t = T[LNG];
  const n = (Number($('fAdulti') && $('fAdulti').value) || 0) +
    (Number($('fBambini') && $('fBambini').value) || 0);
  /* sotto le tre persone non c'e' niente da decidere: la domanda sarebbe
     rumore in cima all'imbuto, e le domande in piu' costano richieste */
  if (n < 3) {
    box.innerHTML = '';
    return;
  }
  const scelte = [1, 2, 3].map((k) =>
    `<option value="${k}"${CAMERE_TOTALI === k ? ' selected' : ''}>` +
    `${esc(k === 1 ? t.unaCamera : t.nCamere(k))}</option>`
  ).join('');
  box.innerHTML = `
    <div class="avviso avvisoOggi">${esc(
      n > PERSONE_PER_CAMERA ? t.servonoDueCamere(n) : t.forsePiuCamere(n),
    )}</div>
    <label for="fCamere" style="margin-top:12px;">${esc(t.quanteCamere)}</label>
    <select id="fCamere">${scelte}</select>
    ${CAMERE_TOTALI > 1
      ? `<div class="guida" style="margin-top:6px;">${esc(t.primaCamera(CAMERE_TOTALI))}</div>`
      : ''}`;
  $('fCamere').onchange = () => {
    CAMERE_TOTALI = Number($('fCamere').value) || 0;
    avvisoPersone();
  };
}

/* ================= passo 1: date e ospiti ================= */

function schermaRicerca(erroreIniziale) {
  const t = T[LNG];
  const r = RICERCA || { arrivo: ARRIVO_URL, partenza: PARTENZA_URL, adulti: DA_URL.adulti || 2, bambini: 0 };
  $('app').innerHTML = `
    <div class="avviso">${esc(t.sotto)}</div>
    <div class="riquadro">
      <h2>${esc(t.dateTit)}</h2><div class="guida">${esc(t.dateGuida)}</div>
      <div class="due">
        <div><label for="fArrivo">${esc(t.arrivo)}</label>
          <input type="date" id="fArrivo" name="arrivo" min="${oggiISO()}" value="${esc(r.arrivo)}" /></div>
        <div><label for="fPartenza">${esc(t.partenza)}</label>
          <input type="date" id="fPartenza" name="partenza" min="${oggiISO()}" value="${esc(r.partenza)}" /></div>
      </div>
      <div id="avvisoOggi"></div>
      <div id="avvisoPersone"></div>
      <div class="due">
        <div><label for="fAdulti">${esc(t.adulti)}</label>
          <input type="number" id="fAdulti" min="1" max="10" value="${r.adulti}" /></div>
        <div><label for="fBambini">${esc(t.bambini)}</label>
          <input type="number" id="fBambini" min="0" max="6" value="${r.bambini}" /></div>
      </div>
      <div class="eta-bambini" id="boxEta"></div>
    </div>
    <button class="invia" id="bCerca" data-testid="cerca">${esc(t.cerca)}</button>
    <div id="esitoRicerca">${erroreIniziale ? `<div class="errore">${esc(erroreIniziale)}</div>` : ''}</div>`;

  const disegnaEta = () => {
    const n = Math.max(0, Math.min(6, Number($('fBambini').value) || 0));
    const precedenti = (RICERCA && RICERCA.eta_bambini) || [];
    $('boxEta').innerHTML = Array.from({ length: n }).map((_, i) => `
      <div><label for="fEta${i}">${esc(t.etaBambino(i + 1))}</label>
        <select id="fEta${i}">
          <option value="">${esc(t.etaOpt)}</option>
          ${Array.from({ length: 18 }).map((__, e) =>
            `<option value="${e}"${precedenti[i] === e ? ' selected' : ''}>${e}</option>`).join('')}
        </select></div>`).join('');
  };
  disegnaEta();
  $('fBambini').oninput = disegnaEta;

  $('bCerca').onclick = cercaDisponibilita;
  /* non si aspetta il clic su «Cerca»: appena la data scelta e' oggi e
     l'ora italiana e' passata, lo si dice */
  $('fArrivo').addEventListener('change', avvisoGiornoStesso);
  avvisoGiornoStesso();
  /* e l'avviso sulle piu' camere: si dice PRIMA di cercare, cosi' il
     filtro parte gia' giusto invece di far arrivare a un elenco corto
     senza spiegazione */
  $('fAdulti').addEventListener('input', avvisoPersone);
  $('fBambini').addEventListener('input', avvisoPersone);
  avvisoPersone();
}

async function cercaDisponibilita() {
  const t = T[LNG];
  if (CERCANDO) return;
  const arrivo = $('fArrivo').value, partenza = $('fPartenza').value;
  const adulti = Number($('fAdulti').value) || 0;
  const nBambini = Math.max(0, Math.min(6, Number($('fBambini').value) || 0));

  if (!arrivo || !partenza || adulti < 1) {
    $('esitoRicerca').innerHTML = `<div class="errore">${esc(t.mancaRicerca)}</div>`;
    return;
  }
  if (partenza <= arrivo) {
    $('esitoRicerca').innerHTML = `<div class="errore">${esc(t.partenzaPrimaArrivo)}</div>`;
    return;
  }
  /* il giorno stesso, passata l'ora, non si cerca nemmeno: la camera non
     farebbe in tempo a essere pronta e la reception lo sa dire meglio al
     telefono. Vedi giorno-stesso.js. */
  if (chiusoPerOggi(arrivo, adessoARoma())) {
    $('esitoRicerca').innerHTML = '';
    avvisoGiornoStesso();
    return;
  }
  /* stesso tetto della ricerca e dell'invio: adulti PIU' bambini, non
     adulti e basta. Prima 8 adulti e 3 bambini cercavano, sceglievano,
     compilavano tutto e venivano respinti solo alla fine; e il messaggio
     che leggevano non parlava di quante persone fossero. */
  if (adulti + nBambini > 10) {
    $('esitoRicerca').innerHTML = `<div class="errore">${esc(t.troppePersone)}</div>`;
    return;
  }
  const eta_bambini = [];
  for (let i = 0; i < nBambini; i++) {
    const v = $('fEta' + i).value;
    if (v === '') {
      $('esitoRicerca').innerHTML = `<div class="errore">${esc(t.mancaEta)}</div>`;
      return;
    }
    eta_bambini.push(Number(v));
  }

  CERCANDO = true;
  $('bCerca').disabled = true;
  $('bCerca').textContent = t.cercando;
  $('esitoRicerca').innerHTML = '';

  try {
    const r = await fetch(FUNZIONE + '?a=disponibilita', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        check_in: arrivo, check_out: partenza, adulti,
        ...(nBambini > 0 ? { bambini: nBambini, eta_bambini } : {}),
        lingua: LNG,
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.esito !== 'ok') {
      console.error('disponibilita non riuscita:', r.status, d);
      throw new Error('ko');
    }
    RICERCA = { arrivo, partenza, adulti, bambini: nBambini, eta_bambini };
    PROPOSTE = Array.isArray(d.proposte) ? d.proposte : [];
    CAPARRA_CENT = Number(d.caparra_cent) || 0;
    CONDIZIONI = d.condizioni && Array.isArray(d.condizioni.righe)
      ? d.condizioni : { righe: [], recesso: '' };
    SCELTA = null;
    /* una ricerca nuova riparte chiusa: le due davanti sono altre */
    TUTTE_LE_CAMERE = false;
    SCRITTI = null;
    BUONO = null;
    BUONO_KO = '';

    if (!PROPOSTE.length) {
      CERCANDO = false;
      $('bCerca').disabled = false;
      $('bCerca').textContent = t.cerca;
      $('esitoRicerca').innerHTML = `<div class="errore">${esc(t.nessunaCamera)}</div>`;
      return;
    }
    /* IL SEMAFORO SI SPEGNE ANCHE QUI. Si spegneva solo quando non
       c'erano camere e quando la ricerca falliva: sulla strada buona
       restava acceso, e tornando indietro a cambiare le date «Vedi le
       camere» non rispondeva piu'. Nessuno se ne accorgeva perche' la
       schermata cambia subito. */
    CERCANDO = false;
    STATO = 'camere';
    disegna();
  } catch (e) {
    console.error(e);
    CERCANDO = false;
    $('bCerca').disabled = false;
    $('bCerca').textContent = t.cerca;
    $('esitoRicerca').innerHTML = `<div class="errore">${esc(t.erroreRicerca)}</div>`;
  }
}

/* Il trattamento con la sua formula a parole: «Mezza Pensione ·
   colazione e cena a buffet». Quello che formule.js non riconosce esce
   com'e' sempre uscito, col solo nome: non si indovina. */
function conFormula(trattamento, t) {
  const k = formulaDi(trattamento);
  const dice = k === 'cena' ? t.formulaCena : k === 'colazione' ? t.formulaColazione : '';
  return dice ? `${trattamento} · ${dice}` : trattamento;
}

/* IL PREZZO E' IL TOTALE DEL SOGGIORNO, e finora non lo diceva nessuno:
   chi legge «190,00 €» sotto «2 adulti» non sa se sono 190 in tutto o a
   testa. Il motore del sito vecchio scrive «Adulti 2 x € 95» proprio per
   questo.

   COI BAMBINI NON SI DIVIDE. Hanno un prezzo loro, e dividere il totale
   per i soli adulti direbbe un numero falso su una pagina che vende. In
   quel caso si dice solo che e' il totale, che e' vero sempre. */
function dettaglioDelPrezzo(cent, t) {
  const adulti = Number(RICERCA && RICERCA.adulti) || 0;
  const uno = aPersonaCent(cent, adulti, RICERCA && RICERCA.bambini);
  return t.dettaglioPrezzo(adulti, uno === null ? '' : euroDaCentesimi(uno));
}

/* L'INVITO. Che cosa si aggiunge scegliendo l'altra opzione. Quasi
   sempre e' la cena, ed e' bene dirlo con la parola giusta invece che
   col nome del trattamento: «Aggiunga la cena a buffet» si capisce,
   «Passi a Mezza Pensione» va tradotto a mente. */
function invito(v, t) {
  return formulaDi(v.trattamento) === 'cena'
    ? t.aggiungiCena
    : t.passaA(nomeTrattamento(v.trattamento, LNG));
}

/* QUANTO IN PIU', nel modo in cui una persona lo giudica davvero.
   «+140 €» e' un ostacolo; «35 € a persona a notte» e' una decisione
   facile — ed e' lo stesso numero. Il totale in piu' resta scritto
   accanto, sempre: non si sostituisce il numero vero, gli si mette
   davanti quello che si capisce. */
function quantoInPiu(v, base, t) {
  const piu = (Number(v.prezzo_cent) || 0) - (Number(base.prezzo_cent) || 0);
  const adulti = Number(RICERCA && RICERCA.adulti) || 0;
  const notti = nottiFra(RICERCA && RICERCA.arrivo, RICERCA && RICERCA.partenza);
  const aNotte = aPersonaNotteCent(piu, adulti, RICERCA && RICERCA.bambini, notti);
  return t.differenza(aNotte === null ? '' : euroDaCentesimi(aNotte), euroDaCentesimi(piu));
}

/* ================= passo 2: le camere ================= */

function schermaCamere() {
  const t = T[LNG];
  /* raggruppate per camera_id, nell'ordine in cui arrivano: una scheda
     "camera" con dentro una riga selezionabile per ogni proposta — cioe'
     per ogni combinazione di tariffa e trattamento */
  const gruppi = [];
  const perId = new Map();
  PROPOSTE.forEach((p, i) => {
    let g = perId.get(p.camera_id);
    if (!g) { g = { camera_id: p.camera_id, nome: p.nome, descrizione: p.descrizione,
      max_adulti: p.max_adulti, voci: [] }; perId.set(p.camera_id, g); gruppi.push(g); }
    g.voci.push({ ...p, indice: i });
  });
  /* dentro ogni camera, dalla piu' economica: il motore le manda in
     ordine sparso e chi guarda deve confrontarle a mente */
  for (const g of gruppi) g.voci = perPrezzo(g.voci);
  /* PRIMA si tolgono quelle che non ci stanno: il motore le restituisce
     tutte, singole comprese, a chiunque. Un bambino occupa un posto come
     chiunque altro. */
  const persone = (Number(RICERCA && RICERCA.adulti) || 0) +
    (Number(RICERCA && RICERCA.bambini) || 0);
  const capienti = adatte(gruppi, persone);
  /* QUANTE NE ABBIAMO TOLTE, e se ha senso proporre di dividersi.

     Tre adulti possono benissimo volere tre singole: amici, colleghi.
     Tre persone di cui un bambino no — il bambino dorme coi genitori,
     sul letto aggiunto o sul divano letto della junior suite, e mandarlo
     in una camera sua non e' una soluzione, e' un equivoco.

     Quindi il filtro vale sempre (una camera che non li tiene tutti non
     si mostra), ma la VIA D'USCITA si offre solo quando sono tutti
     adulti. */
  const bambiniCercati = Number(RICERCA && RICERCA.bambini) || 0;
  const separabili = !bambiniCercati && persone >= 2 &&
    capienti.length < gruppi.length;
  /* e poi nell'ordine con cui la reception le venderebbe a chi ha cercato
     per quel numero di persone */
  const inOrdine = ordinaGruppi(capienti, persone);
  /* e di quelle se ne mostrano due: le altre dietro un pulsante */
  const { visibili, restano } = daMostrare(
    inOrdine, TUTTE_LE_CAMERE, SCELTA && SCELTA.indice,
  );

  $('app').innerHTML = `
    <button type="button" class="indietro" id="bIndietroDate">${esc(t.indietroDate)}</button>
    <div class="riquadro">
      <h2>${esc(t.cameraTit)}</h2><div class="guida">${esc(t.cameraGuida)}</div>
      <!-- il motore ha risposto, ma nessuna camera tiene tutte le persone
           cercate: e' un esito diverso da «non c'e' disponibilita'», e va
           raccontato diverso — con la via d'uscita vera, che sono due
           camere. -->
      ${capienti.length === 0

               reader ne annuncia uno solo. Qui e' a un centimetro dal primo

          <div class="rigaInfo">

          ${accorpa(g.voci).map(fam => `

            <button type="button" class="proposta${SCELTA && SCELTA.indice === v.indice ? ' selezionata' : ''}"

              <div class="riga">
                <div>
                  <div class="tariffa">${esc(nomeTariffa(v.tariffa, LNG))}</div>
                  ${v.trattamento ? `<div class="trattamento">${esc(conFormula(nomeTrattamento(v.trattamento, LNG), t))}</div>` : ''}
                  ${massaggioDelPiano(v.tariffa)
                    ? `<div class="piano">${esc(t.pianoMassaggio(massaggioDelPiano(v.tariffa)))}</div>`
                    : ''}
                </div>
                <div class="prezzoBox">
                  <div class="prezzo">${euroDaCentesimi(v.prezzo_cent)} €</div>
                </div>
              </div>
              <!-- fuori dalla riga: e' la frase piu' lunga della scheda, e in
                   colonna schiacciava il nome della tariffa -->
              <div class="dettPrezzo">${esc(dettaglioDelPrezzo(v.prezzo_cent, t))}</div>
            </button>`
              : `
            <button type="button" class="aggiungi${SCELTA && SCELTA.indice === v.indice ? ' selezionata' : ''}"
              data-testid="proposta-${v.indice}" data-indice="${v.indice}">
              <div class="riga">
                <div>
                  <div class="aggiungiTit">${esc(invito(v, t))}</div>

                  <div class="prezzoPiu">${euroDaCentesimi(v.prezzo_cent)} €</div>
                </div>

              <div class="dettPrezzo">${esc(dettaglioDelPrezzo(v.prezzo_cent, t))}</div>

           con le stesse date. -->

        ? `<a class="altre separate" href="?arrivo=${esc(RICERCA.arrivo)}&partenza=${esc(RICERCA.partenza)}&adulti=1&l=${esc(LNG)}">${esc(t.separate(persone))}</a>`
        : ''}
    </div>
    <div class="barraScelta">
      ${SCELTA

      <div id="esitoCamere"></div>

  $('bIndietroDate').onclick = () => { STATO = 'ricerca'; disegna(); };
  if ($('bAltre')) $('bAltre').onclick = () => { TUTTE_LE_CAMERE = true; schermaCamere(); };
  /* la «i» apre il pannello che c'e' gia' e ci porta l'occhio: l'elenco
     resta in un posto solo, non se ne disegna una copia per camera */
  document.querySelectorAll('.infoInclusi').forEach((b) => {
    b.onclick = () => {
      const d = document.querySelector('details.inclusi');
      if (!d) return;
      d.open = true;
      d.scrollIntoView({ behavior: 'smooth', block: 'center' });

  document.querySelectorAll('.proposta').forEach(btn => {
    btn.onclick = () => {

      schermaCamere();
    };
  });
  $('bContinua').onclick = () => {
    if (!SCELTA) {
      $('esitoCamere').innerHTML = `<div class="errore">${esc(t.mancaScelta)}</div>`;
      return;
    }
    STATO = 'dati';
    disegna();
  };
}

/* LA CAPARRA, CHE IL BUONO PUO' COPRIRE.

   Si dice «il buono copre la caparra» e nient'altro: NON «non le sara'
   chiesto nulla», che sarebbe falso — restano la tassa di soggiorno e
   gli extra. Una frase che promette troppo si paga al banco. */
function disegnaCaparra() {
  const box = document.querySelector('.caparraBuono');
  if (!box) return;
  const t = T[LNG];
  const b = BUONO ? caparraDopoBuono(CAPARRA_CENT, BUONO.valore_cent) : null;
  box.textContent = !b
    ? t.caparraRiga(euroDaCentesimi(CAPARRA_CENT))
    : b.copre
    ? t.caparraCoperta
    : t.caparraRidotta(euroDaCentesimi(b.resta));
}

/* l'esito della verifica, e la caparra che ne consegue */
function disegnaEsitoBuono() {
  const box = $('esitoBuono');
  if (!box) return;
  const t = T[LNG];
  if (BUONO && BUONO.valore_cent) {
    box.innerHTML = `<div class="avviso avvisoCane">${esc(t.buonoValido(euroDaCentesimi(BUONO.valore_cent)))}</div>`;
  } else if (BUONO) {
    box.innerHTML = `<div class="avviso avvisoCane">${esc(t.buonoServizio)}</div>`;
  } else if (BUONO_KO) {
    box.innerHTML = `<div class="errore">${esc(t[BUONO_KO])}</div>`;
  } else {
    box.innerHTML = '';
  }
  disegnaCaparra();
}

/* LA VERIFICA. Un buono che non si riesce a controllare NON blocca
   l'invio: la richiesta parte lo stesso e la reception se ne occupa.
   Bloccare qui vorrebbe dire perdere una prenotazione per un guasto
   nostro.

   E UN BUONO DI SERVIZIO NON TOCCA LA CAPARRA: un ingresso Day Spa non
   e' denaro sul conto della camera. Si registra e basta, e decide la
   reception. */
async function verificaBuono() {
  if (VERIFICANDO_BUONO) return;
  const codice = String(($('fBuono') && $('fBuono').value) || '').trim().toUpperCase();
  BUONO = null;
  BUONO_KO = '';
  if (!codice) { disegnaEsitoBuono(); return; }
  VERIFICANDO_BUONO = true;
  if ($('bBuono')) $('bBuono').disabled = true;
  try {
    const r = await fetch(`${FUNZIONE_BUONI}?a=verifica&codice=${encodeURIComponent(codice)}`);
    const d = await r.json().catch(() => null);
    if (!d || typeof d.valido !== 'boolean') {
      BUONO_KO = 'buonoNonLetto';
    } else if (!d.valido) {
      BUONO_KO = 'buonoNonValido';
    } else {
      const servizio = Array.isArray(d.voci) && d.voci.length > 0;
      const cent = servizio ? null : valoreInCentesimi(d.valore);
      BUONO = { codice, valore_cent: cent };
    }
  } catch (e) {
    console.error('verifica del buono non riuscita', e);
    BUONO_KO = 'buonoNonLetto';
  }
  VERIFICANDO_BUONO = false;
  if ($('bBuono')) $('bBuono').disabled = false;
  disegnaEsitoBuono();
}

/* QUELLO CHE C'E' GIA' SCRITTO NELLE NOTE quando la pagina si apre.
   Due casi, e sono diversi: il riferimento di un'OFFERTA preparata dalla
   reception, e il numero della richiesta a cui questa camera si
   aggiunge. Se ci sono tutti e due si scrivono tutti e due: sono due
   fatti, non due modi di dire la stessa cosa. */
function noteIniziali(t) {
  const righe = [];
  if (DA_URL.insieme) righe.push(t.insiemeA(DA_URL.insieme));
  if (DA_URL.rif) righe.push(t.rifOfferta(DA_URL.rif));
  return righe.join('\n');
}

/* L'ALTRA OPZIONE DELLA STESSA FAMIGLIA: quella con la cena, quando
   l'ospite ha scelto la sola colazione. L'offerta si rifa' qui perche'
   questo e' l'ultimo momento prima di inviare — e chi ha scelto la
   colazione al passo prima non stava ancora decidendo se cenare, stava
   decidendo dove dormire. */
function conCenaPerLaScelta() {
  if (!SCELTA) return null;
  const voci = PROPOSTE
    .map((p, i) => ({ ...p, indice: i }))
    .filter((p) => p.camera_id === SCELTA.camera_id);
  const fam = accorpa(voci)
    .find((f) => f.opzioni.some((o) => o.indice === SCELTA.indice));
  if (!fam) return null;
  /* solo quella che costa PIU' di quella scelta: se l'ospite ha gia' la
     mezza pensione non gli si propone di togliersela */
  return fam.opzioni.find((o) =>
    o.indice !== SCELTA.indice && Number(o.prezzo_cent) > Number(SCELTA.prezzo_cent)
  ) || null;
}

/* quello che c'e' scritto adesso nei campi, prima che il ridisegno lo
   porti via */
function datiScritti() {
  const v = (id) => ($(id) ? $(id).value : '');
  const b = (id) => ($(id) ? $(id).checked : false);
  return {
    nome: v('fNome'), email: v('fEmail'), tel: v('fTel'), note: v('fNote'),
    cane: b('fCane'), privacy: b('fPrivacy'),
  };
}

/* ================= passo 3: i dati e l'invio ================= */

function schermaDati() {
  const t = T[LNG];
  const bambini = RICERCA.bambini || 0;
  const conCena = conCenaPerLaScelta();
  const gia = SCRITTI ||
    { nome: DA_URL.nome, email: DA_URL.email, tel: DA_URL.tel, note: '', cane: false, privacy: false };
  $('app').innerHTML = `
    <button type="button" class="indietro" id="bIndietroCamere">${esc(t.indietroCamere)}</button>
    <div class="riepilogo">
      ${t.riepilogo(esc(RICERCA.arrivo), esc(RICERCA.partenza), RICERCA.adulti, bambini)}<br />
      ${t.riepilogoCamera(SCELTA.nome, nomeTariffa(SCELTA.tariffa, LNG), euroDaCentesimi(SCELTA.prezzo_cent))}
    </div>
    ${conCena ? `
    <button type="button" class="aggiungi" id="bAggiungiCena" data-indice="${conCena.indice}">
      <div class="riga">
        <div>
          <div class="aggiungiTit">${esc(invito(conCena, t))}</div>
          <div class="aggiungiSotto">${esc(quantoInPiu(conCena, SCELTA, t))}</div>
        </div>
        <div class="prezzoBox">
          <div class="prezzoPiu">${euroDaCentesimi(conCena.prezzo_cent)} €</div>
        </div>
      </div>
    </button>` : ''}
    <div class="riquadro">
      <h2>${esc(t.datiTit)}</h2><div class="guida">${esc(t.datiGuida)}</div>
      <label for="fNome">${esc(t.nome)}</label>
      <input type="text" id="fNome" autocomplete="name" value="${esc(gia.nome)}" />
      <div class="due">
        <div><label for="fEmail">${esc(t.email)}</label>
          <input type="email" id="fEmail" autocomplete="email" value="${esc(gia.email)}" /></div>
        <div><label for="fTel">${esc(t.tel)}</label>
          <input type="tel" id="fTel" autocomplete="tel" value="${esc(gia.tel)}" /></div>
      </div>
      <label for="fNote">${esc(t.note)}</label>
      <!-- il riferimento dell'offerta va nelle note, con un'etichetta
           chiara: e' li' che lo ritrova la reception, non e' un campo del
           modulo (vedi il commento in cima a ospite-url.js) -->
      <textarea id="fNote" placeholder="${esc(t.notePh)}">${SCRITTI ? esc(gia.note) : esc(noteIniziali(t))}</textarea>

      <!-- IL CANE. La Knowledge Base dice che va segnalato «sempre al
           momento della prenotazione, mai all'arrivo»: prima di oggi
           questa pagina non aveva modo di dirlo, e l'ospite era
           costretto a violare una regola della casa. I due fatti che
           servono — il supplemento e dove il cane non entra — escono
           solo a chi spunta, perche' agli altri sono rumore. -->
      <label class="spunta" style="margin-top:18px;"><input type="checkbox" id="fCane"${gia.cane ? ' checked' : ''} />
        <!-- l'icona sta FUORI dalle traduzioni: un simbolo solo, in un
             posto solo, e nessuna lingua puo' dimenticarselo -->
        <span><span class="iconaCane" aria-hidden="true">🐕</span>${esc(t.cane)}</span></label>
      <div id="noteCane"></div>

      <label style="margin-top:20px;">${esc(t.condizioniTit)}</label>
      <div class="condizioni">
        <div class="tit">${esc(t.condizioniTit)}</div>
        <ul>${CONDIZIONI.righe.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
        ${CONDIZIONI.recesso ? `<div class="recesso">${esc(CONDIZIONI.recesso)}</div>` : ''}
      </div>
      <!-- LA TASSA, DI NUOVO. E' gia' scritta sulla schermata delle camere,
           e si ripete qui perche' questo e' l'ultimo momento prima di
           premere invia: chi e' arrivato fin qui ha scelto una camera,
           letto le condizioni e visto la caparra, e la tassa e' l'unica
           cifra che non ha ancora incontrato due volte. Stesso testo,
           dalla stessa voce: non puo' divergere. -->
      <div class="caparraBuono">${esc(t.caparraRiga(euroDaCentesimi(CAPARRA_CENT)))}</div>
      <div class="tassaDati">${esc(t.tassaSoggiorno)}</div>
      <!-- IL BUONO REGALO. Sta qui e non sulla scelta della camera:
           scegliere dove dormire e parlare di soldi sono due decisioni
           diverse, e mescolarle confonde. Questa pagina NON sconta il
           prezzo — non incassa niente, e' una richiesta — ma la caparra
           la reception la chiedera' o non la chiedera', e quella si puo'
           dire adesso. -->
      <label for="fBuono" style="margin-top:18px;">${esc(t.buonoTit)}</label>
      <div class="rigaBuono">
        <input type="text" id="fBuono" autocomplete="off" placeholder="${esc(t.buonoPh)}" />
        <button type="button" class="altre" id="bBuono">${esc(t.buonoVerifica)}</button>
      </div>
      <div id="esitoBuono"></div>

      <label class="spunta"><input type="checkbox" id="fPrivacy"${gia.privacy ? ' checked' : ''} />
        <span>${esc(t.privacy)} &mdash;
          <a href="https://www.termeleonardo.com/${LNG}/privacy" target="_blank"

    </div>
    <button class="invia" id="bInvia">${esc(t.invia)}</button>

    <div id="esitoDati"></div>`;

  $('bIndietroCamere').onclick = () => { SCRITTI = datiScritti(); STATO = 'camere'; disegna(); };
  if ($('bBuono')) $('bBuono').onclick = verificaBuono;
  /* un buono gia' verificato resta verificato attraverso i ridisegni:
     rifarlo scrivere sarebbe come cancellargli il nome */
  if (BUONO && $('fBuono')) $('fBuono').value = BUONO.codice;
  disegnaEsitoBuono();
  if ($('bAggiungiCena')) {
    $('bAggiungiCena').onclick = () => {
      /* PRIMA si mette da parte quello che e' scritto, poi si cambia
         tariffa: al contrario il ridisegno lo porterebbe via */
      SCRITTI = datiScritti();
      const i = Number($('bAggiungiCena').dataset.indice);
      SCELTA = { ...PROPOSTE[i], indice: i };
      disegna();
    };
  }
  /* i due fatti compaiono quando la spunta si accende, e sono gli stessi
     che la reception direbbe al telefono */
  const mostraCane = () => {
    $('noteCane').innerHTML = $('fCane').checked
      ? `<div class="avviso avvisoCane">${esc(t.caneNota(euroDaCentesimi(SUPPLEMENTO_CANE_CENT)))}</div>`
      : '';

  mostraCane();
  $('bInvia').onclick = inviaRichiesta;
  /* le stelle si mettono qui, non nel markup: cosi' l'elenco di cosa e'
     obbligatorio sta in un posto solo e le etichette lo seguono */
  segnaEtichette('prenota', document);
}

async function inviaRichiesta() {
  const t = T[LNG];
  if (INVIANDO) return;
  const nome = $('fNome').value.trim();
  const email = $('fEmail').value.trim();
  const telefono = $('fTel').value.trim();
  const note = $('fNote').value.trim();

  /* il telefono e' obbligatorio quanto nome ed email: il server lo impone
     da quando esiste un solo modo per raggiungere l'ospite se la richiesta
     va cambiata, ed e' quello. Il controllo qui evita che l'ospite scopra
     il rifiuto solo dopo aver premuto invia. */
  /* NON «compili nome ed email»: l'elenco di cio' che manca si calcola, e
     nomina i campi vuoti — visto in produzione il 20 agosto, il messaggio
     nominava due campi pieni e taceva il telefono, che era quello vuoto.
     segnaVuoti porta anche il fuoco sul primo campo da riempire. */
  const vuoti = mancanti('prenota', (id) => ($(id) ? $(id).value : ''));
  if (vuoti.length) {
    $('esitoDati').innerHTML = `<div class="errore">${esc(t.mancaChe(nomiMancanti(vuoti, t)))}</div>`;
    segnaVuoti('prenota', vuoti, document);
    return;
  }
  if (!$('fPrivacy').checked) {
    $('esitoDati').innerHTML = `<div class="errore">${esc(t.privacyManca)}</div>`;
    return;
  }

  INVIANDO = true;
  $('bInvia').disabled = true;
  $('bInvia').textContent = t.invio;
  $('esitoDati').innerHTML = '';

  /* la caparra si manda com'e' stata MOSTRATA all'ospite poche righe piu'
     su: e' una promessa gia' fatta, non un numero da ricalcolare a valle */
  const corpo = componiCorpo({
    scelta: SCELTA, nome, email, telefono,
    checkIn: RICERCA.arrivo, checkOut: RICERCA.partenza,
    adulti: RICERCA.adulti, bambini: RICERCA.bambini,
    caparraCent: CAPARRA_CENT,
    note, lingua: LNG,
    cane: $('fCane') ? $('fCane').checked : false,
    buono: BUONO ? BUONO.codice : '',
  });

  try {
    const r = await fetch(FUNZIONE, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(corpo),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      /* qualunque intoppo lascia un modo di arrivare a noi: mai un falso
         "inviata", che e' proprio il difetto che questo progetto corregge */
      console.error('richiesta non registrata:', r.status, d);
      throw new Error('non registrata');
    }
    /* prima di cambiare schermata: i campi stanno per sparire dal DOM e
       servono ancora, per gli inviti qui sotto */
    OSPITE = {
      nome, email, tel: telefono,
      arrivo: RICERCA && RICERCA.arrivo, partenza: RICERCA && RICERCA.partenza,
    };
    /* stessa ragione del semaforo della ricerca: oggi da qui non si
       torna indietro, quindi non fa danno — ma lasciarlo acceso e' la
       stessa trappola pronta per il prossimo che aggiunge un
       «indietro». */
    INVIANDO = false;
    STATO = 'fatta';
    disegna(d.numero || '');
  } catch (e) {
    console.error(e);
    INVIANDO = false;
    $('bInvia').disabled = false;
    $('bInvia').textContent = t.invia;
    $('esitoDati').innerHTML = `<div class="errore">${esc(t.ripiego)}</div>`;
  }
}

/* ================= chiusura ================= */
/* Non dice "prenotata" ne' "confermata": in questo passo la richiesta non
   lo e' ancora, non si incassa niente e la camera non e' bloccata. */
function schermaFatta(numero) {
  const t = T[LNG];
  /* serve dentro l'indirizzo della seconda camera: e' il filo che le
     tiene insieme in reception */
  NUMERO_FATTA = numero;
  $('app').innerHTML = `<div class="riquadro fatta">
    <h2>${esc(t.grazieTit)}</h2>
    <p style="color:var(--verde-medio);">${esc(t.grazieTxt)}</p>
    ${numero ? `<div class="rif">${esc(numero)}</div>
      <div class="guida" style="margin-top:4px;">${esc(t.rif)}</div>` : ''}
    ${OSPITE ? `
      <div class="inviti">
        <div class="invitiTit">${esc(t.ancoraTit)}</div>
        <a class="invito" href="${esc(indirizzoModulo('trattamenti', LNG, OSPITE))}">${esc(t.invitoTrattamenti)}</a>
        <a class="invito" href="${esc(indirizzoModulo('transfer', LNG, OSPITE))}">${esc(t.invitoTransfer)}</a>
        <!-- LA SECONDA CAMERA. Non un carrello: una richiesta nuova, ma
             coi contatti e le date gia' dentro e col numero della prima
             nelle note, cosi' la reception le tiene insieme. -->
        <a class="invito" href="${esc(indirizzoModulo('prenota', LNG, { ...OSPITE, insieme: DA_URL.insieme || NUMERO_FATTA, camera: (DA_URL.camera || 1) + 1, di: CAMERE_TOTALI || DA_URL.di || '' }))}">${esc(t.invitoAltraCamera)}</a>
        <div class="invitiNota">${esc(t.invitoNota)}</div>
      </div>` : ''}
    <p style="margin-top:22px;"><a href="?l=${LNG}">${esc(t.ancora)}</a></p>
  </div>`;
}

function disegna(numeroFatta) {
  passi();
  if (STATO === 'ricerca') schermaRicerca();
  else if (STATO === 'camere') schermaCamere();
  else if (STATO === 'dati') schermaDati();
  else schermaFatta(numeroFatta);
  /* i campi arrivo/partenza sono ridisegnati a ogni passo (schermaRicerca
     li ricrea da zero): riattivarli qui, non solo al primo caricamento,
     altrimenti dopo "← Cambi le date" il calendario al tocco e il
     collegamento arrivo/partenza sono spariti insieme ai vecchi input. */
  attivaDate();
}

testata();
/* il cartello si scrive una volta sola: non cambia da un passo all'altro */
if (DA_URL.insieme) {
  const t0 = T[LNG];
  $('collegata').innerHTML = `<div class="cartello">${esc(
    DA_URL.camera && DA_URL.di
      ? t0.cameraDiQuante(DA_URL.camera, DA_URL.di, DA_URL.insieme)
      : DA_URL.camera
      ? t0.cameraDiSerie(DA_URL.camera, DA_URL.insieme)
      : t0.siAggiungeA(DA_URL.insieme),
  )}</div>`;
}
disegna();
</script>
</body>
</html>
