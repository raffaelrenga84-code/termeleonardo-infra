<title>Prepara il suo arrivo — Hotel Terme Leonardo</title>
<style>
  :root{
    --acqua:#1E7F88; --acqua-scura:#0F5C64; --acqua-chiara:#E3F0F1;
    --pietra:#EDE7DC; --carta:#FAF8F4; --inchiostro:#2A2E2B;
    --grigio:#7B756A; --arancio:#E8751A; --oliva:#7A8450; --allarme:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--carta);color:var(--inchiostro);
       font:16px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
  .fascia{height:6px;background:linear-gradient(90deg,var(--acqua-scura),var(--acqua) 45%,#6FB1B8);}
  header{background:#fff;border-bottom:1px solid var(--pietra);padding:26px 20px 22px;text-align:center;}
  header img{height:56px;}
  header .sotto{font-size:11px;letter-spacing:4px;color:var(--grigio);margin-top:8px;}
  main{max-width:640px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:27px;
     line-height:1.25;color:var(--inchiostro);margin:10px 0 6px;}
  .sotto-titolo{color:var(--grigio);font-size:15px;margin-bottom:22px;}
  .lingue{text-align:right;padding:10px 0 0;}
  .lingue button{border:1px solid var(--pietra);background:#fff;color:var(--grigio);
     font:12px Arial;padding:5px 9px;border-radius:4px;cursor:pointer;margin-left:4px;}
  .lingue button.attiva{background:var(--acqua);border-color:var(--acqua);color:#fff;}
  .scheda{background:#fff;border:1px solid var(--pietra);border-radius:8px;
     padding:20px;margin-bottom:16px;}
  .soggiorno{border-left:4px solid var(--acqua);}
  .soggiorno .nome{font-family:Georgia,serif;font-size:21px;color:var(--inchiostro);}
  .soggiorno .date{color:var(--acqua-scura);font-size:15px;margin-top:4px;}
  .soggiorno .dett{color:var(--grigio);font-size:14px;margin-top:2px;}
  h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acqua);
     font-weight:600;margin:0 0 14px;}
  label{display:block;font-size:13px;color:var(--grigio);margin:12px 0 5px;}
  input[type=text],input[type=tel],input[type=email],input[type=number],
  input[type=datetime-local],input[type=date],input[type=time],select,textarea{
     width:100%;padding:12px;border:1px solid #D8D2C4;border-radius:6px;
     font:16px Arial;color:var(--inchiostro);background:#fff;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--acqua);outline-offset:1px;}
  .due{display:flex;gap:12px;}
  .due>div{flex:1;}
  .interruttore{display:flex;align-items:center;gap:12px;cursor:pointer;
     font-size:16px;color:var(--inchiostro);margin:0;}
  .interruttore input{width:22px;height:22px;accent-color:var(--acqua);flex:none;}
  .ripiega{display:none;margin-top:6px;}
  .aperta .ripiega{display:block;}
  .spunte label{display:flex;align-items:center;gap:12px;font-size:16px;
     color:var(--inchiostro);margin:12px 0;cursor:pointer;}
  .spunte input{width:22px;height:22px;accent-color:var(--acqua);flex:none;}
  .persona{display:flex;gap:10px;margin-top:8px;}
  .persona input:first-child{flex:3;}
  .persona input:last-child{flex:1;}
  .aggiungi{background:none;border:none;color:var(--acqua);font:14px Arial;
     cursor:pointer;padding:10px 0 0;}
  .invia{display:block;width:100%;background:var(--arancio);color:#fff;border:none;
     border-radius:6px;padding:16px;font:600 17px Arial;cursor:pointer;margin-top:8px;}
  .invia:disabled{background:#CFCABF;}
  .nota-invio{text-align:center;color:var(--grigio);font-size:13px;margin-top:12px;}
  .esito-errore{background:#FDEDEC;border-left:4px solid var(--allarme);color:#922B21;
     padding:12px 14px;border-radius:0 6px 6px 0;margin-top:14px;font-size:15px;display:none;}
  .stato{max-width:520px;margin:60px auto;text-align:center;padding:0 20px;}
  .stato .segno{font-size:44px;color:var(--acqua);}
  .stato h1{margin-top:14px;}
  .stato p{color:var(--grigio);margin-top:10px;font-size:16px;}
  footer{text-align:center;color:var(--grigio);font-size:12px;letter-spacing:1px;
     padding:30px 20px 40px;border-top:1px solid var(--pietra);background:#fff;}
  footer .marchio{font-family:Georgia,serif;font-size:14px;letter-spacing:5px;
     color:var(--inchiostro);margin-bottom:6px;}
  @media (prefers-reduced-motion:no-preference){
    .scheda{animation:sale .35s ease both;}
    @keyframes sale{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  }
</style>

 de:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
 en:['January','February','March','April','May','June','July','August','September','October','November','December'],
 fr:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre']
};

let LINGUA = 'it', DATI = null, TOKEN = null;
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dataBella(iso, lingua){
  const d = new Date(iso + 'T00:00');
  const g = d.getDate(), m = MESI[lingua][d.getMonth()], a = d.getFullYear();
  if (lingua === 'en') return `${g} ${m} ${a}`;
  if (lingua === 'de') return `${g}. ${m} ${a}`;
  return `${g} ${m} ${a}`;
}

function stato(titolo, testo, segno, extra){
  app.innerHTML = `<div class="stato"><div class="segno">${segno}</div>
    <h1>${esc(titolo)}</h1><p>${esc(testo)}</p>${extra || ''}</div>`;
}

/* L'elenco dei numeri, come lo mostrano sia la conferma appena inviata sia
   lo stato "gia inviato": stessa forma, perche' sono la stessa cosa vista
   in due momenti diversi. */
function elencoNumeri(numeri){
  const puliti = (Array.isArray(numeri) ? numeri : []).map(esc).filter(Boolean);
  return puliti.length
    ? `<p style="font-family:'Courier New',monospace;letter-spacing:1px;">${puliti.join(' · ')}</p>`
    : '';
}

/* MOSTRA O NASCONDE LA SCELTA DEL SERVIZIO, e la forza a "auto privata"
   quando la sparisce: stessa regola e stesso momento del modulo transfer
   del sito (aggiornaNavetta() in pagine/richieste/transfer/index.html),
   letta dal DOM invece che da variabili di stato perche' qui il servizio
   e' una <select> vera, non due pulsanti — il valore della select E' lo
   stato. Chiamata a ogni cambio di meta, passeggeri, giorno, ora o verso:
   un ospite che diventa "fuori regola" cambiando uno di questi campi non
   deve restare con "navetta condivisa" ancora selezionata sotto un blocco
   che sta per sparire. */
function aggiornaServizioTr(){
  const t = T[LINGUA];
  const box = document.getElementById('trBoxServizio');
  if (!box) return;
  const n = navetta({
    luogo: document.getElementById('trLuogo').value,
    pax: document.getElementById('trPax').value,
    quando: document.getElementById('trQuando').value,
    ora: document.getElementById('trOra').value,
    verso: document.getElementById('trTipo').value,
  }, new Date());
  box.style.display = n ? 'block' : 'none';
  if (!n) {
    document.getElementById('trServizio').value = '0';
  } else {
    document.getElementById('trNavettaNota').textContent =
      n.nota === 'stessoPrezzo' ? t.trNavettaStessoPrezzo : t.trNavettaCostaMeno;
  }
  /* E QUI L'ETICHETTA SEGUE IL CANCELLO, sempre, non solo quando l'ospite
     tocca il servizio di persona. Due buchi, uno dentro l'altro:

     · assegnare `trServizio.value = '0'` da codice NON fa scattare
       `change` — e' la regola del DOM, non un caso — quindi il listener
       che due righe di cablaggio piu' sotto appende aggiornaRitiroTr a
       quel campo non parte mai quando siamo NOI a riportare il servizio
       ad "auto privata";
     · trLuogo e trPax erano legati soltanto a questa funzione, non
       all'etichetta: cambiare meta o passeggeri chiudeva il cancello e
       lasciava scritto "Ora del volo" sopra il campo.

     Il seguito era: partenza condivisa con volo alle 22:00 (etichetta
     "Ora del volo", nota "la prendiamo in hotel alle 19:00"), poi
     l'ospite alza i passeggeri a cinque — la navetta sparisce, il
     servizio torna privato, e il corpo parte giustamente con le 22:00
     che l'ospite ha scritto. Ma lui aveva letto 19:00. Chiamandola da
     qui, l'etichetta e la nota tornano indietro insieme al cancello, e
     trLuogo/trPax ci arrivano per questa strada senza un secondo
     listener.

     Nessuna ricorsione: aggiornaRitiroTr legge il DOM e scrive soltanto
     su trEtiOra e trNotaRitiro, due nodi che nessuno ascolta, e non
     assegna nessun `.value` — non puo' rientrare qui. Verificato
     eseguendo, non a occhio: la prova "il ritorno dell etichetta non fa
     rimbalzare il cancello all infinito" conta le chiamate a navetta().
     Le altre chiamate ad aggiornaRitiroTr (trOra, trQuando, trTipo,
     trServizio) restano: sono il caso in cui il cancello non cambia. */
  aggiornaRitiroTr();
}

/* IL PAVIMENTO DEL RITORNO: la data del ritorno non puo' precedere quella
   dell'andata. Il server la rifiuta comunque ("il ritorno non puo
   precedere l'andata", tipi.ts), ma solo dopo l'invio, e in un italiano
   che un ospite tedesco leggerebbe come un rifiuto muto — la stessa cosa
   per cui il punto 5 del giro precedente ha spostato 404/410 sulle
   schermate tradotte. Legare il minimo qui evita che l'errore nasca:
   vista succedere davvero sul modulo transfer del sito (ritorno il 18 con
   andata il 19), da cui questa stessa regola e' ricopiata
   (legaDateRitorno()). */
function legaRitornoTr(){
  const a = document.getElementById('trQuando')?.value;
  const rq = document.getElementById('trRitornoQuando');
  if (!rq) return;
  if (a) rq.min = a;
  if (a && rq.value && rq.value < a) rq.value = a;
}

/* L'UNICO CASO IN CUI "ORA" CAMBIA SIGNIFICATO: partenza scelta come
   navetta condivisa. navetta.js (oraDellaCorsa) tratta SEMPRE il campo
   "ora" di una partenza come l'ora del volo quando giudica se offrire la
   navetta — anche prima che l'ospite abbia scelto il servizio, perche'
   aggiornaServizioTr() deve poter rispondere "se fosse condivisa,
   andrebbe bene?" senza ancora saperlo. Ma il valore SPEDITO al server
   (validaTransfer, tipi.ts) e' gia' l'orario della corsa, non il volo: le
   due letture combaciano solo se, quando l'ospite conferma la scelta
   condivisa, il campo si etichetta "ora del volo" e il valore si converte
   prima di partire — altrimenti un ospite con ritiro alle 22:00 vede
   offrirsi una navetta che a quell'ora non esiste, e uno con ritiro alle
   9:00 se la vede negare per errore. Stessa forma di
   conNavettaInPartenza() nel modulo transfer del sito. */
function conNavettaInPartenzaTr(){
  return document.getElementById('trServizio').value === '1'
    && document.getElementById('trTipo').value === 'partenza';
}

/* il giorno prima di una data ISO, come GG/MM, senza fusi (mezzogiorno per
   non inciampare nell'ora legale) — copia di giornoPrimaDi() nel modulo
   transfer del sito */
function giornoPrimaDiTr(iso){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
}

/* Cambia l'etichetta del campo e mostra sotto l'orario di ritiro vero,
   cosi' l'ospite legge a che ora passiamo a prenderlo invece di doverlo
   calcolare da solo. Va richiamata a ogni cambio che tocca la domanda
   "e' partenza+condivisa?" o il suo risultato: servizio, verso, ora,
   giorno (per la nota "il giorno prima del volo"). Stessa forma di
   aggiornaRitiro() nel modulo transfer del sito. */
function aggiornaRitiroTr(){
  const t = T[LINGUA];
  const eti = document.getElementById('trEtiOra');
  const nota = document.getElementById('trNotaRitiro');
  if (!eti || !nota) return;
  const attivo = conNavettaInPartenzaTr();
  eti.firstChild.nodeValue = attivo ? t.trOraVolo : t.trOra;
  const r = attivo ? ritiroPerVolo(document.getElementById('trOra').value) : null;
  if (!r) { nota.textContent = ''; return; }
  const quando = document.getElementById('trQuando').value;
  nota.textContent = r.giornoPrima && quando
    ? t.trRitiroGiornoPrima(giornoPrimaDiTr(quando), r.ora)
    : t.trRitiroAlle(r.ora);
}

/* Giorno e ora della corsa come la manda il corpo, piu' l'ora del volo da
   cui nascono quando serve convertire. Fuori dal caso partenza+condivisa
   non cambia niente: quello che l'ospite ha scritto e' gia' l'ora del
   ritiro, come dice l'etichetta.

   PRENDE `v` COME PARAMETRO, non dallo scope. Il modulo transfer del sito
   scrive la stessa aritmetica dentro corsaVera(), che chiama `v('fOra')`
   contando su una `v` definita altrove nel file — e quel modo di legarsi
   allo scope e' costato due giorni: il 18 agosto una modifica ha
   cancellato la riga che definiva `v` lasciando in piedi tredici
   chiamate, il file restava valido, le prove restavano verdi, e il
   modulo si rompeva soltanto quando l'ospite premeva «Invia». La riga e'
   stata rimessa il 20 agosto (commit «Il modulo transfer non si poteva
   inviare: rimessa la riga cancellata») e adesso pagine/aiutanti.test.ts
   sorveglia che `v`, `esc`, `$` e `stato` restino definite: quel file
   oggi e' a posto, e questo commento non lo accusa di niente.

   Il parametro esplicito resta la scelta giusta lo stesso, per la ragione
   opposta a un sospetto: non perche' `v` manchi da qualche parte, ma
   perche' cosi' questa funzione non dipende da dove viene chiamata — si
   estrae e si esegue da sola in una prova, che e' esattamente come le
   prove del giro 4 la collaudano. Stessa forma di corsaVera() nel modulo
   transfer del sito, solo con `v` esplicito. */
function corsaVeraTr(v){
  const quando = v('trQuando');
  const scritta = v('trOra');
  if (!conNavettaInPartenzaTr()) return { quando, ora: scritta };

  const r = ritiroPerVolo(scritta);
  if (!r) return { quando, ora: scritta };

  let giorno = quando;
  if (r.giornoPrima && quando) {
    const d = new Date(quando + 'T12:00:00');
    d.setDate(d.getDate() - 1);
    giorno = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  return { quando: giorno, ora: r.ora, ora_volo: scritta };
}

function selettoreLingue(){
  return `<div class="lingue">${['it','de','en','fr'].map(l =>
    `<button type="button" data-l="${l}" class="${l===LINGUA?'attiva':''}">${l.toUpperCase()}</button>`).join('')}</div>`;
}

  /* Le voci NON si traducono e NON si riordinano: la reception le ricopia

    document.getElementById('trBoxRitorno').style.display = e.target.checked ? 'flex' : 'none';

     regola di navetta.js — e una volta alla fine, sul disegno appena
     fatto, cosi' chi arriva gia' con una meta e un pax fuori dai limiti
     (dal token, o riaprendo la lingua) non vede il blocco comparire senza
     motivo. */

    const el = document.getElementById(id);
    el.addEventListener('change', aggiornaServizioTr);
    el.addEventListener('input', aggiornaServizioTr);
  });

     cambiano il verso o il servizio da soli — non solo meta/pax/giorno/
     ora, che gia' fanno ricalcolare l'eleggibilita' sopra. */
  document.getElementById('trOra').addEventListener('input', aggiornaRitiroTr);
  document.getElementById('trQuando').addEventListener('change', aggiornaRitiroTr);
  document.getElementById('trTipo').addEventListener('change', aggiornaRitiroTr);
  document.getElementById('trServizio').addEventListener('change', aggiornaRitiroTr);
  aggiornaRitiroTr();

    b.addEventListener('click', () => { LINGUA = b.dataset.l; modulo(); }));
  ['schedaFatt','schedaTr'].forEach(id => {
    const s = document.getElementById(id);
    s.querySelector('input[type=checkbox]').addEventListener('change', e =>
      s.classList.toggle('aperta', e.target.checked));
  });
  const box = document.getElementById('persone');

  function rigaPersona(){
    if (box.children.length >= 6) return;
    const d = document.createElement('div');
    d.className = 'persona';
    d.innerHTML = `<input type="text" placeholder="${t2.nome}" maxlength="80" />
                   <input type="text" placeholder="${t2.eta}" maxlength="10" />`;
    box.appendChild(d);
  }
  document.getElementById('piuPersona').addEventListener('click', rigaPersona);
  document.getElementById('invia').addEventListener('click', invia);
}

/* GIA' INVIATO (409). Non e' un errore rosso: e' normale, capita a chi
   ricarica la pagina o riapre l'ultimo link dopo aver gia' compilato.
   Mostriamo i numeri gia' ricevuti e diciamo di scrivere per cambiare
   qualcosa — mai una seconda serie di richieste. */
function giaInviato(t, richieste){
  const numeri = (Array.isArray(richieste) ? richieste : []).map(r => r?.numero);
  stato(t.giaInviatoT, t.giaInviato, '✓', elencoNumeri(numeri) + `<p>${esc(t.perCambiare)}</p>`);
}

/* LO STESSO STATO, ALL'APERTURA. Prima esisteva solo come risposta a un
   invio: chi riapriva il link per correggere il numero del volo
   ricompilava tutto — ora, transfer, partita IVA — premeva Invia e si
   sentiva dire che avevamo gia' tutto. Le correzioni si perdevano.

   UN GUASTO QUI NON CHIUDE IL MODULO: si torna `null` e la pagina fa
   quello che faceva prima, cioe' mostra il modulo. A proteggere dal doppio
   invio resta il controllo del server, che sull'errore di lettura
   rifiuta. */
async function statoInvio(){
  try {
    const r = await fetch(`${FUNZIONE_RICHIESTE}?a=arrivo-inviato&t=${encodeURIComponent(TOKEN)}`);
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    return null;
  }
}

async function invia(){
  const t = T[LINGUA];
  const b = document.getElementById('invia');
  const box = document.getElementById('erroreInvio');
  b.disabled = true; b.textContent = t.attendere;
  box.style.display = 'none';
  const v = id => document.getElementById(id)?.value?.trim() || null;
  const fatt = document.getElementById('fattura').checked;
  const tr = document.getElementById('transfer').checked;
  const ritorno = tr && document.getElementById('trRitorno').checked;

  /* MAI "ritorno:true" SENZA GIORNO E ORA: il validatore lo accetterebbe
     comunque (resta per le richieste vecchie), ma e' esattamente il
     difetto per cui esistono questi due campi — la reception saprebbe
     CHE serve il ritorno e non QUANDO, e dovrebbe telefonare. Si blocca
     l'invio qui, prima ancora di chiamare il server. */
  if (ritorno && (!v('trRitornoQuando') || !v('trRitornoOra'))) {
    box.textContent = t.trRitornoManca;
    box.style.display = 'block';
    b.disabled = false; b.textContent = t.invia;
    return;
  }

  const collettivo = v('trServizio') === '1';
  /* GIORNO E ORA VERI DELLA CORSA, non necessariamente quello che l'ospite
     ha scritto: con partenza+condivisa il campo contiene l'ora del volo, e
     corsaVeraTr() la converte nell'ora di ritiro (arretrando la data se il
     ritiro cade il giorno prima) prima che parta qualunque cosa. Fuori da
     quel caso non cambia niente. */
  const corsaTr = tr ? corsaVeraTr(v) : null;
  /* IL RITORNO SI GIUDICA DA SOLO. Chi sceglie la navetta per l'andata da'
     per scontato che valga anche al ritorno, ma un ritorno alle 22:00 in
     arrivo e' fuori fascia (navetta.js, DALLE/ALLE): senza ricalcolarlo,
     il modulo che prepara la prenotazione dai tassisti leggerebbe
     ritorno_collettivo assente (il server lo risolve a false) e
     prenoterebbe in privata un ritorno che l'ospite ha chiesto condiviso —
     niente di falso stampato per l'ospite, ma quello che si prenota
     divergerebbe da quello che e' stato chiesto. Stessa regola del modulo
     transfer del sito (corsaDiRitorno() + navetta(), aggiornaRitornoNote()). */
  const corsaRitorno = ritorno ? corsaDiRitorno({
    luogo: v('trLuogo'), pax: Number(v('trPax')) || 1, verso: v('trTipo'),
    ritorno_quando: v('trRitornoQuando'), ritorno_ora: v('trRitornoOra'),
  }) : null;
  const ritornoCollettivo = collettivo && !!(corsaRitorno && navetta(corsaRitorno, new Date()));

  const corpo = {
    token: TOKEN,
    /* IL TELEFONO IN CIMA AL CORPO, non dentro transfer_dati: e' li' che
       ?a=invia-arrivo lo cerca (index.ts) e da li' finisce su ogni pezzo
       della richiesta — non solo sul transfer. Dentro transfer_dati si
       perderebbe in silenzio: validaTransfer non legge "cell", e la
       reception si ritroverebbe un taxi da chiamare senza nessun numero,
       peggio di prima che l'email lo stampava. */
    telefono: v('trCell'),
    ora_arrivo: v('ora'), mezzo: v('mezzo'),
    /* le attenzioni partono come CHIAVI, non come testo tradotto: la
       pagina parla quattro lingue, il back office una sola, e "Culla per
       neonato" andrebbe letto da chi aveva davanti "Babybett" */
    attenzioni: [...document.querySelectorAll('.extra:checked')]
      .map(c => ['culla','seggiolone','parcheggio','cane'][+c.dataset.i]),
    fanghi_desiderio: (()=>{ const s = document.querySelector('.fanghi:checked');
      return s ? ['presto','tardi','indifferente'][+s.dataset.i] : null; })(),
    persone_extra: [...document.querySelectorAll('.persona')].map(p => ({
      nome: p.children[0].value.trim(), eta: p.children[1].value.trim()
    })).filter(p => p.nome),
    note: v('note'),
    transfer: tr,
    transfer_dati: tr ? {
      verso: v('trTipo'), luogo: v('trLuogo'), quando: corsaTr.quando, ora: corsaTr.ora,
      /* IL DATO DA CUI NASCE LA CONVERSIONE: senza, chi legge "ora" in
         reception vede solo l'orario di ritiro e non puo' verificare da
         quale volo viene ne' correggerlo se il volo cambia. Assente (non
         partenza+condivisa) resta null, come prezzo_cent: "non c'e'" e
         "e' zero" sono due cose diverse. */
      ora_volo: corsaTr.ora_volo || null,
      pax: Number(v('trPax')) || 1, volo: v('trVolo'),
      /* SENZA QUESTO IL TRANSFER NASCE SEMPRE "AUTO PRIVATA": validaTransfer
         risolve collettivo a false se il corpo non lo manda, e quella non
         e' una scelta neutra — finisce cosi' com'e' nel dettaglio della
         richiesta e nell'email di conferma che legge l'ospite, che non ha
         mai visto l'alternativa (su Venezia aeroporto, entro tre
         passeggeri) piu' economica. */
      collettivo,
      ritorno,
      ritorno_quando: ritorno ? v('trRitornoQuando') : null,
      ritorno_ora: ritorno ? v('trRitornoOra') : null,
      ritorno_collettivo: ritornoCollettivo
    } : null,
    fattura: fatt,
    fattura_dati: fatt ? {
      ragione: v('fRagione'), indirizzo: v('fIndirizzo'), piva: v('fPiva'),
      cf: v('fCf'), sdi: v('fSdi'), pec: v('fPec')
    } : null
  };
  try {
    const r = await fetch(`${FUNZIONE_RICHIESTE}?a=invia-arrivo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo)
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 409) { giaInviato(t, d.richieste); window.scrollTo(0, 0); return; }
    /* 404 E 410 SONO GLI STESSI CASI DEL CARICAMENTO (link non valido,
       soggiorno scaduto), stavolta scoperti al momento dell'invio invece
       che all'apertura — puo' succedere se il link scade mentre l'ospite
       sta ancora compilando. Le schermate tradotte esistono gia' per
       questi due casi: non c'e' motivo di mostrarli come un rifiuto in
       italiano dentro il riquadro rosso. */
    if (r.status === 404) { stato(t.nonValidoT, t.nonValido, '·'); return; }
    if (r.status === 410) { stato(t.scadutoT, t.scaduto, '·'); return; }
    if (!r.ok) {
      /* IL MESSAGGIO DEL SERVER VA MOSTRATO: e' lui che dice «luogo non in
         elenco» o «serve la partita IVA o il codice fiscale», e
         nasconderlo lascerebbe l'ospite davanti a un rifiuto muto. Il
         server non traduce i suoi errori: arrivano in italiano anche a
         chi legge la pagina in un'altra lingua, e non c'e' altro modo di
         dirli. */
      box.textContent = d.errore || t.erroreInvio;
      box.style.display = 'block';
      b.disabled = false; b.textContent = t.invia;
      return;
    }
    /* «abbiamo preso nota del suo desiderio», e nient'altro: nessun orario
       confermato, nessun turno. Compare solo a chi una preferenza l'ha
       davvero espressa. */
    const scelta = document.querySelector('.fanghi:checked');
    /* I NUMERI, SUBITO: senza mostrarli qui l'ospite li scopre solo
       ricaricando (e finendo nel 409) — la stessa lista, mostrata al primo
       giro invece che al secondo. */
    stato(t.grazieT, t.grazie + (scelta ? ' ' + t.fanghiPresoAtto : ''), '✓', elencoNumeri(d.numeri));
    window.scrollTo(0, 0);
  } catch (e) {
    box.textContent = t.erroreInvio;
    box.style.display = 'block';
    b.disabled = false; b.textContent = t.invia;
  }
}

(async function avvia(){
  TOKEN = new URLSearchParams(location.search).get('t');
  if (!TOKEN) { stato(T.it.nonValidoT, T.it.nonValido, '·'); return; }
  try {
    const r = await fetch(`${FUNZIONE_ARRIVO}?token=${encodeURIComponent(TOKEN)}`);
    if (r.status === 410) {
      const l = LINGUA; stato(T[l].scadutoT, T[l].scaduto, '·'); return;
    }
    if (!r.ok) { stato(T.it.nonValidoT, T.it.nonValido, '·'); return; }
    DATI = await r.json();
    LINGUA = ['it','de','en','fr'].includes(DATI.lingua) ? DATI.lingua : 'it';
    document.documentElement.lang = LINGUA;
    /* DOPO la lingua, perche' questa schermata la parla; PRIMA del modulo,
       perche' e' il modulo che non deve nemmeno comparire a chi ha gia'
       mandato tutto. */
    const gia = await statoInvio();
    if (gia && gia.inviato === true) { giaInviato(T[LINGUA], gia.richieste); return; }
    modulo();
  } catch (e) {
    stato(T.it.nonValidoT, T.it.nonValido, '·');
  }
})();
</script>
</body>
</html>
