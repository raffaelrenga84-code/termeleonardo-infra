<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1A3626" />
<!-- ci si arriva solo inquadrando il QR sul tavolo: niente motori di ricerca -->
<meta name="robots" content="noindex, nofollow" />
<title>Ordina al tavolo — Hotel Terme Leonardo</title>
<link rel="icon" href="/buoni/img/logo-quadrato.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* L'ORDINE DAL TAVOLO. Chi apre questa pagina ha inquadrato il QR sul
   tavolo: e' un ospite, col suo telefono, spesso non parla italiano, e
   vuole due cose in fretta — scegliere e pagare. Quadrati grandi con
   un'icona, una barra in fondo col totale, due modi di pagare. Niente
   accessi, niente app (la proprieta', 5 settembre 2026). */
:root{--verde:#1A3626;--verde-medio:#3C5346;--oro:#C9A961;--crema:#F9F6F0;--pietra:#DCD6CB;--grigio:#7B756A;--allarme:#C0392B;--acqua-chiara:#E4F0EA;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--crema);color:#2A2E2B;font:17px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;}
header{background:var(--verde);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header .marchio{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;letter-spacing:.3px;flex:1;white-space:nowrap;}
header .tavolo{font-weight:600;font-size:15px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px;white-space:nowrap;}
.lingue{display:flex;gap:4px;}
.lingue button{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:999px;padding:4px 9px;font:600 12px inherit;letter-spacing:.5px;cursor:pointer;}
.lingue button.attiva{background:#fff;color:var(--verde);border-color:#fff;}
main{padding:14px 14px 110px;max-width:640px;margin:0 auto;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:30px;line-height:1.15;color:var(--verde);margin:6px 0 4px;text-wrap:balance;}
/* La schermata di chi non riesce ad aprire l'elenco dei tavoli (il freno,
   o la rete che non risponde): un muro di parole in serif non si legge sul
   telefono e non dice cosa fare (la proprieta', 6 settembre 2026). Un
   disegno e due passi: il QR sul tavolo funziona sempre. */
.serveQr{padding:6px 2px 24px;}
.serveQr .disegno{display:block;width:96px;height:96px;margin:10px auto 14px;}
.serveQr p{font-size:16px;line-height:1.5;color:var(--verde-medio);margin:0 0 10px;}
.serveQr ol{margin:6px 0 14px;padding-left:22px;font-size:16px;line-height:1.55;}
.serveQr li{margin:4px 0;}
.serveQr .nota{font-size:14px;line-height:1.5;color:var(--grigio);background:#F3F1EC;border-radius:10px;padding:12px 14px;margin-top:14px;}
.sotto{color:var(--grigio);margin:0 0 14px;font-size:15px;}
.fascia{display:inline-block;background:var(--oro);color:var(--verde);font-weight:600;font-size:13px;padding:5px 10px;border-radius:999px;margin-bottom:12px;}
button{font:inherit;cursor:pointer;color:inherit;}
/* i quadratoni delle categorie */
.griglia{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (min-width:520px){.griglia{grid-template-columns:repeat(3,1fr);}}
.quadro{min-height:118px;border:1px solid var(--pietra);border-radius:18px;background:#fff;padding:14px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 1px 2px rgba(26,54,38,.06);}
.quadro .icona{font-size:36px;line-height:1;}
.quadro.grande{min-height:150px;}
.quadro.grande .icona{font-size:46px;}
.quadro b{font-size:17px;line-height:1.2;color:var(--verde);}
.quadro .mini{font-size:13px;color:var(--grigio);font-weight:400;}
.quadro:active{background:var(--acqua-chiara);}
/* la scelta del tavolo a mano: numeri grandi, quattro per riga */
.griglia.numeri{grid-template-columns:repeat(4,1fr);gap:10px;}
.quadro.numero{min-height:64px;align-items:center;justify-content:center;padding:8px;}
.quadro.numero b{font-size:24px;}
.zonaTit{margin:16px 0 6px;font-weight:600;color:var(--verde-medio);font-size:15px;letter-spacing:.3px;text-transform:uppercase;}
.locali{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.locali button{border:1.5px solid var(--verde);background:#fff;color:var(--verde);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;}
.locali button.attiva{background:var(--verde);color:#fff;}
.indietro{border:0;background:none;color:var(--verde-medio);font-size:16px;padding:6px 0 12px;display:inline-flex;align-items:center;gap:4px;}
/* gli articoli */
.lista{display:flex;flex-direction:column;gap:10px;}
.riga{background:#fff;border:1px solid var(--pietra);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;}
.riga .nome{flex:1;min-width:0;}
.riga .nome b{display:block;font-size:16px;line-height:1.25;color:#2A2E2B;}
.riga .desc{display:block;font-size:13px;color:var(--grigio);line-height:1.3;margin-top:2px;}
.riga .allergeni{display:inline-block;font-size:11px;color:var(--grigio);border:1px solid var(--pietra);border-radius:6px;padding:1px 6px;margin-top:4px;letter-spacing:.4px;}
.riga.chiusa{opacity:.6;}
.riga .orario{display:block;font-size:12px;color:var(--allarme);margin-top:3px;}
.riga .prezzo{color:var(--grigio);font-size:15px;}
.riga.scelta{border-color:var(--verde);background:#F3F7F4;}
.qta{display:flex;align-items:center;gap:2px;}
.qta button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--verde);background:#fff;color:var(--verde);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;}
.qta button:disabled{opacity:.25;}
.qta output{min-width:32px;text-align:center;font-weight:600;font-size:19px;}
/* le note pronte, come sul palmare: si toccano, e in cucina arrivano in italiano */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{border:1px solid var(--pietra);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--verde);}
.chip.attiva{background:var(--verde);color:#fff;border-color:var(--verde);}
.notaRiga{margin-top:8px;width:100%;}
.notaRiga input{width:100%;padding:10px 12px;font:inherit;font-size:15px;border:1px solid var(--pietra);border-radius:10px;background:#FCFBF8;}
.aggiungiNota{border:0;background:none;color:var(--verde-medio);font-size:14px;padding:6px 0 0;text-decoration:underline;}
/* la barra in fondo */
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--pietra);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(26,54,38,.08);}
.barra .dentro{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.barra .somma{flex:1;}
.barra .somma b{display:block;font-size:20px;color:var(--verde);}
.barra .somma span{font-size:13px;color:var(--grigio);}
.bottone{padding:15px 18px;border:0;border-radius:14px;background:var(--verde);color:#fff;font-weight:600;font-size:17px;width:100%;}
.bottone.oro{background:var(--oro);color:var(--verde);}
.bottone.sec{background:#fff;color:var(--verde);border:2px solid var(--verde);}
.bottone:disabled{opacity:.45;}
.barra .bottone{width:auto;white-space:nowrap;}
/* il riepilogo e il pagamento */
.riquadro{background:#fff;border:1px solid var(--pietra);border-radius:18px;padding:16px;margin-bottom:14px;}
.totale{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:600;color:var(--verde);padding:12px 0 4px;border-top:1px solid var(--pietra);margin-top:10px;}
.paga{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.mini{font-size:14px;color:var(--grigio);}
label{display:block;font-size:14px;color:var(--verde-medio);font-weight:600;margin-top:12px;}
input.campo{width:100%;padding:13px 14px;font:inherit;font-size:18px;border:1px solid var(--pietra);border-radius:12px;background:#FCFBF8;margin-top:5px;}
.conFoto{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;}
.foto{font-size:22px;padding:8px 12px;border:1px solid var(--pietra);border-radius:12px;background:#fff;margin-top:5px;}
.errore{color:var(--allarme);font-size:15px;margin-top:8px;}
.grazie{text-align:center;padding:30px 10px;}
.grazie .icona{font-size:64px;}
.grazie h1{font-size:34px;}
.numero{font:600 22px ui-monospace,Menlo,monospace;letter-spacing:3px;color:var(--verde);}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;}
.velo .dentro{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:480px;text-align:center;}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--pietra);border-top-color:var(--verde);border-radius:50%;animation:gira 1s linear infinite;}
@keyframes gira{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none;}}
</style>
</head>

    ${inCucina || male ? `<button class="bottone sec" id="nuovo" style="max-width:320px;margin:10px auto 0;">${esc(T().nuovo)}</button>` : ''}</div>`;
  const n = $('nuovo');
  if (n) n.onclick = () => { history.replaceState(null, '', `${location.pathname}?t=${encodeURIComponent(T_ID)}&k=${encodeURIComponent(K)}&l=${LINGUA}${CAMERA ? '&camera=' + CAMERA : ''}`); VISTA = { nome: 'categorie' }; disegna(); };
  clearInterval(sondaggio);
  if (!inCucina && !male) {
    /* dopo Stripe si torna qui: il webhook manda l'ordine in cucina entro
       pochi secondi, e la pagina lo aspetta */
    let giri = 0;
    sondaggio = setInterval(async () => {
      giri += 1;
      try {
        const j = await chiama('ospite-stato', { qs: `&ordine=${encodeURIComponent(VISTA.numero)}` });
        if (j.ordine && j.ordine.stato !== VISTA.stato) { VISTA.stato = j.ordine.stato; if (j.ordine.stato !== 'pagato') disegna(); }
      } catch (e) { /* si riprova */ }
      if (giri > 60) clearInterval(sondaggio);
    }, 3000);
  }
};

/* Senza QR: il tavolo si sceglie a mano, da una griglia di numeri (la
   proprieta', 5 settembre 2026). Scelto il tavolo, la pagina riparte con
   il suo indirizzo firmato, come se avesse inquadrato il QR. */
/* Senza QR: «Dove e' seduto?» — Bistrot interno, Bistrot esterno (esterno
   e terrazza insieme: l'ospite non sa che sono due zone), la Hall (un
   posto solo, i tavoli li' non hanno numero) o in camera, col numero.
   Poi, per interno ed esterno, il numero del tavolo. Scelto il posto, la
   pagina riparte con l'indirizzo firmato, come dal QR (la proprieta', 5
   settembre 2026). */
const schermataScegliTavolo = (d) => {
  const zona = (nome) => d.zone.find((z) => z.locale === 'bistrot' && String(z.nome).toLowerCase() === nome);
  const speciale = (nome) => d.tavoli.find((x) => String(x.nome).toLowerCase() === nome);
  const numero = (nome) => String(nome).replace(/^(tavolo|table|tisch)\s*/i, '');
  const tavoliDi = (nomi) => nomi.map(zona).filter(Boolean)
    .flatMap((z) => d.tavoli.filter((x) => x.zona === z.id && /\d/.test(numero(x.nome))))
    .sort((a, b) => Number(numero(a.nome)) - Number(numero(b.nome)));
  const vai = (x, extra = '') => location.replace(`${location.pathname}?t=${encodeURIComponent(x.id)}&k=${encodeURIComponent(x.k)}&l=${LINGUA}${extra}`);
  const hall = speciale('hall'), camera = speciale('camera');
  if (!VISTA.posto) {
    $('app').innerHTML = `<h1>${esc(T().dove)}</h1><div class="griglia">
      <button class="quadro" data-posto="interno"><span class="icona">🏠</span><b>${esc(T().interno)}</b></button>
      <button class="quadro" data-posto="esterno"><span class="icona">☀️</span><b>${esc(T().esterno)}</b></button>
      ${hall ? `<button class="quadro" data-posto="hall"><span class="icona">🛋️</span><b>${esc(T().hall)}</b></button>` : ''}
      ${camera ? `<button class="quadro" data-posto="camera"><span class="icona">🛏️</span><b>${esc(T().inCamera)}</b></button>` : ''}</div>`;
    $('app').querySelectorAll('[data-posto]').forEach((b) => b.onclick = () => {
      if (b.dataset.posto === 'hall') return vai(hall);
      VISTA.posto = b.dataset.posto; disegna();
    });
    return;
  }
  if (VISTA.posto === 'camera') {
    $('app').innerHTML = `<button class="indietro" id="indietro">‹ ${esc(T().indietro)}</button><h1>${esc(T().qualeCamera)}</h1>
      <input class="campo" id="qCamera" inputmode="numeric" autocomplete="off" placeholder="229" style="font-size:26px;text-align:center;letter-spacing:2px;" />
      <button class="bottone" id="qVai" style="margin-top:12px;">${esc(T().avanti)} ›</button>`;
    $('indietro').onclick = () => { VISTA.posto = null; disegna(); };
    const via = () => { const c = $('qCamera').value.replace(/\D/g, '').slice(0, 10); if (!c) return $('qCamera').focus(); vai(camera, `&camera=${encodeURIComponent(c)}`); };
    $('qVai').onclick = via;
    $('qCamera').onkeydown = (ev) => { if (ev.key === 'Enter') via(); };
    setTimeout(() => $('qCamera').focus(), 50);
    return;
  }
  const tt = VISTA.posto === 'interno' ? tavoliDi(['interno']) : tavoliDi(['esterno', 'terrazza']);
  $('app').innerHTML = `<button class="indietro" id="indietro">‹ ${esc(T().indietro)}</button><h1>${esc(T().numeroTavolo)}</h1>
    <div class="griglia numeri">${tt.map((x) => `<button class="quadro numero" data-tav="${esc(x.id)}" data-k="${esc(x.k)}"><b>${esc(numero(x.nome))}</b></button>`).join('')}</div>`;
  $('indietro').onclick = () => { VISTA.posto = null; disegna(); };
  $('app').querySelectorAll('[data-tav]').forEach((b) => b.onclick = () => vai({ id: b.dataset.tav, k: b.dataset.k }));
};
const disegna = () => {
  testa();
  if (VISTA.nome === 'tavolo') { schermataScegliTavolo(VISTA.dati); barra(); return; }
  if (VISTA.nome === 'categorie') schermataCategorie();
  else if (VISTA.nome === 'articoli') { const c = MENU.categorie.find((x) => x.id === VISTA.categoria); c ? schermataArticoli(c) : schermataCategorie(); }
  else if (VISTA.nome === 'carrello') schermataCarrello();
  else if (VISTA.nome === 'camera') schermataCamera();
  else if (VISTA.nome === 'grazie') schermataGrazie();
  barra();
  window.scrollTo(0, 0);
};

/* un solo ascoltatore per tutti i tocchi: quadratoni, piu' e meno, note */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest ? ev.target.closest('[data-gruppo],[data-cat],[data-piu],[data-meno],[data-apri-nota],[data-chip]') : null;
  if (!el) return;
  if (el.dataset.chip) {
    /* una nota pronta si accende e si spegne; nella nota vanno le parole
       italiane, separate da virgola, come le scrive il cameriere */
    const c = CARRELLO.get(el.dataset.chipArt); if (!c) return;
    const parti = partiNota(c.nota);
    c.nota = (parti.includes(el.dataset.chip) ? parti.filter((p) => p !== el.dataset.chip) : [...parti, el.dataset.chip]).join(', ').slice(0, 120);
    aggiornaRiga(el.dataset.chipArt); return;
  }
  if (el.dataset.gruppo) { VISTA = { nome: 'categorie', gruppo: el.dataset.gruppo }; disegna(); return; }
  if (el.dataset.cat) { VISTA = { nome: 'articoli', categoria: el.dataset.cat }; disegna(); return; }
  if (el.dataset.piu) { metti(el.dataset.piu, quantita(el.dataset.piu) + 1); aggiornaRiga(el.dataset.piu); return; }
  if (el.dataset.meno) { metti(el.dataset.meno, quantita(el.dataset.meno) - 1); aggiornaRiga(el.dataset.meno); return; }
  if (el.dataset.apriNota) { const c = CARRELLO.get(el.dataset.apriNota); if (c) { c.aperta = true; aggiornaRiga(el.dataset.apriNota); const i = document.querySelector(`[data-nota="${el.dataset.apriNota}"]`); if (i) i.focus(); } }
});
document.addEventListener('input', (ev) => {
  const i = ev.target;
  if (i && i.dataset && i.dataset.nota) { const c = CARRELLO.get(i.dataset.nota); if (c) c.nota = i.value.slice(0, 120); }
});
/* si ridisegna la riga sola, non la pagina: il dito resta dov'e' */
const aggiornaRiga = (id) => {
  const a = MENU.articoli.find((x) => x.id === id);
  const vecchia = document.querySelector(`.riga[data-art="${id}"]`);
  if (!a || !vecchia) { disegna(); return; }
  if (VISTA.nome === 'carrello' && !quantita(id)) { disegna(); return; }
  const tmp = document.createElement('div'); tmp.innerHTML = rigaArticolo(a);
  vecchia.replaceWith(tmp.firstElementChild);
  if (VISTA.nome === 'carrello') { const tot = document.querySelector('.totale span:last-child'); if (tot) tot.textContent = euro(totale()); }
};

/* ---------- la tessera con la fotocamera (solo dove Chrome la da') ---------- */
const puoScansionare = () => window.isSecureContext && 'BarcodeDetector' in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function scansiona() {
  const velo = document.createElement('div'); velo.className = 'velo';
  velo.innerHTML = `<div class="dentro"><video id="fotoVideo" autoplay playsinline muted style="width:100%;max-height:50vh;border-radius:12px;background:#000;"></video>
    <button class="bottone sec" id="fotoChiudi" style="margin-top:10px;">${esc(T().annulla)}</button></div>`;
  document.body.appendChild(velo);
  let flusso = null, timer = null;
  const chiudi = () => { clearInterval(timer); if (flusso) flusso.getTracks().forEach((t) => t.stop()); velo.remove(); };
  return new Promise((risolvi) => {
    velo.querySelector('#fotoChiudi').onclick = () => { chiudi(); risolvi(null); };
    (async () => {
      try {
        flusso = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        velo.querySelector('#fotoVideo').srcObject = flusso;
        const voluti = ['code_128', 'code_39', 'ean_13', 'ean_8', 'itf', 'codabar', 'qr_code'];
        const formati = (await BarcodeDetector.getSupportedFormats()).filter((f) => voluti.includes(f));
        if (!formati.length) { chiudi(); risolvi(null); return; }
        const lettore = new BarcodeDetector({ formats: formati });
        timer = setInterval(async () => {
          try { const c = await lettore.detect(velo.querySelector('#fotoVideo')); if (c.length && c[0].rawValue) { const v = c[0].rawValue; chiudi(); risolvi(v); } } catch (e) { /* prossimo fotogramma */ }
        }, 300);
      } catch (e) { chiudi(); risolvi(null); }
    })();
  });
}

/* ---------- avvio ---------- */
/* Senza QR e fuori dalla rete: si dice come si fa, non solo che non si
   puo'. La nota sulla Protezione IP compare solo quando il server l'ha
   riconosciuta nel messaggio: a chi non ce l'ha non serve saperlo. */
function schermataQr(messaggio) {
  const s = String(messaggio || '');
  const q = QT();
  if (!/rete Wi-Fi|QR/i.test(s)) { $('app').innerHTML = `<h1>${esc(traduci(s))}</h1>`; return; }
  $('app').innerHTML = `<div class="serveQr">${DISEGNO_QR}
    <h1>${esc(q.titolo)}</h1>
    <ol><li>${esc(q.passo1)}</li><li>${esc(q.passo2)}</li></ol>
    <p class="mini">${esc(q.senzaQr)}</p>
  </div>`;
}

(async () => {
  if (!T_ID || !K) {
    /* nessun QR inquadrato: si sceglie il tavolo a mano */
    try {
      const d = await chiama('ospite-tavoli');
      VISTA = { nome: 'tavolo', dati: d, locale: null }; disegna();
    } catch (e) { schermataQr(e.message); }
    return;
  }
  try {
    MENU = await chiama('ospite-menu');
  } catch (e) {
    /* firma sbagliata o tavolo sparito: si torna alla scelta a mano */
    try { const d = await chiama('ospite-tavoli'); VISTA = { nome: 'tavolo', dati: d, locale: null }; disegna(); }
    catch (e2) { schermataQr(e2.message); }
    return;
  }
  const ordine = P.get('ordine');
  if (ordine) VISTA = { nome: 'grazie', numero: ordine, stato: 'in_attesa' };
  disegna();
})();
</script>
