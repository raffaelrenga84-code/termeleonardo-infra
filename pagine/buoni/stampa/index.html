<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- la pagina porta la dedica e il nome di chi riceve: niente indicizzazione,
     per lo stesso motivo per cui il back office non si indicizza -->
<meta name="robots" content="noindex, nofollow" />
<title>Buono Regalo — Hotel Terme Leonardo</title>
<style>
:root{--verde:#1B4D4A;--verde-medio:#5C736F;--verde-chiaro:#E4F0EA;--oro:#C9A961;
--carta:#FBFAF7;--sabbia:#EDE7DC;--inchiostro:#2A2E2B;--arancio:#E8751A;--allarme:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--carta);color:var(--inchiostro);font:16px/1.6 Arial,Helvetica,sans-serif;}
header{background:var(--verde-chiaro);padding:22px 16px;text-align:center;}
header img{display:block;width:170px;max-width:60%;height:auto;margin:0 auto;}
main{max-width:900px;margin:0 auto;padding:26px 16px 10px;text-align:center;}
.messaggio{max-width:520px;margin:34px auto;font-size:16px;line-height:1.6;color:var(--verde-medio);}
.messaggio.errore{color:var(--allarme);}
.azione{display:inline-block;background:var(--arancio);color:#fff;border:0;border-radius:8px;
padding:16px 30px;font:600 17px Arial;cursor:pointer;margin:10px 0 6px;text-decoration:none;}
.istruzioni{font-size:13px;color:var(--verde-medio);margin-bottom:10px;}
/* il buono e' il PDF che disegna il server: qui si guarda dentro la
   pagina, e il pulsante sopra lo apre per intero. 80vh perche' un A4 su
   uno schermo alto si legge tutto, il min-height perche' su un telefono
   in orizzontale 80vh sarebbero quattro dita di foglio. */
.pdfFrame{width:100%;height:80vh;min-height:520px;border:1px solid #E5E0D8;background:#fff;}
.piede{border-top:1px solid var(--sabbia);padding:22px 16px 30px;text-align:center;
font-size:12.5px;color:var(--verde-medio);}
@media (max-width:640px){
  main{padding:18px 12px 4px;}
  .azione{width:100%;padding:16px 18px;}
}
</style>
</head>
<body>

<header><img src="/buoni/img/logo.svg" alt="Hotel Terme Leonardo" /></header>

<main id="pagina"></main>

<div class="piede">
  Hotel Terme Leonardo &middot; +39 049 9939200 &middot; info@termeleonardo.com
</div>

<script type="module">
'use strict';
/* Il buono lo disegna il server, in PDF sulla carta intestata: questa
   pagina non ne fa una seconda resa, lo apre e basta. Due disegni dello
   stesso foglio, uno dei due prima o poi rimasto indietro, e' esattamente
   il difetto che questo progetto ha gia' pagato piu' volte — la strada
   presa il 5 settembre 2026 e' che di disegno ce ne sia uno solo, e stia
   dalla parte del server. */
/* buono.js non serve piu': serviva per buonoStampaHTML, e restava solo
   `esc` — un modulo intero (col generatore di QR dentro) tirato giu' da un
   telefono per due righe di sostituzioni. Riscritte qui sotto. */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const FUNZIONE = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/buoni';
const $ = (id) => document.getElementById(id);

const qs = new URLSearchParams(location.search);
const CODICE = (qs.get('codice') || '').trim();

/* La lingua arriva dal link che l'email ha già scelto per il cliente — la
   stessa lingua in cui il buono è stato emesso — così il messaggio di
   caricamento e gli eventuali errori sono nella lingua giusta ancora prima
   che il server risponda (vedi linkStampa in email-buono.ts). Il fallback
   sulla lingua del browser serve solo a chi arriva senza quel parametro,
   ad esempio un codice digitato a mano nella barra degli indirizzi. */
const LNG = ['it','de','en','fr'].includes(qs.get('l')) ? qs.get('l')
  : (['de','fr'].includes((navigator.language || '').slice(0,2)) ? (navigator.language || '').slice(0,2)
  : ((navigator.language || '').slice(0,2) === 'it' ? 'it' : 'en'));
document.documentElement.lang = LNG;

const T = {
  it:{ titolo:'Il tuo Buono Regalo', carico:'Carichiamo il tuo buono…',
    bottone:'Stampa il tuo buono',
    istruzioni:'Si apre il PDF del buono: da lì lo stampa o lo salva. Da telefono può anche condividerlo.',
    erroreRete:'Non siamo riusciti a caricare il buono. Riprova tra poco, oppure scrivici a info@termeleonardo.com o chiamaci al +39 049 9939200.',
    nonTrovato:'Non troviamo un buono con questo codice. Controlla di averlo copiato per intero.',
    attesa:'Questo buono risulta ancora in attesa di pagamento: non è ancora stato emesso.',
    annullato:'Questo buono è stato annullato e non è più valido.',
    riscosso:'Questo buono è già stato riscosso e non è più valido.',
    scaduto:'Questo buono è scaduto e non è più valido.',
    genericoNonValido:'Questo buono non è valido.' },
  de:{ titolo:'Ihr Geschenkgutschein', carico:'Ihr Gutschein wird geladen…',
    bottone:'Gutschein ausdrucken',
    istruzioni:'Es öffnet sich der Gutschein als PDF: von dort drucken oder speichern. Vom Smartphone aus können Sie ihn auch teilen.',
    erroreRete:'Der Gutschein konnte nicht geladen werden. Bitte versuchen Sie es später erneut, oder schreiben Sie an info@termeleonardo.com bzw. rufen Sie +39 049 9939200 an.',
    nonTrovato:'Wir finden keinen Gutschein mit diesem Code. Bitte prüfen Sie, ob Sie ihn vollständig kopiert haben.',
    attesa:'Dieser Gutschein wartet noch auf die Zahlung und wurde noch nicht ausgestellt.',
    annullato:'Dieser Gutschein wurde storniert und ist nicht mehr gültig.',
    riscosso:'Dieser Gutschein wurde bereits eingelöst und ist nicht mehr gültig.',
    scaduto:'Dieser Gutschein ist abgelaufen und nicht mehr gültig.',
    genericoNonValido:'Dieser Gutschein ist nicht gültig.' },
  en:{ titolo:'Your Gift Voucher', carico:'Loading your voucher…',
    bottone:'Print your voucher',
    istruzioni:'The voucher opens as a PDF: print or save it from there. On a phone you can also share it.',
    erroreRete:'We could not load the voucher. Please try again shortly, or write to info@termeleonardo.com or call +39 049 9939200.',
    nonTrovato:'We cannot find a voucher with this code. Please check that you copied it in full.',
    attesa:'This voucher is still awaiting payment and has not been issued yet.',
    annullato:'This voucher has been cancelled and is no longer valid.',
    riscosso:'This voucher has already been redeemed and is no longer valid.',
    scaduto:'This voucher has expired and is no longer valid.',
    genericoNonValido:'This voucher is not valid.' },
  fr:{ titolo:'Votre Bon Cadeau', carico:'Chargement de votre bon…',
    bottone:'Imprimer votre bon',
    istruzioni:'Le bon s’ouvre en PDF : imprimez-le ou enregistrez-le depuis là. Depuis un téléphone, vous pouvez aussi le partager.',
    erroreRete:'Nous n’avons pas pu charger le bon. Réessayez dans un instant, ou écrivez à info@termeleonardo.com ou appelez le +39 049 9939200.',
    nonTrovato:'Nous ne trouvons aucun bon avec ce code. Vérifiez que vous l’avez copié en entier.',
    attesa:'Ce bon est encore en attente de paiement et n’a pas encore été émis.',
    annullato:'Ce bon a été annulé et n’est plus valable.',
    riscosso:'Ce bon a déjà été utilisé et n’est plus valable.',
    scaduto:'Ce bon est expiré et n’est plus valable.',
    genericoNonValido:'Ce bon n’est pas valable.' }
};
const t = T[LNG];
document.title = t.titolo + ' — Hotel Terme Leonardo';

function messaggio(testo, errore) {
  $('pagina').innerHTML = `<div class="messaggio${errore ? ' errore' : ''}">${esc(testo)}</div>`;
}

async function carica() {
  if (!CODICE) { messaggio(t.nonTrovato, true); return; }
  messaggio(t.carico, false);
  let j;
  try {
    const r = await fetch(FUNZIONE + '?a=stampa&codice=' + encodeURIComponent(CODICE));
    j = await r.json().catch(() => ({}));
    /* 404 (codice non trovato) e' una risposta valida quanto un 200: la si
       legge lo stesso, non e' un errore di rete */
    if (!r.ok && r.status !== 404) throw new Error('errore ' + r.status);
  } catch (e) {
    messaggio(t.erroreRete, true);
    return;
  }
  if (!j || !j.valido) {
    /* j.stato vale 'attesa' | 'annullato' | 'riscosso' | 'scaduto': sono
       proprio le chiavi che T porta gia' tradotte, quindi si usa il valore
       cosi' com'e' per scegliere il messaggio, senza una mappa a parte che
       potrebbe restare indietro se domani il server aggiunge uno stato.

       Object.hasOwn e non `t[j.stato]`: la verita' di `t[j.stato]` non dice
       che lo stato esiste fra i testi, dice che l'oggetto ha risposto
       qualcosa — e a "toString" o "constructor" un oggetto risponde sempre,
       con roba ereditata da Object.prototype. All'ospite che prova a
       stampare il suo buono arriverebbe il sorgente di una funzione al posto
       del messaggio. Il server oggi manda solo i quattro stati veri, quindi
       non e' un buco aperto: e' la stessa forma sbagliata che altrove qui
       lasciava passare un circolo di golf inesistente. */
    const testo = (j && Object.hasOwn(t, j.stato)) ? t[j.stato] : t.nonTrovato;
    messaggio(testo, true);
    return;
  }
  /* Il buono e' il PDF: un link che lo apre (dal telefono e' anche il modo
     per condividerlo o salvarlo) e, sotto, lo stesso PDF gia' aperto nella
     pagina. La pagina non manda piu' niente in stampa da se': a stampare
     ci pensa il lettore di PDF del telefono o del computer, che l'ospite
     conosce gia'.
     L'indirizzo del PDF e' scritto per esteso tutte e due le volte invece
     che tenuto in una variabile: e' il solo che questa pagina compone, e
     cosi' si legge tale e quale nell'HTML che l'ospite riceve. */
  $('pagina').innerHTML =
    `<a class="azione" href="${FUNZIONE}?a=pdf&codice=${encodeURIComponent(CODICE)}"
      target="_blank" rel="noopener">${esc(t.bottone)}</a>
    <div class="istruzioni">${esc(t.istruzioni)}</div>
    <iframe class="pdfFrame" src="${FUNZIONE}?a=pdf&codice=${encodeURIComponent(CODICE)}"
      title="${esc(t.titolo)}"></iframe>`;
}

carica();
</script>
</body>
</html>
