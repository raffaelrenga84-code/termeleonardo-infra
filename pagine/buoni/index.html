<html lang="it">
<head>

<title>Buoni regalo — back office</title>
<style>
:root{--acqua:#1E7F88;--acqua-scura:#0F5C64;--acqua-chiara:#E3F0F1;
--pietra:#EDE7DC;--carta:#FAF8F4;--inchiostro:#2A2E2B;--grigio:#7B756A;
--arancio:#E8751A;--oliva:#7A8450;--allarme:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--carta);color:var(--inchiostro);font:15px/1.5 Arial,Helvetica,sans-serif;}
.fascia{height:6px;background:linear-gradient(90deg,var(--acqua-scura),var(--acqua) 45%,#6FB1B8);}
header{background:#fff;border-bottom:1px solid var(--pietra);padding:14px 20px;
display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header .marchio{display:flex;align-items:center;gap:12px;}
header .marchio img{display:block;width:132px;height:auto;}
header .marchio span{font-family:Georgia,serif;font-size:15px;letter-spacing:2px;color:var(--fumo,#5C736F);}
header .chi{font-size:13px;color:var(--grigio);}
main{max-width:1340px;margin:0 auto;padding:20px 16px 60px;}
.due-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,660px);gap:22px;align-items:start;}
@media (max-width:1100px){ .due-col{grid-template-columns:1fr;} .anteprima{position:static !important;} }
.anteprima{position:sticky;top:16px;}
.anteprima .etichetta{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
color:var(--grigio);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.anteprima .telaio{background:#fff;border:1px solid var(--pietra);border-radius:8px;
padding:14px;overflow:auto;}
.anteprima .telaio > *{transform-origin:top left;}
.azioni-buono{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.azioni-buono button{flex:1;min-width:150px;margin-top:0;}
.schede{display:flex;gap:8px;border-bottom:1px solid var(--pietra);margin-bottom:18px;}
.schede button{background:none;border:0;border-bottom:3px solid transparent;
padding:10px 14px;font:600 14px Arial;color:var(--grigio);cursor:pointer;}
.schede button.attiva{color:var(--acqua-scura);border-bottom-color:var(--acqua);}
.riquadro{background:#fff;border:1px solid var(--pietra);border-radius:8px;padding:18px;margin-bottom:16px;}
h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acqua);margin-bottom:12px;}
label{display:block;font-size:12px;color:var(--grigio);margin:10px 0 4px;}
input,select,textarea{width:100%;padding:10px;border:1px solid #D8D2C4;border-radius:5px;
font:15px Arial;color:var(--inchiostro);background:#fff;}
textarea{min-height:64px;}
.due{display:flex;gap:12px;flex-wrap:wrap;}
.due>div{flex:1;min-width:180px;}
/* anche a.azione: "Rispondi all'ospite" apre il programma di posta, quindi
   e' un link e non un pulsante, ma deve avere lo stesso aspetto */
button.azione,a.azione{background:var(--arancio);color:#fff;border:0;border-radius:6px;
padding:13px 20px;font:600 15px Arial;cursor:pointer;margin-top:14px;
display:inline-block;text-decoration:none;box-sizing:border-box;}
button.azione:disabled{background:#CFCABF;}
button.sec{background:#fff;color:var(--acqua-scura);border:1px solid var(--acqua);}
button.mini-azione{background:#fff;color:var(--acqua-scura);border:1px solid var(--acqua);
border-radius:6px;padding:5px 11px;font:11px/1 Arial;letter-spacing:.6px;
text-transform:uppercase;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
color:var(--acqua-scura);padding:8px 10px;background:#F4F1EA;}
td{padding:9px 10px;border-top:1px solid #F0EBE1;vertical-align:top;}
.cod{font-family:monospace;font-weight:700;color:var(--acqua-scura);}
.stato{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;}
/* i promozionali non sono un incasso: si devono riconoscere a colpo d'occhio */
.omaggio{display:inline-block;padding:1px 7px;border-radius:9px;background:#FBF3DF;
color:#8A6D1F;border:1px solid #E4CE93;font-size:11px;letter-spacing:.3px;}
/* un buono con più voci va riconosciuto senza doverlo aprire */
.piu-voci{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:9px;
background:var(--acqua-chiara);color:var(--acqua-scura);border:1px solid var(--acqua);
font-size:11px;letter-spacing:.3px;}
tr.apribile{cursor:pointer;}
tr.apribile:hover td{background:#F7F5EF;}
.st-pagato{background:var(--acqua-chiara);color:var(--acqua-scura);}
.st-attesa{background:#FFF6E8;color:#B3541E;}
.st-riscosso{background:#EFF3E7;color:var(--oliva);}
.st-annullato{background:#F3F0EC;color:var(--grigio);}
.st-scaduto{background:#FDF0EE;color:var(--allarme);}
/* un buono pagato che non e' arrivato al cliente: deve dare fastidio,
   perche' qualcuno ha pagato e sta aspettando qualcosa che non ha */
.nonconsegnato{margin-top:4px;font-size:10px;font-weight:bold;letter-spacing:1px;
  background:var(--allarme,#C0392B);color:#fff;padding:2px 7px;border-radius:3px;
  display:inline-block;}
.avviso-consegna{margin-top:12px;padding:12px 14px;border-radius:5px;
  background:#FDF0EE;border-left:4px solid var(--allarme,#C0392B);
  font-size:13.5px;line-height:1.6;color:#7A2E24;}
/* stati delle richieste dal sito: la "nuova" deve saltare all'occhio,
   e' una persona che aspetta una risposta */
.st-nuova{background:#FFF0E4;color:#B3541E;font-weight:bold;}
.st-vista{background:#FFF6E8;color:#B3541E;}
.st-risposta{background:var(--acqua-chiara);color:var(--acqua-scura);}
.st-chiusa{background:#F3F0EC;color:var(--grigio);}
/* il tipo di richiesta (Trattamenti/Transfer/Green fee/Maestro/Soggiorno):
   una pastiglia sola per tutti i tipi, non un colore per tipo — l'etichetta
   arriva gia' scelta dal server (riepilogo.ts) e qui basta mostrarla */
.badge-tipo{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  background:var(--acqua-chiara);color:var(--acqua-scura);white-space:nowrap;}
/* «aveva chiesto: mattina» accanto a un campo che la reception ha gia'
   corretto rispetto a dati_originali */
.nota-prima{font-size:11.5px;color:var(--grigio);margin-top:2px;}
.esito{font-size:14px;color:var(--acqua-scura);min-height:20px;padding-top:10px;}
.errore{color:var(--allarme);}
.mini{font-size:12px;color:var(--grigio);}
.fatto{background:var(--acqua-chiara);border-left:4px solid var(--acqua);
border-radius:0 8px 8px 0;padding:14px 16px;margin-top:14px;}
.fatto .codice{font-family:monospace;font-size:26px;letter-spacing:2px;color:var(--acqua-scura);}
/* il foglio A4 di stampa (#stampa e tutto il resto di questa regola) vive in
   stampa.css, caricato qui sotto con <link>: lo stesso foglio serve anche a
   pagine/buoni/stampa/index.html, la pagina pubblica che il cliente apre dal
   pulsante «Stampa il tuo buono» nell'email. Una sola resa dell'aspetto,
   come buonoStampaHTML() in buono.js è l'unica resa del markup — cambiare
   qui l'aspetto stampato cambia entrambe le pagine, non serve ricordarsi
   della seconda. Qui in più: nascosto finché non si stampa, perché il back
   office ha anche altro da mostrare (la pagina pubblica invece no, e lo
   tiene visibile — vedi il commento in cima a stampa.css). */
#stampa{display:none;}
</style>
<link rel="stylesheet" href="/buoni/stampa.css" />
</head>

<script type="module">

  if (!iso) return '';
  const M = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
    'agosto','settembre','ottobre','novembre','dicembre'];
  const d = new Date(String(iso).slice(0,10) + 'T12:00');
  return `${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()}`;
};

/* descrizione del buono monetario, nella lingua scelta sul buono */
const TESTO_VALORE = {

};

let SB = null;        // client Supabase
let TOKEN = '';       // token dell'utente autenticato
let OPERATORE = '';   // nome dell'operatore, dal suo utente
let VISTA = 'emetti';

async function chiama(qs, opz = {}, base = FUNZIONE) {
  const r = await fetch(base + qs, {
    ...opz,
    headers: {
      'content-type': 'application/json',
      authorization: 'Bearer ' + TOKEN,
      ...(opz.headers || {})
    }
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { await esci(); throw new Error(j.errore || 'sessione scaduta'); }
  if (!r.ok) throw new Error(j.errore || ('errore ' + r.status));
  return j;
}

async function esci() {
  try { if (SB) await SB.auth.signOut(); } catch (e) {}
  TOKEN = ''; OPERATORE = '';
}

/* ---------- accesso con utente dell'hotel ---------- */
function chiediAccesso(messaggio) {
  $('chiSono').textContent = '';
  $('app').innerHTML = `<div class="riquadro" style="max-width:420px;margin:40px auto;">
    <h2>Accesso reception</h2>
    <label>Email dell'hotel</label>
    <input type="email" id="kMail" placeholder="nome@termeleonardo.com" autocomplete="username" />
    <label>Password</label>
    <input type="password" id="kPwd" autocomplete="current-password" />
    <button class="azione" id="kEntra" style="width:100%;">Entra</button>
    <div class="esito" id="kEsito">${messaggio ? `<span class="errore">${esc(messaggio)}</span>` : ''}</div>
    <p class="mini" style="padding-top:10px;">Serve un indirizzo dell'hotel.
    Password dimenticata? La reimposta l'amministratore da Supabase.</p></div>`;

  const entra = async () => {
    const email = $('kMail').value.trim();
    const pwd = $('kPwd').value;
    if (!email || !pwd) { $('kEsito').innerHTML = '<span class="errore">Servono email e password.</span>'; return; }
    $('kEntra').disabled = true;
    $('kEsito').textContent = 'Un momento\u2026';
    try {
      const { data, error } = await SB.auth.signInWithPassword({ email, password: pwd });
      if (error) throw new Error('Email o password non validi.');
      TOKEN = data.session.access_token;
      OPERATORE = data.user.user_metadata?.nome || email.split('@')[0];
      await chiama('?a=elenco'); // prova: verifica anche dominio e IP
      disegna();
    } catch (e) {
      await esci();
      $('kEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
      $('kEntra').disabled = false;
    }
  };
  $('kEntra').onclick = entra;
  $('kPwd').onkeydown = (ev) => { if (ev.key === 'Enter') entra(); };
}

/* ---------- struttura ---------- */
function disegna() {
  $('chiSono').textContent = OPERATORE ? OPERATORE + ' \u00b7' : '';
  $('app').innerHTML = `<div class="schede">
    <button data-v="emetti" class="${VISTA==='emetti'?'attiva':''}">Emetti un buono</button>
    <button data-v="elenco" class="${VISTA==='elenco'?'attiva':''}">Buoni emessi</button>
    <button data-v="verifica" class="${VISTA==='verifica'?'attiva':''}">Verifica / riscuoti</button>
    <button data-v="richieste" class="${VISTA==='richieste'?'attiva':''}">Richieste dal sito</button>
  </div><div id="vista"></div>`;
  document.querySelectorAll('.schede button').forEach(b =>
    b.onclick = () => { VISTA = b.dataset.v; disegna(); });
  ({ emetti: vistaEmetti, elenco: vistaElenco, verifica: vistaVerifica,
     richieste: vistaRichieste })[VISTA]();
}

/* ---------- 1. emissione ---------- */
function vistaEmetti() {
  const oggi = new Date();
  const fra12 = new Date(oggi); fra12.setFullYear(fra12.getFullYear() + 1);
  /* affianca, non sostituisce, il controllo vero sul server (scadenzaCrea in
     supabase/functions/buoni/acquista.ts): qui serve solo perche' l'errore
     si veda mentre l'operatore digita, non dopo aver gia' premuto "crea" */
  const fraCinqueAnni = new Date(oggi); fraCinqueAnni.setFullYear(fraCinqueAnni.getFullYear() + 5);
  const iso = (d) => d.toISOString().slice(0, 10);

  /* `escludi(id)`, se passato, toglie dalla tendina le voci che non
     dovrebbero starci — un gruppo che resta senza voci non si stampa

     che questa regola possa classificare. */

    const voci = escludi ? gr.v.filter(([id]) => !escludi(id)) : gr.v;
    if (!voci.length) return '';
    return `<optgroup label="${esc(gr.g)}">` + voci.map(([id, nome, prezzo]) =>
      `<option value="${id}" data-prezzo="${prezzo}" data-nome="${esc(nome)}">${esc(nome)} — ${eur(prezzo)} €</option>`
    ).join('') + `</optgroup>`;

  $('vista').innerHTML = `<div class="due-col"><div><div class="riquadro">

    <label>Tipo</label>
    <select id="fTipo">

      <div class="due" style="align-items:flex-end;">
        <div style="flex:3;min-width:240px;"><select id="fVoce">${opzioniCatalogo()}</select></div>
        <div style="flex:0 0 90px;min-width:90px;"><label>Quantit\u00e0</label>
          <input type="number" id="fQta" min="1" step="1" value="1" /></div>
        <div style="flex:0 0 auto;"><button class="azione sec" id="fAggiungi"
          style="margin-top:0;" title="Aggiungi al buono">+ Aggiungi</button></div>
      </div>
      <div id="boxAltro" style="display:none;">
        <div class="due">
          <div style="flex:3;"><label>Descrizione da stampare sul buono</label>
          <input type="text" id="fAltro" placeholder="es. Massaggio a scelta da 50 minuti" /></div>
          <div style="flex:0 0 120px;min-width:120px;"><label>Prezzo (\u20ac)</label>
          <input type="number" id="fAltroPrezzo" min="0" step="1" /></div>
        </div>
      </div>
      <div id="fRighe"></div>
      <p class="mini" id="fRigheNota">Con \u00abAggiungi\u00bb componi un buono con pi\u00f9 voci
      (es. un ingresso alle piscine e un massaggio). Senza aggiungere nulla, vale la voce selezionata qui sopra.</p>
      <p class="mini" id="fNotaSerale" style="display:none;"></p>
    </div>
    <div class="due">
      <div><label>Valore (\u20ac)</label><input type="number" id="fValore" min="1" step="1" /></div>
      <div><label>Valido fino al</label><input type="date" id="fScade" value="${iso(fra12)}"
        min="${iso(oggi)}" max="${iso(fraCinqueAnni)}" /></div>
    </div>
    <p class="mini">Dodici mesi come da regolamento. Ricordi che l'hotel chiude
    da fine novembre a met\u00e0 febbraio: se la scadenza cade l\u00ec, valuti di allungarla.</p>
  </div>

  <div class="riquadro">
    <h2>Chi compra e chi riceve</h2>
    <div class="due">
      <div><label>Acquirente</label><input type="text" id="fAcq" /></div>
      <div><label>Email</label><input type="email" id="fAcqMail" /></div>
      <div><label>Telefono</label><input type="tel" id="fAcqTel" /></div>
    </div>
    <div class="due">
      <div><label>Destinatario (sul buono)</label><input type="text" id="fDest" /></div>
      <div><label>Email del destinatario</label><input type="email" id="fDestMail" /></div>
      <div><label>Pagamento</label>
      <select id="fPag">
        <optgroup label="Incassato adesso in reception">
          <option value="contanti">Contanti</option>
          <option value="bancomat">Bancomat / carta</option>
        </optgroup>
        <optgroup label="Omaggio (nessun incasso)">
          <option value="promozionale">Promozionale</option>
        </optgroup>
        <optgroup label="Da pagare (il buono resta in attesa)">
          <option value="bonifico">Bonifico</option>
          <option value="stripe">Link di pagamento</option>
        </optgroup>
      </select></div>
    </div>
    <label>Lingua del buono</label>
    <select id="fLingua">
      <option value="it">Italiano</option><option value="de">Deutsch</option>
      <option value="en">English</option><option value="fr">Fran&ccedil;ais</option>
    </select>
    <label>Riga sotto il titolo (facoltativa, esce in oro sul buono)</label>
    <input type="text" id="fSotto" placeholder="es. FERIALE \u00b7 DAL LUNED\u00cc AL VENERD\u00cc \u00b7 PER 1 PERSONA" />
    <label>Dedica (facoltativa, esce sul buono)</label>
    <textarea id="fDedica" placeholder="Buon compleanno, con affetto\u2026"></textarea>
    <label>Note interne (non stampate)</label>
    <input type="text" id="fNote" />
    <div id="notaPag" class="mini" style="padding-top:8px;"></div>
    <button class="azione" id="fCrea">Emetti il buono</button>
    <div class="esito" id="fEsito"></div>
    <div id="fFatto"></div>
  </div></div>

  <div class="anteprima">
    <div class="etichetta"><span>Anteprima del buono</span>
    <button type="button" class="mini-azione" id="antStampa">Stampa anteprima</button></div>
    <div class="mini" id="antNota" style="padding-bottom:8px;">si aggiorna mentre compili &middot; la stampa esce marcata BOZZA</div>
    <div class="telaio" id="antTelaio"></div>
  </div></div>`;

  /* ---- paniere: pi\u00f9 voci con quantit\u00e0 ---- */
  let CARRELLO = [];   // [{id, nome, prezzo, q}]

  /* Il Day Spa serale non ha trattamenti alle spalle: alle 18-22.30 di
     venerdi' e sabato il centro benessere non fa trattamenti, e un buono
     "serale + massaggio" sarebbe un buono che il cliente non potrebbe
     usare come gli e' stato venduto \u2014 qui il carrello non ha il tetto di
     due voci che ha la pagina pubblica (regala/index.html), quindi la
     stessa combinazione era possibile anche qui, semplicemente aggiungendo
     le due righe una dopo l'altra. Un altro ingresso Day Spa (anche un
     secondo serale) resta libero di stare nello stesso buono: e' un
     ingresso, non un trattamento che pretende il centro aperto.
     Stessa regola del server (normalizzaVoci, acquista.ts) e della pagina
     pubblica (escludiPer, regala/index.html), scritta qui a mano una terza
     volta e non condivisa: tre ambienti diversi, stesso motivo del
     QUANTITA_MAX duplicato in regala/index.html. Presidiata contro la
     regola vera del server in serale-backoffice.test.ts. */
  const eSerale = (id) => id === 'dayspa_sera';
  const eIngressoDaySpa = (id) => id.startsWith('dayspa');
  /* cosa la tendina non deve piu' poter offrire, dato l'elenco delle voci
     di listino gia' nel carrello (le righe "Altro" non contano: id e'
     null, testo libero dell'operatore). Col serale gia' dentro, niente
     trattamenti; con un trattamento gia' dentro, niente serale; con solo
     altri ingressi Day Spa o un carrello vuoto, nessuna esclusione. */
  const escludiPerVoci = (ids) => ids.some(eSerale) ? (id) => !eIngressoDaySpa(id) : ids.some((id) => !eIngressoDaySpa(id)) ? (id) => eSerale(id) : null;
  const escludiPerCarrello = () => escludiPerVoci(CARRELLO.filter((r) => r.id).map((r) => r.id));
  const NOTA_SERALE = 'I trattamenti non si fanno di sera: per metterli nello stesso buono scelga il Day Spa infrasettimanale o festivo.';

  const vocePlurale = (nome, q) => {
    if (q <= 1) return nome;
    /* plurali garbati per le voci pi\u00f9 comuni; il resto resta invariato */
    return nome
      .replace(/^Massaggio\b/, 'Massaggi')
      .replace(/^Trattamento\b/, 'Trattamenti')
      .replace(/^Programma\b/, 'Programmi')
      .replace(/^Day Spa\b/, 'ingressi Day Spa')
      .replace(/^Pulizia viso\b/, 'Pulizie viso')
      .replace(/^Scrub\b/, 'Scrub')
      .replace(/^Linfodrenaggio\b/, 'Linfodrenaggi')
      .replace(/^Riflessologia\b/, 'Riflessologie');
  };
  /* il numero si scrive solo quando la voce e' una sola e supera uno: "n. 1
     \u00b7 Massaggio antistress" e' il modo in cui un modulo dice a un essere
     umano che l'ha compilato una macchina, ed e' la stessa soglia di
     componiDescrizione sul server e di riepilogoVoci sul sito. Ma quando le
     righe sono piu' di una il numero si scrive su tutte, anche dove vale
     uno: due righe di cui una col numero e una senza si leggono come se la
     seconda avesse una quantita' non specificata, non pari a uno \u2014 ed e'
     proprio quello che la proprieta' ha visto su un buono vero a due voci.
     Nello stesso elenco della reception due buoni identici devono leggersi
     nello stesso modo, sia che siano nati qui o online. */
  const rigaTesto = (r, mostraNumero) => (mostraNumero || r.q > 1) ? `n. ${r.q} \u00b7 ${vocePlurale(r.nome, r.q)}` : r.nome;
  const descrizioneCarrello = (righe) => righe.map(r => rigaTesto(r, righe.length > 1)).join('\n');
  const sommaCarrello = (righe) => righe.reduce((s, r) => s + r.prezzo * r.q, 0);

  const righeCorrenti = () => {
    if (CARRELLO.length) return CARRELLO;
    /* nessuna riga aggiunta: vale la voce selezionata, come prima */
    const o = $('fVoce').selectedOptions[0];
    const q = Math.max(1, parseInt($('fQta').value) || 1);
    if ($('fVoce').value === '__altro') {
      const nome = $('fAltro').value.trim();
      return nome ? [{ id: null, nome, prezzo: parseFloat($('fAltroPrezzo').value) || 0, q }] : [];
    }
    return [{ id: $('fVoce').value, nome: o.dataset.nome, prezzo: Number(o.dataset.prezzo), q }];
  };

  /* la tendina si ricostruisce sul contenuto del carrello. Se l'elenco
     filtrato non cambia si lascia stare del tutto: sostituire l'HTML
     resetta comunque la selezione alla prima opzione, e farlo ogni volta
     che il carrello cambia — anche per un'aggiunta che non tocca la
     regola — sposterebbe la scelta dell'operatore senza ragione. Se
     l'elenco cambia davvero e la voce di prima c'e' ancora, si ripristina:
     solo se e' proprio lei a sparire (il caso che conta: era il serale, o
     era un trattamento incompatibile) la selezione scivola sulla prima
     voce rimasta. "__altro" non sparisce mai (vedi opzioniCatalogo). */
  const rigenerafVoceOpzioni = () => {
    const valorePrima = $('fVoce').value;
    const nuove = opzioniCatalogo(escludiPerCarrello());
    if ($('fVoce').innerHTML === nuove) return;
    $('fVoce').innerHTML = nuove;
    if ([...$('fVoce').options].some((o) => o.value === valorePrima)) $('fVoce').value = valorePrima;
  };

  function disegnaRighe() {
    rigenerafVoceOpzioni();
    const esclusa = escludiPerCarrello();
    $('fNotaSerale').style.display = esclusa ? '' : 'none';
    if (esclusa) $('fNotaSerale').textContent = NOTA_SERALE;
    if (!CARRELLO.length) { $('fRighe').innerHTML = ''; return; }
    $('fRighe').innerHTML = `<table style="margin-top:10px;">` + CARRELLO.map((r, i) =>
      `<tr><td style="width:70px;">n. ${r.q}</td><td>${esc(vocePlurale(r.nome, r.q))}</td>
      <td style="width:90px;text-align:right;">${eur(r.prezzo * r.q)} \u20ac</td>
      <td style="width:40px;text-align:right;"><a href="#" data-i="${i}" class="togliRiga"
        style="color:var(--allarme);text-decoration:none;font-size:17px;" title="Togli">\u00d7</a></td></tr>`
    ).join('') + `<tr><td></td><td style="color:var(--grigio);">Totale listino</td>
      <td style="text-align:right;font-weight:700;">${eur(sommaCarrello(CARRELLO))} \u20ac</td><td></td></tr></table>`;
    document.querySelectorAll('.togliRiga').forEach(a => a.onclick = (ev) => {
      ev.preventDefault();
      CARRELLO.splice(Number(a.dataset.i), 1);
      $('fValore').value = CARRELLO.length ? sommaCarrello(CARRELLO) : '';
      disegnaRighe(); aggiornaAnteprima();
    });
  }

  const agg = () => {
    const servizio = $('fTipo').value === 'servizio';
    $('boxServizio').style.display = servizio ? '' : 'none';
    if (servizio) {
      const o = $('fVoce').selectedOptions[0];
      $('boxAltro').style.display = $('fVoce').value === '__altro' ? '' : 'none';
      if (!CARRELLO.length && $('fVoce').value !== '__altro') $('fValore').value = o.dataset.prezzo;
    } else {
      /* buono monetario: si parte da zero, niente residui del listino */
      $('fValore').value = '';
    }
  };
  const aggPag = () => {
    const v = $('fPag').value;
    const daPagare = ['bonifico', 'stripe'].includes(v);
    $('notaPag').innerHTML = daPagare
      ? 'Il buono nasce <strong>in attesa di pagamento</strong>: si genera l\u2019anteprima da mandare al cliente, ' +
        'e il codice spendibile esce solo quando registri l\u2019incasso.'
      : v === 'promozionale'
        ? 'Omaggio: <strong>nessun incasso</strong>. Il buono viene emesso subito ed \u00e8 spendibile come tutti gli altri; ' +
          'nell\u2019elenco resta segnato come promozionale.'
        : 'Incasso immediato: il buono viene <strong>emesso subito</strong>, pronto da stampare o inviare.';
    $('fCrea').textContent = daPagare ? 'Prepara il buono (in attesa)' : 'Emetti il buono';
  };
  /* ---- anteprima dal vivo: quello che vede il cliente ---- */
  function buonoProvvisorio() {
    const tipo = $('fTipo').value;
    let descrizione = '', voce_id = null, righe = [];
    if (tipo === 'servizio') {
      righe = righeCorrenti();
      voce_id = righe.length ? righe[0].id : null;
      descrizione = righe.length ? descrizioneCarrello(righe) : 'Trattamento a scelta';
    } else {
      descrizione = descrizioneValore($('fValore').value, $('fLingua').value);
    }
    return {
      numero: '\u2014', codice: null, stato: 'attesa', tipo, voce_id, descrizione,
      valore: parseFloat($('fValore').value) || 0,
      lingua: $('fLingua').value, sottotitolo: $('fSotto').value,
      acquirente: $('fAcq').value, destinatario: $('fDest').value,
      dedica: $('fDedica').value, scade_il: $('fScade').value
    };
  }
  function aggiornaAnteprima() {
    const telaio = $('antTelaio');
    if (!telaio) return;
    telaio.innerHTML = buonoHTML(buonoProvvisorio(), true);
    /* il buono è largo 700px: lo rimpiccioliamo per farlo stare nella colonna */
    const dentro = telaio.firstElementChild;
    if (dentro) {
      const scala = Math.min(1, (telaio.clientWidth - 4) / 700);
      dentro.style.transform = `scale(${scala})`;
      telaio.style.height = (dentro.offsetHeight * scala + 8) + 'px';
    }
  }
  /* stampa di quello che si sta componendo: serve a farlo vedere al cliente
     prima che paghi, quindi esce marcata BOZZA e senza codice */
  $('antStampa').onclick = () => {
    $('stampa').innerHTML = buonoStampaHTML(buonoProvvisorio(), true);
    window.print();
  };
  const conAnteprima = (f) => () => { f(); aggiornaAnteprima(); };
  $('fTipo').onchange = conAnteprima(agg);
  $('fVoce').onchange = conAnteprima(agg);
  $('fPag').onchange = aggPag;
  $('fAggiungi').onclick = () => {
    const q = Math.max(1, parseInt($('fQta').value) || 1);
    if ($('fVoce').value === '__altro') {
      const nome = $('fAltro').value.trim();
      if (!nome) { $('fEsito').innerHTML = '<span class="errore">Scrivi la descrizione della voce libera.</span>'; return; }
      CARRELLO.push({ id: null, nome, prezzo: parseFloat($('fAltroPrezzo').value) || 0, q });
      $('fAltro').value = ''; $('fAltroPrezzo').value = '';
    } else {
      /* difensivo, non la prima barriera: con la tendina gia' filtrata da
         rigenerafVoceOpzioni() (dentro disegnaRighe(), chiamata dopo ogni
         aggiunta e ogni rimozione) l'operatore non dovrebbe mai poter
         selezionare una combinazione vietata — ma se qualcosa nel filtro si
         inceppasse, questo e' lo stesso controllo del server
         (normalizzaVoci, acquista.ts), cosi' l'aggiunta si rifiuta comunque
         invece di lasciar comporre un buono che il cliente non potrebbe usare. */
      const esclusa = escludiPerCarrello();
      if (esclusa && esclusa($('fVoce').value)) {
        $('fEsito').innerHTML = `<span class="errore">${esc(NOTA_SERALE)}</span>`; return;
      }
      const o = $('fVoce').selectedOptions[0];
      const gia = CARRELLO.find(r => r.id === $('fVoce').value);
      if (gia) gia.q += q;
      else CARRELLO.push({ id: $('fVoce').value, nome: o.dataset.nome, prezzo: Number(o.dataset.prezzo), q });
    }
    $('fQta').value = 1;
    $('fValore').value = sommaCarrello(CARRELLO);
    $('fEsito').textContent = '';
    disegnaRighe(); aggiornaAnteprima();
  };
  ['fValore','fScade','fLingua','fSotto','fAcq','fDest','fDedica','fAltro','fQta']
    .forEach(id => { const e = $(id); if (e) { e.oninput = aggiornaAnteprima; e.onchange = aggiornaAnteprima; } });
  window.addEventListener('resize', aggiornaAnteprima);

  agg(); aggPag(); disegnaRighe(); aggiornaAnteprima();
  /* #fScade e' ricreato a ogni disegno di vistaEmetti(): riattivarlo qui,
     non solo al primo caricamento. */
  attivaDate();

  $('fCrea').onclick = async () => {
    const tipo = $('fTipo').value;
    let descrizione = '', voce_id = null;
    if (tipo === 'servizio') {
      const righe = righeCorrenti();
      voce_id = righe.length ? righe[0].id : null;
      descrizione = righe.length ? descrizioneCarrello(righe) : '';
    } else {
      descrizione = descrizioneValore($('fValore').value, $('fLingua').value);
    }
    const valore = parseFloat($('fValore').value);
    if (!descrizione || !(valore > 0)) {
      $('fEsito').innerHTML = '<span class="errore">Servono la voce e un valore.</span>'; return;
    }
    $('fCrea').disabled = true; $('fEsito').textContent = 'Un momento\u2026';
    try {
      const j = await chiama('?a=crea', { method:'POST', body: JSON.stringify({
        operatore: OPERATORE, tipo, voce_id, descrizione, valore,
        lingua: $('fLingua').value,
        acquirente: $('fAcq').value, acquirente_email: $('fAcqMail').value,
        acquirente_tel: $('fAcqTel').value, destinatario: $('fDest').value,
        destinatario_email: $('fDestMail').value,
        dedica: $('fDedica').value, sottotitolo: $('fSotto').value, scade_il: $('fScade').value,
        pagamento: $('fPag').value, note: $('fNote').value
      })});
      $('fEsito').textContent = '';
      mostraFatto(j.buono);
    } catch (e) {
      $('fEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
    } finally { $('fCrea').disabled = false; }
  };
}

/* chi l'ha comprato, per chi, a che indirizzi: sono i dati che servono
   quando il cliente telefona perche' il buono non gli e' arrivato */
function dettagliBuono(b) {
  const riga = (etichetta, valore) => valore
    ? `<tr><td style="padding:3px 12px 3px 0;color:#8A938F;white-space:nowrap;">${etichetta}</td>
       <td style="padding:3px 0;">${esc(valore)}</td></tr>` : '';
  const corpo = riga('Acquirente', b.acquirente) + riga('Email acquirente', b.acquirente_email)
    + riga('Telefono', b.acquirente_tel) + riga('Destinatario', b.destinatario)
    + riga('Email destinatario', b.destinatario_email) + riga('Dedica', b.dedica)
    + riga('Pagamento', [b.pagamento, b.pagamento_rif].filter(Boolean).join(' · '))
    + riga('Emesso da', b.creato_da) + riga('Note', b.note);
  if (!corpo) return '';
  return `<div class="mini" style="margin-top:14px;padding-top:12px;border-top:1px solid #F0EBE1;">
    <table style="font-size:13px;border-collapse:collapse;">${corpo}</table></div>`;
}

/* Il pannello del buono: numero, dati, anteprima e modi per consegnarlo.
   Lo usa sia l'emissione sia l'elenco, dove serve a rimandare un buono
   che il cliente non ha ricevuto o si e' trovato nella posta indesiderata. */
function mostraFatto(b, contenitore = 'fFatto') {
  const attesa = b.stato === 'attesa';
  /* il link vale per UN buono solo: azzerarlo qui evita che finisca
     nell email del buono successivo (il cliente pagherebbe l altro) */
  LINK_PAGAMENTO = '';
  $(contenitore).innerHTML = `<div class="fatto">
    <div class="mini">Numero per l&apos;amministrazione</div>
    <div style="font-family:monospace;font-size:17px;color:#0F5C64;">${esc(b.numero)}</div>
    ${nonConsegnato(b) ? `<div class="avviso-consegna">
      <strong>Il cliente non ha ricevuto questo buono.</strong>
      L&apos;invio per email non &egrave; riuscito${b.consegna === 'senza-indirizzo'
        ? ': non c&apos;era nessun indirizzo a cui mandarlo' : ''}.
      Il buono &egrave; valido: va consegnato a mano, stampandolo o inoltrandolo
      da un altro indirizzo.</div>` : ''}
    ${attesa
      ? `<div style="margin-top:12px;"><strong>In attesa di pagamento.</strong>
        Il codice spendibile non esiste ancora: al cliente va l&apos;anteprima con le
        istruzioni per pagare. Quando l&apos;incasso arriva, lo registri qui sotto.</div>
        ${b.pagamento === 'stripe'
          ? `<button class="azione" id="bLink">Crea il link di pagamento</button>` : ''}
        <button class="azione ${b.pagamento === 'stripe' ? 'sec' : ''}" id="bRichiesta">Copia l&apos;email di richiesta pagamento</button>
        <button class="azione sec" id="bStampaBozza">&#128424; Stampa l&apos;anteprima (BOZZA)</button>
        <button class="azione sec" id="bPagato">Ho ricevuto il pagamento</button>`
      : `<div class="mini" style="margin-top:12px;">Codice da consegnare</div>
        <div class="codice">${esc(b.codice)}</div>
        <div class="mini">${righeDescrizione(b.descrizione, b.voci).map(r =>
          `<div>${r.quantita != null ? `${r.quantita} \u00d7 ` : ''}${esc(r.testo)}</div>`).join('')}
          ${eur(b.valore)} \u20ac \u00b7 valido fino al ${dataIT(b.scade_il)}</div>
        <div class="mini" style="padding-top:12px;">Come lo consegna?</div>
        <div class="azioni-buono">
          <button class="azione" id="bStampa">&#128424; Stampa subito</button>
          ${b.destinatario_email
            ? `<button class="azione sec" id="bMailDest">&#9993; Email a ${esc(b.destinatario || 'chi lo riceve')}</button>` : ''}
          ${b.acquirente_email
            ? `<button class="azione sec" id="bMailAcq">&#9993; Email a ${esc(b.acquirente || 'chi compra')}</button>` : ''}
          <button class="azione sec" id="bCopia">&#128203; Copia</button>
        </div>`}
    <div class="esito" id="bEsito"></div>
    ${dettagliBuono(b)}
    <div style="margin-top:16px;overflow:auto;">${buonoHTML(b, attesa)}</div>
  </div>`;

  if (attesa) {
    if ($('bLink')) $('bLink').onclick = async () => {
      $('bEsito').textContent = 'Chiedo il link a Stripe\u2026';
      try {
        const j = await chiama('?a=link', { method: 'POST', body: JSON.stringify({ numero: b.numero }) });
        LINK_PAGAMENTO = j.url;
        $('bEsito').innerHTML = `\u2713 Link pronto: <a href="${esc(j.url)}" target="_blank"
          style="color:#1E7F88;word-break:break-all;">${esc(j.url)}</a><br />
          <span class="mini">Ora "Copia l\u2019email": il link \u00e8 gi\u00e0 dentro. Quando il cliente paga,
          il buono si sblocca da solo.</span>`;
      } catch (e) {
        $('bEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>
          <div class="mini">Puoi comunque procedere con il bonifico.</div>`;
      }
    };
    $('bRichiesta').onclick = async () => {
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([emailRichiesta(b)], { type: 'text/html' }),
          'text/plain': new Blob([emailRichiestaTesto(b)], { type: 'text/plain' })
        })]);
        $('bEsito').textContent = '\u2713 Copiata: incollala in Outlook e invia al cliente.';
      } catch (e) { $('bEsito').innerHTML = '<span class="errore">Copia non riuscita.</span>'; }
    };
    $('bStampaBozza').onclick = () => {
      $('stampa').innerHTML = buonoStampaHTML(b, true);
      window.print();
    };
    $('bPagato').onclick = async () => {
      const rif = prompt('Riferimento del pagamento (CRO del bonifico, id della transazione\u2026). Puoi lasciare vuoto:') ?? null;
      if (rif === null) return;
      try {
        const j = await chiama('?a=pagato', { method: 'POST', body: JSON.stringify({
          numero: b.numero, operatore: OPERATORE, pagamento: b.pagamento, pagamento_rif: rif }) });
        mostraFatto(j.buono, contenitore);
      } catch (e) { $('bEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
    };
  } else {
    $('bStampa').onclick = () => { $('stampa').innerHTML = buonoStampaHTML(b); window.print(); };

    /* email: copia il buono e apre Outlook già indirizzato, come fa l'estensione */
    const perEmail = async (dest, chi) => {
      const L = ['it','de','en','fr'].includes(b.lingua) ? b.lingua : 'it';
      const OGG = {
        it:`Il suo Buono Regalo \u2014 Hotel Terme Leonardo`,
        de:`Ihr Geschenkgutschein \u2014 Hotel Terme Leonardo`,
        en:`Your Gift Voucher \u2014 Hotel Terme Leonardo`,
        fr:`Votre Bon Cadeau \u2014 H\u00f4tel Terme Leonardo`
      }[L];
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([buonoHTML(b)], { type: 'text/html' }),
          'text/plain': new Blob([buonoTesto(b)], { type: 'text/plain' })
        })]);
        window.open('https://outlook.office.com/mail/deeplink/compose?to=' +
          encodeURIComponent(dest) + '&subject=' + encodeURIComponent(OGG), '_blank');

/* Un buono pagato che non e' mai arrivato al cliente. `consegna` vale
   'inviato', 'fallito' o 'senza-indirizzo'; i buoni emessi prima di questa
   modifica non ce l'hanno, e per quelli si tace invece di allarmare a
   vuoto — non sappiamo com'e' andata. */
function nonConsegnato(b) {
  if (b.stato !== 'pagato') return false;
  /* invio tentato e fallito: sempre un problema */
  if (b.consegna === 'fallito') return true;
  /* nessun indirizzo e' normale per un buono emesso al banco e stampato,
     ma non per uno comprato online: quello un indirizzo ce l'aveva */
  return b.consegna === 'senza-indirizzo' && b.creato_da === 'sito';
}

        j.buoni.map(b => {
          const st = (b.stato === 'pagato' && b.scade_il && b.scade_il < oggi) ? 'scaduto' : b.stato;
          return `<tr class="apribile" data-numero="${esc(b.numero || '')}"><td class="cod">${esc(b.numero || '')}</td>

        }).join('') + `</table>` : '';
      /* aprire un buono serve soprattutto a rimandarlo: il cliente che
         telefona perche' non l'ha ricevuto e' il caso piu' frequente */
      for (const tr of $('eTab').querySelectorAll('tr.apribile')) {

const STATI_RICHIESTA = {

function quandoIT(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const due = (n) => String(n).padStart(2, '0');
  return `${due(d.getDate())}/${due(d.getMonth() + 1)} ${due(d.getHours())}:${due(d.getMinutes())}`;

/* Cerca un'etichetta in una mappa e, se non c'e', restituisce il valore
   grezzo. Object.hasOwn e non `MAPPA[chiave] || chiave`: la chiave arriva da
   una colonna del database, e un oggetto non risponde `undefined` solo alle
   chiavi che non ha — risponde con quello che eredita da Object.prototype.
   Con `stato` uguale a "toString" il `||` non scatterebbe mai e in tabella
   comparirebbe il codice sorgente di una funzione al posto dello stato.
   Oggi nessuno scrive quei valori in quelle colonne, quindi non e' un buco
   aperto: e' che la stessa riga sbagliata, altrove in questo progetto,
   lasciava passare un circolo di golf inesistente. Si chiude la forma. */
function etichetta(mappa, chiave) {
  return Object.hasOwn(mappa, chiave) ? mappa[chiave] : (chiave || '');
}

/* «aveva chiesto: mattina» accanto al campo che la reception ha gia'
   corretto. `differenze` arriva gia' calcolata dal server (differenze.ts,
   confronto sui VALORI, non sugli oggetti) dentro ogni riga di ?a=elenco:
   qui si legge un'etichetta gia' pronta, non si ricalcola niente. Le
   stringhe qui sotto (in ETICHETTE_CAMPO_PER_TIPO e nelle chiamate ad
   avevaChiesto) sono le stesse che etichettaCampo() in differenze.ts
   genera per ogni chiave — non un calcolo duplicato, sono comunque il
   testo delle etichette che questo modulo dei campi deve scrivere. */
function avevaChiesto(r, etichettaCampo) {
  const d = Array.isArray(r.differenze) ? r.differenze.find((x) => x.campo === etichettaCampo) : null;
  return d ? `<div class="nota-prima">aveva chiesto: ${esc(d.prima || '—')}</div>` : '';

/* Le etichette che ogni tipo mostra gia' come campo modificabile (le stesse
   passate ad avevaChiesto qui sotto): serve a boxAltreDifferenze per capire
   quali differenze sono gia' visibili accanto a un campo e quali resterebbero
   altrimenti invisibili — es. i noleggi del green fee (golfcar, carrello…),
   che tipi.ts accetta ma questa scheda non offre in un campo dedicato.
   Object.hasOwn e non ETICHETTE_CAMPO_PER_TIPO[r.tipo]: `tipo` arriva dal
   database. */
const ETICHETTE_CAMPO_PER_TIPO = {
  transfer: ['Data', 'Ora', 'Passeggeri', 'Arrivo o partenza', 'Luogo', 'Volo', 'Ritorno incluso', 'Note'],
  greenfee: ['Circolo', 'Data', 'Ora', 'Giocatori', 'Percorso', 'Tessera', 'Taxi al campo', 'Ora del taxi', 'Note'],
  maestro: ['Data', 'Ora', 'Persone', 'Livello', 'Note'],
  trattamenti: ['Trattamenti scelti', 'Giorno', 'Fascia oraria', 'Note'],
};

function differenzeNonMostrate(r) {
  const coperte = Object.hasOwn(ETICHETTE_CAMPO_PER_TIPO, r.tipo) ? ETICHETTE_CAMPO_PER_TIPO[r.tipo] : [];
  return Array.isArray(r.differenze) ? r.differenze.filter((d) => !coperte.includes(d.campo)) : [];
}

/* Una riga in coda ai campi, solo se c'e' una differenza che nessun campo
   qui sopra ha gia' mostrato: cosi' nessuna correzione gia' fatta resta
   invisibile, anche per un campo che questa scheda non rende modificabile. */
function boxAltreDifferenze(r) {
  const extra = differenzeNonMostrate(r);
  if (!extra.length) return '';
  return `<div class="mini" style="margin-top:10px;padding-top:10px;border-top:1px solid #F0EBE1;">
    Altro gia' cambiato rispetto alla richiesta originale: ${extra.map((d) =>
      `${esc(d.campo)} (aveva chiesto: ${esc(d.prima || '—')})`).join(' · ')}</div>`;
}

        <option value="arrivo" ${d.verso === 'arrivo' ? 'selected' : ''}>Arrivo</option>
        <option value="partenza" ${d.verso === 'partenza' ? 'selected' : ''}>Partenza</option>
      </select>${avevaChiesto(r, 'Arrivo o partenza')}</div>
    </div>
    <label>Luogo (deve combaciare con l’elenco ATAM)</label>
    <select id="cLuogo"><option value="">—</option>${opzLuogo}</select>
    ${avevaChiesto(r, 'Luogo')}
    <div class="due">
      <div><label>Volo / treno</label><input type="text" id="cVolo" value="${esc(d.volo || '')}" />${avevaChiesto(r, 'Volo')}</div>
      <div><label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;margin-top:24px;">
        <input type="checkbox" id="cRitorno" ${d.ritorno ? 'checked' : ''}
          style="width:auto;margin:0;" /> serve anche il ritorno</label>${avevaChiesto(r, 'Ritorno incluso')}</div>
    </div>
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

function campiGreenfee(r) {
  const d = r.dati || {};
  const opzCircolo = Object.keys(CIRCOLI_GOLF_NOMI).map((k) =>
    `<option value="${esc(k)}" ${d.circolo === k ? 'selected' : ''}>${esc(CIRCOLI_GOLF_NOMI[k])}</option>`).join('');
  return `<label>Circolo</label>
    <select id="cCircolo">${opzCircolo}</select>${avevaChiesto(r, 'Circolo')}
    <div class="due">
      <div><label>Data</label><input type="date" id="cData" value="${esc(d.data || '')}" />${avevaChiesto(r, 'Data')}</div>
      <div><label>Ora</label><input type="time" id="cOra" value="${esc(d.ora || '')}" />${avevaChiesto(r, 'Ora')}</div>
    </div>
    <div class="due">
      <div><label>Giocatori</label><input type="number" id="cGiocatori" min="1" max="4" value="${esc(d.giocatori || 1)}" />${avevaChiesto(r, 'Giocatori')}</div>
      <div><label>Percorso</label><input type="text" id="cPercorso" value="${esc(d.percorso || '')}" />${avevaChiesto(r, 'Percorso')}</div>
    </div>
    <label>Tessera</label><input type="text" id="cTessera" value="${esc(d.tessera || '')}" />${avevaChiesto(r, 'Tessera')}
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;">
      <input type="checkbox" id="cTaxi" ${d.taxi ? 'checked' : ''}
        style="width:auto;margin:0;" /> serve anche il taxi per il campo</label>${avevaChiesto(r, 'Taxi al campo')}
    <label>Ora del taxi (se serve)</label><input type="time" id="cTaxiOra" value="${esc(d.taxi_ora || '')}" />${avevaChiesto(r, 'Ora del taxi')}
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

const LIVELLI_MAESTRO = ['principiante', 'intermedio', 'esperto'];

function campiMaestro(r) {
  const d = r.dati || {};
  /* "non so" e' il default di tipi.ts per un livello assente: la casella
     vuota deve tornare a mandare '' (non la parola "non so"), perche'
     validaMaestro rifiuta "non so" come livello sconosciuto — lo accetta
     solo quando il campo e' vuoto. Vedi datiCorretti(). */
  const livello = LIVELLI_MAESTRO.includes(d.livello) ? d.livello : '';
  return `<div class="due">
      <div><label>Data</label><input type="date" id="cData" value="${esc(d.data || '')}" />${avevaChiesto(r, 'Data')}</div>
      <div><label>Ora</label><input type="time" id="cOra" value="${esc(d.ora || '')}" />${avevaChiesto(r, 'Ora')}</div>
    </div>
    <div class="due">
      <div><label>Persone</label><input type="number" id="cPersone" min="1" max="4" value="${esc(d.persone || 1)}" />${avevaChiesto(r, 'Persone')}</div>
      <div><label>Livello</label><select id="cLivello">
        <option value="" ${!livello ? 'selected' : ''}>Non so / non specificato</option>
        <option value="principiante" ${livello === 'principiante' ? 'selected' : ''}>Principiante</option>
        <option value="intermedio" ${livello === 'intermedio' ? 'selected' : ''}>Intermedio</option>
        <option value="esperto" ${livello === 'esperto' ? 'selected' : ''}>Esperto</option>
      </select>${avevaChiesto(r, 'Livello')}</div>
    </div>
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

const FASCE_TRATTAMENTI = ['mattina', 'pomeriggio', 'indifferente'];

function campiTrattamenti(r) {
  const d = r.dati || {};
  const voci = Array.isArray(d.voci) ? d.voci : [];
  const fascia = FASCE_TRATTAMENTI.includes(d.fascia) ? d.fascia : 'indifferente';
  return `<label>Trattamenti scelti (uno per riga)</label>
    <textarea id="cVoci" rows="4">${esc(voci.join('\n'))}</textarea>${avevaChiesto(r, 'Trattamenti scelti')}
    <div class="due">
      <div><label>Giorno</label><input type="date" id="cGiorno" value="${esc(d.giorno || '')}" />${avevaChiesto(r, 'Giorno')}</div>
      <div><label>Fascia oraria</label><select id="cFascia">
        <option value="mattina" ${fascia === 'mattina' ? 'selected' : ''}>Mattina</option>
        <option value="pomeriggio" ${fascia === 'pomeriggio' ? 'selected' : ''}>Pomeriggio</option>
        <option value="indifferente" ${fascia === 'indifferente' ? 'selected' : ''}>Indifferente</option>
      </select>${avevaChiesto(r, 'Fascia oraria')}</div>
    </div>
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

/* Elenco chiuso via switch, mai un OGGETTO[tipo]: il tipo arriva dal
   database, e una chiave come "toString" esiste su Object.prototype. Un
   tipo non riconosciuto non offre campi: non sappiamo la sua forma, e un
   modulo indovinato manderebbe a ?a=conferma qualcosa che tipi.ts
   rifiuterebbe comunque. */
function campiModificabili(r) {
  switch (r.tipo) {
    case 'transfer': return campiTransfer(r);
    case 'greenfee': return campiGreenfee(r);
    case 'maestro': return campiMaestro(r);
    case 'trattamenti': return campiTrattamenti(r);
    default: return '';
  }
}

/* Il `dati` da mandare a ?a=conferma, nella forma esatta che tipi.ts si
   aspetta per quel tipo (il server rivalida e rifiuta se non torna). Si
   parte SEMPRE da {...r.dati}: i campi che questa scheda non rende
   modificabili (i noleggi del green fee, per esempio) restano quelli che
   c'erano, non spariscono perche' il modulo non li ha mandati. */
function datiCorretti(r) {
  const base = r.dati || {};
  switch (r.tipo) {
    case 'transfer': return {
      ...base,
      quando: $('cQuando').value, ora: $('cOra').value,
      pax: Number($('cPax').value || 1), verso: $('cVerso').value,
      luogo: $('cLuogo').value, volo: $('cVolo').value,
      ritorno: $('cRitorno').checked, note: $('cNote').value,
    };
    case 'greenfee': return {
      ...base,
      circolo: $('cCircolo').value, data: $('cData').value, ora: $('cOra').value,
      giocatori: Number($('cGiocatori').value || 1), percorso: $('cPercorso').value,
      tessera: $('cTessera').value, note: $('cNote').value,
      taxi: $('cTaxi').checked, taxi_ora: $('cTaxiOra').value,
    };
    case 'maestro': return {
      ...base,
      data: $('cData').value, ora: $('cOra').value,
      persone: Number($('cPersone').value || 1), livello: $('cLivello').value,
      note: $('cNote').value,
    };
    case 'trattamenti': return {
      ...base,
      voci: $('cVoci').value.split('\n').map((s) => s.trim()).filter(Boolean),
      giorno: $('cGiorno').value, fascia: $('cFascia').value, note: $('cNote').value,
    };
    /* soggiorno (mai passato qui: il pannello di conferma non si mostra
       per lui) o un tipo non riconosciuto: nessuna correzione da mandare,
       ?a=conferma tiene i dati che c'erano gia' */
    default: return undefined;
  }
}

/* ATTENZIONE ALL'UNITA': in `dati` i prezzi sono in CENTESIMI (lo dichiara
   il campo `valuta`). 31000 sono 310,00 €, non 31000 €. */
const eurDaCent = (c) => Number.isFinite(Number(c))
  ? Number(c) / 100 : null;

/* La camera scelta sulla pagina di prenotazione vive in `dati`, e questa
   scheda non la guardava affatto: l'ospite sceglieva "Doppia — Soggiorno
   breve — Mezza Pensione — 310,00 €" e in reception si leggeva solo
   "Camera: Doppia · Pacchetto: Soggiorno breve". Due proposte della stessa
   camera differiscono SOLO per trattamento e prezzo, quindi cosi' non c'era
   modo di sapere quale avesse scelto ne' a che cifra. Stesso discorso per
   adulti e bambini: la colonna `ospiti` porta la somma, e la caparra si
   calcola sugli ADULTI. */
function righeSceltaSoggiorno(r, riga) {
  const d = r.dati || {};
  if (r.tipo !== 'soggiorno') return '';
  const prezzo = eurDaCent(d.prezzo_cent);
  const caparra = eurDaCent(d.caparra_cent);
  const persone = Number.isInteger(d.adulti)
    ? `${d.adulti} adult${d.adulti === 1 ? 'o' : 'i'}` +
      (Number.isInteger(d.bambini) && d.bambini > 0
        ? ` · ${d.bambini} bambin${d.bambini === 1 ? 'o' : 'i'}` : '')
    : '';
  return riga('Composizione', esc(persone)) +
    riga('Trattamento', esc(d.trattamento || '')) +
    riga('Prezzo visto dall’ospite',
      prezzo === null ? '' : `<strong>${eur(prezzo)} €</strong>`) +
    riga('Caparra indicata', caparra === null ? '' : `${eur(caparra)} €`) +
    (prezzo === null ? '' : `<tr><td></td><td class="mini" style="padding-bottom:6px;">
      Prezzo e caparra sono quelli che l’ospite ha visto sulla pagina al momento
      della scelta, per l’intero soggiorno: vanno confermati, non sono un
      preventivo della casa. La camera non è bloccata.</td></tr>`);
}

/* Periodo/notti/ospiti sono i campi di un SOGGIORNO: componi-richiesta.ts
   non valorizza quelle colonne per un transfer, un green fee, una lezione o
   dei trattamenti — restano null. Mostrarle comunque era esattamente il
   difetto di partenza di questa scheda: "→ · null notti · null ospiti". Qui
   il pezzo mancante sparisce invece di comparire come "null": si guarda il
   dato, non il tipo, cosi' vale anche per un tipo non ancora previsto che
   avesse comunque un periodo. */
function rigaPeriodo(r, riga) {
  const periodo = [dataIT(r.check_in), dataIT(r.check_out)].filter(Boolean).join(' → ');
  const pezzi = [
    Number.isFinite(r.notti) ? `${r.notti} notti` : '',
    Number.isFinite(r.ospiti) ? `${r.ospiti} ospiti` : '',
  ].filter(Boolean).join(' · ');
  if (!periodo && !pezzi) return '';
  return riga('Periodo', `<strong>${esc(periodo)}</strong>${pezzi ? ` <span class="mini">${esc(pezzi)}</span>` : ''}`);
}

function dettaglioRichiesta(r) {
  const riga = (e, v) => v ? `<tr><td class="mini" style="padding-right:14px;white-space:nowrap;">${esc(e)}</td>
    <td>${v}</td></tr>` : '';
  /* la risposta si scrive dal programma di posta della reception, che qui
     e' configurato: il taglia e incolla dell'indirizzo e' il passaggio in
     cui si sbaglia una lettera e la risposta non arriva */
  const oggetto = encodeURIComponent(`Hotel Terme Leonardo — la sua richiesta ${r.numero}`);
  /* nasce gia' spuntata quando dati_originali e dati differiscono davvero
     (r.differenze, gia' calcolata dal server): i due errori non pesano
     uguale. Segnalare all'ospite una cosa che sapeva gia' e' un fastidio
     piccolo; non segnalargliene una che non sa e' un ospite che si
     presenta all'ora sbagliata, convinto di avere ragione. L'operatore la
     toglie in un clic se ha gia' sentito l'ospite al telefono. */
  const segnalaDiDefault = Array.isArray(r.differenze) && r.differenze.length > 0;
  return `<div class="riquadro" style="margin-top:14px;">
    <h2>${esc(r.nome)} <span class="badge-tipo">${esc(r.etichetta || 'Richiesta')}</span>
      <span class="stato st-${esc(r.stato)}">${esc(etichetta(STATI_RICHIESTA, r.stato))}</span></h2>
    <div class="mini">${esc(r.numero)} · arrivata il ${quandoIT(r.creato_il)}</div>
    <table style="margin-top:12px;">
      ${rigaPeriodo(r, riga)}
      ${riga('Email', `<a href="mailto:${esc(r.email)}?subject=${oggetto}">${esc(r.email)}</a>`)}
      ${riga('Telefono', r.telefono ? `<a href="tel:${esc(r.telefono)}">${esc(r.telefono)}</a>` : '')}
      ${riga('Lingua', esc(etichetta(LINGUA_NOME, r.lingua)))}
      ${riga('Camera', esc(r.tipo_camera || (r.dati && r.dati.nome_camera) || ''))}
      ${riga('Pacchetto', esc(r.pacchetto || ''))}
      ${righeSceltaSoggiorno(r, riga)}
      ${riga('Gestita da', r.gestita_da ? esc(r.gestita_da) + ' · ' + quandoIT(r.gestita_il) : '')}
    </table>
    ${r.messaggio ? `<div style="border-left:3px solid var(--oro);background:#FBFAF7;padding:12px 14px;
      margin-top:14px;white-space:pre-line;">${esc(r.messaggio)}</div>` : ''}
    ${r.conferma_il ? `<div class="mini" style="margin-top:14px;">
      Confermata il ${quandoIT(r.conferma_il)}${r.conferma_da ? ' da ' + esc(r.conferma_da) : ''}
      ${r.conferma_esito === 'fallita'
        ? '<span class="nonconsegnato">EMAIL NON PARTITA</span>' : ''}</div>` : ''}

    ${r.tipo !== 'soggiorno' ? `<div style="margin-top:18px;padding-top:16px;border-top:1px solid #E6E2D8;">
      <h2 style="font-size:18px;">Conferma all’ospite</h2>
      <div class="mini" style="padding-bottom:6px;">Correggi qui se hai spostato qualcosa:
        l’ospite riceve questi dati, non quelli che aveva chiesto.</div>
      ${campiModificabili(r)}
      ${boxAltreDifferenze(r)}
      <label>Messaggio per l’ospite (facoltativo)</label>
      <textarea id="cMessaggio" rows="3"
        placeholder="es. Il prezzo è di 85 € a tratta, pagamento diretto all’autista."></textarea>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;margin-top:12px;">
        <input type="checkbox" id="cSegnala" ${segnalaDiDefault ? 'checked' : ''}
          style="width:auto;margin:0;" /> segnala all’ospite cosa è cambiato</label>
      <button class="azione" id="bConferma">Conferma e avvisa l’ospite</button>
    </div>` : ''}

    ${r.tipo === 'transfer' ? `<div style="margin-top:18px;padding-top:16px;border-top:1px solid #E6E2D8;">
      <h2 style="font-size:18px;">Per il modulo dei tassisti</h2>
      <div class="mini" style="padding-bottom:6px;">Da incollare su atam.biz: il luogo è
        già scritto come nel loro elenco.</div>
      <textarea id="cAtam" rows="6" readonly
        style="font-family:monospace;font-size:12.5px;">${esc(riepilogoATAM(r))}</textarea>
      <button class="azione sec" id="bCopiaAtam">Copia per ATAM</button>
    </div>` : ''}

    <div class="due" style="margin-top:16px;">
      <a class="azione sec" style="text-align:center;text-decoration:none;"
        href="mailto:${esc(r.email)}?subject=${oggetto}">Scrivi a mano</a>
      <div>
        <button class="azione sec" data-stato="vista">Segna vista</button>
        <button class="azione sec" data-stato="chiusa">Chiudi</button>
      </div>
    </div>
    <div class="esito" id="rAzione"></div></div>`;
}

async function vistaRichieste() {
  $('vista').innerHTML = `<div class="riquadro">
    <div class="due">
      <div><label>Stato</label><select id="rStato">
        <option value="nuova">Da guardare</option>
        <option value="">Tutte</option>
        <option value="vista">Viste</option>
        <option value="risposta">Con risposta data</option>
        <option value="chiusa">Chiuse</option>
      </select></div>
    </div>
    <div class="esito" id="rEsito">Carico…</div>
    <div class="mini" style="padding-bottom:6px;">Clicca una richiesta per vedere tutto,
      rispondere e segnarla gestita.</div>
    <div id="rTab"></div></div>
    <div id="rDettaglio"></div>`;

  let CARICATE = [];
  const carica = async () => {
    $('rEsito').textContent = 'Carico…';
    $('rDettaglio').innerHTML = '';
    try {
      const j = await chiama(`?a=elenco&stato=${encodeURIComponent($('rStato').value)}`,
        {}, FUNZIONE_RICHIESTE);
      CARICATE = j.richieste || [];
      $('rEsito').textContent = CARICATE.length
        ? `${CARICATE.length} richieste` : 'Nessuna richiesta.';
      $('rTab').innerHTML = CARICATE.length ? `<table>
        <tr><th>Numero</th><th>Arrivata</th><th>Ospite</th><th>Richiesta</th><th>Stato</th></tr>` +
        CARICATE.map(r => `<tr class="apribile" data-numero="${esc(r.numero)}">
          <td class="cod">${esc(r.numero)}</td>
          <td class="mini">${quandoIT(r.creato_il)}</td>
          <td>${esc(r.nome)}<div class="mini">${esc(r.email)}${r.telefono ? ' · ' + esc(r.telefono) : ''}</div></td>
          <td><span class="badge-tipo">${esc(r.etichetta || 'Richiesta')}</span>
            <div class="mini">${esc(r.riepilogo || '')}</div></td>
          <td><span class="stato st-${esc(r.stato)}">${esc(etichetta(STATI_RICHIESTA, r.stato))}</span></td>
        </tr>`).join('') + `</table>` : '';

      for (const tr of $('rTab').querySelectorAll('tr.apribile')) {
        tr.onclick = () => {
          const r = CARICATE.find(x => x.numero === tr.dataset.numero);
          if (!r) return;
          $('rDettaglio').innerHTML = dettaglioRichiesta(r);
          /* #cQuando (solo per i transfer) e' ricreato qui a ogni richiesta
             aperta: riattivarlo in questo punto, non solo al primo
             caricamento della pagina. */
          attivaDate($('rDettaglio'));

          const bCopia = $('bCopiaAtam');
          if (bCopia) bCopia.onclick = async () => {
            try {
              await navigator.clipboard.writeText($('cAtam').value);
              bCopia.textContent = 'Copiato';
              setTimeout(() => { bCopia.textContent = 'Copia per ATAM'; }, 1800);
            } catch (e) {
              /* se la copia non passa, il testo e' comunque li' da selezionare */
              $('cAtam').select();
              bCopia.textContent = 'Selezionato: premi Ctrl+C';
            }
          };

          const bConf = $('bConferma');
          if (bConf) bConf.onclick = async () => {
            bConf.disabled = true;
            $('rAzione').textContent = 'Invio la conferma…';
            /* la forma esatta che tipi.ts si aspetta per questo tipo: il
               server la rivalida comunque e rifiuta se non torna */
            const dati = datiCorretti(r);
            const cSegnala = $('cSegnala');
            try {
              const j = await chiama('?a=conferma', {
                method: 'POST',
                body: JSON.stringify({ numero: r.numero, dati,
                  messaggio: $('cMessaggio').value,
                  segnala_modifiche: cSegnala ? cSegnala.checked : false,
                  utente: OPERATORE }),
              }, FUNZIONE_RICHIESTE);
              /* la conferma vale solo se l'email e' partita: dirlo, invece di
                 lasciar credere che l'ospite sappia */
              $('rAzione').innerHTML = j.inviata
                ? '<span style="color:var(--oliva);">Conferma inviata all’ospite.</span>'
                : '<span class="errore">Salvata, ma l’email NON è partita: '
                  + 'avvisa l’ospite in un altro modo.</span>';
              await carica();
            } catch (e) {
              bConf.disabled = false;
              $('rAzione').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
            }
          };

          for (const b of $('rDettaglio').querySelectorAll('button[data-stato]')) {
            b.onclick = async () => {
              $('rAzione').textContent = 'Salvo…';
              try {
                await chiama('?a=stato', {
                  method: 'POST',
                  body: JSON.stringify({ numero: r.numero, stato: b.dataset.stato, utente: OPERATORE }),
                }, FUNZIONE_RICHIESTE);
                await carica();
              } catch (e) {
                $('rAzione').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
              }
            };
          }
          $('rDettaglio').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      }
    } catch (e) { $('rEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('rStato').onchange = carica;
  carica();
}

/* ---------- 3. verifica e riscossione ---------- */
function vistaVerifica() {
  $('vista').innerHTML = `<div class="riquadro">
    <h2>Il cliente presenta un buono</h2>
    <label>Codice</label><input type="text" id="vCod" placeholder="LEO-XXXX-XXXX" style="font-family:monospace;text-transform:uppercase;" />
    <button class="azione" id="vCerca">Controlla</button>
    <div class="esito" id="vEsito"></div>
    <div id="vRis"></div></div>`;
  const cerca = async () => {
    const cod = $('vCod').value.trim().toUpperCase();
    if (!cod) return;
    $('vEsito').textContent = 'Controllo\u2026'; $('vRis').innerHTML = '';
    try {
      const r = await fetch(`${FUNZIONE}?a=verifica&codice=${encodeURIComponent(cod)}`);
      const j = await r.json();
      if (!r.ok || j.valido === false) {
        $('vEsito').innerHTML = `<span class="errore">Non utilizzabile: ${esc(j.stato || j.motivo || 'non trovato')}
          ${j.riscosso_il ? ' il ' + dataIT(j.riscosso_il) : ''}</span>`;
        return;
      }
      $('vEsito').textContent = '';
      $('vRis').innerHTML = `<div class="fatto">
        <strong>Valido.</strong>
        <div class="mini" style="margin-top:4px;">${righeDescrizione(j.descrizione, j.voci).map(r =>
          `<div>${r.quantita != null ? `${r.quantita} \u00d7 ` : ''}${esc(r.testo)}</div>`).join('')}
          ${eur(j.valore)} \u20ac</div>
        <div class="mini">Scade il ${dataIT(j.scade_il)}</div>
        <label>Note (facoltative)</label><input type="text" id="vNote" />
        <button class="azione" id="vRiscuoti">Segna come riscosso</button>
        <button class="azione sec" id="vAnnulla"
          style="border-color:var(--allarme);color:var(--allarme);">Annulla e rimborsa</button>
        <div class="esito" id="vEsito2"></div></div>`;
      $('vRiscuoti').onclick = async () => {
        try {
          await chiama('?a=riscuoti', { method:'POST', body: JSON.stringify({
            codice: cod, operatore: OPERATORE, note: $('vNote').value }) });
          $('vEsito2').textContent = '\u2713 Registrato come riscosso.';
          $('vRiscuoti').disabled = true; $('vAnnulla').disabled = true;
        } catch (e) { $('vEsito2').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
      };
      /* Un gesto solo: annulla e, se il buono \u00e8 stato pagato con Stripe,
         rimborsa \u2014 lo decide il server (?a=rimborsa, vedi rimborso.ts),
         qui c'\u00e8 solo la conferma. La conferma dice cosa succede DAVVERO \u2014
         quale buono, quanti euro tornano al cliente, che non si torna
         indietro \u2014 non un "sei sicuro?" generico: prima di questa modifica
         il back office sapeva solo annullare, e il rimborso si faceva a
         mano dentro Stripe: due gesti separati, facili da disallineare
         (buono annullato e mai rimborsato, o rimborsato e mai annullato). */
      $('vAnnulla').onclick = async () => {
        const conferma = `Annullare il buono ${cod} e rimborsare ${eur(j.valore)} \u20ac a chi l\u2019ha pagato?\n\n` +
          `L\u2019operazione NON si pu\u00f2 annullare: se \u00e8 stato pagato con Stripe il rimborso parte subito.`;
        if (!confirm(conferma)) return;
        $('vRiscuoti').disabled = true; $('vAnnulla').disabled = true;
        $('vEsito2').textContent = 'Un momento\u2026';
        try {
          const ris = await chiama('?a=rimborsa', { method:'POST', body: JSON.stringify({
            codice: cod, operatore: OPERATORE, note: $('vNote').value }) });
          $('vEsito2').innerHTML = `\u2713 ${esc(ris.messaggio || 'Buono annullato.')}`;
        } catch (e) {
          /* il buono NON \u00e8 stato toccato (rimborso fallito) o \u00e8 successo
             qualcosa che l'operatore deve sistemare a mano (vedi
             messaggioScritturaFallita in rimborso.ts): in entrambi i casi
             si riabilitano i pulsanti, perch\u00e9 un nuovo tentativo pu\u00f2
             ancora avere senso \u2014 e se il rimborso era gi\u00e0 partito, Stripe
             risponder\u00e0 "gi\u00e0 rimborsato" invece di rimborsare due volte. */
          $('vEsito2').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
          $('vRiscuoti').disabled = false; $('vAnnulla').disabled = false;
        }
      };
    } catch (e) { $('vEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('vCerca').onclick = cerca;
  /* il lettore di codici in portineria e' un lettore 2D: si comporta come
     una tastiera, "digita" il codice che ha letto nel campo che ha il
     fuoco e preme Invio. Senza questo listener quell'Invio non farebbe
     nulla e l'operatore dovrebbe cliccare "Controlla" a mano ogni volta.
     Stesso schema di $('kPwd').onkeydown piu' sopra, per l'accesso. */
  $('vCod').onkeydown = (ev) => { if (ev.key === 'Enter') cerca(); };
  /* il fuoco al campo appena si apre la scheda: chi scansiona un buono
     non deve prima cliccarci dentro con il mouse */
  $('vCod').focus();
}

$('esci').onclick = async (ev) => {
  ev.preventDefault();
  await esci();
  chiediAccesso('');
};

(async () => {
  try {
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  } catch (e) {
    $('app').innerHTML = '<div class="riquadro">Non riesco a caricare il sistema di accesso. Ricarichi la pagina.</div>';
    return;
  }
  /* sessione già aperta su questo computer? */
  const { data } = await SB.auth.getSession();
  if (data?.session) {
    TOKEN = data.session.access_token;
    OPERATORE = data.session.user.user_metadata?.nome || data.session.user.email.split('@')[0];
    try { await chiama('?a=elenco'); disegna(); return; }
    catch (e) { await esci(); chiediAccesso(e.message); return; }
  }
  chiediAccesso('');
})();
</script>
</body>
</html>
