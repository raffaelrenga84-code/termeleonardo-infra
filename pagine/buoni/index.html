<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Buoni regalo — back office</title>
<!-- la pagina si installa sul tablet dello sportello come un'app a tutto
     schermo: manifest.webmanifest apre direttamente «Day Spa oggi» in
     modalita' sportello -->
<link rel="manifest" href="/buoni/manifest.webmanifest" />
<style>
:root{--acqua:#1E7F88;--acqua-scura:#0F5C64;--acqua-chiara:#E3F0F1;
--pietra:#EDE7DC;--carta:#FAF8F4;--inchiostro:#2A2E2B;--grigio:#7B756A;
--arancio:#E8751A;--oliva:#7A8450;--allarme:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--carta);color:var(--inchiostro);font:15px/1.5 Arial,Helvetica,sans-serif;}
.fascia{height:6px;background:linear-gradient(90deg,var(--acqua-scura),var(--acqua) 45%,#6FB1B8);}
header{background:#fff;border-bottom:1px solid var(--pietra);padding:14px 20px;
display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header .marchio{display:flex;align-items:center;gap:12px;}
header .marchio img{display:block;width:132px;height:auto;}
header .marchio span{font-family:Georgia,serif;font-size:15px;letter-spacing:2px;color:var(--fumo,#5C736F);}
header .chi{font-size:13px;color:var(--grigio);}
main{max-width:1340px;margin:0 auto;padding:20px 16px 60px;}
.due-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,660px);gap:22px;align-items:start;}
@media (max-width:1100px){ .due-col{grid-template-columns:1fr;} .anteprima{position:static !important;} }
.anteprima{position:sticky;top:16px;}
.anteprima .etichetta{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
color:var(--grigio);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.anteprima .telaio{background:#fff;border:1px solid var(--pietra);border-radius:8px;
padding:14px;overflow:auto;}
/* il buono non lo disegna piu' la pagina: e' il PDF del server, mostrato
   dentro un iframe (vedi pdfUrl e iframePdf piu' sotto). Niente scala da
   applicare a mano al foglio: ci pensa il lettore di PDF del browser. */
.pdfFrame{width:100%;height:780px;border:1px solid #E5E0D8;border-radius:6px;background:#fff;}
.anteprimaPdf .mini{padding:8px 0;}
.azioni-buono{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
/* anche gli <a>: "Scarica il PDF" e' un link con download, non un pulsante */
.azioni-buono button,.azioni-buono a{flex:1;min-width:150px;margin-top:0;text-align:center;}
.famiglie{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.famiglie button{border:1px solid var(--pietra);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--acqua-scura);}
.famiglie button.attiva{background:var(--acqua-scura);color:#fff;border-color:var(--acqua-scura);}
.schede{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--pietra);margin-bottom:18px;}
.schede button{background:none;border:0;border-bottom:3px solid transparent;
padding:10px 14px;font:600 14px Arial;color:var(--grigio);cursor:pointer;}
.schede button.attiva{color:var(--acqua-scura);border-bottom-color:var(--acqua);}
/* il numero delle richieste da guardare, sul pulsante della scheda */
.schede button .conta{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;
  border-radius:9px;background:#C97B2C;color:#fff;font-size:11px;font-weight:700;
  line-height:18px;text-align:center;vertical-align:1px;}
.riquadro{background:#fff;border:1px solid var(--pietra);border-radius:8px;padding:18px;margin-bottom:16px;}
h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acqua);margin-bottom:12px;}
label{display:block;font-size:12px;color:var(--grigio);margin:10px 0 4px;}
input,select,textarea{width:100%;padding:10px;border:1px solid #D8D2C4;border-radius:5px;
font:15px Arial;color:var(--inchiostro);background:#fff;}
textarea{min-height:64px;}
.due{display:flex;gap:12px;flex-wrap:wrap;}
.due>div{flex:1;min-width:180px;}
/* anche a.azione: "Rispondi all'ospite" apre il programma di posta, quindi
   e' un link e non un pulsante, ma deve avere lo stesso aspetto */
button.azione,a.azione{background:var(--arancio);color:#fff;border:0;border-radius:6px;
padding:13px 20px;font:600 15px Arial;cursor:pointer;margin-top:14px;
display:inline-block;text-decoration:none;box-sizing:border-box;}
button.azione:disabled{background:#CFCABF;}
/* Un <a> non ha :disabled, e uno senza href non e' un pulsante spento: e'
   un elemento con l'aria di essere cliccabile che non fa assolutamente
   niente. «Scarica il PDF» (#bScarica) nasce proprio cosi' — il foglio
   arriva dopo, con una fetch — e ci resta per sempre se quella richiesta
   fallisce: la reception cliccherebbe convinta e non succederebbe nulla.
   Finche' l'indirizzo non c'e' si vede spento, e i clic non arrivano
   nemmeno (pointer-events). Vedi mostraFatto. */
a.azione[aria-disabled="true"]{background:#F2F0EB;color:#9A958B;
border:1px solid #DED9CE;cursor:default;pointer-events:none;}
button.sec,a.sec{background:#fff;color:var(--acqua-scura);border:1px solid var(--acqua);}
button.mini-azione{background:#fff;color:var(--acqua-scura);border:1px solid var(--acqua);
border-radius:6px;padding:5px 11px;font:11px/1 Arial;letter-spacing:.6px;
text-transform:uppercase;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
color:var(--acqua-scura);padding:8px 10px;background:#F4F1EA;}
td{padding:9px 10px;border-top:1px solid #F0EBE1;vertical-align:top;}
/* IL RIEPILOGO PER I TASSISTI. Una riga per campo del loro modulo, e il
   valore da solo nella colonna di mezzo: e' quello che si copia, e non deve
   portarsi dietro l'etichetta. Il valore e' monospaziato perche' si
   confronta a occhio con quello che si e' appena incollato di la'. */
.atam th{width:1%;white-space:nowrap;background:transparent;text-transform:none;
  letter-spacing:0;font-size:12.5px;color:var(--grigio);font-weight:400;
  padding-left:0;vertical-align:top;}
.atam td{font-family:monospace;font-size:13px;white-space:pre-wrap;}
.atam td:last-child{width:1%;white-space:nowrap;padding-right:0;}
.atam .copiaVoce{border:1px solid var(--acqua);border-radius:6px;background:#fff;
  color:var(--acqua-scura);font:600 12px inherit;padding:4px 12px;cursor:pointer;}
.atam .copiaVoce:hover{background:var(--acqua);color:#fff;}
.cod{font-family:monospace;font-weight:700;color:var(--acqua-scura);}
.stato{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;}
/* i promozionali non sono un incasso: si devono riconoscere a colpo d'occhio */
.omaggio{display:inline-block;padding:1px 7px;border-radius:9px;background:#FBF3DF;
color:#8A6D1F;border:1px solid #E4CE93;font-size:11px;letter-spacing:.3px;}
/* un buono con più voci va riconosciuto senza doverlo aprire */
/* il gruppo di camere: si legge prima dei dettagli, perche' cambia il
   modo di trattare la richiesta — vanno assegnate vicine */
.insiemeCamere{margin-top:10px;padding:10px 12px;border-radius:8px;
  background:#EAF3EE;border-left:3px solid #1E7F88;font-size:13.5px;color:#1B4D4A;}
.apriInsieme{border:1px solid #BBD3CC;background:#fff;border-radius:6px;
  padding:2px 8px;cursor:pointer;color:#1B4D4A;}
.piu-voci{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:9px;
background:var(--acqua-chiara);color:var(--acqua-scura);border:1px solid var(--acqua);
font-size:11px;letter-spacing:.3px;}
tr.apribile{cursor:pointer;}
tr.apribile:hover td{background:#F7F5EF;}
.st-pagato{background:var(--acqua-chiara);color:var(--acqua-scura);}
.st-attesa{background:#FFF6E8;color:#B3541E;}
.st-riscosso{background:#EFF3E7;color:var(--oliva);}
.st-annullato{background:#F3F0EC;color:var(--grigio);}
.st-scaduto{background:#FDF0EE;color:var(--allarme);}
/* un buono pagato che non e' arrivato al cliente: deve dare fastidio,
   perche' qualcuno ha pagato e sta aspettando qualcosa che non ha */
.nonconsegnato{margin-top:4px;font-size:10px;font-weight:bold;letter-spacing:1px;
  background:var(--allarme,#C0392B);color:#fff;padding:2px 7px;border-radius:3px;
  display:inline-block;}
.avviso-consegna{margin-top:12px;padding:12px 14px;border-radius:5px;
  background:#FDF0EE;border-left:4px solid var(--allarme,#C0392B);
  font-size:13.5px;line-height:1.6;color:#7A2E24;}
/* stati delle richieste dal sito: la "nuova" deve saltare all'occhio,
   e' una persona che aspetta una risposta */
.st-nuova{background:#FFF0E4;color:#B3541E;font-weight:bold;}
.st-vista{background:#FFF6E8;color:#B3541E;}
.st-risposta{background:var(--acqua-chiara);color:var(--acqua-scura);}
.st-chiusa{background:#F3F0EC;color:var(--grigio);}
/* il tipo di richiesta (Trattamenti/Transfer/Green fee/Maestro/Soggiorno):
   una pastiglia sola per tutti i tipi, non un colore per tipo — l'etichetta
   arriva gia' scelta dal server (riepilogo.ts) e qui basta mostrarla */
.badge-tipo{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  background:var(--acqua-chiara);color:var(--acqua-scura);white-space:nowrap;}
/* «aveva chiesto: mattina» accanto a un campo che la reception ha gia'
   corretto rispetto a dati_originali */
.nota-prima{font-size:11.5px;color:var(--grigio);margin-top:2px;}
.esito{font-size:14px;color:var(--acqua-scura);min-height:20px;padding-top:10px;}
.errore{color:var(--allarme);}
.mini{font-size:12px;color:var(--grigio);}
.fatto{background:var(--acqua-chiara);border-left:4px solid var(--acqua);
border-radius:0 8px 8px 0;padding:14px 16px;margin-top:14px;}
.fatto .codice{font-family:monospace;font-size:26px;letter-spacing:2px;color:var(--acqua-scura);}
/* l'esito della scansione allo sportello: grande, verde o rosso, si legge
   da un metro */
.esitoGrande{font-size:22px;line-height:1.3;padding:14px 16px;border-radius:12px;margin:10px 0;}
.esitoGrande.ok{background:#E6F0EC;color:#1A3626;}
.esitoGrande.no{background:#FBE9E7;color:#8C2F28;}
.esitoGrande small{display:block;font-size:14px;margin-top:4px;opacity:.8;}
body.sportello .chi a{display:none;}
body.sportello #dOggiCod{font-size:22px;padding:14px;}
</style>
</head>
<body>
<div class="fascia"></div>
<header>
<div class="marchio"><img src="/buoni/img/logo.svg" alt="Hotel Terme Leonardo" /><span>back office</span></div>
<div class="chi"><span id="chiSono"></span> <a href="#" id="esci" style="color:var(--acqua);">esci</a></div>
</header>
<main id="app"></main>

<script type="module">
/* da buono.js, condiviso con la pagina pubblica di acquisto, restano i
   testi tradotti e i due aiutanti che servono ancora qui: il buono in se'
   non si disegna piu' da nessuna delle due parti — lo fa il server, in PDF
   sulla carta intestata (la proprieta', 5 settembre 2026). Presidiato da
   buono.test.ts e da pdf-pagine.test.ts. */
/* percorso assoluto e non './buono.js': un modulo si risolve contro
   l'indirizzo nella barra, non contro il file servito. Qui funzionava per
   fortuna, perche' il back office si apre sotto /buoni/, che la riscrittura
   di vercel.json copre; sarebbe bastato aprirlo su /buoni (senza barra
   finale) per cercare /buono.js e trovare la SPA. '/buoni/buono.js' vale
   uguale sui due domini. Vedi percorsi-web.test.ts. */
import { esc, ETI, CONDIZIONI, COMPRENDE, dataLingua, categoriaBuono, righeDescrizione } from '/buoni/buono.js';

/* stessa regola di sopra: percorso assoluto, non relativo — `/comune/date.js`,
   mai `./date.js` o `../comune/date.js`. Vedi il commento in date.js. */
import { attivaDate } from '/comune/date.js';
import { vociATAM, vociATAMRitorno, riepilogoATAM, indirizzoATAM, indirizzoATAMRitorno } from '/comune/atam.js';

const supabase = { createClient };
window.supabase = supabase;

/* il Day Spa venduto da noi (3 settembre 2026): posti, prenotazioni, arrivi */

const FUNZIONE_PRIVACY = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/privacy';

/* ---------- catalogo: dal listino spa del sito ---------- */
/* il Day Spa sta in cima perché è quello che chiedono di più */
const CATALOGO = [
  { g:'Day Spa', v:[
    /* gli orari stanno nella descrizione perche' finiscono sul buono: il

    ['dayspa_fer','Day Spa infrasettimanale — piscine e grotte, dal lunedì al venerdì, 9.00–18.30',35],
    ['dayspa_wknd','Day Spa festivo — piscine e grotte, sabato, domenica e festivi, 9.00–18.30',45],

];

const $ = (id) => document.getElementById(id);
const eur = (n) => Number(n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2 });
const dataIT = (iso) => {
  if (!iso) return '';
  const M = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
    'agosto','settembre','ottobre','novembre','dicembre'];
  const d = new Date(String(iso).slice(0,10) + 'T12:00');
  return `${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()}`;

/* descrizione del buono monetario, nella lingua scelta sul buono */
const TESTO_VALORE = {
  it: (v) => `Buono valore di ${v} \u20ac, spendibile in hotel`,
  de: (v) => `Wertgutschein \u00fcber ${v} \u20ac, im Hotel einl\u00f6sbar`,
  en: (v) => `Gift voucher worth ${v} \u20ac, redeemable at the hotel`,
  fr: (v) => `Bon d\u2019une valeur de ${v} \u20ac, utilisable \u00e0 l\u2019h\u00f4tel`
};
const descrizioneValore = (v, l) => (TESTO_VALORE[l] || TESTO_VALORE.it)(eur(v || 0));

let SB = null;        // client Supabase
let TOKEN = '';       // token dell'utente autenticato
let OPERATORE = '';   // nome dell'operatore, dal suo utente
let EMAIL = '';       // il suo indirizzo: decide schede e apertura
let VISTA = '';      // la scheda d'apertura: la decide schedaIniziale()

/* SU QUALE SCHEDA SI APRE IL BACK OFFICE.

   Si apriva sempre su «Emetti un buono». Per la reception sembrava
   andare bene — dal 3 settembre 2026 no: si apre sulle richieste dal sito,
   vedi ORDINE_SCHEDE piu' sotto. Per la spa non andava bene da prima, e
   non per gusto: `puoScrivereBuoni()` in supabase/functions/
   buoni/ruoli.ts dice che la spa NON emette buoni — deciso dalla
   proprieta' il 18 agosto 2026, perche' emettere un buono e' un gesto sul
   denaro incassato. La spa apriva quindi un modulo che il server le
   avrebbe rifiutato, mentre le sue richieste — trattamenti e Day Spa,
   l'unica ragione per cui quell'account esiste — stavano tre schede piu'
   in la'.

   QUESTA NON E' UNA REGOLA DI PERMESSI. Non nasconde schede e non toglie
   niente a nessuno: il cancello resta nel server, dove ha senso. Qui si
   sceglie solo da dove si comincia.

   La tabella e' una COPIA di quella in ruoli.ts, che una pagina servita
   da Vercel non puo' importare. La copia e' inevitabile; che le due
   divergano in silenzio no — le confronta scheda-iniziale.test.ts. */
/* LE SCHEDE, nell'ordine in cui compaiono. Erano scritte a mano nel
   markup di disegna(): un elenco non si puo' filtrare, e finche' erano
   cinque pulsanti uguali per tutti andava bene. */
const SCHEDE = [
  ['emetti', 'Emetti un buono'],
  ['elenco', 'Buoni emessi'],
  ['verifica', 'Verifica / riscuoti'],
  ['richieste', 'Richieste dal sito'],
  ['arrivi', 'Arrivi del giorno'],
  /* il Day Spa venduto da noi, dal 3 settembre 2026 (in prova) */
  ['dayspaOggi', 'Day Spa oggi'],
  ['dayspaDisponibilita', 'Disponibilit\u00e0 Day Spa'],
  ['dayspaPrenotazioni', 'Prenotazioni Day Spa'],
  /* il POS di Bistrot e ristorante, dal 4 settembre 2026: solo amministrazione */
  ['posMenu', 'POS · Menù'],
  ['posTavoli', 'POS · Tavoli'],
  ['posPersonale', 'POS · Personale'],
  ['posOrdiniQr', 'POS · Ordini dal QR'],  ['posAddebiti', 'POS · Addebiti in camera'],
  ['posGiornata', 'POS · Giornata'],
  ['posFasce', 'POS · Fasce orarie'],
  /* i consensi privacy firmati al totem e sugli iPad (4 settembre 2026) */
  ['privacy', 'Privacy'],
];

/* LE QUATTRO FAMIGLIE. Sedici schede in fila non si leggevano piu' («si sta
   affollando», la proprieta', 5 settembre 2026): una barra sopra con le
   famiglie, sotto le schede della famiglia aperta. L'ordine per indirizzo
   (ORDINE_SCHEDE) e le schede nascoste restano come sono: qui si decide
   solo dove sta ogni scheda. */
const FAMIGLIE = [
  ['buoni', 'Buoni', ['emetti', 'elenco', 'verifica']],
  ['ospiti', 'Ospiti', ['richieste', 'arrivi', 'privacy']],
  ['dayspa', 'Day Spa', ['dayspaOggi', 'dayspaDisponibilita', 'dayspaPrenotazioni']],
  ['pos', 'POS', ['posOrdiniQr', 'posAddebiti', 'posGiornata', 'posMenu', 'posTavoli', 'posPersonale', 'posFasce']],
];
const famigliaDi = (scheda) => (FAMIGLIE.find(([, , schede]) => schede.includes(scheda)) || FAMIGLIE[0])[0];

/* CHI NON VEDE COSA. Alla spa «Emetti un buono» non serve e non
   funziona: puoScrivereBuoni() la rifiuta, quindi oggi e' un vicolo
   cieco che si scopre premendo Invia.

   NASCONDERE NON E' PROTEGGERE, e non finge di esserlo: il cancello
   resta nel server, che rifiuterebbe la chiamata anche se qualcuno
   riaprisse il pulsante dagli strumenti del browser. Questo toglie di
   mezzo una strada che porta solo a un errore. */
const SCHEDE_NASCOSTE = new Map([
  ['spa@termeleonardo.com', ['emetti']],
]);

/** Le schede che questo indirizzo NON vede. */
function schedeNascoste(email) {
  const e = String(email ?? '').trim().toLowerCase();
  return SCHEDE_NASCOSTE.get(e) || [];
}

/* L'ORDINE DELLE SCHEDE, PER CHI ENTRA. «Per la reception cambia ordine:
   le richieste dal sito come prima cosa, poi arrivi del giorno e poi i
   buoni regalo» (la proprieta', 3 settembre 2026). La reception vive di
   richieste e arrivi; il buono e' il gesto piu' raro della giornata.
   L'amministrazione invece lavora sui buoni e tiene l'ordine di sempre.
   La spa ha davanti le due schede che le servono davvero.

   L'ORDINE E' ANCHE LA SCHEDA D'APERTURA: si entra sulla prima. Prima erano
   due tabelle — l'ordine fisso e una SCHEDA_PER_RUOLO — che dovevano
   restare d'accordo a mano; adesso e' una sola e non puo' contraddirsi.

   Una Map e non un oggetto: una chiave come `toString` esiste su
   Object.prototype e una lookup diretta restituirebbe la funzione
   ereditata. Gli indirizzi sono quelli di ruoli.ts (il server): la copia
   e' inevitabile, che divergano no — scheda-iniziale.test.ts. */
const ORDINE_SCHEDE = new Map([
  ['reception@termeleonardo.com', ['richieste', 'arrivi', 'dayspaOggi', 'emetti', 'elenco', 'verifica', 'dayspaDisponibilita', 'dayspaPrenotazioni']],
  ['spa@termeleonardo.com', ['richieste', 'arrivi', 'dayspaOggi', 'elenco', 'verifica', 'dayspaDisponibilita', 'dayspaPrenotazioni']],
]);

/** L'ordine delle schede per questo indirizzo; chi non e' in tabella tiene
 *  quello della pagina. Una scheda che manca dall'elenco va in coda, non
 *  sparisce: nascondere e' un'altra tabella (SCHEDE_NASCOSTE). */
function ordineDi(email) {
  const e = String(email ?? '').trim().toLowerCase();
  return ORDINE_SCHEDE.get(e) || SCHEDE.map(([v]) => v);
}

/** Le schede che questo indirizzo vede, nel suo ordine. */
function schedeDi(email) {
  const fuori = schedeNascoste(email);
  const ordine = ordineDi(email);
  const posto = (v) => { const i = ordine.indexOf(v); return i < 0 ? ordine.length : i; };
  return SCHEDE.filter(([v]) => !fuori.includes(v))
    .slice().sort((a, b) => posto(a[0]) - posto(b[0]));
}

/** MODALITA' SPORTELLO (?sportello=1): solo «Day Spa oggi», senza la barra
 *  delle schede e senza «esci». «Devo creargli una app dedicata perche'
 *  per sbaglio non tocchino o escano?» (la proprieta', 3 settembre 2026):
 *  no. Questa modalita' toglie di mezzo cio' che si puo' toccare per
 *  sbaglio; il blocco su app di Android fa il resto. Non e' una
 *  protezione: il cancello resta nel server. */
function sportello() {
  return new URLSearchParams(location.search).get('sportello') === '1';
}

/** La scheda chiesta nell'indirizzo (?scheda=dayspaOggi): il tablet allo
 *  sportello si apre direttamente li'. Solo una scheda che esiste; il
 *  server resta il cancello, come per tutto il resto. */
function schedaDaUrl() {
  const s = new URLSearchParams(location.search).get('scheda');
  return SCHEDE.some(([v]) => v === s) ? s : '';
}

/** La scheda su cui aprire il back office: la prima che si vede. */
function schedaIniziale(email) {
  const viste = schedeDi(email);
  return viste.length ? viste[0][0] : 'emetti';
}

async function chiama(qs, opz = {}, base = FUNZIONE) {
  const r = await fetch(base + qs, {
    ...opz,
    headers: {
      'content-type': 'application/json',
      authorization: 'Bearer ' + TOKEN,
      ...(opz.headers || {})
    }
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { await esci(); throw new Error(j.errore || 'sessione scaduta'); }
  if (!r.ok) throw new Error(j.errore || ('errore ' + r.status));
  return j;
}

/* Il PDF del buono: la sola resa che esiste, disegnata dal server sulla
   carta intestata. `chiama` non serve, perche' la risposta buona non e'
   JSON ma il file: si legge come blob e si tiene un indirizzo blob: da
   dare all'iframe, al pulsante Stampa e al link Scarica.
   Con `corpo` la richiesta e' un POST e chiede la BOZZA di un buono non
   ancora emesso (il modulo che l'operatore sta compilando); senza corpo e'
   un GET, e la coda `qs` dice quale buono. L'errore invece torna in JSON,
   e si legge solo in quel caso. */
async function pdfUrl(qs, corpo) {
  const r = await fetch(FUNZIONE + qs, {
    method: corpo ? 'POST' : 'GET',
    headers: { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    throw new Error(j.errore || ('errore ' + r.status));
  }
  return URL.createObjectURL(await r.blob());
}

/* il PDF si guarda dentro la pagina, senza aprire una finestra: e' quello
   che la reception fa cento volte al giorno mentre compila */
function iframePdf(contenitore, url) {
  contenitore.innerHTML = `<iframe class="pdfFrame" src="${url}" title="Anteprima del buono"></iframe>`;
}

/* Apre in una scheda nuova un PDF gia' pronto. DEVE stare dentro il giro
   di evento del clic: un window.open() dopo un await il browser lo tratta
   come aperto da solo (non dall'operatore) e lo blocca — spesso senza
   nemmeno un avviso visibile, quindi il clic sembrerebbe non fare niente.
   Se blocca comunque lo dice nell'elemento di esito passato, invece di
   restare muto. Un solo percorso per i tre pulsanti che aprono un PDF gia'
   scaricato: bStampa e bStampaBozza (mostraFatto) e antStampa (il modulo
   di emissione). Vedi pdf-pagine.test.ts: antStampa non deve piu' chiamare
   window.open() per conto suo. */
function apriPdfGuardato(url, elementoEsito) {
  if (!window.open(url, '_blank')) {
    elementoEsito.textContent = 'Il browser ha bloccato la finestra: stampi dall’anteprima qui sotto.';
  }
}

async function esci() {
  try { if (SB) await SB.auth.signOut(); } catch (e) {}
  TOKEN = ''; OPERATORE = '';
}

/* ---------- accesso con utente dell'hotel ---------- */
function chiediAccesso(messaggio) {
  $('chiSono').textContent = '';
  $('app').innerHTML = `<div class="riquadro" style="max-width:420px;margin:40px auto;">
    <h2>Accesso reception</h2>
    <label>Email dell'hotel</label>
    <input type="email" id="kMail" placeholder="nome@termeleonardo.com" autocomplete="username" />
    <label>Password</label>

    <button class="azione" id="kEntra" style="width:100%;">Entra</button>
    <div class="esito" id="kEsito">${messaggio ? `<span class="errore">${esc(messaggio)}</span>` : ''}</div>
    <p class="mini" style="padding-top:10px;">Serve un indirizzo dell'hotel.
    Password dimenticata? La reimposta l'amministratore da Supabase.</p></div>`;

  const entra = async () => {
    const email = $('kMail').value.trim();
    const pwd = $('kPwd').value;
    if (!email || !pwd) { $('kEsito').innerHTML = '<span class="errore">Servono email e password.</span>'; return; }
    $('kEntra').disabled = true;
    $('kEsito').textContent = 'Un momento\u2026';
    try {
      const { data, error } = await SB.auth.signInWithPassword({ email, password: pwd });
      if (error) throw new Error('Email o password non validi.');
      TOKEN = data.session.access_token;
      OPERATORE = data.user.user_metadata?.nome || email.split('@')[0];
      EMAIL = email;
      VISTA = schedaIniziale(email);
      await chiama('?a=elenco'); // prova: verifica anche dominio e IP
      disegna();
    } catch (e) {
      await esci();
      $('kEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
      $('kEntra').disabled = false;
    }
  };
  $('kEntra').onclick = entra;
  $('kPwd').onkeydown = (ev) => { if (ev.key === 'Enter') entra(); };
}

/* ---------- struttura ---------- */
function disegna() {
  $('chiSono').textContent = OPERATORE ? OPERATORE + ' \u00b7' : '';
  if (sportello()) {
    document.body.classList.add('sportello');
    VISTA = 'dayspaOggi';
    $('app').innerHTML = '<div id="vista"></div>';
    vistaDayspaOggi();
    return;
  }
  const visibili = schedeDi(EMAIL);
  /* se la scheda corrente non e' fra quelle visibili si torna alla prima:
     senza, la pagina disegnerebbe una vista senza il pulsante per uscirne */
  if (!visibili.some(([v]) => v === VISTA)) VISTA = visibili[0][0];
  /* due righe: le famiglie sopra, sotto le schede della famiglia aperta
     (5 settembre 2026). Il pulsante di una famiglia apre la sua prima
     scheda visibile, nell'ordine di chi e' entrato. */
  const fam = famigliaDi(VISTA);
  const famiglie = FAMIGLIE.filter(([, , schede]) => schede.some((v) => visibili.some(([x]) => x === v)));
  const diQuesta = visibili.filter(([v]) => famigliaDi(v) === fam);
  $('app').innerHTML = `<div class="famiglie">${famiglie.map(([f, nome]) =>
    `<button data-famiglia="${f}" class="${f === fam ? 'attiva' : ''}">${esc(nome)}</button>`
  ).join('')}</div><div class="schede">${diQuesta.map(([v, t]) =>
    `<button data-scheda="${v}" class="${VISTA === v ? 'attiva' : ''}">${esc(t)}</button>`
  ).join('')}</div><div id="vista"></div>`;
  document.querySelectorAll('.famiglie button').forEach((b) =>
    b.onclick = () => { const prima = visibili.find(([v]) => famigliaDi(v) === b.dataset.famiglia); if (prima) { VISTA = prima[0]; disegna(); } });
  document.querySelectorAll('.schede button').forEach(b =>
    b.onclick = () => { VISTA = b.dataset.scheda; disegna(); });
  ({ emetti: vistaEmetti, elenco: vistaElenco, verifica: vistaVerifica,
     richieste: vistaRichieste, arrivi: vistaArrivi, dayspaOggi: vistaDayspaOggi,
     dayspaDisponibilita: vistaDayspaDisponibilita, dayspaPrenotazioni: vistaDayspaPrenotazioni,
     posMenu: vistaPosMenu, posTavoli: vistaPosTavoli, posPersonale: vistaPosPersonale,
     posOrdiniQr: vistaPosOrdiniQr, posAddebiti: vistaPosAddebiti, posGiornata: vistaPosGiornata, posFasce: vistaPosFasce, privacy: vistaPrivacy })[VISTA]();
  aggiornaContatore();
}

/* IL NUMERO DELLE RICHIESTE DA GUARDARE, SUL PULSANTE. Chi entra legge
   «Richieste dal sito 3» prima ancora di cliccare: una richiesta nuova non
   resta ferma in una scheda che nessuno apre, che e' il modo in cui una
   risposta arriva il giorno dopo. Si aggiorna a ogni cambio di scheda e a
   ogni ricarica dell'elenco, cosi' scende appena una richiesta e' segnata
   vista. Il numero e' un aiuto, non un dato: se la chiamata fallisce il
   pulsante resta com'e', senza errori a video. */
async function aggiornaContatore() {
  const b = document.querySelector('.schede button[data-scheda="richieste"]') || document.querySelector('.famiglie button[data-famiglia="ospiti"]');
  if (!b) return;
  try {
    const j = await chiama('?a=elenco&stato=nuova&cerca=', {}, FUNZIONE_RICHIESTE);
    const n = (j.richieste || []).length;
    const vecchio = b.querySelector('.conta');
    if (vecchio) vecchio.remove();
    if (n > 0) b.insertAdjacentHTML('beforeend', ` <span class="conta">${n}</span>`);
  } catch (e) { /* senza numero la scheda resta com'e' */ }
}

/* ---------- 1. emissione ---------- */
function vistaEmetti() {

  const fraCinqueAnni = new Date(oggi); fraCinqueAnni.setFullYear(fraCinqueAnni.getFullYear() + 5);
  const iso = (d) => d.toISOString().slice(0, 10);

  /* `escludi(id)`, se passato, toglie dalla tendina le voci che non
     dovrebbero starci — un gruppo che resta senza voci non si stampa
     nemmeno lui. "Altro (scrivo io)" non si esclude mai: e' testo libero

  const opzioniCatalogo = (escludi) => CATALOGO.map(gr => {

  }).join('') + `<option value="__altro" data-prezzo="0" data-nome="">Altro (scrivo io)</option>`;

  $('vista').innerHTML = `<div class="due-col"><div><div class="riquadro">
    <h2>Cosa regala</h2>
    <label>Tipo</label>
    <select id="fTipo">

          <div style="flex:0 0 120px;min-width:120px;"><label>Prezzo (\u20ac)</label>
          <input type="number" id="fAltroPrezzo" min="0" step="1" /></div>
        </div>
      </div>
      <div id="fRighe"></div>
      <p class="mini" id="fRigheNota">Con \u00abAggiungi\u00bb componi un buono con pi\u00f9 voci

      <p class="mini" id="fNotaSerale" style="display:none;"></p>
    </div>
    <div class="due">
      <div><label>Valore (\u20ac)</label><input type="number" id="fValore" min="1" step="1" /></div>
      <div><label>Valido fino al</label><input type="date" id="fScade" value="${iso(fra12)}"
        min="${iso(oggi)}" max="${iso(fraCinqueAnni)}" /></div>
    </div>
    <p class="mini">Dodici mesi come da regolamento. Ricordi che l'hotel chiude
    da fine novembre a met\u00e0 febbraio: se la scadenza cade l\u00ec, valuti di allungarla.</p>
  </div>

  <div class="riquadro">
    <h2>Chi compra e chi riceve</h2>
    <div class="due">
      <div><label>Acquirente</label><input type="text" id="fAcq" /></div>
      <div><label>Email</label><input type="email" id="fAcqMail" /></div>
      <div><label>Telefono</label><input type="tel" id="fAcqTel" /></div>
    </div>
    <div class="due">
      <div><label>Destinatario (sul buono)</label><input type="text" id="fDest" /></div>
      <div><label>Email del destinatario</label><input type="email" id="fDestMail" /></div>
      <div><label>Pagamento</label>
      <select id="fPag">
        <optgroup label="Incassato adesso in reception">
          <option value="contanti">Contanti</option>
          <option value="bancomat">Bancomat / carta</option>
        </optgroup>

        </optgroup>
        <optgroup label="Da pagare (il buono resta in attesa)">
          <option value="bonifico">Bonifico</option>
          <option value="stripe">Link di pagamento</option>
        </optgroup>
      </select></div>
    </div>
    <label>Lingua del buono</label>
    <select id="fLingua">
      <option value="it">Italiano</option><option value="de">Deutsch</option>
      <option value="en">English</option><option value="fr">Fran&ccedil;ais</option>
    </select>
    <label>Riga sotto il titolo (facoltativa, esce in oro sul buono)</label>
    <input type="text" id="fSotto" placeholder="es. FERIALE \u00b7 DAL LUNED\u00cc AL VENERD\u00cc \u00b7 PER 1 PERSONA" />
    <label>Dedica (facoltativa, esce sul buono)</label>
    <textarea id="fDedica" placeholder="Buon compleanno, con affetto\u2026"></textarea>

  <div class="anteprima">

    <div class="telaio" id="antTelaio"></div>
  </div></div>`;

  /* ---- paniere: pi\u00f9 voci con quantit\u00e0 ---- */
  let CARRELLO = [];   // [{id, nome, prezzo, q}]

  /* Il Day Spa serale non ha trattamenti alle spalle: alle 18-22.30 di
     venerdi' e sabato il centro benessere non fa trattamenti, e un buono
     "serale + massaggio" sarebbe un buono che il cliente non potrebbe
     usare come gli e' stato venduto \u2014 qui il carrello non ha il tetto di
     due voci che ha la pagina pubblica (regala/index.html), quindi la
     stessa combinazione era possibile anche qui, semplicemente aggiungendo
     le due righe una dopo l'altra. Un altro ingresso Day Spa (anche un
     secondo serale) resta libero di stare nello stesso buono: e' un
     ingresso, non un trattamento che pretende il centro aperto.
     Stessa regola del server (normalizzaVoci, acquista.ts) e della pagina
     pubblica (escludiPer, regala/index.html), scritta qui a mano una terza
     volta e non condivisa: tre ambienti diversi, stesso motivo del
     QUANTITA_MAX duplicato in regala/index.html. Presidiata contro la
     regola vera del server in serale-backoffice.test.ts. */
  const eSerale = (id) => id === 'dayspa_sera';
  const eIngressoDaySpa = (id) => id.startsWith('dayspa');
  /* cosa la tendina non deve piu' poter offrire, dato l'elenco delle voci
     di listino gia' nel carrello (le righe "Altro" non contano: id e'

     trattamenti; con un trattamento gia' dentro, niente serale; con solo
     altri ingressi Day Spa o un carrello vuoto, nessuna esclusione. */
  const escludiPerVoci = (ids) => ids.some(eSerale) ? (id) => !eIngressoDaySpa(id) : ids.some((id) => !eIngressoDaySpa(id)) ? (id) => eSerale(id) : null;
  const escludiPerCarrello = () => escludiPerVoci(CARRELLO.filter((r) => r.id).map((r) => r.id));
  const NOTA_SERALE = 'I trattamenti non si fanno di sera: per metterli nello stesso buono scelga il Day Spa infrasettimanale o festivo.';

  const vocePlurale = (nome, q) => {
    if (q <= 1) return nome;
    /* plurali garbati per le voci pi\u00f9 comuni; il resto resta invariato */
    return nome
      .replace(/^Massaggio\b/, 'Massaggi')
      .replace(/^Trattamento\b/, 'Trattamenti')
      .replace(/^Programma\b/, 'Programmi')
      .replace(/^Day Spa\b/, 'ingressi Day Spa')
      .replace(/^Pulizia viso\b/, 'Pulizie viso')
      .replace(/^Scrub\b/, 'Scrub')
      .replace(/^Linfodrenaggio\b/, 'Linfodrenaggi')
      .replace(/^Riflessologia\b/, 'Riflessologie');
  };
  /* il numero si scrive solo quando la voce e' una sola e supera uno: "n. 1
     \u00b7 Massaggio antistress" e' il modo in cui un modulo dice a un essere
     umano che l'ha compilato una macchina, ed e' la stessa soglia di
     componiDescrizione sul server e di riepilogoVoci sul sito. Ma quando le
     righe sono piu' di una il numero si scrive su tutte, anche dove vale

     seconda avesse una quantita' non specificata, non pari a uno \u2014 ed e'

     Nello stesso elenco della reception due buoni identici devono leggersi
     nello stesso modo, sia che siano nati qui o online. */
  const rigaTesto = (r, mostraNumero) => (mostraNumero || r.q > 1) ? `n. ${r.q} \u00b7 ${vocePlurale(r.nome, r.q)}` : r.nome;
  const descrizioneCarrello = (righe) => righe.map(r => rigaTesto(r, righe.length > 1)).join('\n');
  const sommaCarrello = (righe) => righe.reduce((s, r) => s + r.prezzo * r.q, 0);

  const righeCorrenti = () => {
    if (CARRELLO.length) return CARRELLO;
    /* nessuna riga aggiunta: vale la voce selezionata, come prima */
    const o = $('fVoce').selectedOptions[0];
    const q = Math.max(1, parseInt($('fQta').value) || 1);
    if ($('fVoce').value === '__altro') {
      const nome = $('fAltro').value.trim();
      return nome ? [{ id: null, nome, prezzo: parseFloat($('fAltroPrezzo').value) || 0, q }] : [];
    }
    return [{ id: $('fVoce').value, nome: o.dataset.nome, prezzo: Number(o.dataset.prezzo), q }];
  };

  /* la tendina si ricostruisce sul contenuto del carrello. Se l'elenco
     filtrato non cambia si lascia stare del tutto: sostituire l'HTML
     resetta comunque la selezione alla prima opzione, e farlo ogni volta
     che il carrello cambia — anche per un'aggiunta che non tocca la
     regola — sposterebbe la scelta dell'operatore senza ragione. Se
     l'elenco cambia davvero e la voce di prima c'e' ancora, si ripristina:
     solo se e' proprio lei a sparire (il caso che conta: era il serale, o
     era un trattamento incompatibile) la selezione scivola sulla prima
     voce rimasta. "__altro" non sparisce mai (vedi opzioniCatalogo). */
  const rigenerafVoceOpzioni = () => {
    const valorePrima = $('fVoce').value;
    const nuove = opzioniCatalogo(escludiPerCarrello());
    if ($('fVoce').innerHTML === nuove) return;
    $('fVoce').innerHTML = nuove;
    if ([...$('fVoce').options].some((o) => o.value === valorePrima)) $('fVoce').value = valorePrima;
  };

  function disegnaRighe() {
    rigenerafVoceOpzioni();
    const esclusa = escludiPerCarrello();
    $('fNotaSerale').style.display = esclusa ? '' : 'none';
    if (esclusa) $('fNotaSerale').textContent = NOTA_SERALE;
    if (!CARRELLO.length) { $('fRighe').innerHTML = ''; return; }
    $('fRighe').innerHTML = `<table style="margin-top:10px;">` + CARRELLO.map((r, i) =>
      `<tr><td style="width:70px;">n. ${r.q}</td><td>${esc(vocePlurale(r.nome, r.q))}</td>
      <td style="width:90px;text-align:right;">${eur(r.prezzo * r.q)} \u20ac</td>
      <td style="width:40px;text-align:right;"><a href="#" data-i="${i}" class="togliRiga"
        style="color:var(--allarme);text-decoration:none;font-size:17px;" title="Togli">\u00d7</a></td></tr>`
    ).join('') + `<tr><td></td><td style="color:var(--grigio);">Totale listino</td>
      <td style="text-align:right;font-weight:700;">${eur(sommaCarrello(CARRELLO))} \u20ac</td><td></td></tr></table>`;
    document.querySelectorAll('.togliRiga').forEach(a => a.onclick = (ev) => {
      ev.preventDefault();
      CARRELLO.splice(Number(a.dataset.i), 1);
      $('fValore').value = CARRELLO.length ? sommaCarrello(CARRELLO) : '';
      disegnaRighe(); aggiornaAnteprima();
    });
  }

  const agg = () => {
    const servizio = $('fTipo').value === 'servizio';
    $('boxServizio').style.display = servizio ? '' : 'none';
    if (servizio) {
      const o = $('fVoce').selectedOptions[0];
      $('boxAltro').style.display = $('fVoce').value === '__altro' ? '' : 'none';
      if (!CARRELLO.length && $('fVoce').value !== '__altro') $('fValore').value = o.dataset.prezzo;
    } else {
      /* buono monetario: si parte da zero, niente residui del listino */
      $('fValore').value = '';
    }
  };
  const aggPag = () => {
    const v = $('fPag').value;
    const daPagare = ['bonifico', 'stripe'].includes(v);
    $('notaPag').innerHTML = daPagare
      ? 'Il buono nasce <strong>in attesa di pagamento</strong>: si genera l\u2019anteprima da mandare al cliente, ' +
        'e il codice spendibile esce solo quando registri l\u2019incasso.'
      : v === 'promozionale'
        ? 'Omaggio: <strong>nessun incasso</strong>. Il buono viene emesso subito ed \u00e8 spendibile come tutti gli altri; ' +
          'nell\u2019elenco resta segnato come promozionale.'
        : 'Incasso immediato: il buono viene <strong>emesso subito</strong>, pronto da stampare o inviare.';
    $('fCrea').textContent = daPagare ? 'Prepara il buono (in attesa)' : 'Emetti il buono';
  };
  /* ---- anteprima dal vivo: quello che vede il cliente ---- */
  function buonoProvvisorio() {
    const tipo = $('fTipo').value;
    let descrizione = '', voce_id = null, righe = [];
    if (tipo === 'servizio') {
      righe = righeCorrenti();
      voce_id = righe.length ? righe[0].id : null;
      descrizione = righe.length ? descrizioneCarrello(righe) : 'Trattamento a scelta';
    } else {
      descrizione = descrizioneValore($('fValore').value, $('fLingua').value);
    }
    return {
      numero: '\u2014', codice: null, stato: 'attesa', tipo, voce_id, descrizione,
      valore: parseFloat($('fValore').value) || 0,
      lingua: $('fLingua').value, sottotitolo: $('fSotto').value,
      acquirente: $('fAcq').value, destinatario: $('fDest').value,
      dedica: $('fDedica').value, scade_il: $('fScade').value
    };
  }
  /* l'ultima bozza chiesta al server: la tiene anche "Stampa anteprima",
     che apre lo stesso foglio invece di chiederne un altro */
  let attesaAnteprima = null;
  let urlAnteprima = '';
  /* L'anteprima e' il PDF vero, non un secondo disegno del buono: quello
     che l'operatore vede mentre compila e' esattamente il foglio che il
     cliente ricevera'. Il prezzo e' che ogni aggiornamento e' un giro al
     server, quindi non si chiede a ogni tasto premuto: si aspetta che
     l'operatore smetta di scrivere (900 ms), con un solo timer che i tasti
     successivi riazzerano. */
  function aggiornaAnteprima() {
    const telaio = $('antTelaio');
    if (!telaio) return;
    clearTimeout(attesaAnteprima);
    attesaAnteprima = setTimeout(async () => {
      try {
        const url = await pdfUrl('?a=pdf', buonoProvvisorio());
        /* senza revoca ogni modifica lascerebbe un PDF in memoria fino a
           che la scheda resta aperta: una mattina di lavoro sono decine */
        if (urlAnteprima) URL.revokeObjectURL(urlAnteprima);
        urlAnteprima = url;
        iframePdf(telaio, url);
      } catch (e) {
        telaio.innerHTML = `<span class="errore">${esc(e.message)}</span>`;
      }
    }, 900);
  }
  /* stampa di quello che si sta componendo: serve a farlo vedere al cliente
     prima che paghi, quindi il server lo marca BOZZA e senza codice.
     Passa per apriPdfGuardato — MAI un window.open() dopo un await, vedi
     il commento sopra la sua definizione. Se il foglio non c'e' ancora
     (l'operatore ha premuto prima dei 900 ms, o il primo giro non e' ancora
     arrivato) lo si chiede e lo si carica nel telaio qui sotto, come fa gia'
     aggiornaAnteprima: la finestra pero' non si apre da questo giro, perche'
     arriverebbe dopo un await e il browser la bloccherebbe; si chiede
     all'operatore di premere di nuovo, e il secondo clic trovera' il foglio
     gia' pronto. */
  $('antStampa').onclick = () => {
    if (urlAnteprima) { apriPdfGuardato(urlAnteprima, $('fEsito')); return; }
    $('fEsito').textContent = 'Sto preparando l’anteprima: prema di nuovo tra un momento.';
    pdfUrl('?a=pdf', buonoProvvisorio()).then((url) => {
      if (urlAnteprima) URL.revokeObjectURL(urlAnteprima);
      urlAnteprima = url;
      iframePdf($('antTelaio'), url);
    }).catch((e) => {
      $('fEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
    });
  };
  const conAnteprima = (f) => () => { f(); aggiornaAnteprima(); };
  $('fTipo').onchange = conAnteprima(agg);
  $('fVoce').onchange = conAnteprima(agg);
  $('fPag').onchange = aggPag;
  $('fAggiungi').onclick = () => {
    const q = Math.max(1, parseInt($('fQta').value) || 1);
    if ($('fVoce').value === '__altro') {
      const nome = $('fAltro').value.trim();
      if (!nome) { $('fEsito').innerHTML = '<span class="errore">Scrivi la descrizione della voce libera.</span>'; return; }
      CARRELLO.push({ id: null, nome, prezzo: parseFloat($('fAltroPrezzo').value) || 0, q });
      $('fAltro').value = ''; $('fAltroPrezzo').value = '';
    } else {
      /* difensivo, non la prima barriera: con la tendina gia' filtrata da
         rigenerafVoceOpzioni() (dentro disegnaRighe(), chiamata dopo ogni
         aggiunta e ogni rimozione) l'operatore non dovrebbe mai poter
         selezionare una combinazione vietata — ma se qualcosa nel filtro si
         inceppasse, questo e' lo stesso controllo del server
         (normalizzaVoci, acquista.ts), cosi' l'aggiunta si rifiuta comunque
         invece di lasciar comporre un buono che il cliente non potrebbe usare. */
      const esclusa = escludiPerCarrello();
      if (esclusa && esclusa($('fVoce').value)) {
        $('fEsito').innerHTML = `<span class="errore">${esc(NOTA_SERALE)}</span>`; return;
      }
      const o = $('fVoce').selectedOptions[0];
      const gia = CARRELLO.find(r => r.id === $('fVoce').value);
      if (gia) gia.q += q;
      else CARRELLO.push({ id: $('fVoce').value, nome: o.dataset.nome, prezzo: Number(o.dataset.prezzo), q });
    }
    $('fQta').value = 1;
    $('fValore').value = sommaCarrello(CARRELLO);
    $('fEsito').textContent = '';
    disegnaRighe(); aggiornaAnteprima();
  };
  ['fValore','fScade','fLingua','fSotto','fAcq','fDest','fDedica','fAltro','fQta']
    .forEach(id => { const e = $(id); if (e) { e.oninput = aggiornaAnteprima; e.onchange = aggiornaAnteprima; } });
  window.addEventListener('resize', aggiornaAnteprima);

  agg(); aggPag(); disegnaRighe(); aggiornaAnteprima();
  /* #fScade e' ricreato a ogni disegno di vistaEmetti(): riattivarlo qui,
     non solo al primo caricamento. */
  attivaDate();

  $('fCrea').onclick = async () => {
    const tipo = $('fTipo').value;
    let descrizione = '', voce_id = null;
    if (tipo === 'servizio') {
      const righe = righeCorrenti();
      voce_id = righe.length ? righe[0].id : null;
      descrizione = righe.length ? descrizioneCarrello(righe) : '';
    } else {
      descrizione = descrizioneValore($('fValore').value, $('fLingua').value);
    }
    const valore = parseFloat($('fValore').value);
    if (!descrizione || !(valore > 0)) {
      $('fEsito').innerHTML = '<span class="errore">Servono la voce e un valore.</span>'; return;
    }
    $('fCrea').disabled = true; $('fEsito').textContent = 'Un momento\u2026';
    try {
      const j = await chiama('?a=crea', { method:'POST', body: JSON.stringify({
        operatore: OPERATORE, tipo, voce_id, descrizione, valore,
        lingua: $('fLingua').value,
        acquirente: $('fAcq').value, acquirente_email: $('fAcqMail').value,
        acquirente_tel: $('fAcqTel').value, destinatario: $('fDest').value,
        destinatario_email: $('fDestMail').value,
        dedica: $('fDedica').value, sottotitolo: $('fSotto').value, scade_il: $('fScade').value,
        pagamento: $('fPag').value, note: $('fNote').value
      })});
      $('fEsito').textContent = '';
      mostraFatto(j.buono);
    } catch (e) {
      $('fEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
    } finally { $('fCrea').disabled = false; }
  };
}

/* chi l'ha comprato, per chi, a che indirizzi: sono i dati che servono
   quando il cliente telefona perche' il buono non gli e' arrivato */
function dettagliBuono(b) {
  const riga = (etichetta, valore) => valore
    ? `<tr><td style="padding:3px 12px 3px 0;color:#8A938F;white-space:nowrap;">${etichetta}</td>
       <td style="padding:3px 0;">${esc(valore)}</td></tr>` : '';
  const corpo = riga('Acquirente', b.acquirente) + riga('Email acquirente', b.acquirente_email)
    + riga('Telefono', b.acquirente_tel) + riga('Destinatario', b.destinatario)
    + riga('Email destinatario', b.destinatario_email) + riga('Dedica', b.dedica)
    + riga('Pagamento', [b.pagamento, b.pagamento_rif].filter(Boolean).join(' · '))
    + riga('Emesso da', b.creato_da) + riga('Note', b.note);
  if (!corpo) return '';
  return `<div class="mini" style="margin-top:14px;padding-top:12px;border-top:1px solid #F0EBE1;">
    <table style="font-size:13px;border-collapse:collapse;">${corpo}</table></div>`;
}

/* il PDF dell'ultimo buono mostrato da mostraFatto: una variabile per
   pagina e non per chiamata, altrimenti la revoca qui sotto non troverebbe
   mai l'URL del buono precedente (ogni chiamata a mostraFatto ha la sua
   chiusura, che finita la chiamata non e' piu' raggiungibile). Stessa idea
   di urlAnteprima nel modulo di emissione: senza revoca, un buono aperto
   dall'elenco dopo l'altro lascerebbe ogni foglio in memoria per tutta la
   giornata di back office. */
let urlBuonoMostrato = '';
/* Chi ha diritto a scrivere in urlBuonoMostrato / #bAnteprima / #bScarica.
   mostraFatto chiede il PDF con una fetch, e due chiamate (l'operatore apre
   il buono A e poi il buono B dall'elenco prima che il PDF di A sia
   arrivato) possono rispondere in un ordine qualunque: se la risposta di A
   arriva DOPO quella di B, senza un modo per riconoscerlo revocherebbe il
   foglio di B — quello che si vede adesso — e riscriverebbe #bAnteprima e
   #bScarica (cercati per id, quindi validi per il buono di chiunque) col
   PDF sbagliato: il pannello mostrerebbe, stampasse o scaricasse il buono
   di un altro cliente. Un numero di giro, non un booleano: ogni chiamata
   prende il numero corrente incrementato (`mio`), e quando la sua risposta
   arriva la confronta con quello ATTUALE — se sono diversi la sua risposta
   non e' piu' di nessuno: revoca il blob appena ricevuto (nessuno lo usera'
   mai) e non tocca altro. Solo la chiamata vincente (l'ultima aperta)
   revoca il foglio mostrato prima di lei. */
let giroBuono = 0;
/* Il giro a cui appartiene il foglio che sta in urlBuonoMostrato. Senza,
   il controllo del giro copriva meta' del difetto: la risposta in ritardo
   non ruba piu' il pannello, ma i pulsanti si', perche' guardavano solo se
   urlBuonoMostrato fosse pieno — e quella variabile e' di modulo, non la
   azzera nessuno quando mostraFatto ridisegna. Aperto il buono A e poi il
   buono B dall'elenco, per tutto il volo della richiesta di B (e PER SEMPRE
   se quella richiesta fallisce) urlBuonoMostrato tiene ancora il foglio di
   A: «Stampa subito» apriva il buono di un altro cliente — nome, dedica e
   codice spendibile compresi. Trovato dalla revisione finale (5-6 settembre
   2026). Adesso l'URL e il suo giro si scrivono insieme, e chi apre un PDF
   deve trovarci il PROPRIO giro. */
let giroDelFoglio = 0;

/* Il pannello del buono: numero, dati, anteprima e modi per consegnarlo.
   Lo usa sia l'emissione sia l'elenco, dove serve a rimandare un buono
   che il cliente non ha ricevuto o si e' trovato nella posta indesiderata. */
function mostraFatto(b, contenitore = 'fFatto') {
  /* il numero di questo giro: vedi il commento sopra giroBuono */
  const mio = ++giroBuono;
  const attesa = b.stato === 'attesa';
  /* il link vale per UN buono solo: azzerarlo qui evita che finisca
     nell email del buono successivo (il cliente pagherebbe l altro) */
  LINK_PAGAMENTO = '';
  $(contenitore).innerHTML = `<div class="fatto">
    <div class="mini">Numero per l&apos;amministrazione</div>
    <div style="font-family:monospace;font-size:17px;color:#0F5C64;">${esc(b.numero)}</div>
    ${nonConsegnato(b) ? `<div class="avviso-consegna">
      <strong>Il cliente non ha ricevuto questo buono.</strong>
      L&apos;invio per email non &egrave; riuscito${b.consegna === 'senza-indirizzo'
        ? ': non c&apos;era nessun indirizzo a cui mandarlo' : ''}.
      Il buono &egrave; valido: va consegnato a mano, stampandolo o inoltrandolo
      da un altro indirizzo.</div>` : ''}
    ${attesa
      ? `<div style="margin-top:12px;"><strong>In attesa di pagamento.</strong>
        Il codice spendibile non esiste ancora: al cliente va l&apos;anteprima con le
        istruzioni per pagare. Quando l&apos;incasso arriva, lo registri qui sotto.</div>
        ${b.pagamento === 'stripe'
          ? `<button class="azione" id="bLink">Crea il link di pagamento</button>` : ''}
        <button class="azione ${b.pagamento === 'stripe' ? 'sec' : ''}" id="bRichiesta">Copia l&apos;email di richiesta pagamento</button>
        <button class="azione sec" id="bStampaBozza">&#128424; Stampa l&apos;anteprima (BOZZA)</button>
        <button class="azione sec" id="bPagato">Ho ricevuto il pagamento</button>`
      : `<div class="mini" style="margin-top:12px;">Codice da consegnare</div>
        <div class="codice">${esc(b.codice)}</div>
        <div class="mini">${righeDescrizione(b.descrizione, b.voci).map(r =>
          `<div>${r.quantita != null ? `${r.quantita} \u00d7 ` : ''}${esc(r.testo)}</div>`).join('')}
          ${eur(b.valore)} \u20ac \u00b7 valido fino al ${dataIT(b.scade_il)}</div>
        <div class="mini" style="padding-top:12px;">Come lo consegna?</div>
        <div class="azioni-buono">
          <button class="azione" id="bStampa">&#128424; Stampa subito</button>
          <a class="azione sec" id="bScarica" aria-disabled="true" download="Buono-Regalo-${esc(b.codice)}.pdf">&#11015; Scarica il PDF</a>
          ${b.destinatario_email
            ? `<button class="azione sec" id="bMailDest">&#9993; Email a ${esc(b.destinatario || 'chi lo riceve')}</button>` : ''}
          ${b.acquirente_email
            ? `<button class="azione sec" id="bMailAcq">&#9993; Email a ${esc(b.acquirente || 'chi compra')}</button>` : ''}
          <button class="azione sec" id="bCopia">&#128203; Copia</button>
        </div>`}
    ${b.stato === 'riscosso' ? `<div class="avviso-consegna" style="margin-top:12px;">
      <strong>Riscosso</strong>${b.riscosso_il ? ' il ' + dataIT(b.riscosso_il) : ''}${b.riscosso_da ? ' da ' + esc(b.riscosso_da) : ''}${b.riscosso_note ? ' · ' + esc(b.riscosso_note) : ''}.
      <button class="azione sec" id="bRipristina" style="margin-top:8px;">Rimetti valido (riscosso per sbaglio)</button></div>` : ''}
    <div class="esito" id="bEsito"></div>
    ${dettagliBuono(b)}
    <div class="anteprimaPdf" id="bAnteprima"><div class="mini">Carico l&rsquo;anteprima del buono&hellip;</div></div>
  </div>`;

  /* Il PDF del buono, chiesto una volta sola: lo stesso foglio serve
     all'anteprima qui sotto, a "Stampa subito" e a "Scarica il PDF". Un
     buono ancora in attesa il server lo marca BOZZA da se': la pagina non
     deve dirglielo, e non puo' sbagliarsi. */
  /* window.open resta DENTRO il clic dell'operatore e non dopo un await:
     una finestra aperta al ritorno di una promessa il browser la tratta
     come aperta da sola, e la blocca. Il foglio ce l'abbiamo gia', perche'
     l'anteprima qui sotto lo scarica appena il pannello compare. */
  /* `giroDelFoglio !== mio` e non solo `!urlBuonoMostrato`: il foglio in
     memoria puo' benissimo esserci ed essere di UN ALTRO BUONO (vedi il
     commento sopra giroDelFoglio). Aprirlo qui vorrebbe dire stampare il
     nome, la dedica e il codice spendibile di un altro cliente. Meglio non
     aprire niente e dirlo: il foglio giusto arriva fra un istante, o non
     arriva affatto e allora l'anteprima qui sotto mostra il suo errore. */
  const apriPdf = () => {
    if (!urlBuonoMostrato || giroDelFoglio !== mio) {
      $('bEsito').textContent = 'L’anteprima di questo buono si sta ancora caricando: un momento.';
      return;
    }
    apriPdfGuardato(urlBuonoMostrato, $('bEsito'));
  };
  /* il pannello puo' essere sparito mentre il PDF arrivava (l'operatore ha
     cambiato scheda, o ha aperto un altro buono dall'elenco): allora non
     c'e' piu' niente da riempire. La revoca del foglio precedente va qui,
     al momento in cui il nuovo e' davvero arrivato: se questa richiesta
     fallisse, il vecchio foglio (magari ancora aperto in un'altra scheda
     del browser) resterebbe valido invece di sparire per un errore che non
     lo riguarda.
     PRIMA di tutto pero' il controllo del giro (vedi il commento sopra
     giroBuono): se nel frattempo si e' aperto un altro buono, `mio` non e'
     piu' il giro corrente, e questa risposta e in ritardo non ha piu' un
     pannello da riempire — solo un blob da revocare, perche' e' suo e di
     nessun altro. */
  pdfUrl('?a=pdf&numero=' + encodeURIComponent(b.numero)).then((url) => {
    if (mio !== giroBuono) { URL.revokeObjectURL(url); return; }
    if (urlBuonoMostrato) URL.revokeObjectURL(urlBuonoMostrato);
    urlBuonoMostrato = url;
    /* l'URL e il suo giro si scrivono INSIEME, sempre: sono una cosa sola,
       e un foglio senza il suo giro e' esattamente il difetto di prima */
    giroDelFoglio = mio;
    if (!$('bAnteprima')) return;
    iframePdf($('bAnteprima'), url);
    /* il link si accende solo adesso che ha un indirizzo da aprire */
    if ($('bScarica')) { $('bScarica').href = url; $('bScarica').removeAttribute('aria-disabled'); }
  }).catch((e) => {
    if (mio !== giroBuono) return;
    if ($('bAnteprima')) $('bAnteprima').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
  });

  if ($('bRipristina')) $('bRipristina').onclick = async () => {
    if (!confirm(`Rimettere valido il buono ${b.codice}? Va fatto solo se e stato riscosso per sbaglio.`)) return;
    try {
      await chiama('?a=ripristina', { method: 'POST', body: JSON.stringify({ codice: b.codice, note: '' }) });
      mostraFatto({ ...b, stato: 'pagato', riscosso_il: null, riscosso_da: null, riscosso_note: null }, contenitore);
    } catch (e) { $('bEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  if (attesa) {
    if ($('bLink')) $('bLink').onclick = async () => {
      $('bEsito').textContent = 'Chiedo il link a Stripe\u2026';
      try {
        const j = await chiama('?a=link', { method: 'POST', body: JSON.stringify({ numero: b.numero }) });
        LINK_PAGAMENTO = j.url;
        $('bEsito').innerHTML = `\u2713 Link pronto: <a href="${esc(j.url)}" target="_blank"
          style="color:#1E7F88;word-break:break-all;">${esc(j.url)}</a><br />
          <span class="mini">Ora "Copia l\u2019email": il link \u00e8 gi\u00e0 dentro. Quando il cliente paga,
          il buono si sblocca da solo.</span>`;
      } catch (e) {
        $('bEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>
          <div class="mini">Puoi comunque procedere con il bonifico.</div>`;
      }
    };
    $('bRichiesta').onclick = async () => {
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([emailRichiesta(b)], { type: 'text/html' }),
          'text/plain': new Blob([emailRichiestaTesto(b)], { type: 'text/plain' })
        })]);
        $('bEsito').textContent = '\u2713 Copiata: incollala in Outlook e invia al cliente.';
      } catch (e) { $('bEsito').innerHTML = '<span class="errore">Copia non riuscita.</span>'; }
    };
    $('bStampaBozza').onclick = apriPdf;
    $('bPagato').onclick = async () => {
      const rif = prompt('Riferimento del pagamento (CRO del bonifico, id della transazione\u2026). Puoi lasciare vuoto:') ?? null;
      if (rif === null) return;
      try {
        const j = await chiama('?a=pagato', { method: 'POST', body: JSON.stringify({
          numero: b.numero, operatore: OPERATORE, pagamento: b.pagamento, pagamento_rif: rif }) });
        mostraFatto(j.buono, contenitore);
      } catch (e) { $('bEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
    };
  } else {
    const L = ['it','de','en','fr'].includes(b.lingua) ? b.lingua : 'it';
    $('bStampa').onclick = apriPdf;

    /* L'email la manda il server, col PDF in allegato. Prima la reception
       copiava il buono negli appunti e apriva Outlook gia' indirizzato,
       poi incollava a mano: quello che arrivava al cliente dipendeva da
       come Outlook rendeva l'HTML incollato, e spesso «viene un'immagine
       in miniatura» (la proprieta', 5 settembre 2026). Il pulsante resta
       spento mentre il server manda, cosi' un secondo clic impaziente non
       spedisce due email allo stesso indirizzo. */
    const perEmail = async (bottone, dest, chi) => {
      bottone.disabled = true;
      $('bEsito').textContent = 'Mando l\u2019email\u2026';
      try {
        const j = await chiama('?a=manda', { method: 'POST', body: JSON.stringify({ numero: b.numero, a: chi }) });
        /* `allegato` il server lo manda APPOSTA: l'email parte comunque
           anche quando il foglio non esce (vedi ?a=manda in index.ts), e
           chi sta al banco deve saperlo, perche' al cliente e' arrivata una
           lettera senza il suo buono e va rimediato a mano. Fino alla
           revisione finale (5-6 settembre 2026) la pagina buttava via
           questo valore e scriveva "con il buono in PDF allegato" in tutti
           e due i casi: diceva alla reception il contrario della verita'.
           Il messaggio storto si vede anche da lontano (classe `errore`),
           o passerebbe per quello di sempre appena letto di sfuggita. */
        if (j.allegato) {
          $('bEsito').innerHTML = `\u2713 Email inviata a ${esc(dest)} con il buono in PDF allegato.`;
        } else {
          $('bEsito').innerHTML = `<span class="errore">\u26a0 Email inviata a ${esc(dest)}, ma SENZA il buono in PDF:
            il foglio non \u00e8 stato generato.</span> Gli faccia avere il buono stampandolo, oppure
            scaricandolo qui sopra e allegandolo a mano.`;
        }
      } catch (e) {
        $('bEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
      } finally {
        bottone.disabled = false;
      }
    };
    if ($('bMailDest')) $('bMailDest').onclick = () => perEmail($('bMailDest'), b.destinatario_email, 'destinatario');
    if ($('bMailAcq')) $('bMailAcq').onclick = () => perEmail($('bMailAcq'), b.acquirente_email, 'acquirente');
    /* Copia mette negli appunti SOLO testo, col link alla pagina da cui si
       apre il PDF: era l'HTML negli appunti a diventare quell'immagine in
       miniatura una volta incollato nell'email. Il buono vero e' il PDF,
       e a quello porta il link. */
    $('bCopia').onclick = async () => {
      try {
        await navigator.clipboard.writeText(buonoTesto(b) +
          '\n\nPDF del buono: https://www.hoteltermeleonardo.com/buoni/stampa?codice=' + b.codice + '&l=' + L);
        $('bEsito').textContent = '\u2713 Copiato il testo del buono, col link al PDF.';
      } catch (e) { $('bEsito').innerHTML = '<span class="errore">Copia non riuscita.</span>'; }
    };
  }
}

/* email di richiesta pagamento: bonifico e/o link, come nelle offerte */
const IBAN = 'IT11C0306962321100000006041';
let LINK_PAGAMENTO = '';
/* Un buono a due voci ha la descrizione su due righe. In HTML il ritorno a
   capo non si vede: senza <br /> il cliente si legge le due voci di fila su
   una riga sola. Si escapa riga per riga, perche' il <br /> e' markup nostro
   e non va escapato insieme al testo. La versione in testo semplice qui
   sotto non ne ha bisogno: li' il ritorno a capo e' gia' un ritorno a capo. */
const righeHTML = (s) => String(s || '').split('\n').map(r => esc(r)).join('<br />');
/* In coda a questa email c'era l'anteprima del buono disegnata in HTML:
   non c'e' piu', perche' il buono e' il PDF del server e questa email e'
   la richiesta di pagamento, non il buono. Via anche la frase «qui sotto
   trova l'anteprima», che prometteva qualcosa che non arriva. La bozza in
   PDF, se l'operatore la vuole allegare, la apre col pulsante «Stampa
   l'anteprima (BOZZA)». */
function emailRichiesta(b) {

  <table cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:18px 0;">
    <tr><td style="border-left:3px solid #1E7F88;background:#FAF8F4;padding:14px 18px;">

    </td></tr></table>
  <p><strong>Come pagare</strong><br />
  ${link ? `<a href="${esc(LINK_PAGAMENTO)}" style="display:inline-block;background:#E8751A;color:#fff;
    text-decoration:none;padding:12px 22px;border-radius:6px;font-weight:600;margin:6px 0 14px;">
    Paga con carta &mdash; ${eur(b.valore)} &euro;</a><br />oppure` : ''}
  con bonifico bancario intestato a Tria S.r.l.:<br />
  IBAN <strong>${IBAN}</strong><br />
  Causale: <strong>${esc(b.numero)}</strong> &mdash; buono regalo</p>
  <p>Appena ricevuto le mandiamo il buono, pronto da stampare o da inoltrare
  a chi lo ricever\u00e0.</p>
  <p>Un cordiale saluto,<br />${esc(OPERATORE)}<br />
  <span style="color:#7B756A;font-size:13px;">Hotel Terme Leonardo &middot; +39 049 9939200</span></p>
  </div>`;
}
function emailRichiestaTesto(b) {
  return `Gentile ${b.acquirente || 'Cliente'},\n\necco il buono regalo che ci ha chiesto.\n` +
  `Diventa valido appena registriamo il pagamento.\n\n` +
  `${b.descrizione}\nImporto: ${eur(b.valore)} \u20ac\nRiferimento: ${b.numero}\n\n` +
  `COME PAGARE\n` +
  (LINK_PAGAMENTO && b.pagamento === 'stripe' ? `Con carta: ${LINK_PAGAMENTO}\noppure\n` : '') +
  `Bonifico intestato a Tria S.r.l.\nIBAN ${IBAN}\n` +

  `Appena ricevuto le mandiamo il buono definitivo.\n\n${OPERATORE}\n` +
