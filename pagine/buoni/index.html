        ${arts.length ? `<table><tr><th>Articolo</th><th>Prezzo €</th><th>IVA</th><th>Stampante</th><th>Portata</th><th>Si prepara a</th><th>Libero</th><th>Esaurito</th><th>Attivo</th><th title="Lo vedono gli ospiti che ordinano dal QR">QR</th><th title="Scelta rapida del menu dal QR: senza glutine (una sigla GL scritta negli allergeni vince sulla spunta)">🌾</th><th title="Scelta rapida: vegetariano (un vegano e anche vegetariano)">🥗</th><th title="Scelta rapida: vegano">🌱</th><th title="Scelta rapida: senza lattosio (una sigla LA scritta negli allergeni vince sulla spunta)">🥛</th><th title="Per gli ospiti dal QR">🌐</th></tr>
        ${arts.map((a) => `<tr data-art="${esc(a.id)}"><td><input data-a="nome" value="${esc(a.nome)}" /></td>
          <td><input data-a="prezzo_cent" value="${euroPos(a.prezzo_cent)}" style="width:72px;" /></td>
          <td><input data-a="iva" type="number" value="${Number(a.iva ?? 10)}" style="width:52px;" /></td>
          <td><select data-a="stampante">${opzPos([['', 'della categoria'], ['cucina', 'Cucina'], ['bar', 'Bar']], a.stampante || '')}</select></td>
          <td><select data-a="portata">${opzPos([['', 'della categoria'], ...portOpz], a.portata || '')}</select></td>
          <td><select data-a="locale_stampa">${opzPos(localeOpz, a.locale_stampa || '')}</select></td>
          <td><input type="checkbox" data-a="prezzo_libero" ${a.prezzo_libero ? 'checked' : ''}/></td>
          <td><input type="checkbox" data-a="esaurito" ${a.esaurito ? 'checked' : ''}/></td>
          <td><input type="checkbox" data-a="attivo" ${a.attivo !== false ? 'checked' : ''}/></td>
          <td><input type="checkbox" data-a="per_ospiti" ${a.per_ospiti !== false ? 'checked' : ''} title="Lo vedono gli ospiti dal QR (il palmare lo vede sempre)"/></td>
          <td><input type="checkbox" data-a="senza_glutine" ${a.senza_glutine === true ? 'checked' : ''} title="Senza glutine: compare nella scelta rapida del menu dal QR"/></td>
          <td><input type="checkbox" data-a="vegetariano" ${a.vegetariano === true ? 'checked' : ''} title="Vegetariano: compare nella scelta rapida del menu dal QR"/></td>
          <td><input type="checkbox" data-a="vegano" ${a.vegano === true ? 'checked' : ''} title="Vegano: compare nella scelta rapida del menu dal QR (e anche fra i vegetariani)"/></td>
          <td><input type="checkbox" data-a="senza_lattosio" ${a.senza_lattosio === true ? 'checked' : ''} title="Senza lattosio: compare nella scelta rapida del menu dal QR"/></td>
          <td><button type="button" class="azione sec mini" data-tradu="${esc(a.id)}" style="width:auto;padding:2px 8px;" title="Nomi, ingredienti e allergeni per gli ospiti dal QR">🌐${a.nomi ? '' : ' ·'}</button></td></tr>
          <tr data-tradu-di="${esc(a.id)}" hidden><td colspan="15"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 6px;">${LINGUE.map((l) => `<input data-an="${l}" placeholder="nome ${l}" value="${esc((a.nomi || {})[l] || '')}" />`).join('')}${LINGUE.map((l) => `<input data-ad="${l}" placeholder="ingredienti ${l}" value="${esc((a.descrizioni || {})[l] || '')}" />`).join('')}<input data-allergeni placeholder="allergeni, es. GL-LA-U" value="${esc(a.allergeni || '')}" /><input data-orari placeholder="orari, es. 12:15-17:30; ven,sab 12:15-20:30" value="${esc(a.orari || '')}" /></div></td></tr>`).join('')}</table>` : '<div class="mini">Nessun articolo.</div>'}
        <button type="button" class="azione sec mini" data-nuovo-art="${esc(c.id)}" style="width:auto;margin-top:6px;">+ articolo</button></div>`;
    };
    const varianti = `<div class="riquadro"><b>Varianti</b><div class="mini">Una variante vale per un articolo o per una categoria intera; il supplemento si somma al prezzo.</div>
      <table><tr><th>Variante</th><th>Supplemento €</th><th>Per la categoria</th><th>oppure per l'articolo</th></tr>
      ${D.varianti.map((v) => `<tr data-var="${esc(v.id)}"><td><input data-vr="nome" value="${esc(v.nome)}" /></td>
        <td><input data-vr="supplemento_cent" value="${euroPos(v.supplemento_cent)}" style="width:72px;" /></td>
        <td><select data-vr="categoria">${opzPos(catOpz(''), v.categoria || '')}</select></td>
        <td><input data-vr="articolo_nome" list="pmArticoli" value="${esc((D.articoli.find((a) => a.id === v.articolo) || {}).nome || '')}" /></td></tr>`).join('')}</table>
      <datalist id="pmArticoli">${D.articoli.map((a) => `<option value="${esc(a.nome)}"></option>`).join('')}</datalist>
      <button type="button" class="azione sec mini" id="pmNuovaVar" style="width:auto;margin-top:6px;">+ variante</button></div>`;
    const preferiti = D.locali.map((l) => { const miei = D.preferiti.filter((p) => p.locale === l.id);
      return `<div class="riquadro" data-pref-locale="${esc(l.id)}"><b>Preferiti · ${esc(l.nome)}</b><div class="mini">I dodici articoli che il cameriere vede per primi.</div>
        <div class="due">${Array.from({ length: 12 }, (_, i) => { const p = miei.find((x) => Number(x.posizione) === i);
          return `<div><label>${i + 1}</label><select>${opzPos(artOpz, p ? p.articolo : '')}</select></div>`; }).join('')}</div></div>`; }).join('');
    $('vista').innerHTML = `<div class="riquadro"><div class="due">
        <div><label>Cerca articolo o categoria</label><input id="pmFiltro" value="${esc(filtro)}" placeholder="es. birra" /></div>
        <div><label>&nbsp;</label><button type="button" class="azione" id="pmSalva" style="width:auto;">Salva il menù</button>
          <button type="button" class="azione sec" id="pmNuovaCat" style="width:auto;">+ categoria</button></div></div>
      <div class="mini">${D.articoli.length} articoli in ${D.categorie.length} categorie. Le bevande escono al bar, il cibo in cucina: la stampante la decide la categoria, l'articolo può fare eccezione. Il menù arriva da Fidra con l'estensione (pagina Articoli, «Manda gli articoli al POS»).</div>
      <div class="esito" id="pmEsito"></div></div>` + D.categorie.map(blocco).join('') + varianti + preferiti;
    $('pmFiltro').oninput = () => { raccogli(); filtro = $('pmFiltro').value; disegna(); const n = $('pmFiltro'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    $('pmNuovaCat').onclick = () => { raccogli(); D.categorie.push({ id: crypto.randomUUID(), nome: 'Nuova categoria', posizione: D.categorie.length, colore: null, stampante: 'cucina', portata: 'secondi', sotto: null, note_rapide: [], fidra_id: null, locale_stampa: null, attiva: true }); filtro = ''; disegna(); };
    $('pmNuovaVar').onclick = () => { raccogli(); D.varianti.push({ id: crypto.randomUUID(), articolo: null, categoria: null, nome: '', supplemento_cent: 0, posizione: D.varianti.length }); disegna(); };
    document.querySelectorAll('[data-tradu]').forEach((b) => b.onclick = () => { const r = document.querySelector(`[data-tradu-di="${b.dataset.tradu}"]`); if (r) r.hidden = !r.hidden; });
    document.querySelectorAll('[data-nuovo-art]').forEach((b) => b.onclick = () => { raccogli(); D.articoli.push({ id: crypto.randomUUID(), categoria: b.dataset.nuovoArt, nome: '', prezzo_cent: 0, iva: 10, portata: null, stampante: null, prezzo_libero: false, incluso_trattamento: false, conto_ricavo: null, esaurito: false, posizione: D.articoli.length, fidra_id: null, locale_stampa: null, attivo: true }); disegna(); });
    $('pmSalva').onclick = async () => {
      raccogli();
      $('pmEsito').textContent = 'Salvo…';
      try {
        const pulisci = (r) => { const { aggiornato_il, ...resto } = r; return resto; };
        const corpo = { categorie: D.categorie.map(pulisci), articoli: D.articoli.filter((a) => String(a.nome).trim()).map(pulisci), varianti: D.varianti.filter((v) => String(v.nome).trim()).map(pulisci), preferiti: D.preferiti.map(pulisci) };
        await chiama('?a=menu-salva', { method: 'POST', body: JSON.stringify(corpo) }, FUNZIONE_POS);
        $('pmEsito').textContent = 'Salvato. I palmari lo vedono al prossimo accesso.';
      } catch (e) { $('pmEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
    };
  };
  caricaPos().then((d) => { D = d; disegna(); }).catch((e) => { $('pmEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; });
}

/* I conti chiusi «in camera» che aspettano di entrare nel conto camera di
   Fidra. La reception li riporta a mano dalla scheda del soggiorno e poi
   li segna qui: finche' questa lista non e' vuota, la giornata non e'
   chiusa. Quando il conto camera sara' nostro, cambia solo chi la svuota. */
function vistaPosAddebiti() {
  $('vista').innerHTML = `<div class="riquadro"><div class="esito" id="paEsito">Carico…</div></div>`;
  let stato = 'da_riportare';
  const disegna = (righe) => {
    const soldi = righe.filter((r) => r.stato === 'da_riportare').reduce((t, r) => t + Number(r.totale_cent || 0), 0);
    $('vista').innerHTML = `<div class="riquadro">
      <div class="due"><div><label>Da vedere</label>
        <select id="paStato">${opzPos([['da_riportare', 'Da riportare in Fidra'], ['riportato', 'Già riportati'], ['annullato', 'Annullati'], ['tutti', 'Tutti']], stato)}</select></div>
        <div><label>&nbsp;</label><button type="button" class="azione sec" id="paRicarica" style="width:auto;">Aggiorna</button></div></div>
      <div class="mini">${righe.length} conti. ${stato === 'da_riportare' ? `Da riportare: <b>${euroPos(soldi)} €</b>. Si aprono in Fidra sulla scheda del soggiorno, si aggiunge l’extra, poi si preme «Riportato».` : ''}</div>
      <div class="esito" id="paEsito"></div></div>
      ${righe.length ? righe.map((r) => `<div class="riquadro">
        <div class="due"><div><b>Camera ${esc(r.camera)}</b>${r.ospite ? ` · ${esc(r.ospite)}` : ''}
          <div class="mini">${esc(new Date(r.chiuso_il).toLocaleString('it-IT'))}${r.tessera ? ' · tessera letta' : ' · camera scritta a mano'}${r.firma ? ' · firmato dall’ospite' : ' · senza firma'}</div></div>
          <div style="text-align:right;"><b style="font-size:20px;">${euroPos(r.totale_cent)} €</b></div></div>
        <table><tr><th>Q.tà</th><th>Articolo</th><th style="text-align:right;">Totale</th></tr>
          ${(Array.isArray(r.righe) ? r.righe : []).map((x) => `<tr><td>${Number(x.quantita)}</td><td>${esc(x.nome)}</td><td style="text-align:right;">${euroPos(x.totale_cent)} €</td></tr>`).join('')}</table>
        ${r.firma
          ? `<div class="mini">Firmato dall’ospite sul palmare${r.firmato_il ? ` il ${esc(new Date(r.firmato_il).toLocaleString('it-IT'))}` : ''}</div>
             <img src="${esc(r.firma)}" alt="firma dell’ospite" style="max-width:320px;width:100%;border:1px solid var(--pietra);border-radius:8px;background:#fff;" />`
          : '<div class="mini">Senza firma: l’ospite non era al tavolo alla chiusura.</div>'}
        ${r.nota ? `<div class="mini">Nota: ${esc(r.nota)}</div>` : ''}
        <div class="due" style="margin-top:8px;">
          ${r.stato === 'da_riportare'
            ? `<button type="button" class="azione" data-segna="riportato" data-id="${esc(r.id)}" style="width:auto;">Riportato in Fidra</button>
               <button type="button" class="azione sec" data-segna="annullato" data-id="${esc(r.id)}" style="width:auto;">Annulla addebito</button>`
            : `<div class="mini">${r.stato === 'riportato' ? 'Riportato' : 'Annullato'} ${r.riportato_il ? esc(new Date(r.riportato_il).toLocaleString('it-IT')) : ''}${r.riportato_da ? ` da ${esc(r.riportato_da)}` : ''}</div>
               <button type="button" class="azione sec" data-segna="da_riportare" data-id="${esc(r.id)}" style="width:auto;">Rimetti in coda</button>`}
        </div></div>`).join('')
        : '<div class="riquadro"><div class="mini">Niente in questa lista.</div></div>'}`;
    $('paStato').onchange = () => { stato = $('paStato').value; carica(); };
    $('paRicarica').onclick = carica;
    document.querySelectorAll('[data-segna]').forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try {
        await chiama('?a=addebito-segna', { method: 'POST', body: JSON.stringify({ id: b.dataset.id, stato: b.dataset.segna, da: OPERATORE || 'reception' }) }, FUNZIONE_POS);
        carica();
      } catch (e) { $('paEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; b.disabled = false; }
    });
  };
  const carica = async () => {
    try { const j = await chiama(`?a=addebiti&stato=${encodeURIComponent(stato)}`, {}, FUNZIONE_POS); disegna(j.addebiti || []); }
    catch (e) { $('paEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  carica();
}

/* Gli ordini dal QR, un giorno alla volta (la proprieta', 5 settembre 2026):
   righe, come ha pagato, stato; «Rimborsa» tutto o una parte (con Stripe,
   come i buoni), «Annulla l'addebito» per quelli in camera, «Ristampa la
   comanda», una nota per ricordare cosa e' successo. Le regole stanno nel
   server (rimborsi.ts); qui si guarda e si preme. */
function vistaPosOrdiniQr() {
  const oggi = new Date();
  if (oggi.getHours() < 4) oggi.setDate(oggi.getDate() - 1);
  const aData = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  let giorno = aData(oggi);
  const finestra = (g) => { const [y, m, d] = g.split('-').map(Number); return { da: new Date(y, m - 1, d, 4, 0, 0).toISOString(), a: new Date(y, m - 1, d + 1, 4, 0, 0).toISOString() }; };
  const STATI = { in_attesa: 'in attesa del pagamento', pagato: 'pagato', in_cucina: 'in cucina', annullato: 'annullato', errore: 'errore', rimborsato: 'rimborsato' };
  const pagati = (o) => ['in_cucina', 'pagato', 'rimborsato'].includes(o.stato);
  $('vista').innerHTML = `<div class="riquadro"><div class="esito" id="poEsito">Carico…</div></div>`;
  const disegna = (ordini) => {
    const tot = ordini.filter(pagati).reduce((t, o) => t + Number(o.totale_cent || 0) - Number(o.rimborsato_cent || 0), 0);
    $('vista').innerHTML = `<div class="riquadro">
      <div class="due"><div><label>Giorno (dalle 4 alle 4)</label><input type="date" id="poGiorno" value="${giorno}" /></div>
        <div><label>&nbsp;</label><button type="button" class="azione sec" id="poRicarica" style="width:auto;">Aggiorna</button></div></div>
      <div class="mini">${ordini.length} ordini dal QR, incassati <b>${euroPos(tot)} €</b> al netto dei rimborsi. Con la carta il rimborso lo fa Stripe (il cliente lo vede in qualche giorno); in camera si toglie dall’addebito, finché non è riportato in Fidra.</div>
      <div class="esito" id="poEsito"></div></div>
      ${ordini.length ? ordini.map((o) => `<div class="riquadro">
        <div class="due"><div><b>${esc(o.tavolo_nome)}</b> · ${o.modo === 'camera' ? `camera ${esc(o.camera || '')}` : 'carta'} · <span class="mini">${esc(STATI[o.stato] || o.stato)}</span>
          <div class="mini">${esc(o.id)} · ${esc(new Date(o.creato_il).toLocaleString('it-IT'))}${o.stripe_pagamento ? ` · ${esc(o.stripe_pagamento)}` : ''}${o.addebito ? ` · addebito ${esc(o.addebito.stato)}` : ''}</div></div>
          <div style="text-align:right;"><b style="font-size:20px;">${euroPos(o.totale_cent)} €</b>${Number(o.rimborsato_cent) ? `<div class="mini">rimborsati ${euroPos(o.rimborsato_cent)} €</div>` : ''}</div></div>
        <table><tr><th>Q.tà</th><th>Articolo</th><th>Nota</th><th style="text-align:right;">Totale</th></tr>
          ${(o.righe_conto && o.righe_conto.length ? o.righe_conto : (Array.isArray(o.righe) ? o.righe : [])).map((x) => `<tr${x.stato === 'stornata' ? ' style="text-decoration:line-through;opacity:.6;"' : ''}><td>${Number(x.quantita)}</td><td>${esc(x.nome)}</td><td class="mini">${esc(x.nota || '')}</td><td style="text-align:right;">${euroPos(Number(x.quantita) * Number(x.prezzo_cent))} €</td></tr>`).join('')}</table>
        ${o.errore ? `<div class="mini errore">Errore: ${esc(o.errore)}</div>` : ''}
        <div class="due" style="margin-top:8px;align-items:end;"><div><label>Nota</label><input data-nota="${esc(o.id)}" value="${esc(o.nota || '')}" maxlength="500" /></div><div><button type="button" class="azione sec" data-salva-nota="${esc(o.id)}" style="width:auto;">Salva la nota</button></div></div>
        <div class="due" style="margin-top:8px;">
          <div>${pagati(o) && Number(o.totale_cent) > Number(o.rimborsato_cent || 0)
            ? (o.modo === 'carta'
              ? `<button type="button" class="azione" data-rimborsa="${esc(o.id)}" style="width:auto;">Rimborsa</button>`
              : `<button type="button" class="azione" data-rimborsa="${esc(o.id)}" style="width:auto;">Rimborsa una parte</button> <button type="button" class="azione sec" data-annulla="${esc(o.id)}" style="width:auto;">Annulla l’addebito</button>`)
            : ''}</div>
          <div style="text-align:right;">${o.conto ? `<button type="button" class="azione sec" data-ristampa="${esc(o.id)}" style="width:auto;">Ristampa la comanda</button>` : ''}</div></div></div>`).join('')
        : '<div class="riquadro"><div class="mini">Nessun ordine dal QR in questo giorno.</div></div>'}`;
    $('poGiorno').onchange = () => { giorno = $('poGiorno').value || giorno; carica(); };
    $('poRicarica').onclick = carica;
    const manda = async (b, qs, corpo, dopo) => {
      b.disabled = true;
      try { const j = await chiama(qs, { method: 'POST', body: JSON.stringify({ ...corpo, da: OPERATORE || 'reception' }) }, FUNZIONE_POS); if (dopo) dopo(j); carica(); }
      catch (e) { $('poEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; b.disabled = false; window.scrollTo(0, 0); }
    };
    document.querySelectorAll('[data-rimborsa]').forEach((b) => b.onclick = () => {
      const o = ordini.find((x) => x.id === b.dataset.rimborsa);
      const residuo = Number(o.totale_cent) - Number(o.rimborsato_cent || 0);
      const euro = prompt(`Quanto restituire? Al massimo ${euroPos(residuo)} €. Vuoto = tutto.`, euroPos(residuo));
      if (euro === null) return;
      const cent = euro.trim() ? centPos(euro) : null;
      if (euro.trim() && (!cent || cent <= 0)) return alert('Importo non valido.');
      const motivo = prompt('Il motivo (resta scritto sull’ordine):') || '';
      manda(b, '?a=ospite-rimborsa', { ordine: o.id, importo_cent: cent, motivo }, (j) => alert(`Restituiti ${euroPos(j.importo_cent)} €.`));
    });
    document.querySelectorAll('[data-annulla]').forEach((b) => b.onclick = () => {
      if (!confirm('Annullo l’addebito in camera? La reception non lo riporterà in Fidra.')) return;
      const motivo = prompt('Il motivo:') || '';
      manda(b, '?a=ospite-annulla-addebito', { ordine: b.dataset.annulla, motivo });
    });
    document.querySelectorAll('[data-ristampa]').forEach((b) => b.onclick = () => manda(b, '?a=ospite-ristampa', { ordine: b.dataset.ristampa }, (j) => alert(`Ristampa in coda: ${j.biglietti} ${j.biglietti === 1 ? 'biglietto' : 'biglietti'}.`)));
    document.querySelectorAll('[data-salva-nota]').forEach((b) => b.onclick = () => manda(b, '?a=ospite-nota', { ordine: b.dataset.salvaNota, nota: document.querySelector(`[data-nota="${b.dataset.salvaNota}"]`).value }));
  };
  const carica = async () => {
    const f = finestra(giorno);
    try { const j = await chiama(`?a=ospite-ordini&da=${encodeURIComponent(f.da)}&fino=${encodeURIComponent(f.a)}`, {}, FUNZIONE_POS); disegna(j.ordini || []); }
    catch (e) { $('poEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  carica();
}

/* La cassa di fine giornata (la proprieta', 4 settembre 2026): i conti
   chiusi dalle quattro del mattino alle quattro del giorno dopo — la
   giornata di un bar non finisce a mezzanotte. I numeri li fa il server
   (giornata.ts); qui si scelgono giorno e locale e si guardano. */
function vistaPosGiornata() {
  const oggi = new Date();
  if (oggi.getHours() < 4) oggi.setDate(oggi.getDate() - 1);
  const aData = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  let giorno = aData(oggi), locale = '';
  const finestra = (g) => {
    const [y, m, d] = g.split('-').map(Number);
    return { da: new Date(y, m - 1, d, 4, 0, 0).toISOString(), a: new Date(y, m - 1, d + 1, 4, 0, 0).toISOString() };
  };
  const testa = () => `<div class="riquadro"><div class="due">
      <div><label>Giornata (dalle 4 del mattino alle 4 del giorno dopo)</label><input type="date" id="pgGiorno" value="${esc(giorno)}" /></div>
      <div><label>Locale</label><select id="pgLocale">${opzPos([['', 'Tutti'], ['bistrot', 'Bistrot'], ['ristorante', 'Ristorante']], locale)}</select></div></div>
      <div class="esito" id="pgEsito"></div></div>`;
  const collega = () => {
    $('pgGiorno').onchange = () => { giorno = $('pgGiorno').value || giorno; carica(); };
    $('pgLocale').onchange = () => { locale = $('pgLocale').value; carica(); };
  };
  const disegna = (g) => {
    const num = (n) => `${euroPos(n)} €`;
    const cifra = (t, v) => `<div style="border:1px solid var(--pietra);border-radius:10px;padding:10px 12px;"><div class="mini">${t}</div><b style="font-size:22px;">${v}</b></div>`;
    $('vista').innerHTML = testa() + `
      <div class="riquadro"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;">
        ${cifra('Incasso (contanti + carta)', num(g.incasso_cent))}${cifra('Contanti', num(g.per_modo.contanti))}${cifra('Carta', num(g.per_modo.carta))}
        ${cifra('In camera (da riportare)', num(g.camera_cent))}${cifra('Rimborsi dal QR', num(g.rimborsi_qr_cent))}${cifra('Conti chiusi', g.conti)}${cifra('Coperti', g.coperti)}
      </div></div>
      <div class="riquadro"><b>Per cameriere</b> <span class="mini">chi ha chiuso il conto</span>
        <table><tr><th>Cameriere</th><th>Conti</th><th style="text-align:right;">Totale</th></tr>
        ${g.per_cameriere.map((c) => `<tr><td>${esc(c.nome)}</td><td>${c.conti}</td><td style="text-align:right;">${num(c.totale_cent)}</td></tr>`).join('') || '<tr><td colspan="3" class="mini">Nessun conto chiuso in questa giornata.</td></tr>'}</table></div>
      <div class="riquadro"><b>Articoli più venduti</b>
        <table><tr><th>Q.tà</th><th>Articolo</th><th style="text-align:right;">Totale</th></tr>
        ${g.articoli.map((a) => `<tr><td>${a.quantita}</td><td>${esc(a.nome)}</td><td style="text-align:right;">${num(a.totale_cent)}</td></tr>`).join('') || '<tr><td colspan="3" class="mini">Niente venduto.</td></tr>'}</table></div>
      <div class="riquadro"><b>Storni</b> <span class="mini">${g.storni.length ? `${g.storni.length}, per ${num(g.storni_cent)}` : 'nessuno'}</span>
        ${g.storni.length ? `<table><tr><th>Q.tà</th><th>Articolo</th><th>Motivo</th><th>Chi</th><th style="text-align:right;">Valore</th></tr>
        ${g.storni.map((s) => `<tr><td>${s.quantita}</td><td>${esc(s.nome)}</td><td>${esc(s.motivo || '—')}</td><td>${esc(s.da || '—')}</td><td style="text-align:right;">${num(s.totale_cent)}</td></tr>`).join('')}</table>` : ''}</div>`;
    collega();
  };
  const carica = async () => {
    const f = finestra(giorno);
    try {
      const j = await chiama(`?a=giornata&da=${encodeURIComponent(f.da)}&fino=${encodeURIComponent(f.a)}&locale=${encodeURIComponent(locale)}`, {}, FUNZIONE_POS);
      disegna({ ...j.giornata, rimborsi_qr_cent: j.rimborsi_qr_cent || 0 });
    } catch (e) { $('vista').innerHTML = testa(); collega(); $('pgEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('vista').innerHTML = testa() + '<div class="riquadro"><div class="mini">Carico…</div></div>';
  collega();
  carica();
}

/* I listini a fasce (la proprieta', 4 settembre 2026): happy hour, il
   prezzo di sera. Una fascia ha ore, giorni e locale; dentro, uno sconto
   per categoria e/o prezzi scritti apposta articolo per articolo. Le
   regole le applica il server (fasce.ts); qui si scrivono. */
function vistaPosFasce() {
  $('vista').innerHTML = `<div class="riquadro"><div class="esito" id="pfEsito">Carico…</div></div>`;
  let D = null;
  const GIORNI = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
  const nomeArt = (id) => (D.articoli.find((a) => a.id === id) || {}).nome || '';
  const raccogli = () => {
    document.querySelectorAll('[data-fascia]').forEach((b) => {
      const f = D.fasce.find((x) => x.id === b.dataset.fascia); if (!f) return;
      b.querySelectorAll('[data-f]').forEach((el) => {
        const k = el.dataset.f, v = valoreCampo(el);
        if (k === 'sconto_percento') f[k] = v === '' ? null : Math.max(0, Math.min(100, Number(v) || 0));
        else if (k === 'locale') f[k] = v || null;
        else if (k === 'attiva') f[k] = !!v;
        else f[k] = v;
      });
      const giorni = [...b.querySelectorAll('[data-giorno]')].filter((c) => c.checked).map((c) => Number(c.dataset.giorno));
      f.giorni = giorni.length && giorni.length < 7 ? giorni : null;
      const cats = [...b.querySelectorAll('[data-categoria]')].filter((c) => c.checked).map((c) => c.dataset.categoria);
      f.categorie = cats.length ? cats : null;
      b.querySelectorAll('[data-prezzo]').forEach((r) => {
        const p = D.prezzi.find((x) => x.id === r.dataset.prezzo); if (!p) return;
        const a = D.articoli.find((x) => x.nome === valoreCampo(r.querySelector('[data-p="articolo_nome"]')));
        p.articolo = a ? a.id : null;
        p.prezzo_cent = centPos(valoreCampo(r.querySelector('[data-p="prezzo_cent"]')));
      });
    });
  };
  const disegna = () => {
    $('vista').innerHTML = `<div class="riquadro"><div class="mini">Una fascia vale dalle ore «dalle» alle ore «alle» (escluse; anche a cavallo della mezzanotte), nei giorni segnati, nel locale scelto. Dentro la fascia un articolo costa il prezzo scritto apposta qui sotto; se non c’è, il listino meno lo sconto — solo per le categorie segnate (nessuna = tutte). Il palmare la vede entro dieci minuti.</div>
      <div class="due" style="margin-top:8px;"><button type="button" class="azione sec" id="pfNuova" style="width:auto;">+ Fascia</button><button type="button" class="azione" id="pfSalva" style="width:auto;">Salva</button></div>
      <div class="esito" id="pfEsito"></div></div>
      ${D.fasce.map((f) => `<div class="riquadro" data-fascia="${esc(f.id)}">
        <div class="due"><div><label>Nome</label><input data-f="nome" value="${esc(f.nome || '')}" /></div>
          <div><label>Locale</label><select data-f="locale">${opzPos([['', 'Tutti'], ...D.locali.map((l) => [l.id, l.nome])], f.locale || '')}</select></div></div>
        <div class="due"><div><label>Dalle</label><input data-f="dalle" type="time" value="${esc(f.dalle || '')}" /></div><div><label>Alle</label><input data-f="alle" type="time" value="${esc(f.alle || '')}" /></div></div>
        <label>Giorni (nessuno = tutti)</label><div>${GIORNI.map((g, i) => `<label style="display:inline-block;margin-right:10px;"><input type="checkbox" data-giorno="${i}" ${(f.giorni || []).includes(i) ? 'checked' : ''} /> ${g}</label>`).join('')}</div>
        <div class="due"><div><label>Sconto % (vuoto = nessuno)</label><input data-f="sconto_percento" inputmode="numeric" value="${f.sconto_percento ?? ''}" /></div>
          <div><label>Attiva</label><select data-f="attiva">${opzPos([['1', 'Sì'], ['', 'No']], f.attiva ? '1' : '')}</select></div></div>
        <label>Categorie con lo sconto (nessuna = tutte)</label><div>${D.categorie.map((c) => `<label style="display:inline-block;margin-right:10px;"><input type="checkbox" data-categoria="${esc(c.id)}" ${(f.categorie || []).includes(c.id) ? 'checked' : ''} /> ${esc(c.nome)}</label>`).join('')}</div>
        <label>Prezzi scritti apposta</label>
        <table><tr><th>Articolo</th><th>Prezzo in fascia (€)</th><th></th></tr>
        ${D.prezzi.filter((p) => p.fascia === f.id).map((p) => `<tr data-prezzo="${esc(p.id)}"><td><input data-p="articolo_nome" list="pfArticoli" value="${esc(nomeArt(p.articolo))}" style="width:100%;" /></td><td><input data-p="prezzo_cent" inputmode="decimal" value="${euroPos(p.prezzo_cent)}" /></td><td><button type="button" class="azione sec" data-togli-prezzo="${esc(p.id)}" style="width:auto;">Togli</button></td></tr>`).join('')}</table>
        <div class="due" style="margin-top:8px;"><button type="button" class="azione sec" data-nuovo-prezzo="${esc(f.id)}" style="width:auto;">+ Prezzo</button><button type="button" class="azione sec" data-togli-fascia="${esc(f.id)}" style="width:auto;">Togli la fascia</button></div>
      </div>`).join('') || '<div class="riquadro"><div class="mini">Nessuna fascia. «+ Fascia» per farne una.</div></div>'}
      <datalist id="pfArticoli">${D.articoli.map((a) => `<option value="${esc(a.nome)}"></option>`).join('')}</datalist>`;
    $('pfNuova').onclick = () => { raccogli(); D.fasce.push({ id: crypto.randomUUID(), nome: 'Nuova fascia', locale: null, dalle: '17:00', alle: '19:00', giorni: null, sconto_percento: null, categorie: null, attiva: true }); disegna(); };
    document.querySelectorAll('[data-nuovo-prezzo]').forEach((b) => b.onclick = () => { raccogli(); D.prezzi.push({ id: crypto.randomUUID(), fascia: b.dataset.nuovoPrezzo, articolo: null, prezzo_cent: 0 }); disegna(); });
    document.querySelectorAll('[data-togli-prezzo]').forEach((b) => b.onclick = () => { raccogli(); D.prezzi = D.prezzi.filter((p) => p.id !== b.dataset.togliPrezzo); disegna(); });
    document.querySelectorAll('[data-togli-fascia]').forEach((b) => b.onclick = () => {
      if (!confirm('Tolgo questa fascia?')) return;
      raccogli(); D.tolte.push(b.dataset.togliFascia);
      D.fasce = D.fasce.filter((f) => f.id !== b.dataset.togliFascia); D.prezzi = D.prezzi.filter((p) => p.fascia !== b.dataset.togliFascia);
      disegna();
    });
    $('pfSalva').onclick = salva;
  };
  const salva = async () => {
    raccogli();
    if (D.fasce.some((f) => !f.nome || !f.dalle || !f.alle)) return $('pfEsito').innerHTML = '<span class="errore">Ogni fascia vuole nome, dalle e alle.</span>';
    if (D.prezzi.some((p) => !p.articolo)) return $('pfEsito').innerHTML = '<span class="errore">C’è un prezzo senza articolo: scelga l’articolo dall’elenco o lo tolga.</span>';
    $('pfEsito').textContent = 'Salvo…';
    try {
      await chiama('?a=fasce-salva', { method: 'POST', body: JSON.stringify({ fasce: D.fasce, prezzi: D.prezzi, tolte: D.tolte }) }, FUNZIONE_POS);
      D.tolte = [];
      $('pfEsito').textContent = 'Salvato.';
    } catch (e) { $('pfEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  (async () => {
    try {
      const j = await chiama('?a=allinea-giu&da=1970-01-01T00:00:00Z', {}, FUNZIONE_POS);
      D = { fasce: j.fascia || [], prezzi: j.prezzo_fascia || [], categorie: (j.categoria || []).filter((c) => c.attiva), articoli: (j.articolo || []).filter((a) => a.attivo), locali: j.locale || [], tolte: [] };
      disegna();
    } catch (e) { $('pfEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  })();
}

          </body></html>`);

    document.querySelectorAll('[data-nuovo-tav]').forEach((b) => b.onclick = () => { raccogli(); const n = D.tavoli.filter((t) => t.zona === b.dataset.nuovoTav).length + 1; D.tavoli.push({ id: crypto.randomUUID(), zona: b.dataset.nuovoTav, nome: `Tavolo ${n}`, posti: 4, x: 50, y: 50, attivo: true }); disegna(); });
    $('ptSalva').onclick = async () => {
      raccogli();
      $('ptEsito').textContent = 'Salvo…';
      try {
        const pulisci = (r) => { const { aggiornato_il, ...resto } = r; return resto; };
        await chiama('?a=tavoli-salva', { method: 'POST', body: JSON.stringify({ locali: D.locali.map(pulisci), zone: D.zone.map(pulisci), tavoli: D.tavoli.map(pulisci) }) }, FUNZIONE_POS);

      } catch (e) { $('ptEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
    };
  };
  caricaPos().then((d) => { D = d; disegna(); }).catch((e) => { $('ptEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; });
}

function vistaPosPersonale() {
  $('vista').innerHTML = `<div class="riquadro"><div class="esito" id="ppEsito">Carico…</div></div>`;
  let D = null;
  const disegna = () => {
    const ruoli = [['cameriere', 'Cameriere'], ['capo_sala', 'Capo sala'], ['amministrazione', 'Amministrazione']];
    $('vista').innerHTML = `<div class="riquadro"><button type="button" class="azione" id="ppSalva" style="width:auto;">Salva personale e palmari</button><div class="esito" id="ppEsito"></div></div>
      <div class="riquadro"><b>Camerieri</b><div class="mini">Il codice è quello che si digita sul palmare. Con la spunta «senza PIN» basta quello: la pagina risponde solo dall’IP dell’hotel e il palmare ha già il suo codice. Il PIN si scrive qui e non si rilegge: lasciarlo vuoto lo lascia com'è. Storni: il cameriere può stornare da solo una riga già partita. Capo sala e amministrazione possono anche cambiare i prezzi.</div>
        <table><tr><th>Nome</th><th>Codice</th><th>PIN</th><th>Senza PIN</th><th>Ruolo</th><th>Storni</th><th>Bloccato</th></tr>
        ${D.camerieri.map((c) => `<tr data-cam="${esc(c.id)}"><td><input data-k="nome" value="${esc(c.nome)}" /></td><td><input data-k="codice" value="${esc(c.codice)}" style="width:60px;" inputmode="numeric" /></td>
          <td><input data-k="pin" type="password" placeholder="nuovo PIN" style="width:96px;" inputmode="numeric" autocomplete="new-password" data-lpignore="true" data-1p-ignore data-bwignore /></td>
          <td style="text-align:center;"><input type="checkbox" data-k="senza_pin" ${c.senza_pin ? 'checked' : ''}/></td><td><select data-k="ruolo">${opzPos(ruoli, c.ruolo)}</select></td>
          <td><input type="checkbox" data-k="storni" ${c.storni ? 'checked' : ''}/></td><td><input type="checkbox" data-k="bloccato" ${c.bloccato ? 'checked' : ''}/></td></tr>`).join('')}</table>
        <button type="button" class="azione sec mini" id="ppNuovoCam" style="width:auto;margin-top:6px;">+ cameriere</button></div>
      <div class="riquadro"><b>Palmari</b><div class="mini">Ogni palmare ha il suo codice di otto caratteri: sul palmare si apre <b>hoteltermeleonardo.com/pos</b> e lo si scrive una volta sola. Un palmare bloccato non entra più, anche con il PIN giusto. «Nuovo codice» serve se un palmare si perde: il vecchio smette di funzionare al salvataggio.</div>
        <table><tr><th>Palmare</th><th>Locale</th><th>Bloccato</th><th>Ultimo accesso</th><th>Codice</th><th></th></tr>
        ${D.dispositivi.map((d) => `<tr data-disp="${esc(d.id)}"><td><input data-d="nome" value="${esc(d.nome)}" /></td>
          <td><select data-d="locale">${opzPos([['', '—'], ...D.locali.map((l) => [l.id, l.nome])], d.locale || '')}</select></td>
          <td><input type="checkbox" data-d="bloccato" ${d.bloccato ? 'checked' : ''}/></td>
          <td class="mini">${d.ultimo_accesso ? esc(String(d.ultimo_accesso).slice(0, 16).replace('T', ' ')) : '—'}</td>
          <td class="cod" style="font-size:20px;letter-spacing:2px;">${d.token ? esc(d.token) : '<span class="mini">dopo il salvataggio</span>'}</td>
          <td>${d.token ? `<label class="mini"><input type="checkbox" data-d="nuovo_token" /> nuovo codice</label>` : ''}</td></tr>`).join('')}</table>
        <button type="button" class="azione sec mini" id="ppNuovoDisp" style="width:auto;margin-top:6px;">+ palmare</button></div>`;
    const raccogli = () => {
      const camerieri = [...document.querySelectorAll('[data-cam]')].map((r) => { const c = D.camerieri.find((x) => x.id === r.dataset.cam); const out = { id: c.id }; r.querySelectorAll('[data-k]').forEach((el) => { out[el.dataset.k] = valoreCampo(el); }); if (!out.pin) delete out.pin; return out; });
      const dispositivi = [...document.querySelectorAll('[data-disp]')].map((r) => { const out = { id: r.dataset.disp }; r.querySelectorAll('[data-d]').forEach((el) => { out[el.dataset.d] = el.dataset.d === 'locale' ? (el.value || null) : valoreCampo(el); }); return out; });
      return { camerieri, dispositivi };
    };
    $('ppNuovoCam').onclick = () => { const s = raccogli(); D.camerieri = D.camerieri.map((c) => ({ ...c, ...(s.camerieri.find((x) => x.id === c.id) || {}) })); D.camerieri.push({ id: crypto.randomUUID(), nome: '', codice: '', ruolo: 'cameriere', storni: false, bloccato: false, nuovo: true }); disegna(); };
    $('ppNuovoDisp').onclick = () => { D.dispositivi.push({ id: crypto.randomUUID(), nome: 'Palmare', locale: D.locali[0] ? D.locali[0].id : null, bloccato: false, token: null }); disegna(); };
    $('ppSalva').onclick = async () => {
      const s = raccogli();
      const senzaPin = s.camerieri.filter((c) => !c.pin && (D.camerieri.find((x) => x.id === c.id) || {}).nuovo);
      if (senzaPin.length) { $('ppEsito').innerHTML = `<span class="errore">Un cameriere nuovo ha bisogno del PIN: ${esc(senzaPin.map((c) => c.nome || c.codice || '?').join(', '))}</span>`; return; }
      $('ppEsito').textContent = 'Salvo…';
      try {
        await chiama('?a=personale-salva', { method: 'POST', body: JSON.stringify(s) }, FUNZIONE_POS);
        D = await caricaPos(); disegna();
        $('ppEsito').textContent = 'Salvato.';
      } catch (e) { $('ppEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
    };
  };
  caricaPos().then((d) => { D = d; disegna(); }).catch((e) => { $('ppEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; });
}

function vistaDayspaOggi() {
  $('vista').innerHTML = `<div class="riquadro">
    <div class="due">
      <div><label>Giorno</label><input id="dOggiGiorno" type="date" value="${oggiISO()}" /></div>
      <div><label>Codice dal lettore, o numero della prenotazione</label>
        <input id="dOggiCod" placeholder="QR o DS-2026-0001" style="font-family:monospace;text-transform:uppercase;" /></div>
    </div>
    <button class="azione sec" id="dOggiCam" style="margin-top:8px;">Scansiona con la fotocamera</button>
    <video id="dOggiVideo" hidden playsinline muted style="display:block;width:100%;max-width:420px;border-radius:10px;margin-top:8px;background:#000;"></video>
    <div class="esito" id="dOggiScan"></div>
    <div class="esito" id="dOggiRicevute"></div>
    <div class="esito" id="dOggiEsito">Carico\u2026</div>
    <div id="dOggiTab"></div></div>`;

  const carica = async () => {
    $('dOggiEsito').textContent = 'Carico\u2026';
    $('dOggiTab').innerHTML = '';
    try {
      const j = await chiama('?a=oggi&giorno=' + encodeURIComponent($('dOggiGiorno').value), {}, FUNZIONE_DAYSPA);
      const pren = j.prenotazioni || [];
      const fasce = j.fasce || [];
      /* le ricevute che aspettano da piu' di dieci minuti: il PC della
         reception e' spento o la stampante non risponde. Nessuna si perde,
         si accodano; ma va detto in rosso. */
      const inAttesa = pren.filter((p) => p.stato === 'pagata' && p.ricevuta_stato === 'da_battere');
      $('dOggiRicevute').innerHTML = inAttesa.length
        ? `<span class="errore">${inAttesa.length} ricevut${inAttesa.length === 1 ? 'a' : 'e'} da battere (la stampa automatica non \u00e8 ancora attiva: fase 3)</span>`
        : '';
      if (!pren.length) { $('dOggiEsito').textContent = 'Nessuna prenotazione Day Spa per questo giorno.'; return; }
      $('dOggiEsito').textContent = '';
      $('dOggiTab').innerHTML = Object.keys(FASCE_DAYSPA).map((fascia) => {
        const righe = pren.filter((p) => p.fascia === fascia);
        if (!righe.length) return '';
        const f = fasce.find((x) => x.fascia === fascia);
        const presenti = righe.filter((p) => p.stato === 'pagata').reduce((t, p) => t + (p.presenti || 0), 0);
        const attesi = righe.filter((p) => p.stato === 'pagata').reduce((t, p) => t + p.persone, 0);
        return `<div style="margin-top:14px;"><div class="mini" style="padding-bottom:6px;"><b>${esc(FASCE_DAYSPA[fascia])}</b>
            \u00b7 presenti ${presenti} su ${attesi} attesi${f ? ` \u00b7 posti ${f.venduti}/${f.posti}` : ''}</div>
          <table><tr><th>Numero</th><th>Ospite</th><th>Persone</th><th>Presenti</th><th>Stato</th></tr>` +
          righe.map((p) => `<tr>
            <td class="cod">${esc(p.numero)}${p.prova ? '<div class="mini">prova</div>' : ''}</td>
            <td>${esc(p.nome)}<div class="mini">${esc(p.email || '')}${p.telefono ? ' \u00b7 ' + esc(p.telefono) : ''}</div>${p.note ? `<div class="mini errore">${esc(p.note)}</div>` : ''}</td>
            <td>${p.persone} <span class="mini">(${p.adulti} ad.${p.bambini ? ' + ' + p.bambini + ' bamb.' : ''})</span></td>
            <td>${p.stato === 'pagata'
              ? `<input type="number" min="0" max="${p.persone}" value="${p.presenti || 0}" data-numero="${esc(p.numero)}" style="width:64px;display:inline-block;margin:0 6px 0 0;" />
                 <button class="azione sec" data-segna="${esc(p.numero)}">Segna</button>`
              : '\u2014'}</td>
            <td>${esc(STATI_PRENOTAZIONE_DAYSPA[p.stato] || p.stato)}${p.arrivato_il ? `<div class="mini">arrivati ${new Date(p.arrivato_il).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</div>` : ''}
              <div class="mini">ricevuta: ${esc(RICEVUTA_DAYSPA[p.ricevuta_stato] || p.ricevuta_stato || '')}</div></td>
          </tr>`).join('') + '</table></div>';
      }).join('');
      document.querySelectorAll('[data-segna]').forEach((b) => b.onclick = () => {
        const inp = document.querySelector(`input[data-numero="${b.dataset.segna}"]`);
        segna({ numero: b.dataset.segna, presenti: Number(inp.value) });
      });
    } catch (e) { $('dOggiEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };

  /* segna i presenti; senza `presenti` il server mette tutte le persone
     della prenotazione, che e' il caso normale del QR allo sportello */
  const segna = async (corpo) => {
    $('dOggiScan').textContent = 'Un momento\u2026';
    try {
      const j = await chiama('?a=presenti', { method: 'POST', body: JSON.stringify(corpo) }, FUNZIONE_DAYSPA);
      const p = j.prenotazione;
      /* grande e colorato: l'operatore legge da un metro chi e', quanti sono,
         quanti sono entrati, e se il giorno e' quello giusto */
      $('dOggiScan').innerHTML = j.oggi
        ? `<div class="esitoGrande ok">\u2713 ${esc(p.nome)} \u00b7 presenti ${p.presenti} su ${p.persone}
             <small>${esc(FASCE_DAYSPA[p.fascia] || p.fascia)} \u00b7 ${esc(p.numero)}</small></div>`
        : `<div class="esitoGrande no">\u2717 ${esc(p.nome)}: la prenotazione \u00e8 per ${dataIT(p.giorno)}, non per oggi
             <small>presenti segnati ${p.presenti} su ${p.persone} \u00b7 ${esc(p.numero)}</small></div>`;
      if (p.giorno === $('dOggiGiorno').value) carica();
    } catch (e) { $('dOggiScan').innerHTML = `<div class="esitoGrande no">\u2717 ${esc(e.message)}</div>`; }
  };

  /* il lettore 2D della portineria digita il codice e preme Invio, come
     per i buoni (vistaVerifica) */
  $('dOggiCod').onkeydown = (ev) => {
    if (ev.key !== 'Enter') return;
    const v = $('dOggiCod').value.trim().toUpperCase();
    if (!v) return;
    $('dOggiCod').value = '';
    segna(/^DS-\d{4}-\d+$/.test(v) ? { numero: v } : { codice: v });
  };
  /* LA FOTOCAMERA. «Che hardware per obliterare gli ingressi, senza un PC
     sempre aperto sulla schermata?» (la proprieta', 3 settembre 2026): un
     tablet o un telefono, con questa stessa pagina. La fotocamera
     posteriore inquadra il QR sul telefono dell'ospite; dove il browser
     ha BarcodeDetector (Chrome, Android) si usa quello, altrove (Safari su
     iPhone e iPad) si carica jsQR dalla copia locale. Lo schermo resta
     acceso finche' la fotocamera e' aperta. Lo stesso codice letto due
     volte di seguito si segna una volta sola. */
  let flusso = null, blocco = null, fermo = true;
  const chiudiCam = async () => {
    fermo = true;
    if (flusso) { flusso.getTracks().forEach((t) => t.stop()); flusso = null; }
    if (blocco) { try { await blocco.release(); } catch (e) { /* gia' rilasciato */ } blocco = null; }
    const v = $('dOggiVideo');
    if (v) { v.hidden = true; v.srcObject = null; }
    const b = $('dOggiCam');
    if (b) b.textContent = 'Scansiona con la fotocamera';
  };
  const apriCam = async () => {
    if (!fermo) { chiudiCam(); return; }
    const video = $('dOggiVideo');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('dOggiScan').innerHTML = '<span class="errore">Questo browser non da accesso alla fotocamera.</span>';
      return;
    }
    try {
      flusso = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (e) {
      $('dOggiScan').innerHTML = `<span class="errore">Fotocamera non disponibile: ${esc(e.message)}</span>`;
      return;
    }
    video.srcObject = flusso;
    video.hidden = false;
    await video.play();
    fermo = false;
    $('dOggiCam').textContent = 'Ferma la fotocamera';
    try { if (navigator.wakeLock) blocco = await navigator.wakeLock.request('screen'); } catch (e) { /* senza, lo schermo si spegne come sempre */ }
    let leggi;
    if ('BarcodeDetector' in window) {
      const rilevatore = new window.BarcodeDetector({ formats: ['qr_code'] });
      leggi = async () => { const r = await rilevatore.detect(video); return r.length ? String(r[0].rawValue || '') : ''; };
    } else {
      if (!window.jsQR) {
        await new Promise((ok, ko) => {
          const sc = document.createElement('script');
          sc.src = '/comune/jsqr.js'; sc.onload = ok; sc.onerror = ko;
          document.head.appendChild(sc);
        });
      }
      const tela = document.createElement('canvas');
      const ctx = tela.getContext('2d', { willReadFrequently: true });
      leggi = async () => {
        if (!video.videoWidth) return '';
        tela.width = video.videoWidth; tela.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, tela.width, tela.height);
        const r = window.jsQR(img.data, img.width, img.height);
        return r ? String(r.data || '') : '';
      };
    }
    let ultimo = '', ultimoQuando = 0;
    const giro = async () => {
      if (fermo) return;
      try {
        const testo = (await leggi()).trim().toUpperCase();
        if (testo && (testo !== ultimo || Date.now() - ultimoQuando > 4000)) {
          ultimo = testo; ultimoQuando = Date.now();
          if (navigator.vibrate) navigator.vibrate(80);
          segna(/^DS-\d{4}-\d+$/.test(testo) ? { numero: testo } : { codice: testo });
        }
      } catch (e) { /* un fotogramma perso non e' un errore */ }
      setTimeout(giro, 250);
    };
    giro();
  };
  $('dOggiCam').onclick = apriCam;
  /* cambiando scheda la fotocamera si spegne: il pulsante sparisce con la vista */
  const osserva = new MutationObserver(() => { if (!document.body.contains($('dOggiCam'))) { chiudiCam(); osserva.disconnect(); } });
  osserva.observe($('vista'), { childList: true });
  $('dOggiGiorno').onchange = carica;
  carica();
  /* il fuoco al campo appena si apre la scheda: chi scansiona non deve
     prima cliccarci dentro */
  $('dOggiCod').focus();
}

function vistaDayspaDisponibilita() {
  $('vista').innerHTML = `<div class="riquadro">
    <div class="mini" style="padding-bottom:10px;">I posti in vendita, giorno per giorno: come in Fidra, ma qui. Tipo e prezzo li propone
      la regola (sabato prefestivo, domenica e feste festivo): si possono correggere sul singolo giorno.
      Una riga senza posti non \u00e8 in vendita.</div>
    <div class="due">
      <div><label>Dal giorno</label><input id="dDispDa" type="date" value="${oggiISO()}" /></div>
      <div style="align-self:end;"><button id="dDispVai" class="primario">Guarda due settimane</button>
        <button id="dDispFidra" class="azione sec" title="Legge i posti come li ha caricati in Fidra e riempie le righe: poi Salva">Prendi da Fidra</button></div>
    </div>
    <div class="esito" id="dDispEsito">Carico\u2026</div>
    <div id="dDispTab"></div>
    <button class="azione" id="dDispSalva" style="margin-top:12px;" disabled>Salva</button>
    <div class="esito" id="dDispEsito2"></div></div>`;

  const carica = async () => {
    $('dDispEsito').textContent = 'Carico\u2026';
    $('dDispTab').innerHTML = '';
    $('dDispSalva').disabled = true;
    const da = $('dDispDa').value;
    try {
      const j = await chiama(`?a=disponibilita&da=${encodeURIComponent(da)}&fino=${encodeURIComponent(giornoDopoDayspa(da, 13))}`, {}, FUNZIONE_DAYSPA);
      const giorni = j.giorni || [];
      $('dDispEsito').textContent = '';
      $('dDispTab').innerHTML = `<table><tr><th>Giorno</th><th>Fascia</th><th>Tipo</th><th>Posti</th><th>Prezzo \u20ac</th><th>Venduti</th></tr>` +
        giorni.map((g) => g.fasce.map((f, i) => `<tr${g.chiuso ? ' style="opacity:.5"' : ''}>
          ${i === 0 ? `<td rowspan="${g.fasce.length}"><b>${esc(giornoIT(g.giorno))}</b><div class="mini">${esc(g.giorno)}${g.chiuso ? ' \u00b7 chiusi' : ''}</div></td>` : ''}
          <td>${esc(FASCE_DAYSPA[f.fascia] || f.fascia)}</td>
          <td><select data-campo="tipo" data-giorno="${g.giorno}" data-fascia="${f.fascia}" style="width:auto;margin:0;">
            ${TIPI_DAYSPA.map((t) => `<option value="${t}"${(f.tipo || g.tipoProposto) === t ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
          <td><input type="number" min="0" max="500" data-campo="posti" data-giorno="${g.giorno}" data-fascia="${f.fascia}" value="${f.caricata ? f.posti : ''}" placeholder="\u2014" style="width:80px;margin:0;"${g.chiuso ? ' disabled' : ''} /></td>
          <td><input type="number" min="1" step="1" data-campo="prezzo" data-giorno="${g.giorno}" data-fascia="${f.fascia}" value="${Math.round(f.prezzo_cent / 100)}" style="width:80px;margin:0;"${g.chiuso ? ' disabled' : ''} /></td>
          <td class="mini">${f.venduti}${f.caricata ? '' : ' <span class="mini">(non in vendita)</span>'}</td>
        </tr>`).join('')).join('') + '</table>';
      $('dDispSalva').disabled = false;
      document.querySelectorAll('#dDispTab input, #dDispTab select').forEach((el) => el.oninput = () => { el.dataset.toccato = '1'; });
    } catch (e) { $('dDispEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };

  /* si salvano SOLO le righe toccate, e solo se hanno i posti: caricare
     tutto ogni volta riscriverebbe righe che nessuno ha guardato */
  const salva = async () => {
    const righe = [];
    const toccate = new Set();
    document.querySelectorAll('#dDispTab [data-toccato]').forEach((el) => toccate.add(el.dataset.giorno + '|' + el.dataset.fascia));
    for (const chiave of toccate) {
      const [giorno, fascia] = chiave.split('|');
      const q = (campo) => document.querySelector(`#dDispTab [data-campo="${campo}"][data-giorno="${giorno}"][data-fascia="${fascia}"]`);
      const posti = q('posti').value;
      if (posti === '') continue;
      righe.push({ giorno, fascia, tipo: q('tipo').value, posti: Number(posti), prezzo_cent: Math.round(Number(q('prezzo').value) * 100) });
    }
    if (!righe.length) { $('dDispEsito2').textContent = 'Niente da salvare: nessuna riga toccata con i posti.'; return; }
    $('dDispEsito2').textContent = 'Salvo\u2026';
    try {
      const j = await chiama('?a=disponibilita', { method: 'POST', body: JSON.stringify({ righe }) }, FUNZIONE_DAYSPA);
      $('dDispEsito2').innerHTML = `<span class="fatto">\u2713 ${j.salvate} righe salvate.</span>`;
      carica();
    } catch (e) { $('dDispEsito2').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  /* i posti come stanno in Fidra: riempie le righe (posti = liberi in
     Fidra + venduti da noi, tipo e prezzo di Fidra) e le segna toccate,
     cosi' Salva le manda. Nessun salvataggio automatico: la reception
     guarda e conferma. */
  const daFidra = async () => {
    $('dDispEsito2').textContent = 'Leggo da Fidra\u2026';
    const da = $('dDispDa').value;
    try {
      const j = await chiama(`?a=fidra&da=${encodeURIComponent(da)}&fino=${encodeURIComponent(giornoDopoDayspa(da, 13))}`, {}, FUNZIONE_DAYSPA);
      let n = 0;
      for (const r of j.righe || []) {
        const q = (campo) => document.querySelector(`#dDispTab [data-campo="${campo}"][data-giorno="${r.giorno}"][data-fascia="${r.fascia}"]`);
        if (!q('posti') || q('posti').disabled) continue;
        q('posti').value = r.posti; q('posti').dataset.toccato = '1';
        q('tipo').value = r.tipo; q('tipo').dataset.toccato = '1';
        q('prezzo').value = Math.round(r.prezzo_cent / 100); q('prezzo').dataset.toccato = '1';
        q('posti').title = `liberi in Fidra: ${r.liberiFidra}`;
        n++;
      }
      $('dDispEsito2').innerHTML = n
        ? `<span class="fatto">\u2713 ${n} righe lette da Fidra: le controlli e prema Salva.</span>`
        : 'Fidra non ha posti caricati per questi giorni.';
    } catch (e) { $('dDispEsito2').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('dDispVai').onclick = carica;
  $('dDispFidra').onclick = daFidra;
  $('dDispSalva').onclick = salva;
  carica();
}

function vistaDayspaPrenotazioni() {
  const oggi = oggiISO();
  $('vista').innerHTML = `<div class="riquadro">
    <div class="due">
      <div><label>Cerca (nome, email, numero, codice)</label><input id="dPrenCerca" /></div>
      <div><label>Dal giorno</label><input id="dPrenDa" type="date" value="${oggi}" /></div>
      <div><label>Al giorno</label><input id="dPrenFino" type="date" value="${giornoDopoDayspa(oggi, 60)}" /></div>
      <div style="align-self:end;"><button id="dPrenVai" class="primario">Cerca</button></div>
    </div>
    <div class="esito" id="dPrenEsito">Carico\u2026</div>
    <div id="dPrenTab"></div></div>`;

  const carica = async () => {
    $('dPrenEsito').textContent = 'Carico\u2026';
    $('dPrenTab').innerHTML = '';
    try {
      const qs = `?a=elenco&cerca=${encodeURIComponent($('dPrenCerca').value.trim())}&da=${encodeURIComponent($('dPrenDa').value)}&fino=${encodeURIComponent($('dPrenFino').value)}`;
      const j = await chiama(qs, {}, FUNZIONE_DAYSPA);
      const pren = j.prenotazioni || [];
      $('dPrenEsito').textContent = pren.length ? `${pren.length} prenotazion${pren.length === 1 ? 'e' : 'i'}` : 'Nessuna prenotazione.';
      if (!pren.length) return;
      $('dPrenTab').innerHTML = `<table><tr><th>Numero</th><th>Giorno</th><th>Ospite</th><th>Persone</th><th>Importo</th><th>Stato</th><th>Ricevuta</th><th></th></tr>` +
        pren.map((p) => `<tr>
          <td class="cod">${esc(p.numero)}${p.prova ? '<div class="mini">prova</div>' : ''}<div class="mini">${esc(p.codice)}</div></td>
          <td>${dataIT(p.giorno)}<div class="mini">${esc(FASCE_DAYSPA[p.fascia] || p.fascia)}</div></td>
          <td>${esc(p.nome)}<div class="mini">${esc(p.email || '')}${p.telefono ? ' \u00b7 ' + esc(p.telefono) : ''} \u00b7 ${esc(p.lingua)}</div></td>
          <td>${p.persone}${p.presenti ? ` <span class="mini">(presenti ${p.presenti})</span>` : ''}</td>
          <td>${eur(p.importo_cent / 100)} \u20ac</td>
          <td>${esc(STATI_PRENOTAZIONE_DAYSPA[p.stato] || p.stato)}${p.note ? `<div class="mini errore">${esc(p.note)}</div>` : ''}</td>
          <td class="mini">${esc(RICEVUTA_DAYSPA[p.ricevuta_stato] || p.ricevuta_stato || '')}${p.ricevuta_numero ? ' ' + esc(p.ricevuta_numero) : ''}</td>
          <td>${p.stato === 'pagata' && puoRimborsareDayspa(EMAIL)
            ? `<button class="azione sec" data-rimborsa="${esc(p.numero)}" data-importo="${p.importo_cent}" style="border-color:var(--allarme);color:var(--allarme);">Annulla e rimborsa</button>`
            : ''}</td>
        </tr>`).join('') + '</table>';
      /* uno strumento nostro, non un diritto dell'ospite: l'ingresso pagato
         non si rimborsa (proprieta', 3 settembre 2026). Serve quando siamo
         noi a non poter dare il servizio. */
      document.querySelectorAll('[data-rimborsa]').forEach((b) => b.onclick = async () => {
        const numero = b.dataset.rimborsa;
        const motivo = prompt(`Annullare la prenotazione ${numero} e rimborsare ${eur(Number(b.dataset.importo) / 100)} \u20ac?\n\nL'ingresso pagato non si rimborsa all'ospite: questo serve solo se siamo NOI a non poter dare il servizio. Scriva il motivo:`);
        if (motivo === null) return;
        if (!confirm(`Confermo il rimborso di ${numero}. L'operazione NON si pu\u00f2 annullare.`)) return;
        b.disabled = true;
        try {
          await chiama('?a=rimborsa', { method: 'POST', body: JSON.stringify({ numero, motivo }) }, FUNZIONE_DAYSPA);
          carica();
        } catch (e) { $('dPrenEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; b.disabled = false; }
      });
    } catch (e) { $('dPrenEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('dPrenVai').onclick = carica;
  $('dPrenCerca').onkeydown = (ev) => { if (ev.key === 'Enter') carica(); };
  carica();
}

(async () => {
  try {
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  } catch (e) {
    $('app').innerHTML = '<div class="riquadro">Non riesco a caricare il sistema di accesso. Ricarichi la pagina.</div>';
    return;
  }
  /* sessione già aperta su questo computer? */
  const { data } = await SB.auth.getSession();
  if (data?.session) {
    TOKEN = data.session.access_token;
    OPERATORE = data.session.user.user_metadata?.nome || data.session.user.email.split('@')[0];
    /* L'INDIRIZZO ANCHE QUI. Questa strada non passa dall'accesso, e senza
       queste due righe EMAIL restava vuoto: ordine delle schede e scheda
       d'apertura tornavano quelli di default per chiunque avesse la
       sessione gia' aperta — cioe' per la reception, sempre. Visto in
       reception il 3 settembre 2026: intestazione nuova, ordine vecchio. */
    EMAIL = data.session.user.email || '';
    VISTA = schedaDaUrl() || schedaIniziale(EMAIL);
    try { await chiama('?a=elenco'); disegna(); return; }
    catch (e) { await esci(); chiediAccesso(e.message); return; }
  }
  chiediAccesso('');
})();
