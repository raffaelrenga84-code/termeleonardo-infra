/* ---------- il buono scritto, per gli appunti ----------
   L'unica resa del buono rimasta nella pagina, e non e' un disegno: e' il
   testo che il pulsante "Copia" mette negli appunti, col link al PDF in
   coda. Il buono da guardare e da stampare e' il PDF del server. */

function buonoTesto(b) {
  const L = ['it','de','en','fr'].includes(b.lingua) ? b.lingua : 'it';
  const e = ETI[L];
  /* categoriaBuono guarda solo la prima voce, e con due voci il Day Spa
     puo' essere la seconda. Prima qui c'era COMPRENDE[categoriaBuono(b)] e
     la copia negli appunti ometteva l'elenco delle piscine che le altre
     rese del buono mostravano. */
  const catComprende = /day spa/i.test(String(b.descrizione || '')) ? 'dayspa' : categoriaBuono(b);
  return `${e.titolo.toUpperCase()} \u2014 Hotel Terme Leonardo\n` +
    (b.destinatario ? e.haRicevuto(b.destinatario).replace(/<br \/>/g, ' ') + '\n' : '') +
    (b.dedica ? `"${b.dedica}"\n` : '') +
    (b.acquirente ? `${e.da.charAt(0) + e.da.slice(1).toLowerCase()} ${b.acquirente}\n` : '') +
    `\n${b.descrizione}${b.sottotitolo ? '\n' + b.sottotitolo : ''}\n` +
    (((COMPRENDE[catComprende] || {})[L] || []).map(x => '\u00b7 ' + x).join('\n') || '') +
    `\n${e.nota}\n` +
    `\n${e.codice}: ${b.codice || '\u2014'}\n${e.valido(dataLingua(b.scade_il, L))}\n\n` +
    `+39 049 9939200 \u00b7 info@termeleonardo.com\n\n${CONDIZIONI[L] || CONDIZIONI.it}`;
}

/* ---------- 2. elenco ---------- */
/* Un buono pagato che non e' mai arrivato al cliente. `consegna` vale
   'inviato', 'fallito' o 'senza-indirizzo'; i buoni emessi prima di questa
   modifica non ce l'hanno, e per quelli si tace invece di allarmare a
   vuoto — non sappiamo com'e' andata. */
function nonConsegnato(b) {
  if (b.stato !== 'pagato') return false;
  /* invio tentato e fallito: sempre un problema */
  if (b.consegna === 'fallito') return true;
  /* nessun indirizzo e' normale per un buono emesso al banco e stampato,
     ma non per uno comprato online: quello un indirizzo ce l'aveva */
  return b.consegna === 'senza-indirizzo' && b.creato_da === 'sito';
}

/* L'elenco si rilegge da solo ogni mezzo minuto, finche' non c'e' un
   buono aperto sotto: una riscossione al totem si vede senza ricaricare
   («non si aggiorna la pagina del backend», la proprieta', 5 settembre
   2026). Un solo orologio: cambiando scheda si ferma. */
let orologioElenco = null;
async function vistaElenco() {
  clearInterval(orologioElenco);
  $('vista').innerHTML = `<div class="riquadro">
    <div class="due">
      <div><label>Cerca (codice, acquirente, destinatario, email)</label><input type="text" id="eCerca" /></div>
      <div><label>Stato</label><select id="eStato">
        <option value="">Tutti</option><option value="attesa">In attesa di pagamento</option>
        <option value="pagato">Pagati (spendibili)</option>
        <option value="riscosso">Riscossi</option><option value="annullato">Annullati</option>
      </select></div>
    </div>
    <div class="esito" id="eEsito">Carico\u2026</div>
    <div class="mini" style="padding-bottom:6px;">Clicca un buono per vederne i dati,
      l\u2019anteprima e rimandarlo a chi non l\u2019ha ricevuto.</div>
    <div id="eTab"></div></div>
    <div id="eDettaglio"></div>`;
  let CARICATI = [];
  orologioElenco = setInterval(() => {
    if (!$('eTab') || !$('eDettaglio')) { clearInterval(orologioElenco); return; }
    if (document.visibilityState !== 'visible' || $('eDettaglio').innerHTML) return;
    carica().catch(() => {});
  }, 30000);
  const carica = async () => {
    $('eEsito').textContent = 'Carico\u2026';
    $('eDettaglio').innerHTML = '';
    try {
      const j = await chiama(`?a=elenco&stato=${encodeURIComponent($('eStato').value)}&cerca=${encodeURIComponent($('eCerca').value)}`);
      const oggi = new Date().toISOString().slice(0, 10);
      CARICATI = j.buoni;
      $('eEsito').textContent = j.buoni.length ? `${j.buoni.length} buoni` : 'Nessun buono.';
      $('eTab').innerHTML = j.buoni.length ? `<table>
        <tr><th>Numero</th><th>Codice</th><th>Cosa</th><th>Valore</th><th>Stato</th><th>Chi</th></tr>` +
        j.buoni.map(b => {
          const st = (b.stato === 'pagato' && b.scade_il && b.scade_il < oggi) ? 'scaduto' : b.stato;
          return `<tr class="apribile" data-numero="${esc(b.numero || '')}"><td class="cod">${esc(b.numero || '')}</td>
            <td class="cod">${b.codice ? esc(b.codice) : '<span class="mini">non ancora emesso</span>'}</td>
            <td><div style="white-space:pre-line;">${esc(b.descrizione)}</div>
              ${Array.isArray(b.voci) && b.voci.length > 1 ? `<span class="piu-voci">${b.voci.length} voci</span>` : ''}
              ${b.dedica ? `<div class="mini">&laquo;${esc(b.dedica)}&raquo;</div>` : ''}</td>
            <td>${eur(b.valore)} &euro;<div class="mini">${b.pagamento === 'promozionale'
              ? '<span class="omaggio">promozionale</span>' : esc(b.pagamento || '')}</div></td>
            <td><span class="stato st-${st}">${st}</span>${b.scade_il ? `<div class="mini">${dataIT(b.scade_il)}</div>` : ''}
              ${nonConsegnato(b) ? '<div class="nonconsegnato">NON CONSEGNATO</div>' : ''}</td>
            <td class="mini">${esc(b.acquirente || '')}${b.destinatario ? ' \u2192 ' + esc(b.destinatario) : ''}
            <div>${esc(b.creato_da || '?')}</div></td></tr>`;
        }).join('') + `</table>` : '';
      /* aprire un buono serve soprattutto a rimandarlo: il cliente che
         telefona perche' non l'ha ricevuto e' il caso piu' frequente */
      for (const tr of $('eTab').querySelectorAll('tr.apribile')) {
        tr.onclick = () => {
          const b = CARICATI.find(x => x.numero === tr.dataset.numero);
          if (!b) return;
          mostraFatto(b, 'eDettaglio');
          $('eDettaglio').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      }
    } catch (e) { $('eEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('eCerca').oninput = () => { clearTimeout(window.__t); window.__t = setTimeout(carica, 400); };
  $('eStato').onchange = carica;
  carica();
}

/* ---------- 4. richieste di preventivo dal sito ----------
   Finche' Resend non e' configurato queste richieste non arrivano per
   email: questo elenco e' l'unico posto dove si vedono. Per questo si apre
   sulle "da guardare" invece che su tutte. */
const STATI_RICHIESTA = {
  nuova: 'da guardare', vista: 'vista', risposta: 'risposta data', chiusa: 'chiusa',
};

function quandoIT(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const due = (n) => String(n).padStart(2, '0');
  return `${due(d.getDate())}/${due(d.getMonth() + 1)} ${due(d.getHours())}:${due(d.getMinutes())}`;
}

const LINGUA_NOME = { it: 'Italiano', de: 'Tedesco', en: 'Inglese', fr: 'Francese' };

/* Cerca un'etichetta in una mappa e, se non c'e', restituisce il valore
   grezzo. Object.hasOwn e non `MAPPA[chiave] || chiave`: la chiave arriva da
   una colonna del database, e un oggetto non risponde `undefined` solo alle
   chiavi che non ha — risponde con quello che eredita da Object.prototype.
   Con `stato` uguale a "toString" il `||` non scatterebbe mai e in tabella
   comparirebbe il codice sorgente di una funzione al posto dello stato.
   Oggi nessuno scrive quei valori in quelle colonne, quindi non e' un buco
   aperto: e' che la stessa riga sbagliata, altrove in questo progetto,
   lasciava passare un circolo di golf inesistente. Si chiude la forma. */
function etichetta(mappa, chiave) {
  return Object.hasOwn(mappa, chiave) ? mappa[chiave] : (chiave || '');
}

/* vociATAM e riepilogoATAM stanno in /comune/atam.js: e' la parte che vale
   la pena provare da sola, e da qui si passa solo il modo di scrivere una
   data. Il blocco a una voce sola che stava qui prometteva un incollaggio
   che il modulo dei tassisti non poteva accettare — vedi il commento in
   testa a quel file, e atam.test.ts. */

/* Stessi tre circoli di CIRCOLI_GOLF in luoghi.ts: qui serve solo la chiave
   (quella che tipi.ts controlla con Object.hasOwn) e il nome da mostrare —
   nome esteso, luogo del taxi e le altre derivazioni le ricalcola il
   server da solo (validaGreenfee), non vanno duplicate qui. */
const CIRCOLI_GOLF_NOMI = {
  padova: 'Golf Club Padova',
  montecchia: 'Golf della Montecchia',
  frassanelle: 'Golf Club Frassanelle',
};

/* «aveva chiesto: mattina» accanto al campo che la reception ha gia'
   corretto. `differenze` arriva gia' calcolata dal server (differenze.ts,
   confronto sui VALORI, non sugli oggetti) dentro ogni riga di ?a=elenco:
   qui si legge un'etichetta gia' pronta, non si ricalcola niente. Le
   stringhe qui sotto (in ETICHETTE_CAMPO_PER_TIPO e nelle chiamate ad
   avevaChiesto) sono le stesse che etichettaCampo() in differenze.ts
   genera per ogni chiave — non un calcolo duplicato, sono comunque il
   testo delle etichette che questo modulo dei campi deve scrivere. */
function avevaChiesto(r, etichettaCampo) {
  const d = Array.isArray(r.differenze) ? r.differenze.find((x) => x.campo === etichettaCampo) : null;
  return d ? `<div class="nota-prima">aveva chiesto: ${esc(d.prima || '—')}</div>` : '';
}

/* Le etichette che ogni tipo mostra gia' come campo modificabile (le stesse
   passate ad avevaChiesto qui sotto): serve a boxAltreDifferenze per capire
   quali differenze sono gia' visibili accanto a un campo e quali resterebbero
   altrimenti invisibili — es. i noleggi del green fee (golfcar, carrello…),
   che tipi.ts accetta ma questa scheda non offre in un campo dedicato.
   Object.hasOwn e non ETICHETTE_CAMPO_PER_TIPO[r.tipo]: `tipo` arriva dal
   database. */
const ETICHETTE_CAMPO_PER_TIPO = {
  transfer: ['Data', 'Ora', 'Passeggeri', 'Arrivo o partenza', 'Luogo', 'Volo', 'Ritorno incluso', 'Note'],
  greenfee: ['Circolo', 'Data', 'Ora', 'Giocatori', 'Percorso', 'Tessera', 'Taxi al campo', 'Ora del taxi', 'Note'],
  maestro: ['Data', 'Ora', 'Persone', 'Livello', 'Note'],
  trattamenti: ['Trattamenti scelti', 'Giorno', 'Fascia oraria', 'Note'],
  arrivo: ['Persone da aggiungere confermate'],
};

function differenzeNonMostrate(r) {
  const coperte = Object.hasOwn(ETICHETTE_CAMPO_PER_TIPO, r.tipo) ? ETICHETTE_CAMPO_PER_TIPO[r.tipo] : [];
  return Array.isArray(r.differenze) ? r.differenze.filter((d) => !coperte.includes(d.campo)) : [];
}

/* Una riga in coda ai campi, solo se c'e' una differenza che nessun campo
   qui sopra ha gia' mostrato: cosi' nessuna correzione gia' fatta resta
   invisibile, anche per un campo che questa scheda non rende modificabile. */
function boxAltreDifferenze(r) {
  const extra = differenzeNonMostrate(r);
  if (!extra.length) return '';
  return `<div class="mini" style="margin-top:10px;padding-top:10px;border-top:1px solid #F0EBE1;">
    Altro gia' cambiato rispetto alla richiesta originale: ${extra.map((d) =>
      `${esc(d.campo)} (aveva chiesto: ${esc(d.prima || '—')})`).join(' · ')}</div>`;
}

/* ---- i campi modificabili, uno schema per tipo ----
   Le chiavi qui sotto rispecchiano tipi.ts (validaTransfer, validaGreenfee,
   validaMaestro, validaTrattamenti): e' quel modulo a rivalidare quello che
   si rimanda con ?a=conferma, qui si costruisce solo il modulo che lo
   raccoglie. I campi che un tipo non espone qui (es. golfcar del green fee)
   restano quelli che c'erano: vedi lo spread di r.dati in datiCorretti(). */
/* Una riga della tabella per il modulo dei tassisti: etichetta, valore e il
   pulsante che copia il VALORE e basta. Serve all'andata e al ritorno, che
   hanno la stessa tabella. */
function rigaAtam(v) {
  return `<tr>
        <th>${esc(v.eti)}</th>
        <td>${esc(v.val)}</td>
        <td>${v.soloDaLeggere || !v.val ? ''
          : `<button type="button" class="copiaVoce" data-val="${esc(v.val)}">Copia</button>`}</td>
      </tr>`;
}

function campiTransfer(r) {
  const d = r.dati || {};
  const opzLuogo = LUOGHI_ATAM.map((l) =>
    `<option value="${esc(l)}" ${d.luogo === l ? 'selected' : ''}>${esc(l)}</option>`).join('');
  /* ============================================================
     ANDATA E RITORNO, IN DUE BLOCCHI SEPARATI.
     ------------------------------------------------------------
     «Suddividi visualmente meglio l'andata dal ritorno: ci sono molte
     informazioni ed e' facile sbagliare.» Aveva ragione, e il difetto era
     peggio di un problema di spaziatura: i campi erano MESCOLATI. Il
     «Servizio» dell'andata stava sotto «Servizio del ritorno», e le due
     tendine, identiche parola per parola, si leggevano una accanto
     all'altra senza niente che dicesse a quale corsa appartenessero.

     Sbagliarle non da' nessun errore: manda un'auto privata dove serviva
     la navetta, e lo si scopre in aeroporto.

     Ora ogni blocco tiene TUTTI i campi della sua corsa, con
     un'intestazione e un filetto a sinistra. Il ritorno compare solo se
     serve: un blocco vuoto e' un blocco che si compila per sbaglio.
     ============================================================ */
  const servizio = (id, scelto, eti) => `<div><label>${eti}</label><select id="${id}">
        <option value="no" ${scelto ? '' : 'selected'}>Auto privata (individuale)</option>
        <option value="si" ${scelto ? 'selected' : ''}>Navetta condivisa (collettivo)</option>
      </select>`;
  const titolo = (t) => `<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:#1E7F88;font-weight:700;padding-bottom:8px;">${t}</div>`;
  const blocco = (t, dentro, colore) => `<div style="margin-top:14px;padding:12px 0 12px 14px;
    border-left:3px solid ${colore};">${titolo(t)}${dentro}</div>`;

  const andata = `<div class="due">
      <div><label>Giorno</label><input type="date" id="cQuando" value="${esc(d.quando || '')}" />${avevaChiesto(r, 'Data')}</div>
      <div><label>Ora</label><input type="time" id="cOra" value="${esc(d.ora || '')}" />${avevaChiesto(r, 'Ora')}</div>
    </div>
    <!-- L'ora del VOLO, quando la navetta parte tre ore prima: «Ora» qui
         sopra e' gia' l'ora del RITIRO in hotel, che e' quello che chiede il
         modulo dei tassisti. Questa e' il dato da cui quel conto nasce. -->
    ${d.ora_volo ? `<div class="mini">Ora del volo dichiarata dall'ospite:
      <strong>${esc(d.ora_volo)}</strong> — il ritiro qui sopra e' tre ore prima.</div>` : ''}
    <div class="due">
      <div><label>Passeggeri</label><input type="number" id="cPax" min="1" max="8" value="${esc(d.pax || 2)}" />${avevaChiesto(r, 'Passeggeri')}</div>
      <div><label>Arrivo o partenza</label><select id="cVerso">
        <option value="arrivo" ${d.verso === 'arrivo' ? 'selected' : ''}>Arrivo</option>
        <option value="partenza" ${d.verso === 'partenza' ? 'selected' : ''}>Partenza</option>
      </select>${avevaChiesto(r, 'Arrivo o partenza')}</div>
    </div>
    <label>Luogo (deve combaciare con l’elenco ATAM)</label>
    <select id="cLuogo"><option value="">—</option>${opzLuogo}</select>
    ${avevaChiesto(r, 'Luogo')}
    <div class="due">
      <div><label>Volo / treno</label><input type="text" id="cVolo" value="${esc(d.volo || '')}" />${avevaChiesto(r, 'Volo')}</div>
      ${servizio('cCollettivo', d.collettivo, 'Servizio')}${avevaChiesto(r, 'Servizio')}</div>
    </div>`;

  /* il servizio del ritorno e' SUO: alle 22:00 la navetta non e' in
     servizio, quindi un ritorno puo' essere privato anche quando l'andata
     era condivisa */
  const ritorno = `<div class="due">
      <div><label>Giorno del ritorno</label>
        <input type="date" id="cRitornoQuando" value="${esc(d.ritorno_quando || '')}" />${avevaChiesto(r, 'Giorno del ritorno')}</div>
      <div><label>Ora del ritorno</label>
        <input type="time" id="cRitornoOra" value="${esc(d.ritorno_ora || '')}" />${avevaChiesto(r, 'Ora del ritorno')}</div>
    </div>
    ${d.ritorno_ora_volo ? `<div class="mini">Ora del volo dichiarata dall'ospite:
      <strong>${esc(d.ritorno_ora_volo)}</strong> — il ritiro qui sopra e' tre ore prima.</div>` : ''}
    <div class="due">
      <div><label>Volo / treno del ritorno</label>
        <input type="text" id="cRitornoVolo" value="${esc(d.ritorno_volo || '')}" />${avevaChiesto(r, 'Volo del ritorno')}</div>
      ${servizio('cRitornoCollettivo', d.ritorno_collettivo, 'Servizio del ritorno')}${avevaChiesto(r, 'Servizio del ritorno')}</div>
    </div>`;

  return `${blocco('Andata', andata, '#1E7F88')}
    <div style="margin-top:12px;">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;">
        <input type="checkbox" id="cRitorno" ${d.ritorno ? 'checked' : ''}
          style="width:auto;margin:0;" /> serve anche il ritorno</label>${avevaChiesto(r, 'Ritorno incluso')}
    </div>
    <!-- IL RITORNO E' UNA SECONDA CORSA: sul modulo dei tassisti si prenota
         a parte, e qui si compila a parte. Nascosto quando non serve. -->
    <div id="cBoxRitorno" style="display:${d.ritorno ? 'block' : 'none'};">
      ${blocco('Ritorno · seconda corsa, verso opposto', ritorno, '#7A8450')}
    </div>
    <div class="due" style="margin-top:14px;">
      <!-- IL PREZZO. Prima si scriveva a mano dentro il messaggio libero, e
           chi se ne dimenticava mandava una conferma senza cifra. Qui arriva
           gia' proposto dal listino, e chi conferma lo guarda: e' quella
           occhiata a renderlo onesto. Dove il listino tace resta vuoto —
           una cifra inventata dal sistema si legge come verificata. -->
      <div><label>Prezzo da confermare (€)</label>
        <input type="number" id="cPrezzo" step="0.01" min="0"
          value="${d.prezzo_cent != null ? (d.prezzo_cent / 100).toFixed(2) : ''}" />
        <div class="mini" id="cPrezzoNota"></div>${avevaChiesto(r, 'Prezzo')}</div>
      <div></div>
    </div>
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

/* La proposta del listino, ricalcolata dai campi come stanno adesso: se
   l'operatore cambia meta, passeggeri, servizio o ritorno, la cifra
   proposta cambia con loro.

   Il campo si aggiorna da solo SOLO se contiene ancora quello che avevamo
   proposto noi: se l'operatore ha scritto una cifra sua, non si tocca. E'
   lo stesso criterio della data che segue il verso nel modulo pubblico. */
let prezzoNostro = null;

function aggiornaPrezzoTransfer() {
  if (!$('cPrezzo')) return;
  const proposta = prezzoTransfer({
    luogo: $('cLuogo').value,
    pax: Number($('cPax').value || 1),
    collettivo: $('cCollettivo').value === 'si',
    ritorno: $('cRitorno').checked,
  });
  const campo = $('cPrezzo');
  if (!proposta) {
    $('cPrezzoNota').textContent = 'Il listino non copre questa destinazione: scrivi tu la cifra.';
    return;
  }
  const tratta = (proposta.trattaCent / 100).toFixed(2);
  const totale = (proposta.totaleCent / 100).toFixed(2);
  $('cPrezzoNota').textContent = proposta.corse === 2
    ? `Listino: ${tratta} € a tratta × 2 corse = ${totale} €`
    : `Listino: ${tratta} € a tratta`;
  if (campo.value === '' || campo.value === prezzoNostro) {
    campo.value = totale;
    prezzoNostro = totale;
  }
}

function campiGreenfee(r) {
  const d = r.dati || {};
  const opzCircolo = Object.keys(CIRCOLI_GOLF_NOMI).map((k) =>
    `<option value="${esc(k)}" ${d.circolo === k ? 'selected' : ''}>${esc(CIRCOLI_GOLF_NOMI[k])}</option>`).join('');
  return `<label>Circolo</label>
    <select id="cCircolo">${opzCircolo}</select>${avevaChiesto(r, 'Circolo')}
    <div class="due">
      <div><label>Data</label><input type="date" id="cData" value="${esc(d.data || '')}" />${avevaChiesto(r, 'Data')}</div>
      <div><label>Ora</label><input type="time" id="cOra" value="${esc(d.ora || '')}" />${avevaChiesto(r, 'Ora')}</div>
    </div>
    <div class="due">
      <div><label>Giocatori</label><input type="number" id="cGiocatori" min="1" max="4" value="${esc(d.giocatori || 1)}" />${avevaChiesto(r, 'Giocatori')}</div>
      <div><label>Percorso</label><input type="text" id="cPercorso" value="${esc(d.percorso || '')}" />${avevaChiesto(r, 'Percorso')}</div>
    </div>
    <label>Tessera</label><input type="text" id="cTessera" value="${esc(d.tessera || '')}" />${avevaChiesto(r, 'Tessera')}
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;">
      <input type="checkbox" id="cTaxi" ${d.taxi ? 'checked' : ''}
        style="width:auto;margin:0;" /> serve anche il taxi per il campo</label>${avevaChiesto(r, 'Taxi al campo')}
    <label>Ora del taxi (se serve)</label><input type="time" id="cTaxiOra" value="${esc(d.taxi_ora || '')}" />${avevaChiesto(r, 'Ora del taxi')}
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

const LIVELLI_MAESTRO = ['principiante', 'intermedio', 'esperto'];

function campiMaestro(r) {
  const d = r.dati || {};
  /* "non so" e' il default di tipi.ts per un livello assente: la casella
     vuota deve tornare a mandare '' (non la parola "non so"), perche'
     validaMaestro rifiuta "non so" come livello sconosciuto — lo accetta
     solo quando il campo e' vuoto. Vedi datiCorretti(). */
  const livello = LIVELLI_MAESTRO.includes(d.livello) ? d.livello : '';
  return `<div class="due">
      <div><label>Data</label><input type="date" id="cData" value="${esc(d.data || '')}" />${avevaChiesto(r, 'Data')}</div>
      <div><label>Ora</label><input type="time" id="cOra" value="${esc(d.ora || '')}" />${avevaChiesto(r, 'Ora')}</div>
    </div>
    <div class="due">
      <div><label>Persone</label><input type="number" id="cPersone" min="1" max="4" value="${esc(d.persone || 1)}" />${avevaChiesto(r, 'Persone')}</div>
      <div><label>Livello</label><select id="cLivello">
        <option value="" ${!livello ? 'selected' : ''}>Non so / non specificato</option>
        <option value="principiante" ${livello === 'principiante' ? 'selected' : ''}>Principiante</option>
        <option value="intermedio" ${livello === 'intermedio' ? 'selected' : ''}>Intermedio</option>
        <option value="esperto" ${livello === 'esperto' ? 'selected' : ''}>Esperto</option>
      </select>${avevaChiesto(r, 'Livello')}</div>
    </div>
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

const FASCE_TRATTAMENTI = ['mattina', 'pomeriggio', 'indifferente'];

function campiTrattamenti(r) {
  const d = r.dati || {};
  const voci = Array.isArray(d.voci) ? d.voci : [];
  const fascia = FASCE_TRATTAMENTI.includes(d.fascia) ? d.fascia : 'indifferente';
  return `<label>Trattamenti scelti (uno per riga)</label>
    <textarea id="cVoci" rows="4">${esc(voci.join('\n'))}</textarea>${avevaChiesto(r, 'Trattamenti scelti')}
    <div class="due">
      <div><label>Giorno</label><input type="date" id="cGiorno" value="${esc(d.giorno || '')}" />${avevaChiesto(r, 'Giorno')}</div>
      <div><label>Fascia oraria</label><select id="cFascia">
        <option value="mattina" ${fascia === 'mattina' ? 'selected' : ''}>Mattina</option>
        <option value="pomeriggio" ${fascia === 'pomeriggio' ? 'selected' : ''}>Pomeriggio</option>
        <option value="indifferente" ${fascia === 'indifferente' ? 'selected' : ''}>Indifferente</option>
      </select>${avevaChiesto(r, 'Fascia oraria')}</div>
    </div>
    <label>Note</label><textarea id="cNote">${esc(d.note || '')}</textarea>${avevaChiesto(r, 'Note')}`;
}

/* Le chiavi delle attenzioni e del desiderio dei fanghi arrivano dal
   database COME CHIAVI, non come testo: la pagina d'arrivo parla quattro
   lingue e "Culla per neonato" sarebbe stato scritto da chi in quel momento
   aveva davanti "Babybett". Qui si rimettono in italiano, che e' la lingua
   di questa schermata. Uno switch e non un OGGETTO[chiave], per lo stesso
   motivo di campiModificabili qui sotto. */
function nomeAttenzione(k) {
  switch (k) {
    case 'culla': return 'culla';
    case 'seggiolone': return 'seggiolone';
    case 'parcheggio': return 'parcheggio';
    case 'cane': return 'cane al seguito';
    default: return '';
  }
}

/* UNA TABELLA SOLA. Le tre fasce stavano scritte due volte in questo
   stesso file: qui e in DESIDERIO_IN_PAGINA, che e' l'unica tenuta ferma
   da pagine/buoni/fanghi-copie.test.ts contro il testo delle email.
   Cambiando una fascia domani, la prova avrebbe costretto quella a
   seguire e lasciato indietro questa: la scheda di una richiesta e la
   scheda «Arrivi del giorno» avrebbero detto due cose diverse sullo
   stesso ospite, con la suite verde.

   Object.hasOwn e non una ricerca diretta: una chiave come «toString»
   esiste su Object.prototype e tornerebbe una funzione al posto di una
   fascia. */
function nomeFanghi(k) {
  const chiave = String(k ?? '');
  return Object.hasOwn(DESIDERIO_IN_PAGINA, chiave) ? DESIDERIO_IN_PAGINA[chiave] : '';
}

/* «Elena (12) · Marco»: il nome c'e' sempre, l'età no. Le voci senza nome
   non arrivano (validaArrivo le scarta), ma una riga vecchia puo' averle:
   una voce vuota qui sarebbe un «(undefined)» a schermo. */
function elencoPersoneArrivo(v) {
  return (Array.isArray(v) ? v : []).map((p) => {
    const nome = String((p && p.nome) || '').trim();
    const eta = String((p && p.eta) || '').trim();
    return nome ? (eta ? `${nome} (${eta})` : nome) : '';
  }).filter(Boolean).join(' · ');
}

/* QUELLO CHE L'OSPITE HA SCRITTO, e i dati per fatturare.
   Questa scheda disegnava solo le colonne del soggiorno, che per un arrivo
   e per una fattura sono vuote: le note dell'ospite e i nomi delle persone
   da aggiungere non comparivano su NESSUNA schermata — vivevano soltanto
   nell'email arrivata a info@, e se quella si perdeva il dato c'era e non
   si poteva piu' guardare. Messo insieme al blocco della chiusura, voleva
   dire che la reception non poteva chiudere una richiesta il cui contenuto
   bloccante non poteva nemmeno leggere.

   E l'amministrazione non poteva fatturare dallo schermo: il riepilogo dice
   «Bianchi S.r.l. · P.IVA …», ma indirizzo, codice fiscale, SDI e PEC
   stavano solo nell'email in copia. */
function righeCheckIn(r, riga) {
  const d = r.dati || {};
  if (r.tipo === 'arrivo') {
    const attenzioni = (Array.isArray(d.attenzioni) ? d.attenzioni : [])
      .map(nomeAttenzione).filter(Boolean).join(' · ');
    const persone = elencoPersoneArrivo(d.persone_extra);
    return riga('Arrivo previsto', esc(d.ora_arrivo || '')) +
      riga('Mezzo', esc(d.mezzo || '')) +
      riga('Piccole attenzioni', esc(attenzioni)) +
      riga('Desiderio fanghi', esc(nomeFanghi(d.fanghi_desiderio))) +
      riga('Persone da aggiungere', persone
        ? `<strong>${esc(persone)}</strong> <span class="mini">· ${
            d.persone_confermate === true ? 'confermate' : 'in attesa di risposta'}</span>`
        : '') +
      riga('Note dell’ospite', d.note
        ? `<span style="white-space:pre-line;">${esc(d.note)}</span>` : '');
  }
  if (r.tipo === 'fattura') {
    /* il grassetto si accende SOLO se c'e' qualcosa da scrivere: un
       `<strong></strong>` e' una stringa non vuota, e riga() lo
       disegnerebbe come una riga vuota invece di saltarla */
    return riga('Intestazione', d.ragione ? `<strong>${esc(d.ragione)}</strong>` : '') +
      riga('Indirizzo', esc(d.indirizzo || '')) +
      riga('Partita IVA', esc(d.piva || '')) +
      riga('Codice fiscale', esc(d.cf || '')) +
      riga('Codice SDI', esc(d.sdi || '')) +
      riga('PEC', esc(d.pec || ''));
  }
  return '';
}

/* LA CASELLA CHE SBLOCCA LA CHIUSURA. puoChiudere()
   (supabase/functions/richieste/arrivi.ts) rifiuta di portare a «chiusa»
   una richiesta d'arrivo con persone da aggiungere finche' nessuno ha
   risposto, e il segno che qualcuno ha risposto e' `persone_confermate`.
   I due inserimenti pubblici lo forzano a falso apposta — e' la porta
   dell'ospite — quindi l'unica via per metterlo a vero e' ?a=conferma. Ma
   nessuna schermata gliene mandava uno: la reception confermava, riprovava
   a chiudere, e leggeva lo stesso rifiuto. Per sempre.

   COMPARE SOLO SE C'E' QUALCUNO DA CONFERMARE: senza persone da aggiungere
   la chiusura non e' bloccata, e una spunta che non sblocca niente si
   legge come un adempimento da fare sempre. */
function campiArrivo(r) {
  const d = r.dati || {};
  if (!elencoPersoneArrivo(d.persone_extra)) return '';
  return `<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;">
      <input type="checkbox" id="cPersoneOk" ${d.persone_confermate === true ? 'checked' : ''}
        style="width:auto;margin:0;" /> ho confermato disponibilità e prezzo delle persone da
      aggiungere</label>${avevaChiesto(r, 'Persone da aggiungere confermate')}
    <div class="mini">Finché questa casella è vuota la richiesta non si può chiudere. Scrivi il
      prezzo nel messaggio qui sotto, spunta, e premi «Conferma e avvisa l’ospite».</div>`;
}

/* Elenco chiuso via switch, mai un OGGETTO[tipo]: il tipo arriva dal
   database, e una chiave come "toString" esiste su Object.prototype. Un
   tipo non riconosciuto non offre campi: non sappiamo la sua forma, e un
   modulo indovinato manderebbe a ?a=conferma qualcosa che tipi.ts
   rifiuterebbe comunque. */
function campiModificabili(r) {
  switch (r.tipo) {
    case 'transfer': return campiTransfer(r);
    case 'greenfee': return campiGreenfee(r);
    case 'maestro': return campiMaestro(r);
    case 'trattamenti': return campiTrattamenti(r);
    case 'arrivo': return campiArrivo(r);
    default: return '';
  }
}

/* Il `dati` da mandare a ?a=conferma, nella forma esatta che tipi.ts si
   aspetta per quel tipo (il server rivalida e rifiuta se non torna). Si
   parte SEMPRE da {...r.dati}: i campi che questa scheda non rende
   modificabili (i noleggi del green fee, per esempio) restano quelli che
   c'erano, non spariscono perche' il modulo non li ha mandati. */
function datiCorretti(r) {
  const base = r.dati || {};
  switch (r.tipo) {
    case 'transfer': return {
      ...base,
      quando: $('cQuando').value, ora: $('cOra').value,
      pax: Number($('cPax').value || 1), verso: $('cVerso').value,
      luogo: $('cLuogo').value, volo: $('cVolo').value,
      ritorno: $('cRitorno').checked, note: $('cNote').value,
      ritorno_quando: $('cRitornoQuando').value || null,
      ritorno_ora: $('cRitornoOra').value || null,
      ritorno_volo: $('cRitornoVolo').value,
      ritorno_collettivo: $('cRitornoCollettivo').value === 'si',
      collettivo: $('cCollettivo').value === 'si',
      /* euro a schermo, centesimi nel dato: e' il trabocchetto gia' pagato
         in email-richiesta.ts e differenze.ts. Vuoto resta null e non zero —
         «non c'e' un prezzo» e «e' gratis» sono due cose diverse. */
      prezzo_cent: $('cPrezzo').value === ''
        ? null
        : Math.round(Number($('cPrezzo').value) * 100),
    };
    case 'greenfee': return {
      ...base,
      circolo: $('cCircolo').value, data: $('cData').value, ora: $('cOra').value,
      giocatori: Number($('cGiocatori').value || 1), percorso: $('cPercorso').value,
      tessera: $('cTessera').value, note: $('cNote').value,
      taxi: $('cTaxi').checked, taxi_ora: $('cTaxiOra').value,
    };
    case 'maestro': return {
      ...base,
      data: $('cData').value, ora: $('cOra').value,
      persone: Number($('cPersone').value || 1), livello: $('cLivello').value,
      note: $('cNote').value,
    };
    case 'trattamenti': return {
      ...base,
      voci: $('cVoci').value.split('\n').map((s) => s.trim()).filter(Boolean),
      giorno: $('cGiorno').value, fascia: $('cFascia').value, note: $('cNote').value,
    };
    /* L'UNICO campo che questa scheda scrive su un arrivo: il segno che
       qualcuno ha risposto sulle persone da aggiungere. Tutto il resto
       resta com'e' — ora e mezzo arrivano nella lingua dell'ospite e non
       si riscrivono da qui.
       SE LA CASELLA NON C'E' (nessuna persona da aggiungere: campiArrivo
       non la disegna) si tiene il valore che c'era, mai un `false` scritto
       solo perche' il modulo non l'ha mandato. */
    case 'arrivo': return {
      ...base,
      persone_confermate: $('cPersoneOk')
        ? $('cPersoneOk').checked
        : base.persone_confermate === true,
    };
    /* soggiorno (mai passato qui: il pannello di conferma non si mostra
       per lui) o un tipo non riconosciuto: nessuna correzione da mandare,
       ?a=conferma tiene i dati che c'erano gia' */
    default: return undefined;
  }
}

/* ATTENZIONE ALL'UNITA': in `dati` i prezzi sono in CENTESIMI (lo dichiara
   il campo `valuta`). 31000 sono 310,00 €, non 31000 €. */
const eurDaCent = (c) => Number.isFinite(Number(c))
  ? Number(c) / 100 : null;

/* La camera scelta sulla pagina di prenotazione vive in `dati`, e questa
   scheda non la guardava affatto: l'ospite sceglieva "Doppia — Soggiorno
   breve — Mezza Pensione — 310,00 €" e in reception si leggeva solo
   "Camera: Doppia · Pacchetto: Soggiorno breve". Due proposte della stessa
   camera differiscono SOLO per trattamento e prezzo, quindi cosi' non c'era
   modo di sapere quale avesse scelto ne' a che cifra. Stesso discorso per
   adulti e bambini: la colonna `ospiti` porta la somma, e la caparra si
   calcola sugli ADULTI. */
function righeSceltaSoggiorno(r, riga) {
  const d = r.dati || {};
  if (r.tipo !== 'soggiorno') return '';
  const prezzo = eurDaCent(d.prezzo_cent);
  const caparra = eurDaCent(d.caparra_cent);
  const persone = Number.isInteger(d.adulti)
    ? `${d.adulti} adult${d.adulti === 1 ? 'o' : 'i'}` +
      (Number.isInteger(d.bambini) && d.bambini > 0
        ? ` · ${d.bambini} bambin${d.bambini === 1 ? 'o' : 'i'}` : '')
    : '';
  return riga('Composizione', esc(persone)) +
    riga('Trattamento', esc(d.trattamento || '')) +
    riga('Prezzo visto dall’ospite',
      prezzo === null ? '' : `<strong>${eur(prezzo)} €</strong>`) +
    riga('Caparra indicata', caparra === null ? '' : `${eur(caparra)} €`) +
    (prezzo === null ? '' : `<tr><td></td><td class="mini" style="padding-bottom:6px;">
      Prezzo e caparra sono quelli che l’ospite ha visto sulla pagina al momento
      della scelta, per l’intero soggiorno: vanno confermati, non sono un
      preventivo della casa. La camera non è bloccata.</td></tr>`);
}

/* Periodo/notti/ospiti sono i campi di un SOGGIORNO: componi-richiesta.ts
   non valorizza quelle colonne per un transfer, un green fee, una lezione o
   dei trattamenti — restano null. Mostrarle comunque era esattamente il
   difetto di partenza di questa scheda: "→ · null notti · null ospiti". Qui
   il pezzo mancante sparisce invece di comparire come "null": si guarda il
   dato, non il tipo, cosi' vale anche per un tipo non ancora previsto che
   avesse comunque un periodo. */
function rigaPeriodo(r, riga) {
  const periodo = [dataIT(r.check_in), dataIT(r.check_out)].filter(Boolean).join(' → ');
  const pezzi = [
    Number.isFinite(r.notti) ? `${r.notti} notti` : '',
    Number.isFinite(r.ospiti) ? `${r.ospiti} ospiti` : '',
  ].filter(Boolean).join(' · ');
  if (!periodo && !pezzi) return '';
  return riga('Periodo', `<strong>${esc(periodo)}</strong>${pezzi ? ` <span class="mini">${esc(pezzi)}</span>` : ''}`);
}

/* LE CAMERE CHE VIAGGIANO INSIEME. Il carrello del sito ne salva una
   riga per camera: sono pratiche distinte — ognuna col suo periodo, la
   sua tariffa e il suo stato, ed e' giusto cosi' — ma sono lo stesso
   ospite, e vanno assegnate vicine.

   Il collegamento lo calcola il server (collegaCamere in elenco.ts) e
   arriva su OGNI riga del gruppo, capofila compresa: prima si vedeva
   da una parte sola, e chi apriva la capofila non sapeva che ce
   n'erano altre due. */
function camereInsieme(r) {
  const numeri = Array.isArray(r.camere_insieme) ? r.camere_insieme : [];
  if (numeri.length < 2) return null;
  return { numeri, quale: numeri.indexOf(r.numero) + 1 };
}

/* il segno in lista: corto, perche' sta dentro una cella gia' piena */
function segnoInsieme(r) {
  const g = camereInsieme(r);
  if (!g) return '';
  return `<span class="piu-voci">${g.quale > 0 ? g.quale + ' di ' + g.numeri.length : g.numeri.length} camere insieme</span>`;
}

function dettaglioRichiesta(r) {
  const riga = (e, v) => v ? `<tr><td class="mini" style="padding-right:14px;white-space:nowrap;">${esc(e)}</td>
    <td>${v}</td></tr>` : '';
  /* la risposta si scrive dal programma di posta della reception, che qui
     e' configurato: il taglia e incolla dell'indirizzo e' il passaggio in
     cui si sbaglia una lettera e la risposta non arriva */
  const oggetto = encodeURIComponent(`Hotel Terme Leonardo — la sua richiesta ${r.numero}`);
  /* nasce gia' spuntata quando dati_originali e dati differiscono davvero
     (r.differenze, gia' calcolata dal server): i due errori non pesano
     uguale. Segnalare all'ospite una cosa che sapeva gia' e' un fastidio
     piccolo; non segnalargliene una che non sa e' un ospite che si
     presenta all'ora sbagliata, convinto di avere ragione. L'operatore la
     toglie in un clic se ha gia' sentito l'ospite al telefono. */
  const segnalaDiDefault = Array.isArray(r.differenze) && r.differenze.length > 0;
  return `<div class="riquadro" style="margin-top:14px;">

         camera che serve senza cercarla a mano nella lista, che e'
         esattamente il gesto che prima non c'era. */
      const g = camereInsieme(r);
      if (!g) return '';
      return `<div class="insiemeCamere">
        <strong>${g.numeri.length} camere per lo stesso ospite</strong>${g.quale > 0 ? ` — questa e' la ${g.quale}ª` : ''}.
        Da assegnare vicine.
        <div style="margin-top:6px;">${g.numeri.map((num) =>
          num === r.numero
            ? `<span class="cod">${esc(num)}</span>`
            : `<button type="button" class="apriInsieme cod" data-numero="${esc(num)}">${esc(num)}</button>`
        ).join(' · ')}</div>
      </div>`;
    })()}
    <table style="margin-top:12px;">
      ${rigaPeriodo(r, riga)}
      ${riga('Email', `<a href="mailto:${esc(r.email)}?subject=${oggetto}">${esc(r.email)}</a>`)}
      ${riga('Telefono', r.telefono ? `<a href="tel:${esc(r.telefono)}">${esc(r.telefono)}</a>` : '')}
      ${riga('Lingua', esc(etichetta(LINGUA_NOME, r.lingua)))}
      ${riga('Camera', esc(r.tipo_camera || (r.dati && r.dati.nome_camera) || ''))}
      ${riga('Pacchetto', esc(r.pacchetto || ''))}
      ${righeSceltaSoggiorno(r, riga)}
      ${righeCheckIn(r, riga)}
      ${riga('Gestita da', r.gestita_da ? esc(r.gestita_da) + ' · ' + quandoIT(r.gestita_il) : '')}
    </table>
    ${r.messaggio ? `<div style="border-left:3px solid var(--oro);background:#FBFAF7;padding:12px 14px;
      margin-top:14px;white-space:pre-line;">${esc(r.messaggio)}</div>` : ''}
    ${r.conferma_il ? `<div class="mini" style="margin-top:14px;">
      Confermata il ${quandoIT(r.conferma_il)}${r.conferma_da ? ' da ' + esc(r.conferma_da) : ''}
      ${r.conferma_esito === 'fallita'
        ? '<span class="nonconsegnato">EMAIL NON PARTITA</span>' : ''}</div>` : ''}

    ${r.tipo === 'transfer' ? `<div style="margin-top:18px;padding-top:16px;border-top:1px solid #E6E2D8;">
      <h2 style="font-size:18px;">Per il modulo dei tassisti</h2>
      <!-- ANDATA E RITORNO UNO SOTTO L'ALTRO, OGNUNO CON LA SUA TABELLA E IL
           SUO PULSANTE, e PRIMA della conferma all'ospite. «Apri in ATAM lo
           posizionerei sotto ogni richiesta: andata e poi pulsante, ritorno
           e poi pulsante, e poi conferma al cliente. Metti un po' di
           ordine» (2 settembre 2026). Prima la tabella dell'andata stava in
           fondo, il ritorno aveva un pulsante senza tabella, e in mezzo
           c'era il modulo della conferma: tre cose impilate senza un ordine.

           Una riga per campo, e si copia il VALORE: il blocco unico di prima
           finiva in un campo solo, «Data: 15 agosto 2026» con dentro la
           parola «Data:», e il loro calendario non la sapeva leggere. -->
      <div class="mini" style="padding-bottom:4px;">Una riga per ogni campo del loro modulo, e
        si copia il valore. Il luogo è già scritto come nel loro elenco. Per aprire il
        modulo già compilato serve l'estensione Offerta Leonardo: <strong>Prenota lo premi

      <div style="margin-top:10px;padding:12px 0 12px 14px;border-left:3px solid #1E7F88;">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;

        <textarea id="cAtam" rows="2" readonly hidden>${esc(riepilogoATAM(r, dataIT))}</textarea>
        <!-- Il modulo dei tassisti si compila da solo: l'estensione legge i

             manda mai al server. Chi non ha l'estensione usa il copia, che
             resta. Provato che un link con la query NON funziona: la loro
             vista Django ignora ?pax=3, i campi restano vuoti. -->
        <a class="azione" id="bApriAtam" href="${esc(indirizzoATAM(r))}"
          target="_blank" rel="noopener noreferrer"

      </div>
      <!-- IL RITORNO E' UNA SECONDA PRENOTAZIONE. Su atam.biz non esiste un
           campo «ritorno»: si prenota da capo, con la sua data, la sua ora e
           il VERSO OPPOSTO — chi arriva dall'aeroporto torna in aeroporto.
           Prima c'era solo una nota nelle note e la reception rifaceva tutto
           a mano, indovinando il verso. La tabella nasce dagli stessi valori
           del modulo compilato (vociATAMRitorno), quindi non possono
           divergere. -->
      ${vociATAMRitorno(r, dataIT) ? `
      <div style="margin-top:14px;padding:12px 0 12px 14px;border-left:3px solid #8FA98A;">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;
          color:#5F7A5A;font-weight:700;padding-bottom:8px;">Ritorno · seconda prenotazione, verso opposto</div>
        <table class="atam">${vociATAMRitorno(r, dataIT).map(rigaAtam).join('')}</table>
        <a class="azione" id="bApriAtamRitorno" href="${esc(indirizzoATAMRitorno(r))}"
          target="_blank" rel="noopener noreferrer"
          style="display:block;text-align:center;text-decoration:none;">Apri il ritorno su ATAM già compilato</a>
      </div>` : ''}
    </div>` : ''}

    ${r.tipo !== 'soggiorno' ? `<div style="margin-top:18px;padding-top:16px;border-top:1px solid #E6E2D8;">
      <h2 style="font-size:18px;">Conferma all’ospite</h2>
      <div class="mini" style="padding-bottom:6px;">Correggi qui se hai spostato qualcosa:
        l’ospite riceve questi dati, non quelli che aveva chiesto.</div>
      ${campiModificabili(r)}
      ${boxAltreDifferenze(r)}
      <label>Messaggio per l’ospite (facoltativo)</label>
      <textarea id="cMessaggio" rows="3"

      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;margin-top:12px;">
        <input type="checkbox" id="cSegnala" ${segnalaDiDefault ? 'checked' : ''}
          style="width:auto;margin:0;" /> segnala all’ospite cosa è cambiato</label>
      <button class="azione" id="bConferma">Conferma e avvisa l’ospite</button>
    </div>` : ''}

    <div class="due" style="margin-top:16px;">
      <a class="azione sec" style="text-align:center;text-decoration:none;"
        href="mailto:${esc(r.email)}?subject=${oggetto}">Scrivi a mano</a>
      <div>
        <button class="azione sec" data-stato="vista">Segna vista</button>
        <button class="azione sec" data-stato="chiusa">Chiudi</button>
      </div>
    </div>
    <div class="esito" id="rAzione"></div></div>`;
}

async function vistaRichieste() {
  $('vista').innerHTML = `<div class="riquadro">
    <div class="due">
      <div><label>Stato</label><select id="rStato">
        <option value="nuova">Da guardare</option>
        <option value="">Tutte</option>
        <option value="vista">Viste</option>
        <option value="risposta">Con risposta data</option>
        <option value="chiusa">Chiuse</option>
      </select></div>
      <!-- LA RICERCA. Il server ne restituisce al massimo 200: con sei
           richieste si scorre a occhio, alla duecentunesima quella del
           signore di tre settimane fa non si trova piu'. Il caso vero e' il
           tassista che sposta la partenza dopo la conferma. Cerca sul
           SERVER (ricerca.ts), non fra le righe gia' caricate: filtrare
           quelle darebbe una risposta che sembra completa e non lo e'. -->
      <div><label>Cerca</label>
        <input id="rCerca" type="search" placeholder="cognome, email, telefono, numero o giorno" /></div>
    </div>
    <div class="esito" id="rEsito">Carico…</div>
    <div class="mini" style="padding-bottom:6px;">Clicca una richiesta per vedere tutto,
      rispondere e segnarla gestita.</div>
    <div id="rTab"></div></div>
    <div id="rDettaglio"></div>`;

  let CARICATE = [];
  const carica = async () => {
    $('rEsito').textContent = 'Carico…';
    $('rDettaglio').innerHTML = '';
    try {
      const j = await chiama(`?a=elenco&stato=${encodeURIComponent($('rStato').value)}&cerca=${encodeURIComponent($('rCerca').value.trim())}`,
        {}, FUNZIONE_RICHIESTE);
      CARICATE = j.richieste || [];
      $('rEsito').textContent = CARICATE.length
        ? `${CARICATE.length} richieste` : 'Nessuna richiesta.';
      /* il numero sul pulsante segue l'elenco: dopo «Segna vista» o
         «Chiudi» scende subito, senza cambiare scheda */
      aggiornaContatore();
      $('rTab').innerHTML = CARICATE.length ? `<table>
        <tr><th>Numero</th><th>Arrivata</th><th>Ospite</th><th>Richiesta</th><th>Stato</th></tr>` +
        CARICATE.map(r => `<tr class="apribile" data-numero="${esc(r.numero)}">
          <td class="cod">${esc(r.numero)}</td>
          <td class="mini">${quandoIT(r.creato_il)}</td>
          <td>${esc(r.nome)}<div class="mini">${esc(r.email)}${r.telefono ? ' · ' + esc(r.telefono) : ''}</div></td>
          <td><span class="badge-tipo">${esc(r.etichetta || 'Richiesta')}</span>${segnoInsieme(r)}
            <div class="mini">${esc(r.riepilogo || '')}</div></td>
          <td><span class="stato st-${esc(r.stato)}">${esc(etichetta(STATI_RICHIESTA, r.stato))}</span></td>
        </tr>`).join('') + `</table>` : '';

      for (const tr of $('rTab').querySelectorAll('tr.apribile')) {
        tr.onclick = () => {
          const r = CARICATE.find(x => x.numero === tr.dataset.numero);
          if (!r) return;
          $('rDettaglio').innerHTML = dettaglioRichiesta(r);
          /* #cQuando (solo per i transfer) e' ricreato qui a ogni richiesta
             aperta: riattivarlo in questo punto, non solo al primo
             caricamento della pagina. */
          attivaDate($('rDettaglio'));

          /* Il prezzo proposto dal listino, subito e a ogni cambiamento dei
             campi che lo determinano: meta, passeggeri, servizio, ritorno.
             Senza il primo giro la cifra comparirebbe solo dopo che
             l'operatore ha toccato qualcosa. */
          prezzoNostro = null;
          aggiornaPrezzoTransfer();
          for (const id of ['cLuogo', 'cPax', 'cCollettivo', 'cRitorno']) {
            if ($(id)) $(id).addEventListener('change', aggiornaPrezzoTransfer);
          }
          /* il blocco del ritorno segue la spunta: un riquadro vuoto sempre
             aperto e' un riquadro che prima o poi qualcuno compila per
             sbaglio, e allora la reception prenota una corsa che nessuno
             ha chiesto */
          if ($('cRitorno') && $('cBoxRitorno')) {
            $('cRitorno').addEventListener('change', () => {
              $('cBoxRitorno').style.display = $('cRitorno').checked ? 'block' : 'none';
            });
          }

          /* le camere dello stesso gruppo si aprono da qui: cercarle a
             mano nella lista e' il gesto che questo collegamento
             esiste per togliere */
          for (const b of $('rDettaglio').querySelectorAll('button.apriInsieme')) {
            b.onclick = () => {
              const altra = CARICATE.find(x => x.numero === b.dataset.numero);
              if (!altra) {
                b.textContent = 'non in elenco';
                return;
              }
              $('rDettaglio').innerHTML = dettaglioRichiesta(altra);
              $('rDettaglio').scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
          }
          /* un pulsante per riga: si copia il valore, mai l'etichetta */
          for (const b of $('rDettaglio').querySelectorAll('button.copiaVoce')) {
            b.onclick = async () => {
              const prima = b.textContent;
              try {
                await navigator.clipboard.writeText(b.dataset.val);
                b.textContent = 'Copiato';
              } catch (e) {
                console.error('copia non riuscita', e);
                b.textContent = 'Non riesco';
              }
              setTimeout(() => { b.textContent = prima; }, 1500);
            };
          }

          const bCopia = $('bCopiaAtam');
          if (bCopia) bCopia.onclick = async () => {
            try {
              await navigator.clipboard.writeText($('cAtam').value);
              bCopia.textContent = 'Copiato';
              setTimeout(() => { bCopia.textContent = 'Copia tutto in blocco'; }, 1800);
            } catch (e) {
              /* se la copia non passa, il testo si mostra e si seleziona:
                 nascosto non sarebbe selezionabile, e l'operatore resterebbe
                 con un pulsante che non fa niente */
              $('cAtam').hidden = false;
              $('cAtam').rows = 8;
              $('cAtam').select();
              bCopia.textContent = 'Selezionato: premi Ctrl+C';
            }
          };

          const bConf = $('bConferma');
          if (bConf) bConf.onclick = async () => {
            bConf.disabled = true;
            $('rAzione').textContent = 'Invio la conferma…';
            /* la forma esatta che tipi.ts si aspetta per questo tipo: il
               server la rivalida comunque e rifiuta se non torna */
            const dati = datiCorretti(r);
            const cSegnala = $('cSegnala');
            try {
              const j = await chiama('?a=conferma', {
                method: 'POST',
                body: JSON.stringify({ numero: r.numero, dati,
                  messaggio: $('cMessaggio').value,
                  segnala_modifiche: cSegnala ? cSegnala.checked : false,
                  utente: OPERATORE }),
              }, FUNZIONE_RICHIESTE);
              /* la conferma vale solo se l'email e' partita: dirlo, invece di
                 lasciar credere che l'ospite sappia */
              $('rAzione').innerHTML = j.inviata
                ? '<span style="color:var(--oliva);">Conferma inviata all’ospite.</span>'
                : '<span class="errore">Salvata, ma l’email NON è partita: '
                  + 'avvisa l’ospite in un altro modo.</span>';
              await carica();
            } catch (e) {
              bConf.disabled = false;
              $('rAzione').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
            }
          };

          for (const b of $('rDettaglio').querySelectorAll('button[data-stato]')) {
            b.onclick = async () => {
              $('rAzione').textContent = 'Salvo…';
              try {
                await chiama('?a=stato', {
                  method: 'POST',
                  body: JSON.stringify({ numero: r.numero, stato: b.dataset.stato, utente: OPERATORE }),
                }, FUNZIONE_RICHIESTE);
                await carica();
              } catch (e) {
                $('rAzione').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
              }
            };
          }
          $('rDettaglio').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      }
    } catch (e) { $('rEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('rStato').onchange = carica;
  /* Un freno prima di chiedere: senza, ogni lettera digitata sarebbe una
     chiamata al server, e le risposte tornerebbero fuori ordine — l'elenco
     finirebbe per mostrare i risultati di «Reng» dopo quelli di «Renga».
     Invio cerca subito, per chi ha gia' finito di scrivere. */
  let attesa;
  $('rCerca').addEventListener('input', () => {
    clearTimeout(attesa);
    attesa = setTimeout(carica, 350);
  });
  $('rCerca').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clearTimeout(attesa); carica(); }
  });
  carica();
}

/* ---------- 3. verifica e riscossione ---------- */
function vistaVerifica() {
  $('vista').innerHTML = `<div class="riquadro">
    <h2>Il cliente presenta un buono</h2>
    <label>Codice</label><input type="text" id="vCod" placeholder="LEO-XXXX-XXXX" style="font-family:monospace;text-transform:uppercase;" />
    <button class="azione" id="vCerca">Controlla</button>
    <div class="esito" id="vEsito"></div>
    <div id="vRis"></div></div>`;
  const cerca = async () => {
    const cod = $('vCod').value.trim().toUpperCase();
    if (!cod) return;
    $('vEsito').textContent = 'Controllo\u2026'; $('vRis').innerHTML = '';
    try {
      const r = await fetch(`${FUNZIONE}?a=verifica&codice=${encodeURIComponent(cod)}`);
      const j = await r.json();
      if (!r.ok || j.valido === false) {
        $('vEsito').innerHTML = `<span class="errore">Non utilizzabile: ${esc(j.stato || j.motivo || 'non trovato')}
          ${j.riscosso_il ? ' il ' + dataIT(j.riscosso_il) : ''}</span>`;
        return;
      }
      $('vEsito').textContent = '';
      $('vRis').innerHTML = `<div class="fatto">
        <strong>Valido.</strong>
        <div class="mini" style="margin-top:4px;">${righeDescrizione(j.descrizione, j.voci).map(r =>
          `<div>${r.quantita != null ? `${r.quantita} \u00d7 ` : ''}${esc(r.testo)}</div>`).join('')}
          ${eur(j.valore)} \u20ac</div>
        <div class="mini">Scade il ${dataIT(j.scade_il)}</div>
        <label>Note (facoltative)</label><input type="text" id="vNote" />
        <button class="azione" id="vRiscuoti">Segna come riscosso</button>
        <button class="azione sec" id="vAnnulla"
          style="border-color:var(--allarme);color:var(--allarme);">Annulla e rimborsa</button>
        <div class="esito" id="vEsito2"></div></div>`;
      $('vRiscuoti').onclick = async () => {
        try {
          await chiama('?a=riscuoti', { method:'POST', body: JSON.stringify({

        } catch (e) { $('vEsito2').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
      };
      /* Un gesto solo: annulla e, se il buono \u00e8 stato pagato con Stripe,
         rimborsa \u2014 lo decide il server (?a=rimborsa, vedi rimborso.ts),
         qui c'\u00e8 solo la conferma. La conferma dice cosa succede DAVVERO \u2014
         quale buono, quanti euro tornano al cliente, che non si torna
         indietro \u2014 non un "sei sicuro?" generico: prima di questa modifica
         il back office sapeva solo annullare, e il rimborso si faceva a
         mano dentro Stripe: due gesti separati, facili da disallineare
         (buono annullato e mai rimborsato, o rimborsato e mai annullato). */
      $('vAnnulla').onclick = async () => {
        const conferma = `Annullare il buono ${cod} e rimborsare ${eur(j.valore)} \u20ac a chi l\u2019ha pagato?\n\n` +
          `L\u2019operazione NON si pu\u00f2 annullare: se \u00e8 stato pagato con Stripe il rimborso parte subito.`;
        if (!confirm(conferma)) return;
        $('vRiscuoti').disabled = true; $('vAnnulla').disabled = true;
        $('vEsito2').textContent = 'Un momento\u2026';
        try {
          const ris = await chiama('?a=rimborsa', { method:'POST', body: JSON.stringify({
            codice: cod, operatore: OPERATORE, note: $('vNote').value }) });
          $('vEsito2').innerHTML = `\u2713 ${esc(ris.messaggio || 'Buono annullato.')}`;
        } catch (e) {
          /* il buono NON \u00e8 stato toccato (rimborso fallito) o \u00e8 successo
             qualcosa che l'operatore deve sistemare a mano (vedi
             messaggioScritturaFallita in rimborso.ts): in entrambi i casi
             si riabilitano i pulsanti, perch\u00e9 un nuovo tentativo pu\u00f2
             ancora avere senso \u2014 e se il rimborso era gi\u00e0 partito, Stripe
             risponder\u00e0 "gi\u00e0 rimborsato" invece di rimborsare due volte. */
          $('vEsito2').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
          $('vRiscuoti').disabled = false; $('vAnnulla').disabled = false;
        }
      };
    } catch (e) { $('vEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`; }
  };
  $('vCerca').onclick = cerca;
  /* il lettore di codici in portineria e' un lettore 2D: si comporta come
     una tastiera, "digita" il codice che ha letto nel campo che ha il
     fuoco e preme Invio. Senza questo listener quell'Invio non farebbe
     nulla e l'operatore dovrebbe cliccare "Controlla" a mano ogni volta.
     Stesso schema di $('kPwd').onkeydown piu' sopra, per l'accesso. */
  $('vCod').onkeydown = (ev) => { if (ev.key === 'Enter') cerca(); };
  /* il fuoco al campo appena si apre la scheda: chi scansiona un buono
     non deve prima cliccarci dentro con il mouse */
  $('vCod').focus();
}

/* ---------- 5. gli arrivi di un giorno ----------
   SOLA LETTURA. Da qui non si conferma e non si corregge niente: e' la
   schermata che mancava, non un secondo posto dove modificare le stesse
   cose. Quello che l'ospite scrive nel «Prepara il suo arrivo» finiva in
   un'email nella casella info@ e in una riga che nessuna schermata
   leggeva; se l'email si perdeva, il dato c'era e non si poteva guardare.

   CHI VEDE COSA LO DECIDE IL SERVER (arrivi.ts, perRuolo). Alla Segreteria
   Cure arrivano i fanghi e non la partita IVA — e non perche' qui si
   nascondano delle caselle, ma perche' quei campi non partono proprio.
   Questa pagina disegna quello che riceve: se un campo non c'e', non c'e'
   la riga. */

/* Le tre fasce, come si leggono qui. Sono le stesse di
   supabase/functions/prepara-arrivo/fanghi.ts (IN_RECEPTION): una pagina
   HTML non puo' importare un modulo Deno, e la copia e' tenuta ferma da
   pagine/buoni/fanghi-copie.test.ts. */
const DESIDERIO_IN_PAGINA = {
  presto: 'presto — dalle 5:50',
  tardi: 'più tardi — verso le 10:00',
  indifferente: 'indifferente'
};

const oggiISO = () => {
  const d = new Date();
  const due = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + due(d.getMonth() + 1) + '-' + due(d.getDate());
};

/* Le richieste di questo ospite, col numero: e' quello che si cerca
   nella scheda «Richieste dal sito» per rispondere. Qui non si
   risponde e non si chiude: questa schermata e' in sola lettura. */
const righeRichieste = (a) => !a.richieste?.length ? '' :
  `<div class="mini" style="padding-top:6px;">` + a.richieste.map((r) =>
    `<div><span class="badge-tipo">${esc(r.etichetta)}</span> <span class="cod">${esc(r.numero)}</span> ${esc(r.riepilogo || '')}` +
    `${r.stato && r.stato !== 'chiusa' ? '' : ' · chiusa'}</div>`
  ).join('') + `</div>`;

function vistaArrivi() {
  $('vista').innerHTML = `<div class="riquadro">
    <div class="due">
      <div><label>Giorno di arrivo</label><input id="aGiorno" type="date" value="${oggiISO()}" /></div>

    </div>

    <div id="aTratt"></div></div>`;

  const carica = async () => {

    $('aTab').innerHTML = '';
    $('aTratt').innerHTML = '';
    try {
      const j = await chiama('?a=arrivi&giorno=' + encodeURIComponent($('aGiorno').value),
        {}, FUNZIONE_RICHIESTE);
      const arrivi = j.arrivi || [];
      const tratt = j.trattamenti || [];
      $('aEsito').textContent = arrivi.length
        ? arrivi.length + (arrivi.length === 1 ? ' arrivo' : ' arrivi')

      if (arrivi.length) {
        $('aTab').innerHTML = `<table>
          <tr><th>Ospite</th><th>Soggiorno</th><th>Arrivo previsto</th><th>Cure e fanghi</th><th>Altro</th></tr>`
          + arrivi.map(a => `<tr>
            <td>${esc(a.intestatario || '')}${a.numero ? `<div class="mini cod">${esc(a.numero)}</div>` : ''}</td>
            <td class="mini">${dataIT(a.data_arrivo)} → ${dataIT(a.data_partenza)}
              <div>${a.adulti || 1} ad.${a.bambini ? ' · ' + a.bambini + ' bamb.' : ''}</div></td>
            <td>${a.compilazioni === 0
                  ? '<span class="mini">non ha ancora compilato</span>'
                  : esc(a.ora_arrivo || '—') + (a.mezzo ? ` <span class="mini">(${esc(a.mezzo)})</span>` : '')}
              ${a.compilazioni > 1
                  ? `<div class="mini errore">ha compilato ${a.compilazioni} volte: controllare</div>`
                  : ''}</td>
            <td>${a.cure ? '<span class="badge-tipo">cure termali</span>' : ''}
              ${a.fanghi_desiderio
                  ? `<div class="mini">fanghi, desiderio: <b>${esc(nomeFanghi(a.fanghi_desiderio) || a.fanghi_desiderio)}</b>
                       <br />il turno lo assegna la Segreteria Cure</div>`
                  : ''}</td>
            <td class="mini">${a.transfer ? '<span class="badge-tipo">transfer</span> ' : ''}${esc(a.note || '')}${righeRichieste(a)}</td>
          </tr>`).join('') + `</table>`;
      }

      /* L'altra meta': i trattamenti chiesti PER quel giorno. Non sono gli
         stessi ospiti — sono anche i clienti esterni del Day Spa — ed e'
         quello che la spa deve sapere per sapere cosa la aspetta. */
      $('aTratt').innerHTML = tratt.length ? `<div style="margin-top:18px;">
        <div class="mini" style="padding-bottom:6px;">Richieste di trattamenti e Day Spa per questo giorno

        <table><tr><th>Numero</th><th>Ospite</th><th>Richiesta</th></tr>`
        + tratt.map(r => `<tr>
          <td class="cod">${esc(r.numero)}</td>
          <td>${esc(r.nome)}<div class="mini">${esc(r.email || '')}</div></td>
          <td><span class="badge-tipo">${esc(r.etichetta || 'Richiesta')}</span>
            <div class="mini">${esc(r.riepilogo || '')}</div></td>
        </tr>`).join('') + `</table></div>`
        : '<div class="mini" style="margin-top:18px;">Nessuna richiesta di trattamenti per questo giorno.</div>';
    } catch (e) {
      $('aEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
    }
  };

  $('aVai').onclick = carica;
  $('aGiorno').onchange = carica;
  carica();
}

          <td style="white-space:nowrap;"><button type="button" class="azione sec mini" data-stampa="${esc(c.id)}" style="width:auto;">Stampa</button> <a class="azione sec mini" href="https://leonardo.fidra.cloud/privacy/create?leo=${encodeURIComponent(c.id)}" target="_blank" rel="noopener" style="width:auto;display:inline-block;text-decoration:none;" title="Apre il modulo privacy di Fidra già compilato con questa firma (serve l’estensione): Salva lo premi tu.">Registra in Fidra</a></td></tr>`).join('')}</table>` : '';
      document.querySelectorAll('[data-annulla]').forEach((b) => b.onclick = async () => {

/* ==================== il POS: menu', tavoli, personale ====================
   Tre schede per l'amministrazione. Leggono tutto con pos?a=allinea-giu e
   scrivono con menu-salva, tavoli-salva, personale-salva. Il PIN dei
   camerieri si scrive e non si rilegge mai: il server ne tiene l'impronta. */
const PORTATE_POS = { bevande: 'Bevande', antipasti: 'Antipasti', primi: 'Primi', secondi: 'Secondi', dolci: 'Dolci' };
const euroPos = (c) => (Number(c || 0) / 100).toFixed(2).replace('.', ',');
const centPos = (s) => Math.round(Number(String(s ?? '0').replace(',', '.')) * 100) || 0;
const opzPos = (lista, valore) => lista.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(valore ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('');
async function caricaPos() {
  const j = await chiama('?a=allinea-giu', {}, FUNZIONE_POS);
  const ord = (a, b) => (Number(a.posizione) || 0) - (Number(b.posizione) || 0) || String(a.nome ?? '').localeCompare(String(b.nome ?? ''));
  return {
    locali: j.locale || [], zone: (j.zona || []).sort(ord), tavoli: (j.tavolo || []).sort(ord),
    categorie: (j.categoria || []).sort(ord), articoli: (j.articolo || []).sort(ord),
    varianti: (j.variante || []).sort(ord), preferiti: (j.preferito || []).sort(ord),
    camerieri: (j.cameriere || []).sort(ord), dispositivi: (j.dispositivo || []).sort(ord),
  };
}
const valoreCampo = (el) => el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;

function vistaPosMenu() {
  $('vista').innerHTML = `<div class="riquadro"><div class="esito" id="pmEsito">Carico…</div></div>`;
  let D = null, filtro = '';
  const cat = (id) => D.categorie.find((c) => c.id === id);
  /* dal disegno ai dati, prima di ridisegnare o salvare */
  const raccogli = () => {
    document.querySelectorAll('[data-cat]').forEach((b) => {
      const c = cat(b.dataset.cat); if (!c) return;
      b.querySelectorAll('[data-c]').forEach((el) => {
        const k = el.dataset.c, v = valoreCampo(el);
        c[k] = k === 'note_rapide' ? String(v).split(',').map((s) => s.trim()).filter(Boolean) : (k === 'sotto' || k === 'locale_stampa' || k === 'orari') ? (v || null) : v;
      });
      const cn = {}; b.querySelectorAll('[data-cn]').forEach((el) => { if (el.value.trim()) cn[el.dataset.cn] = el.value.trim(); });
      c.nomi = Object.keys(cn).length ? cn : null;
      b.querySelectorAll('[data-art]').forEach((r) => {
        const a = D.articoli.find((x) => x.id === r.dataset.art); if (!a) return;
        r.querySelectorAll('[data-a]').forEach((el) => {
          const k = el.dataset.a, v = valoreCampo(el);
          a[k] = k === 'prezzo_cent' ? centPos(v) : (k === 'stampante' || k === 'portata' || k === 'locale_stampa') ? (v || null) : v;
        });
      });
    });
    document.querySelectorAll('[data-tradu-di]').forEach((r) => {
      const a = D.articoli.find((x) => x.id === r.dataset.traduDi); if (!a) return;
      const n = {}, d = {};
      r.querySelectorAll('[data-an]').forEach((el) => { if (el.value.trim()) n[el.dataset.an] = el.value.trim(); });
      r.querySelectorAll('[data-ad]').forEach((el) => { if (el.value.trim()) d[el.dataset.ad] = el.value.trim(); });
      a.nomi = Object.keys(n).length ? n : null; a.descrizioni = Object.keys(d).length ? d : null;
      const al = r.querySelector('[data-allergeni]'); a.allergeni = al && al.value.trim() ? al.value.trim().toUpperCase() : null;
      const or = r.querySelector('[data-orari]'); a.orari = or && or.value.trim() ? or.value.trim() : null;
    });
    document.querySelectorAll('[data-var]').forEach((r) => {
      const v = D.varianti.find((x) => x.id === r.dataset.var); if (!v) return;
      r.querySelectorAll('[data-vr]').forEach((el) => {
        const k = el.dataset.vr, val = valoreCampo(el);
        if (k === 'supplemento_cent') v[k] = centPos(val);
        else if (k === 'articolo_nome') { const a = D.articoli.find((x) => x.nome === val); v.articolo = a ? a.id : null; }
        else v[k] = val || null;
      });
    });
    document.querySelectorAll('[data-pref-locale]').forEach((b) => {
      const locale = b.dataset.prefLocale;
      D.preferiti = D.preferiti.filter((p) => p.locale !== locale);
      b.querySelectorAll('select').forEach((s, i) => { if (s.value) D.preferiti.push({ id: `${locale}-${i}`, locale, articolo: s.value, posizione: i }); });
    });
  };
  const disegna = () => {
    const f = filtro.toLowerCase();
    const catOpz = (esclusa) => [['', '— nessuna —'], ...D.categorie.filter((c) => c.id !== esclusa).map((c) => [c.id, c.nome])];
    const portOpz = Object.entries(PORTATE_POS);
    /* dove si prepara: vuoto = dove si mangia (il locale del tavolo) */
    const localeOpz = [['', 'dove si mangia'], ...D.locali.map((l) => [l.id, l.nome])];
    const artOpz = [['', '—']].concat(D.categorie.flatMap((c) => D.articoli.filter((a) => a.categoria === c.id).map((a) => [a.id, `${c.nome} › ${a.nome}`])));
    const LINGUE = ['it', 'en', 'de', 'fr']; /* i nomi per gli ospiti dal QR */
    const blocco = (c) => {
      const arts = D.articoli.filter((a) => a.categoria === c.id && (!f || String(a.nome).toLowerCase().includes(f)));
      if (f && !arts.length && !String(c.nome).toLowerCase().includes(f)) return '';
      return `<div class="riquadro" data-cat="${esc(c.id)}">
        <div class="due"><div><label>Categoria</label><input data-c="nome" value="${esc(c.nome)}" /></div>
          <div><label>Stampante</label><select data-c="stampante">${opzPos([['cucina', 'Cucina'], ['bar', 'Bar']], c.stampante)}</select></div></div>
