<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buoni Regalo — Hotel Terme Leonardo</title>
<meta name="description" content="Regala una giornata alle piscine termali, un massaggio o un buono valore all'Hotel Terme Leonardo di Abano Terme." />
<style>
:root{--verde:#1B4D4A;--verde-medio:#5C736F;--verde-chiaro:#E4F0EA;--salvia:#7A9490;
--oro:#C9A961;--carta:#FBFAF7;--sabbia:#EDE7DC;--inchiostro:#2A2E2B;--arancio:#E8751A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--carta);color:var(--inchiostro);
font:16px/1.6 Arial,Helvetica,sans-serif;}
.serif{font-family:Georgia,'Times New Roman',serif;}
a{color:var(--verde);}

/* ---- testata ---- */
.testata{background:var(--verde-chiaro);padding:34px 20px 40px;text-align:center;}
.marchio{display:block;width:200px;max-width:60%;height:auto;margin:0 auto;}
.testata h1{font-family:Georgia,serif;font-weight:normal;font-size:32px;line-height:1.25;
color:var(--verde);margin-top:26px;}
.testata .sotto{color:var(--verde-medio);max-width:560px;margin:12px auto 0;font-size:15px;}
.lingue{margin-top:16px;font-size:13px;letter-spacing:1px;}
/* bersagli comodi da toccare col pollice, non solo da cliccare col mouse */
.lingue a{display:inline-block;padding:10px 12px;text-decoration:none;color:var(--salvia);}
.lingue a.attiva{color:var(--verde);box-shadow:inset 0 -2px 0 var(--oro);}

/* ---- corpo ---- */
main{max-width:1180px;margin:0 auto;padding:30px 16px 70px;}
.colonne{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:26px;align-items:start;}
@media (max-width:980px){
  /* minmax(0,1fr) e non 1fr: con 1fr la colonna non scende sotto il suo
     contenuto, e il buono dell'anteprima è largo 700px fissi — la pagina
     finirebbe per scorrere in orizzontale su ogni telefono */
  .colonne{grid-template-columns:minmax(0,1fr);}
  /* al telefono l'anteprima va sopra: è quello che si sta comprando,
     e in fondo alla pagina non la vedrebbe nessuno prima di pagare */
  .fissa{position:static !important;order:-1;margin-bottom:4px;}
}
.riquadro{background:#fff;border:1px solid var(--sabbia);border-radius:10px;padding:22px;margin-bottom:18px;}
h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--oro);margin-bottom:6px;}
h2 + .guida{font-size:14px;color:var(--verde-medio);margin-bottom:12px;}
label{display:block;font-size:12px;letter-spacing:.5px;color:var(--verde-medio);margin:12px 0 5px;}
input,select,textarea{width:100%;padding:12px;border:1px solid #D8D2C4;border-radius:6px;
font:16px Arial;color:var(--inchiostro);background:#fff;}
textarea{min-height:70px;}
.due{display:flex;gap:14px;flex-wrap:wrap;}
.due>div{flex:1;min-width:200px;}
.scelta-tipo{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.scelta-tipo button{flex:1;min-width:180px;padding:14px;border:1.5px solid var(--sabbia);
border-radius:8px;background:#fff;font:15px Arial;color:var(--verde-medio);cursor:pointer;text-align:left;}
.scelta-tipo button strong{display:block;color:var(--verde);font-size:16px;margin-bottom:2px;}
.scelta-tipo button.attivo{border-color:var(--oro);background:#FDFBF5;}
button.paga{width:100%;background:var(--arancio);color:#fff;border:0;border-radius:8px;
padding:16px 22px;font:600 17px Arial;cursor:pointer;margin-top:18px;}
button.paga:disabled{background:#CFCABF;cursor:default;}
.mini{font-size:12.5px;color:var(--verde-medio);}
.esito{min-height:22px;padding-top:10px;font-size:14px;color:var(--verde);}
/* le condizioni si leggono prima di pagare, non quando arriva l'email */
.condizioni{margin-top:18px;border:1px solid var(--sabbia);border-radius:8px;background:#FBFAF7;padding:14px 16px;}
.cond-tit{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--oro);margin-bottom:8px;}
.cond-testo{font-size:12.5px;line-height:1.55;color:var(--verde-medio);max-height:150px;overflow:auto;}
.cond-spunta{display:flex;gap:9px;align-items:flex-start;margin-top:12px;
padding-top:12px;border-top:1px solid var(--sabbia);font-size:13.5px;color:var(--inchiostro);cursor:pointer;}
.cond-spunta input{width:auto;flex:0 0 auto;margin-top:2px;}
.chiusura{margin-top:12px;border-left:3px solid var(--oro);background:#FDFBF5;
padding:9px 12px;font-size:12.5px;line-height:1.5;color:var(--verde-medio);}
.errore{color:#C0392B;}
.fissa{position:sticky;top:14px;}
.fissa .etichetta{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--verde-medio);margin-bottom:8px;}
.telaio{background:#fff;border:1px solid var(--sabbia);border-radius:10px;padding:12px;overflow:hidden;}
/* il buono si adatta con il solo ridimensionamento: senza forzare qui la
   larghezza naturale, il max-width:100% del markup (che serve nelle email)
   lo restringerebbe una prima volta, e la scala una seconda */
.telaio > *{transform-origin:top left;width:700px !important;max-width:none !important;}
.grazie{max-width:640px;margin:40px auto;text-align:center;}
.grazie .segno{font-size:44px;color:var(--verde);}
.grazie h2{font-family:Georgia,serif;font-size:26px;letter-spacing:0;text-transform:none;
color:var(--verde);margin:14px 0 10px;}
.piede{border-top:1px solid var(--sabbia);padding:26px 20px 34px;text-align:center;
font-size:13px;color:var(--verde-medio);}
.piede .nome{font-family:Georgia,serif;letter-spacing:4px;color:var(--inchiostro);font-size:15px;margin-bottom:8px;}

/* ---- telefono ---- */
@media (max-width:640px){
  .testata{padding:22px 16px 26px;}
  .testata h1{font-size:26px;margin-top:18px;}
  .testata .sotto{font-size:14.5px;}
  .marchio{width:168px;max-width:70%;}
  main{padding:18px 12px 48px;}
  .colonne{gap:16px;}
  .riquadro{padding:16px 14px;margin-bottom:14px;border-radius:9px;}
  /* una sola colonna: due campi affiancati su 320px non ci stanno */
  .due{gap:0;}
  .due>div{flex:1 1 100%;min-width:0;}
  .scelta-tipo{gap:8px;}
  .scelta-tipo button{flex:1 1 100%;min-width:0;}
  /* niente scorrimento dentro lo scorrimento: le condizioni si leggono intere */
  .cond-testo{max-height:none;overflow:visible;font-size:13px;}
  .cond-spunta{font-size:14px;gap:11px;padding-top:14px;}
  .cond-spunta input{width:22px;height:22px;margin-top:0;}
  button.paga{padding:17px 18px;font-size:16.5px;}
  .telaio{padding:7px;}
  .piede{font-size:12.5px;padding:22px 16px 28px;}
  /* email e indirizzi lunghi non devono allargare la pagina */
  .riquadro,.esito{overflow-wrap:anywhere;}
}
</style>
</head>

  fr:'Ouverture saisonnière : l’hôtel ferme chaque année de fin novembre à février ; le bon n’est pas valable durant cette période. La majorité est requise pour accéder aux piscines, à l’hôtel et au spa ; entrées soumises à disponibilité et réservation obligatoire. Le bon n’est pas utilisable dans les 48 heures suivant l’achat, n’est ni remboursable ni convertible en espèces ; les montants restants après la première utilisation ne sont pas transférables. Validité 12 mois à compter de la date d’achat.'
};

  it:{ titolo:'Condizioni di acquisto', accetto:'Ho letto e accetto le condizioni di acquisto',
    manca:'Per procedere devi accettare le condizioni di acquisto.',
    chiusura:'L’hotel chiude da fine novembre a febbraio: in quel periodo il buono non è utilizzabile.',
    altraRicevuta:'Mando il riepilogo d’acquisto a un altro indirizzo',

    altraRicevutaNota:'Utile se paghi per l’azienda o giri tutto al commercialista. Non è una ricevuta fiscale: per quella ci contatti in reception.' },
  de:{ titolo:'Kaufbedingungen', accetto:'Ich habe die Kaufbedingungen gelesen und akzeptiere sie',
    manca:'Bitte akzeptieren Sie die Kaufbedingungen, um fortzufahren.',
    chiusura:'Das Hotel ist von Ende November bis Februar geschlossen: in diesem Zeitraum ist der Gutschein nicht einlösbar.',

    altraRicevutaNota:'Nützlich, wenn Sie für die Firma zahlen. Es ist keine steuerliche Quittung: dafür wenden Sie sich bitte an die Rezeption.' },
  en:{ titolo:'Purchase conditions', accetto:'I have read and accept the purchase conditions',

  fr:{ titolo:'Conditions d’achat', accetto:'J’ai lu et j’accepte les conditions d’achat',

    chiusura:'L’hôtel ferme de fin novembre à février : le bon n’est pas utilisable durant cette période.',

    altraRicevutaNota:'Utile si vous payez pour une entreprise. Ce n’est pas un reçu fiscal : pour cela, contactez la réception.' }
};

const TESTO_VALORE = {
  it:(v)=>`Buono valore di ${v} \u20ac, spendibile in hotel`,
  de:(v)=>`Wertgutschein \u00fcber ${v} \u20ac, im Hotel einl\u00f6sbar`,
  en:(v)=>`Gift voucher worth ${v} \u20ac, redeemable at the hotel`,
  fr:(v)=>`Bon d\u2019une valeur de ${v} \u20ac, utilisable \u00e0 l\u2019h\u00f4tel`
};

/* la foto segue quello che il cliente sta scegliendo; stesse categorie
   di fotoBuono() nella funzione `buoni` e di COPERTINE nel back office */
const BASE_IMG = 'https://arrivo-terme-leonardo.vercel.app/buoni/img';
function fotoBuono(b) {
  const id = String(b.voce_id || '');
  if (b.tipo === 'valore') return `${BASE_IMG}/valore.jpg`;
  if (id.startsWith('dayspa')) return `${BASE_IMG}/dayspa.jpg`;
  if (/^(prog|relax|plantare|candle|antistress|californiano|ayurveda|hotstone|pindasweda|linfo|shiatzu)/.test(id) ||
      /^(visofango|pulizia|ialuronico|collagene|vitaminac)/.test(id) ||
      /^(scrub|riducente|seno|antiage|manicure|pedicure|epil)/.test(id))
    return `${BASE_IMG}/trattamenti.jpg`;
  return `${BASE_IMG}/valore.jpg`;
}

function anteprimaHTML(b) {
  const e = ETI[b.lingua] || ETI.it;
  const dest = b.destinatario ? esc(b.destinatario) : '';
  return `<table cellpadding="0" cellspacing="0" border="0" width="700" style="width:700px;max-width:100%;
  border-collapse:collapse;font-family:Georgia,'Times New Roman',serif;background:#FFFFFF;">
<tr>
  <td width="240" valign="top" style="width:240px;background:#E4F0EA;padding:30px 24px;">
    <img src="${BASE_IMG}/logo.png" width="140" alt="Hotel Terme Leonardo"
      style="display:block;width:140px;height:auto;border:0;" />
    <img src="${fotoBuono(b)}" alt="" style="display:block;width:192px;height:130px;
      object-fit:cover;border-radius:2px;margin:24px 0 10px;" />
    <div style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;letter-spacing:2px;color:#7A9490;padding-top:20px;">
      ABANO TERME \u00b7 COLLI EUGANEI</div>
  </td>
  <td valign="top" style="padding:30px 28px;">
    <div style="width:34px;height:2px;background:#C9A961;margin-bottom:12px;"></div>
    <div style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;letter-spacing:3px;color:#C9A961;">
      ${e.titolo.toUpperCase()}</div>
    <div style="font-size:23px;line-height:1.3;color:#1B4D4A;margin:10px 0 0;">
      ${dest ? e.haRicevuto(dest) : e.senzaNome}</div>
    ${b.dedica ? `<div style="font-size:13px;font-style:italic;color:#5C736F;margin-top:12px;line-height:1.5;">
      ${esc(b.dedica)}</div>` : ''}
    ${b.acquirente ? `<div style="font-family:Arial,Helvetica,sans-serif;font-size:9px;letter-spacing:2px;color:#9AA9A6;margin-top:16px;">
      ${e.da}</div>
    <div style="font-size:14px;font-style:italic;color:#1B4D4A;margin-top:3px;">${esc(b.acquirente)}</div>` : ''}
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top:22px;border-collapse:collapse;">
      <tr><td style="border-left:3px solid #C9A961;background:#FBFAF7;padding:14px 16px;">
        <div style="font-size:16px;color:#1B4D4A;">${esc(b.descrizione || '\u2026')}</div>
      </td></tr>
    </table>
    <div style="font-family:Arial,Helvetica,sans-serif;font-size:9px;letter-spacing:2px;color:#9AA9A6;margin-top:22px;">
      ${e.codice}</div>
    <div style="font-family:'Courier New',monospace;font-size:16px;letter-spacing:2px;color:#C7C2B6;margin-top:5px;">
      \u2014 \u2014 \u2014 \u2014 \u2014 \u2014</div>
  </td>
</tr>
</table>`;
}

/* ---------- la pagina ---------- */
let TIPO = 'servizio';

function testata() {
  const t = T[LNG];
  $('tTitolo').textContent = t.titolo;
  $('tSotto').textContent = t.sotto;
  $('lingue').innerHTML = [['it','Italiano'],['de','Deutsch'],['en','English'],['fr','Fran\u00e7ais']]
    .map(([l,n]) => `<a href="?l=${l}" class="${l===LNG?'attiva':''}">${n}</a>`).join('');
  document.documentElement.lang = LNG;
}

function grazie() {
  const t = T[LNG];
  const rif = qs.get('rif') || '';
  $('pagina').innerHTML = `<div class="grazie">
    <div class="segno">\u2713</div>
    <h2>${esc(t.grazieTit)}</h2>
    <p style="color:var(--verde-medio);">${t.grazieTxt(esc(rif))}</p>
    <p style="margin-top:22px;"><a href="?l=${LNG}">${esc(t.grazieAncora)}</a></p>
  </div>`;
}

function modulo() {
  const t = T[LNG];
  const g = LEGALE[LNG] || LEGALE.it;
  $('pagina').innerHTML = `<div class="colonne"><div>
    <div class="riquadro">
      <h2>${esc(t.cosa)}</h2><div class="guida">${esc(t.guidaCosa)}</div>
      <div class="scelta-tipo">
        <button type="button" id="btServizio" class="attivo"><strong>${esc(t.servizio)}</strong>${esc(t.servizioSotto)}</button>
        <button type="button" id="btValore"><strong>${esc(t.valore)}</strong>${esc(t.valoreSotto)}</button>
      </div>
      <div id="boxServizio">
        <label>${esc(t.voce)}</label>
        <select id="fVoce">${CATALOGO.map(gr =>
          `<optgroup label="${esc(gr.g[LNG] || gr.g.it)}">` + gr.v.map(([id, nome, prezzo]) =>
            `<option value="${id}" data-prezzo="${prezzo}" data-nome="${esc(nome)}">${esc(nome)} \u2014 ${eur(prezzo)} \u20ac</option>`
          ).join('') + `</optgroup>`).join('')}
        </select>
      </div>
      <div id="boxValore" style="display:none;">
        <label>${esc(t.importo)}</label>
        <input type="number" id="fValore" min="25" max="1000" step="1" placeholder="100" />
        <div class="mini" style="margin-top:5px;">${esc(t.importoGuida)}</div>
      </div>
      <div class="chiusura">${esc(g.chiusura)}</div>
    </div>

    <div class="riquadro">
      <h2>${esc(t.per)}</h2><div class="guida">${esc(t.guidaPer)}</div>
      <label>${esc(t.dest)}</label><input type="text" id="fDest" />
      <label>${esc(t.dedica)}</label><textarea id="fDedica" placeholder="${esc(t.dedicaPh)}"></textarea>
      <label>${esc(t.linguaBuono)}</label>
      <select id="fLingua">
        <option value="it">Italiano</option><option value="de">Deutsch</option>
        <option value="en">English</option><option value="fr">Fran\u00e7ais</option>
      </select>
    </div>

    <div class="riquadro">
      <h2>${esc(t.tu)}</h2><div class="guida">${esc(t.guidaTu)}</div>
      <div class="due">
        <div><label>${esc(t.acq)}</label><input type="text" id="fAcq" autocomplete="name" /></div>
        <div><label>${esc(t.mail)} *</label><input type="email" id="fAcqMail" autocomplete="email" /></div>
      </div>
      <label>${esc(t.mailDest)}</label><input type="email" id="fDestMail" />
      <div class="mini" style="margin-top:5px;">${esc(t.mailDestNota)}</div>
      <label class="cond-spunta" style="border:0;padding-top:14px;margin-top:6px;">
        <input type="checkbox" id="fAltraRic" /><span>${esc(g.altraRicevuta)}</span>
      </label>
      <div id="boxRicevuta" style="display:none;">
        <input type="email" id="fRicMail" placeholder="${esc(g.altraRicevutaPh)}" />
        <div class="mini" style="margin-top:5px;">${esc(g.altraRicevutaNota)}</div>
      </div>
      <div class="condizioni">
        <div class="cond-tit">${esc(g.titolo)}</div>
        <div class="cond-testo">${esc(CONDIZIONI[LNG] || CONDIZIONI.it)}</div>
        <label class="cond-spunta">
          <input type="checkbox" id="fCond" /><span>${esc(g.accetto)}</span>
        </label>
      </div>
      <button class="paga" id="fPaga" disabled></button>
      <div class="mini" style="margin-top:10px;">${esc(t.pagoIn)}</div>
      <div class="esito" id="fEsito"></div>
    </div>
  </div>

  <div class="fissa">
    <div class="etichetta">${esc(t.anteprima)}</div>
    <div class="telaio" id="telaio"></div>
  </div></div>`;

  $('fLingua').value = LNG;

  const stato = () => {
    const servizio = TIPO === 'servizio';
    let descrizione = '', valore = 0, voce_id = null;
    if (servizio) {
      const o = $('fVoce').selectedOptions[0];
      voce_id = $('fVoce').value; descrizione = o.dataset.nome; valore = Number(o.dataset.prezzo);
    } else {
      valore = parseFloat($('fValore').value) || 0;
      descrizione = valore > 0 ? (TESTO_VALORE[$('fLingua').value] || TESTO_VALORE.it)(eur(valore)) : '';
    }
    return { tipo: TIPO, voce_id: servizio ? voce_id : null, descrizione, valore,
      lingua: $('fLingua').value, destinatario: $('fDest').value.trim(),
      dedica: $('fDedica').value.trim(), acquirente: $('fAcq').value.trim(),
      acquirente_email: $('fAcqMail').value.trim(), destinatario_email: $('fDestMail').value.trim() };
  };

  const ridisegna = () => {
    const b = stato();
    $('fPaga').textContent = t.paga(eur(b.valore));
    const tel = $('telaio');
    tel.innerHTML = anteprimaHTML(b);
    const dentro = tel.firstElementChild;
    if (dentro) {
      const scala = Math.min(1, (tel.clientWidth - 4) / 700);
      dentro.style.transform = `scale(${scala})`;
      tel.style.height = (dentro.offsetHeight * scala + 6) + 'px';
    }
  };

  const scegli = (tipo) => {
    TIPO = tipo;
    $('btServizio').classList.toggle('attivo', tipo === 'servizio');
    $('btValore').classList.toggle('attivo', tipo === 'valore');
    $('boxServizio').style.display = tipo === 'servizio' ? '' : 'none';
    $('boxValore').style.display = tipo === 'valore' ? '' : 'none';
    ridisegna();
  };
  $('btServizio').onclick = () => scegli('servizio');
  $('btValore').onclick = () => scegli('valore');
  ['fVoce','fValore','fDest','fDedica','fLingua','fAcq'].forEach(id => {
    const e = $(id); e.oninput = ridisegna; e.onchange = ridisegna;
  });
  /* il campo per il riepilogo compare solo se serve davvero */
  $('fAltraRic').onchange = () => {
    $('boxRicevuta').style.display = $('fAltraRic').checked ? '' : 'none';
    if (!$('fAltraRic').checked) $('fRicMail').value = '';
  };

  /* si paga solo dopo aver accettato le condizioni. I gestori si attaccano
     PRIMA del primo disegno: se ridisegna() inciampasse, il pulsante
     resterebbe disabilitato per sempre e la spunta inerte, cioè una pagina
     che non si sblocca con nessuna azione dell'utente. */
  let inviando = false;
  const condOk = () => $('fCond').checked;
  const aggiornaPaga = () => { $('fPaga').disabled = inviando || !condOk(); };
  $('fCond').onchange = () => {
    aggiornaPaga();
    if (condOk() && !inviando) $('fEsito').textContent = '';
  };
  /* tornando indietro da Stripe il browser ripristina la pagina com'era,
     con il pulsante spento e "un momento…" ancora scritto: va riarmata */
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) { inviando = false; $('fEsito').textContent = ''; aggiornaPaga(); }
  });

  /* sul telefono la barra degli indirizzi che si apre e chiude scatena
     un resize a ogni scorrimento: senza freno l'anteprima si ridisegna
     di continuo e la pagina scatta */
  let attesaResize;
  window.addEventListener('resize', () => {
    clearTimeout(attesaResize);
    attesaResize = setTimeout(ridisegna, 150);
  });
  ridisegna();

  $('fPaga').onclick = async () => {
    const b = stato();
    const emailOk = /.+@.+\..+/.test(b.acquirente_email);
    const valoreOk = b.tipo === 'valore' ? (b.valore >= 25 && b.valore <= 1000) : (b.valore > 0);
    if (!b.descrizione || !valoreOk || !emailOk) {
      $('fEsito').innerHTML = `<span class="errore">${esc(t.manca)}</span>`; return;
    }
    if (!condOk()) {
      $('fEsito').innerHTML = `<span class="errore">${esc(g.manca)}</span>`; return;
    }
    inviando = true; aggiornaPaga();
    $('fEsito').textContent = t.attesa;
    try {
      const r = await fetch(FUNZIONE + '?a=acquista', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ ...b, condizioni_accettate: condOk(),
          ricevuta_email: $('fAltraRic').checked ? $('fRicMail').value.trim() : '',
          ritorno: location.origin + location.pathname + '?l=' + LNG })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.url) throw new Error(j.errore || 'errore');
      location.href = j.url;
    } catch (e) {
      $('fEsito').innerHTML = `<span class="errore">${esc(t.erroreGen)}</span>`;
      inviando = false; aggiornaPaga();
    }
  };
}

testata();
if (qs.get('ok') === '1') grazie(); else modulo();
</script>
</body>
</html>
