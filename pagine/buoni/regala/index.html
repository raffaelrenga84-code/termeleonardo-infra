<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buoni Regalo — Hotel Terme Leonardo</title>
<meta name="description" content="Regala una giornata alle piscine termali, un massaggio o un buono valore all'Hotel Terme Leonardo di Abano Terme." />
<style>
:root{--verde:#1B4D4A;--verde-medio:#5C736F;--verde-chiaro:#E4F0EA;--salvia:#7A9490;
--oro:#C9A961;--carta:#FBFAF7;--sabbia:#EDE7DC;--inchiostro:#2A2E2B;--arancio:#E8751A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--carta);color:var(--inchiostro);
font:16px/1.6 Arial,Helvetica,sans-serif;}
.serif{font-family:Georgia,'Times New Roman',serif;}
a{color:var(--verde);}

/* ---- testata ---- */
.testata{background:var(--verde-chiaro);padding:34px 20px 40px;text-align:center;}
.marchio{display:block;width:200px;max-width:60%;height:auto;margin:0 auto;}
.testata h1{font-family:Georgia,serif;font-weight:normal;font-size:32px;line-height:1.25;
color:var(--verde);margin-top:26px;}
.testata .sotto{color:var(--verde-medio);max-width:560px;margin:12px auto 0;font-size:15px;}
.lingue{position:absolute;top:12px;right:12px;margin:0;}
.lingue select{width:auto;margin:0;padding:6px 26px 6px 9px;font-size:14px;border-radius:8px;
  border:1px solid rgba(26,54,38,.15);background:rgba(255,255,255,.8);color:var(--salvia);cursor:pointer;}
/* bersagli comodi da toccare col pollice, non solo da cliccare col mouse */

/* ---- corpo ---- */
main{max-width:1180px;margin:0 auto;padding:30px 16px 70px;}
.colonne{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:26px;align-items:start;}
@media (max-width:980px){
  /* minmax(0,1fr) e non 1fr: con 1fr la colonna non scende sotto il suo
     contenuto, e il buono dell'anteprima è largo 700px fissi — la pagina
     finirebbe per scorrere in orizzontale su ogni telefono */
  .colonne{grid-template-columns:minmax(0,1fr);}
  /* al telefono l'anteprima va sopra: è quello che si sta comprando,
     e in fondo alla pagina non la vedrebbe nessuno prima di pagare */
  .fissa{position:static !important;order:-1;margin-bottom:4px;}
}
.riquadro{background:#fff;border:1px solid var(--sabbia);border-radius:10px;padding:22px;margin-bottom:18px;}
h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--oro);margin-bottom:6px;}
h2 + .guida{font-size:14px;color:var(--verde-medio);margin-bottom:12px;}
label{display:block;font-size:12px;letter-spacing:.5px;color:var(--verde-medio);margin:12px 0 5px;}
input,select,textarea{width:100%;padding:12px;border:1px solid #D8D2C4;border-radius:6px;
font:16px Arial;color:var(--inchiostro);background:#fff;}
textarea{min-height:70px;}
.due{display:flex;gap:14px;flex-wrap:wrap;}
.due>div{flex:1;min-width:200px;}
.scelta-tipo{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.scelta-tipo button{flex:1;min-width:180px;padding:14px;border:1.5px solid var(--sabbia);
border-radius:8px;background:#fff;font:15px Arial;color:var(--verde-medio);cursor:pointer;text-align:left;}
.scelta-tipo button strong{display:block;color:var(--verde);font-size:16px;margin-bottom:2px;}
.scelta-tipo button.attivo{border-color:var(--oro);background:#FDFBF5;}
/* «aggiungi/togli la seconda voce»: un collegamento, non un pulsante — non è
   un'azione allo stesso livello di "paga", è un dettaglio del modulo */
.link-voce{display:inline-block;margin-top:10px;background:none;border:0;padding:0;
color:var(--verde);font:14px Arial;text-decoration:underline;cursor:pointer;}
.link-voce:hover{color:var(--oro);}
button.paga{width:100%;background:var(--arancio);color:#fff;border:0;border-radius:8px;
padding:16px 22px;font:600 17px Arial;cursor:pointer;margin-top:18px;}
button.paga:disabled{background:#CFCABF;cursor:default;}
.mini{font-size:12.5px;color:var(--verde-medio);}
.esito{min-height:22px;padding-top:10px;font-size:14px;color:var(--verde);}
/* le condizioni si leggono prima di pagare, non quando arriva l'email */
.condizioni{margin-top:18px;border:1px solid var(--sabbia);border-radius:8px;background:#FBFAF7;padding:14px 16px;}
.cond-tit{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--oro);margin-bottom:8px;}
.cond-testo{font-size:12.5px;line-height:1.55;color:var(--verde-medio);max-height:150px;overflow:auto;}
.cond-spunta{display:flex;gap:9px;align-items:flex-start;margin-top:12px;
padding-top:12px;border-top:1px solid var(--sabbia);font-size:13.5px;color:var(--inchiostro);cursor:pointer;}
.cond-spunta input{width:auto;flex:0 0 auto;margin-top:2px;}
.chiusura{margin-top:12px;border-left:3px solid var(--oro);background:#FDFBF5;
padding:9px 12px;font-size:12.5px;line-height:1.5;color:var(--verde-medio);}
.errore{color:#C0392B;}
.fissa{position:sticky;top:14px;}
.fissa .etichetta{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--verde-medio);margin-bottom:8px;}
.telaio{background:#fff;border:1px solid var(--sabbia);border-radius:10px;padding:12px;overflow:hidden;}
/* il buono si adatta con il solo ridimensionamento: senza forzare qui la
   larghezza naturale, il max-width:100% del markup (che serve nelle email)
   lo restringerebbe una prima volta, e la scala una seconda */
.telaio > *{transform-origin:top left;width:700px !important;max-width:none !important;}
.grazie{max-width:640px;margin:40px auto;text-align:center;}
.grazie .segno{font-size:44px;color:var(--verde);}
.grazie h2{font-family:Georgia,serif;font-size:26px;letter-spacing:0;text-transform:none;
color:var(--verde);margin:14px 0 10px;}
.piede{border-top:1px solid var(--sabbia);padding:26px 20px 34px;text-align:center;
font-size:13px;color:var(--verde-medio);}
.piede .nome{font-family:Georgia,serif;letter-spacing:4px;color:var(--inchiostro);font-size:15px;margin-bottom:8px;}

/* ---- telefono ---- */
@media (max-width:640px){
  .testata{padding:22px 16px 26px;}
  .testata h1{font-size:26px;margin-top:18px;}
  .testata .sotto{font-size:14.5px;}
  .marchio{width:168px;max-width:70%;}
  main{padding:18px 12px 48px;}
  .colonne{gap:16px;}
  .riquadro{padding:16px 14px;margin-bottom:14px;border-radius:9px;}
  /* una sola colonna: due campi affiancati su 320px non ci stanno */
  .due{gap:0;}
  .due>div{flex:1 1 100%;min-width:0;}
  .scelta-tipo{gap:8px;}
  .scelta-tipo button{flex:1 1 100%;min-width:0;}
  /* niente scorrimento dentro lo scorrimento: le condizioni si leggono intere */
  .cond-testo{max-height:none;overflow:visible;font-size:13px;}
  .cond-spunta{font-size:14px;gap:11px;padding-top:14px;}
  .cond-spunta input{width:22px;height:22px;margin-top:0;}
  button.paga{padding:17px 18px;font-size:16.5px;}
  .telaio{padding:7px;}
  .piede{font-size:12.5px;padding:22px 16px 28px;}
  /* email e indirizzi lunghi non devono allargare la pagina */
  .riquadro,.esito{overflow-wrap:anywhere;}
}
</style>
</head>

function modulo() {
  const t = T[LNG];
  const g = LEGALE[LNG] || LEGALE.it;
  /* la stessa lista di opzioni serve due volte, per la prima e per la
     seconda voce: una funzione sola, cosi' le due tendine non possono
     divergere fra loro */
  /* `escludi(id)`, se passato, toglie dalla tendina le voci che non
     dovrebbero starci \u2014 un gruppo che resta senza voci non si stampa
     nemmeno lui, un <optgroup> vuoto sarebbe solo rumore nella tendina */
  const opzioniCatalogo = (escludi) => CATALOGO.map(gr => {
    const voci = escludi ? gr.v.filter(([id]) => !escludi(id)) : gr.v;
    if (!voci.length) return '';
    return `<optgroup label="${esc(gr.g[LNG] || gr.g.it)}">` + voci.map(([id, nome, prezzo]) =>
      `<option value="${id}" data-prezzo="${prezzo}" data-nome="${esc(nome)}">${esc(nome)} \u2014 ${eur(prezzo)} \u20ac</option>`
    ).join('') + `</optgroup>`;
  }).join('');

  /* Il Day Spa serale non ha trattamenti alle spalle: alle 18-22.30 di
     venerdi' e sabato il centro benessere non fa trattamenti, e un buono
     "serale + massaggio" sarebbe un buono che l'ospite non potrebbe usare
     come gli e' stato venduto. La nota in fondo al buono non promette piu'
     "venga in momenti diversi" (tolta apposta dalla proprieta', vedi
     ETI.nota in buono.js): non basta rimandare il problema all'ospite,
     va evitato mentre sceglie. Un altro ingresso Day Spa (anche un
     secondo serale) resta libero di combinarsi: e' un ingresso, non un
     trattamento che pretende il centro aperto.
     Stessa regola del server (normalizzaVoci, acquista.ts), scritta qui a
     mano e non importata: pagina statica ed edge function vivono in due
     ambienti diversi, stesso motivo di QUANTITA_MAX piu' sotto. Presidiata
     contro la regola vera del server in regala/serale.test.ts, coppia per
     coppia su tutto il listino. */
  const eSerale = (id) => id === 'dayspa_sera';
  const eIngressoDaySpa = (id) => id.startsWith('dayspa');
  /* cosa la tendina dell'ALTRA voce non deve poter offrire, dato il
     valore di questa: col serale, niente trattamenti; con un trattamento,
     niente serale; con un altro ingresso Day Spa (infrasettimanale o
     festivo) o senza ancora una scelta, nessuna esclusione. */
  const escludiPer = (id) => !id ? null : eSerale(id) ? (altro) => !eIngressoDaySpa(altro) : !eIngressoDaySpa(id) ? (altro) => eSerale(altro) : null;

  /* la seconda tendina si ricostruisce sul valore della prima. Se
     l'elenco filtrato non cambia si lascia stare del tutto: sostituire
     l'HTML resetta comunque la selezione alla prima opzione, e farlo ogni
     volta che la prima tendina cambia \u2014 anche fra due voci che non si
     escludono a vicenda \u2014 sposterebbe la scelta della seconda ospite senza
     ragione. Se invece l'elenco cambia davvero e la voce di prima c'e'
     ancora, si ripristina: solo se e' proprio lei a sparire (il caso che
     conta: era il serale, o era un trattamento incompatibile con la nuova
     prima scelta) la selezione scivola sulla prima voce rimasta. */
  const rigenerafVoce2 = () => {
    const valorePrima = $('fVoce2').value;
    const nuove = opzioniCatalogo(escludiPer($('fVoce').value));

    $('fVoce2').innerHTML = nuove;
    if ([...$('fVoce2').options].some((o) => o.value === valorePrima)) $('fVoce2').value = valorePrima;
  };
  /* da 1 a 4: lo stesso limite che il server applica per ciascuna voce,
     qui e' semplicemente l'unica scelta possibile nella tendina */
  const opzioniQuantita = () => [1, 2, 3, 4].map(n => `<option value="${n}">${n}</option>`).join('');

        <div class="mini errore" id="erroreVoci" style="display:none;margin-top:8px;"></div>
      </div>
      <div id="boxValore" style="display:none;">
        <label>${esc(t.importo)}</label>

        <div class="mini" id="importoGuida" style="margin-top:5px;">${esc(t.importoGuida)}</div>
      </div>
      <div class="chiusura">${esc(g.chiusura)}</div>
    </div>

    <div class="riquadro">
      <h2>${esc(t.per)}</h2><div class="guida">${esc(t.guidaPer)}</div>
      <label>${esc(t.dest)}</label><input type="text" id="fDest" />

    </div>

    <div class="riquadro">

      <div class="due">
        <div><label>${esc(t.acq)}</label><input type="text" id="fAcq" autocomplete="name" /></div>
        <div><label>${esc(t.mail)} *</label><input type="email" id="fAcqMail" autocomplete="email" /></div>

          </div>
          <div class="due">
            <div><label>${esc(t.fattSdi)}</label><input type="text" id="fFattSdi" maxlength="7" /></div>
            <div><label>${esc(t.fattPec)}</label><input type="email" id="fFattPec" /></div>
          </div>
          <div class="mini" style="margin-top:5px;">${esc(t.fattSdiPecNota)}</div>
        </div>

        <div class="mini errore" id="erroreFatt" style="display:none;margin-top:8px;"></div>
      </div>

      <div class="condizioni">
        <div class="cond-tit">${esc(g.titolo)}</div>

  $('fLingua').value = LNG;

  /* legge una tendina voce + la sua quantita': quello che riepilogoVoci()
     si aspetta in ingresso per comporre la stessa descrizione e lo stesso
     totale che comporra' il server */
  const leggiVoce = (idVoce, idQta) => {
    const o = $(idVoce).selectedOptions[0];
    return { voce_id: $(idVoce).value, nome: o.dataset.nome,
      prezzo: Number(o.dataset.prezzo), quantita: Number($(idQta).value) || 1 };
  };

  /* lo stesso tetto per singola voce che il server applica in acquista.ts
     (normalizzaVoci): scritto qui a mano e non importato, perche' pagina
     statica ed edge function vivono in due ambienti diversi. Cambia cosi'
     di rado — e' legato allo spazio sul foglio del buono, si veda il
     commento su VOCI_MAX in acquista.ts — che tenerlo in due punti costa
     meno di condividerlo. */
  const QUANTITA_MAX = 4;

  /* scegliere la stessa voce in entrambe le tendine e' lecito, il server la
     fonde in una riga sola — ma se le quantita' sommate superano il tetto
     il server rifiuta l'intero acquisto. Meglio che l'ospite lo scopra qui,
     accanto alle tendine dove l'ha causato, che dopo aver compilato nome,
     email, dedica e le due spunte, con in mano solo un errore generico. */
  const vociFuseTroppo = () => {
    if (TIPO !== 'servizio' || $('rigaVoce2').style.display === 'none') return false;
    if ($('fVoce').value !== $('fVoce2').value) return false;
    return (Number($('fQta1').value) || 0) + (Number($('fQta2').value) || 0) > QUANTITA_MAX;
  };

  /* difensivo, non la prima barriera: con la seconda tendina filtrata da
     rigenerafVoce2() (vedi sopra) l'ospite non dovrebbe mai riuscire a
     mettere insieme il serale e un trattamento — ma se qualcosa nella
     filtratura si inceppasse, questo e' lo stesso controllo che gia' fa
     normalizzaVoci sul server (acquista.ts), cosi' il pulsante si spegne
     comunque invece di lasciar credere che l'acquisto possa andare avanti. */
  const seraleConTrattamento = () => {
    if (TIPO !== 'servizio' || $('rigaVoce2').style.display === 'none') return false;
    const scelte = [$('fVoce').value, $('fVoce2').value];
    return scelte.some(eSerale) && scelte.some((id) => !eIngressoDaySpa(id));
  };

  /* l'avviso compare appena il serale limita l'altra tendina, prima ancora
     che l'ospite possa arrivare alla combinazione vietata: spiega perche'
     certe voci non compaiono piu' nell'altra tendina, invece di lasciarlo
     a chiedersi dove sono finite */
  const mostraNotaSerale = () => TIPO === 'servizio' && $('rigaVoce2').style.display !== 'none'
    && escludiPer($('fVoce').value) !== null;

  /* stesso principio di vociFuseTroppo qui sopra: il limite vero resta sul
     server (25-1.000 €, in acquista.ts), ma se la cifra digitata lo supera
     l'ospite deve saperlo subito — non al momento di pagare, quando
     l'anteprima avrebbe gia' mostrato un buono che non puo' esistere. Zero
     (campo vuoto, o non ancora un numero) non conta come fuori limite: e'
     semplicemente un campo non ancora compilato. */
  const importoFuoriLimiti = () => {
    if (TIPO !== 'valore') return false;
    const v = arrotondaValore($('fValore').value);
    return v !== 0 && (v < 25 || v > 1000);
  };

  const stato = () => {
    const servizio = TIPO === 'servizio';
    let descrizione = '', valore = 0, voce_id = null, voci = [];
    if (servizio) {
      const scelte = [leggiVoce('fVoce', 'fQta1')];
      /* la seconda voce conta solo quando il suo riquadro e' aperto: chiusa,
         resta una tendina qualunque ferma sulla prima opzione */
      if ($('rigaVoce2').style.display !== 'none') scelte.push(leggiVoce('fVoce2', 'fQta2'));
      const r = riepilogoVoci(scelte);
      descrizione = r.descrizione; valore = r.valore; voci = r.voci;
      voce_id = voci[0] ? voci[0].voce_id : null;
    } else {
      /* stesso arrotondamento del server: vedi il commento su
         arrotondaValore piu' sopra. Fuori dai limiti (25-1.000 €)
         l'anteprima non disegna nessuna cifra — mostrare "Buono valore di
         1.000.000,00 €" prometterebbe un buono che il server rifiuterebbe
         comunque al momento di pagare */
      valore = arrotondaValore($('fValore').value);
      const entroLimiti = valore >= 25 && valore <= 1000;
      descrizione = entroLimiti ? (TESTO_VALORE[$('fLingua').value] || TESTO_VALORE.it)(eur(valore)) : '';
    }
    return { tipo: TIPO, voce_id: servizio ? voce_id : null, voci: servizio ? voci : [],
      descrizione, valore,
      lingua: $('fLingua').value, destinatario: $('fDest').value.trim(),
      dedica: $('fDedica').value.trim(), acquirente: $('fAcq').value.trim(),
      acquirente_email: $('fAcqMail').value.trim(), destinatario_email: $('fDestMail').value.trim(),
      scade_il: fraDodiciMesi() };
  };

  const ridisegna = () => {
    const b = stato();
    $('fPaga').textContent = t.paga(eur(b.valore));
    const tel = $('telaio');
    tel.innerHTML = buonoHTML(b, true);
    const dentro = tel.firstElementChild;
    if (dentro) {
      const scala = Math.min(1, (tel.clientWidth - 4) / 700);
      dentro.style.transform = `scale(${scala})`;
      tel.style.height = (dentro.offsetHeight * scala + 6) + 'px';
    }
    /* l'avviso compare accanto alle tendine appena la scelta lo causa, non
       solo al momento di pagare; aggiornaPaga() spegne anche il pulsante,
       cosi' il messaggio e lo stato del modulo dicono la stessa cosa.
       Tre casi, in ordine di gravita': una combinazione davvero vietata
       (rossa, come vociFuseTroppo — non dovrebbe succedere, e' difensiva),
       altrimenti la nota che spiega perche' l'altra tendina offre di meno
       (informativa, non un errore: l'ospite non ha ancora sbagliato niente). */
    const erroreVoci = $('erroreVoci');
    if (vociFuseTroppo()) {
      erroreVoci.textContent = t.stessaVoceTroppo;
      erroreVoci.className = 'mini errore'; erroreVoci.style.display = '';
    } else if (seraleConTrattamento()) {
      erroreVoci.textContent = t.seraleConTrattamento;
      erroreVoci.className = 'mini errore'; erroreVoci.style.display = '';
    } else if (mostraNotaSerale()) {
      erroreVoci.textContent = t.seraleConTrattamento;
      erroreVoci.className = 'mini'; erroreVoci.style.display = '';
    } else {
      erroreVoci.style.display = 'none';
    }
    /* stesso schema, per l'importo libero: il testo di aiuto gia' dice il
       limite ("da 25 a 1.000 €"), colorarlo di avviso quando lo si supera
       basta a farlo notare mentre si scrive, senza inventare un secondo
       messaggio che dovrebbe restare tradotto in ogni lingua */
    $('importoGuida').classList.toggle('errore', importoFuoriLimiti());
    aggiornaPaga();
  };

  const scegli = (tipo) => {
    TIPO = tipo;
    $('btServizio').classList.toggle('attivo', tipo === 'servizio');
    $('btValore').classList.toggle('attivo', tipo === 'valore');
    $('boxServizio').style.display = tipo === 'servizio' ? '' : 'none';
    $('boxValore').style.display = tipo === 'valore' ? '' : 'none';
    ridisegna();
  };
  $('btServizio').onclick = () => scegli('servizio');
  $('btValore').onclick = () => scegli('valore');
  ['fVoce','fQta1','fVoce2','fQta2','fValore','fDest','fDedica','fLingua','fAcq'].forEach(id => {
    const e = $(id); e.oninput = ridisegna; e.onchange = ridisegna;
  });
  /* la prima tendina scavalca il gestore generico qui sopra: cambiando
     voce puo' cambiare anche cosa la seconda tendina puo' offrire (il
     serale scelto qui esclude i trattamenti li', un trattamento esclude
     il serale), quindi la si rigenera PRIMA di ridisegnare l'anteprima —
     se l'opzione gia' scelta in fVoce2 sparisce, il browser sposta da solo
     la selezione sulla prima rimasta, ed e' quella che ridisegna() legge. */
  $('fVoce').oninput = $('fVoce').onchange = () => { rigenerafVoce2(); ridisegna(); };
  /* la seconda voce si apre e si chiude: mai una terza, non esiste una
     terza tendina da poter aprire */
  $('btAggiungiVoce').onclick = () => {
    $('rigaVoce2').style.display = '';
    $('btAggiungiVoce').style.display = 'none';
    /* filtrata sul valore della prima tendina PRIMA di scegliere l'indice
       di partenza, o il conteggio delle opzioni disponibili sarebbe quello
       di prima del filtro */
    rigenerafVoce2();
    /* la seconda tendina si apre su un articolo diverso dal primo: ferma
       com'era sul primo elemento del catalogo, l'anteprima si fonderebbe
       subito in una riga con un numero davanti senza che l'ospite abbia
       scelto niente */
    $('fVoce2').selectedIndex = (Number($('fVoce').selectedIndex) + 1) % $('fVoce2').options.length;
    ridisegna();
    $('fVoce2').focus();
  };
  $('btRimuoviVoce2').onclick = () => {
    $('rigaVoce2').style.display = 'none';
    $('btAggiungiVoce').style.display = '';
    $('fVoce2').selectedIndex = 0; $('fQta2').value = '1';
    ridisegna();
  };
  /* il campo per il riepilogo compare solo se serve davvero */
  $('fAltraRic').onchange = () => {
    $('boxRicevuta').style.display = $('fAltraRic').checked ? '' : 'none';
    if (!$('fAltraRic').checked) $('fRicMail').value = '';
  };

  /* ---------- riquadro fattura: prima privato o azienda, poi solo i campi di quel caso ----------
     Validazione SOLO lato client, per un messaggio gentile prima di
     pagare: quella vera sta sul server (fattura.ts, richiamato da
     acquista.ts) — un campo può sempre arrivare falsificato da una
     chiamata diretta. Niente cifra di controllo della partita IVA qui:
     due copie dello stesso algoritmo divergono prima o poi (stesso
     principio del commento su calcolaScadenza in scadenza.ts) — una
     partita IVA sbagliata la scopre comunque il server, e l'ospite vede
     lo stesso messaggio generico di qualunque altro rifiuto del server. */
  const fatturaAttiva = () => $('fFattRichiesta').checked;

  const fattCampiComuniOk = () => {
    const indirizzo = $('fFattIndirizzo').value.trim();
    const cap = $('fFattCap').value.trim();
    const comune = $('fFattComune').value.trim();
    const provincia = $('fFattProvincia').value.trim();
    return indirizzo.length > 0 && indirizzo.length <= 60
      && /^\d{5}$/.test(cap)
      && comune.length > 0 && comune.length <= 60
      && /^[A-Z]{2}$/.test(provincia);
  };
  const fattPrivatoOk = () => /^[A-Za-z0-9]{16}$/.test($('fFattCfPrivato').value.trim());
  const fattAziendaOk = () => {
    const denom = $('fFattDenominazione').value.trim();
    const piva = $('fFattPiva').value.trim();
    const sdi = $('fFattSdi').value.trim();
    const pec = $('fFattPec').value.trim();
    /* codice destinatario o PEC, almeno uno dei due: è l'errore che le
       aziende fanno più spesso, e quello che fa scartare la fattura
       dallo SdI giorni dopo — vale la pena dirlo già qui */
    return denom.length >= 2 && denom.length <= 80
      && /^\d{11}$/.test(piva)
      && (/^[A-Za-z0-9]{7}$/.test(sdi) || /.+@.+\..+/.test(pec));
  };
  const fatturaOk = () => {
    if (!fatturaAttiva()) return true;
    if (!fattCampiComuniOk()) return false;
    return FATT_TIPO === 'privato' ? fattPrivatoOk() : fattAziendaOk();
  };
  /* i dati per il corpo della richiesta: solo quelli del caso scelto, così
     un privato non manda mai una ragione sociale o un codice destinatario
     che comunque il server ignorerebbe (vedi fattura.ts) */
  const datiFattura = () => {
    if (!fatturaAttiva()) return { fatt_richiesta: false };
    const comuni = {
      fatt_richiesta: true, fatt_intestatario: FATT_TIPO,
      fatt_indirizzo: $('fFattIndirizzo').value.trim(),
      fatt_civico: $('fFattCivico').value.trim(),
      fatt_cap: $('fFattCap').value.trim(),
      fatt_comune: $('fFattComune').value.trim(),
      fatt_provincia: $('fFattProvincia').value.trim(),
    };
    return FATT_TIPO === 'privato'
      ? { ...comuni, fatt_cf: $('fFattCfPrivato').value.trim() }
      : { ...comuni,
          fatt_denominazione: $('fFattDenominazione').value.trim(),
          fatt_piva: $('fFattPiva').value.trim(),
          fatt_cf: $('fFattCfAzienda').value.trim(),
          fatt_sdi: $('fFattSdi').value.trim(),
          fatt_pec: $('fFattPec').value.trim() };
  };

  /* il messaggio compare solo quando la spunta è attiva e i dati non sono
     ancora completi: a modulo appena aperto, vuoto, non è un errore */
  const aggiornaFattura = () => {
    const erroreFatt = $('erroreFatt');
    if (fatturaAttiva() && !fatturaOk()) {
      erroreFatt.textContent = t.fattManca;
      erroreFatt.style.display = '';
    } else {
      erroreFatt.style.display = 'none';
    }
    aggiornaPaga();
  };

  $('fFattRichiesta').onchange = () => {
    $('boxFatt').style.display = fatturaAttiva() ? '' : 'none';
    aggiornaFattura();
  };
  const scegliFatt = (tipo) => {
    FATT_TIPO = tipo;
    $('btFattPrivato').classList.toggle('attivo', tipo === 'privato');
    $('btFattAzienda').classList.toggle('attivo', tipo === 'azienda');
    $('boxFattPrivato').style.display = tipo === 'privato' ? '' : 'none';
    $('boxFattAzienda').style.display = tipo === 'azienda' ? '' : 'none';
    aggiornaFattura();
  };
  $('btFattPrivato').onclick = () => scegliFatt('privato');
  $('btFattAzienda').onclick = () => scegliFatt('azienda');

  /* provincia, codice fiscale e codice destinatario: il server li vuole
     maiuscoli e la provincia li rifiuta (non li corregge) se minuscola —
     vedi fattura.ts. Portarli in maiuscolo mentre l'ospite scrive evita
     il rifiuto più comune, senza spostare la vera validazione dal
     server alla pagina: è la stessa cautela di arrotondaValore più sopra. */
  ['fFattProvincia', 'fFattCfPrivato', 'fFattCfAzienda', 'fFattSdi'].forEach((id) => {
    $(id).oninput = () => { $(id).value = $(id).value.toUpperCase(); aggiornaFattura(); };
  });
  ['fFattIndirizzo', 'fFattCivico', 'fFattCap', 'fFattComune', 'fFattDenominazione', 'fFattPiva', 'fFattPec']
    .forEach((id) => { $(id).oninput = aggiornaFattura; });

  /* si paga solo dopo aver accettato le condizioni. I gestori si attaccano
     PRIMA del primo disegno: se ridisegna() inciampasse, il pulsante
     resterebbe disabilitato per sempre e la spunta inerte, cioè una pagina
     che non si sblocca con nessuna azione dell'utente. */
  let inviando = false;
  const condOk = () => $('fCond').checked;
  /* due consensi distinti: le condizioni si accettano, dell'informativa si
     prende atto. Il pulsante si sblocca solo con tutti e due, e il server
     li pretende separati anche se qualcuno aggirasse la pagina. */
  const privacyOk = () => $('fPrivacy').checked;
  /* !importoFuoriLimiti(): stesso trattamento di !vociFuseTroppo() qui
     accanto — l'ospite non deve poter premere "paga" mentre l'importo
     digitato e' fuori dai limiti, scoprendolo solo dal rifiuto del server */
  const tuttoOk = () => condOk() && privacyOk() && !vociFuseTroppo() && !seraleConTrattamento() && !importoFuoriLimiti() && fatturaOk();
  const aggiornaPaga = () => { $('fPaga').disabled = inviando || !tuttoOk(); };
  $('fCond').onchange = $('fPrivacy').onchange = () => {
    aggiornaPaga();
    if (tuttoOk() && !inviando) $('fEsito').textContent = '';
  };
  /* tornando indietro da Stripe il browser ripristina la pagina com'era,
     con il pulsante spento e "un momento…" ancora scritto: va riarmata */
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) { inviando = false; $('fEsito').textContent = ''; aggiornaPaga(); }
  });

  /* sul telefono la barra degli indirizzi che si apre e chiude scatena
     un resize a ogni scorrimento: senza freno l'anteprima si ridisegna
     di continuo e la pagina scatta */
  let attesaResize;
  window.addEventListener('resize', () => {
    clearTimeout(attesaResize);
    attesaResize = setTimeout(ridisegna, 150);
  });
  ridisegna();
  aggiornaFattura();

  $('fPaga').onclick = async () => {
    const b = stato();
    const emailOk = /.+@.+\..+/.test(b.acquirente_email);
    const valoreOk = b.tipo === 'valore' ? (b.valore >= 25 && b.valore <= 1000) : (b.valore > 0);
    if (!b.descrizione || !valoreOk || !emailOk) {
      $('fEsito').innerHTML = `<span class="errore">${esc(t.manca)}</span>`; return;
    }
    /* il pulsante e' gia' spento in questo caso (tuttoOk() lo controlla): il
       controllo qui e' solo la stessa cautela degli altri, non la prima
       barriera — se qualcosa riabilitasse il pulsante senza passare da
       aggiornaPaga(), l'ospite avrebbe comunque una spiegazione e non
       l'errore generico del server. */
    if (vociFuseTroppo()) {
      $('fEsito').innerHTML = `<span class="errore">${esc(t.stessaVoceTroppo)}</span>`; return;
    }
    if (seraleConTrattamento()) {
      $('fEsito').innerHTML = `<span class="errore">${esc(t.seraleConTrattamento)}</span>`; return;
    }
    if (!condOk()) {
      $('fEsito').innerHTML = `<span class="errore">${esc(g.manca)}</span>`; return;
    }
    /* messaggio suo: "accetta le condizioni" non spiegherebbe che manca
       l'altra spunta, e chi legge continuerebbe a guardare quella giusta */
    if (!privacyOk()) {
      $('fEsito').innerHTML = `<span class="errore">${esc(g.privacyManca)}</span>`; return;
    }
    /* il pulsante è già spento in questo caso (tuttoOk() lo controlla):
       stessa cautela di vociFuseTroppo() e seraleConTrattamento() più
       sopra, non la prima barriera — la vera validazione resta sul
       server, che i dati falsificati li rifiuta comunque */
    if (fatturaAttiva() && !fatturaOk()) {
      $('fEsito').innerHTML = `<span class="errore">${esc(t.fattManca)}</span>`; return;
    }
    inviando = true; aggiornaPaga();
    $('fEsito').textContent = t.attesa;
    try {
      const r = await fetch(FUNZIONE + '?a=acquista', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ ...b, ...datiFattura(), condizioni_accettate: condOk(),
          privacy_presa_atto: !!($('fPrivacy') && $('fPrivacy').checked),
          ricevuta_email: $('fAltraRic').checked ? $('fRicMail').value.trim() : '',
          ritorno: location.origin + location.pathname + '?l=' + LNG })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.url) throw new Error(j.errore || 'errore');
      location.href = j.url;
    } catch (e) {
      $('fEsito').innerHTML = `<span class="errore">${esc(t.erroreGen)}</span>`;
      inviando = false; aggiornaPaga();
    }
  };
}

testata();
if (qs.get('ok') === '1') grazie(); else modulo();
</script>
</body>
</html>
