/* ============================================================
   TRATTAMENTI — traduzione del nome arrangiamento di Fidra
   "DOLCE VITA 10 CURE" → "Dolce Vita mit 10 Anwendungen".
   I nomi propri restano; se tutto maiuscolo, viene ricomposto
   in maiuscole/minuscole. Regole per pezzi ricorrenti.
   ============================================================ */
function traduciTrattamento(nome, lingua) {
  let out = String(nome || '').trim();
  if (!out || lingua === 'it') return out;
  // da TUTTO MAIUSCOLO a Iniziali Maiuscole
  if (out === out.toUpperCase() && /[A-Z]/.test(out)) {
    out = out.toLowerCase().replace(/(^|[\s&(\/-])([a-zà-ù])/g, (m, p, c) => p + c.toUpperCase());
  }
  const regole = {
    de: [[/\bMiglior\s*Prezzo\b/i, 'Bestpreis'], [/\b(\d+)\s*Cure\b/i, 'mit $1 Anwendungen'], [/\bMezza\s*Pensione\b/i, 'Halbpension'],
         [/\bSoggiorno\s*Breve\b/i, 'Kurzaufenthalt'], [/\bPernottamento\s*e\s*Colazione\b/i, '&Uuml;bernachtung mit Fr&uuml;hst&uuml;ck']],
    en: [[/\bMiglior\s*Prezzo\b/i, 'Best rate'], [/\b(\d+)\s*Cure\b/i, 'with $1 treatments'], [/\bMezza\s*Pensione\b/i, 'Half board'],
         [/\bSoggiorno\s*Breve\b/i, 'Short stay'], [/\bPernottamento\s*e\s*Colazione\b/i, 'Bed &amp; breakfast']],
    fr: [[/\bMiglior\s*Prezzo\b/i, 'Meilleur tarif'], [/\b(\d+)\s*Cure\b/i, 'avec $1 soins'], [/\bMezza\s*Pensione\b/i, 'Demi-pension'],
         [/\bSoggiorno\s*Breve\b/i, 'Court s&eacute;jour'], [/\bPernottamento\s*e\s*Colazione\b/i, 'Nuit et petit d&eacute;jeuner']]
  };
  for (const [re, sost] of (regole[lingua] || [])) out = out.replace(re, sost);
  return out;
}

function periodoCamera(c, lingua) {
  const p = c && c.periodo;
  if (!p || !p.g1 || !p.g2) return '';
  const mese = (MESI_LUNGHI[p.mese] || {})[lingua] || p.mese;
  const frasi = {
    it: `dal ${p.g1} al ${p.g2} ${mese}` + (p.notti ? ` &middot; ${p.notti} notti` : ''),
    de: `vom ${p.g1}. bis ${p.g2}. ${mese}` + (p.notti ? ` &middot; ${p.notti} N&auml;chte` : ''),
    en: `from ${p.g1} to ${p.g2} ${mese}` + (p.notti ? ` &middot; ${p.notti} nights` : ''),
    fr: `du ${p.g1} au ${p.g2} ${mese}` + (p.notti ? ` &middot; ${p.notti} nuits` : '')
  };
  return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:19px;color:#0F5C64;padding-top:4px;"><strong>${frasi[lingua] || frasi.it}</strong></div>`;

/* periodo di una camera in parole: quello proprio se c'è, altrimenti quello
   globale del soggiorno. Serve quando le camere hanno date diverse: lasciarne
   una senza periodo farebbe pensare a una dimenticanza. */
function testoPeriodo(c, d, lingua) {
  const p = (c && c.periodo) || null;
  const g1 = p ? p.g1 : (d && d.giornoArrivo);
  const g2 = p ? p.g2 : (d && d.giornoPartenza);
  const mese = p ? p.mese : (d && d.mese);
  const mese2 = (p ? (p.mesePartenza || p.mese) : ((d && d.mesePartenza) || (d && d.mese)));
  if (!g1 || !g2 || !mese) return '';
  const nome = (MESI_LUNGHI[mese] || {})[lingua] || mese;
  const nome2 = (MESI_LUNGHI[mese2] || {})[lingua] || mese2;
  /* a cavallo di due mesi il mese va ripetuto su entrambe le date */
  const doppio = mese2 && mese2 !== mese;
  const frasi = {
    it: doppio ? `dal ${g1} ${nome} al ${g2} ${nome2}` : `dal ${g1} al ${g2} ${nome}`,
    de: doppio ? `vom ${g1}. ${nome} bis ${g2}. ${nome2}` : `vom ${g1}. bis ${g2}. ${nome}`,
    en: doppio ? `from ${g1} ${nome} to ${g2} ${nome2}` : `from ${g1} to ${g2} ${nome}`,
    fr: doppio ? `du ${g1} ${nome} au ${g2} ${nome2}` : `du ${g1} au ${g2} ${nome}`
  };
  return frasi[lingua] || frasi.it;
}

/* titolo della camera: "1 Doppia" oppure, quando i periodi differiscono,
   "1 Doppia per 2 persone dal 2 al 4 settembre" */
function intestazioneCamera(c, d, lingua, nomeCategoria) {
  const nOsp = (c.adulti || 0) + (c.bambini || 0);
  const PERS = {
    it: (n) => `${n} ${n === 1 ? 'persona' : 'persone'}`,
    de: (n) => `${n} ${n === 1 ? 'Person' : 'Personen'}`,
    en: (n) => `${n} ${n === 1 ? 'person' : 'people'}`,
    fr: (n) => `${n} ${n === 1 ? 'personne' : 'personnes'}`
  };
  const PER = { it: 'per', de: 'f&uuml;r', en: 'for', fr: 'pour' };
  const base = `1 ${nomeCategoria}`;
  if (!periodiDiversi(d)) return base;
  const per = testoPeriodo(c, d, lingua);
  return `${base} ${PER[lingua] || PER.it} ${(PERS[lingua] || PERS.it)(nOsp)}${per ? ' ' + per : ''}`;
}

/* almeno una camera ha un periodo proprio (date diverse dal soggiorno globale)? */
function periodiDiversi(d) {
  return ((d && d.camere) || []).some(c => c && c.periodo);
}

/* le camere con pacchetto vanno in fondo: la descrizione del pacchetto è lunga
   e seppellirebbe le informazioni delle altre camere */
function ordinaCamere(camere) {
  const haPacchetto = (c) =>
    Object.keys(PACCHETTI).some(k => (c.trattamento || '').toLowerCase().includes(k)) ? 1 : 0;
  return [...(camere || [])].sort((a, b) => haPacchetto(a) - haPacchetto(b));
}

function notaPacchetto(trattamento, lingua) {
  const chiave = Object.keys(PACCHETTI).find(k => (trattamento || '').toLowerCase().includes(k));
  if (!chiave) return '';
  const p = PACCHETTI[chiave];
  // pacchetti riservati ad alcune lingue: fuori da quelle, nessuna didascalia
  if (Array.isArray(p.lingue) && !p.lingue.includes(lingua)) return '';
  const testo = p[lingua];
  if (!testo && !p.prezzoSpeciale) return '';
  let righe = '';
  if (testo) {
    // il testo usa &middot; come separatore: ogni voce diventa una riga con pallino
    righe = testo.split('&middot;').map(v => v.trim()).filter(Boolean).map(v =>
      `<tr><td valign="top" width="12" style="padding:0 6px 5px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#7A8450;">&bull;</td>` +
      `<td style="padding:0 0 5px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:19px;color:#55524B;">${v.charAt(0).toUpperCase() + v.slice(1)}</td></tr>`
    ).join('');
  }
  const avviso = p.prezzoSpeciale
    ? `<tr><td colspan="2" style="padding:7px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8A5A2B;"><strong>${AVVISO_PREZZO_SPECIALE[lingua] || AVVISO_PREZZO_SPECIALE.it}</strong></td></tr>`
    : '';
  return `
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:10px;background-color:#FFFFFF;border:1px solid #E7E1D4;">
        <tr><td style="padding:10px 14px 8px 14px;">
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:1.5px;color:#7A8450;padding-bottom:7px;">${TITOLO_PACCHETTO[lingua] || TITOLO_PACCHETTO.it}</div>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">${righe}${avviso}</table>
        </td></tr>
      </table>`;
}

function dataIT(giorno, meseAbbr, anno) {
  return `${giorno} ${MESI_IT[MESI_N[meseAbbr]]} ${anno}`;
}

function scadenzaIT(s) {
  const m = (s || '').match(/(\d{1,2})\s+([A-Za-z]{3})\s+(20\d\d)/);
  return m ? dataIT(+m[1], m[2], +m[3]) : s;
}

/* saluto: il gestionale non espone il genere, quindi lo sceglie l'operatore */
function saluto(nomeCompleto, genere) {
  const p = (nomeCompleto || '').trim().split(/\s+/);
  const cognome = p[0] || '';
  if (genere === 'F') return `Gentile Signora ${cognome}`;
  if (genere === 'M') return `Gentile Signor ${cognome}`;
  return `Gentile ${nomeCompleto}`;
}

function descrizioneOspiti(adulti, bambini) {
  const a = adulti === 1 ? '1 persona' : `${adulti} persone`;
  if (!bambini) return a;
  return `${a}, di cui ${bambini === 1 ? '1 bambino' : bambini + ' bambini'}`;
}

/* ============================================================

   ============================================================ */

const MONATE = ['Januar','Februar','März','April','Mai','Juni',
                'Juli','August','September','Oktober','November','Dezember'];
const MON_N  = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };


/* Categorie Fidra (italiane) tradotte per l'ospite; i nomi propri restano. */
const MAPPA_KATEGORIEDE = {
  'singola senza balcone': 'Einzelzimmer ohne Balkon',
  'singola parco': 'Einzelzimmer mit Parkblick',
  'singola accessibile': 'Barrierefreies Einzelzimmer',
  'matrimoniale queen': 'Queen-Doppelzimmer',
  'doppia': 'Doppelzimmer',
  'junior suite accessibile': 'Barrierefreie Junior Suite',
  'uso singola': 'zur Alleinbenutzung'
};
function kategorieDE(nome) {
  let out = String(nome || '');
  const chiavi = Object.keys(MAPPA_KATEGORIEDE).sort((a, b) => b.length - a.length);
  for (const k of chiavi) {
    out = out.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), MAPPA_KATEGORIEDE[k]);
  }
  return out;
}

function datumDE(giorno, meseAbbr, anno) {
  return `${giorno}. ${MONATE[MON_N[meseAbbr]]} ${anno}`;
}

function fristDE(s) {
  const m = (s || '').match(/(\d{1,2})\s+([A-Za-z]{3})\s+(20\d\d)/);
  return m ? datumDE(+m[1], m[2], +m[3]) : s;
}

function anredeDE(nomeCompleto, genere, titolo) {
  const p = (nomeCompleto || '').trim().split(/\s+/);
  const cognome = p[0] || '';
  const t = titolo ? titolo + ' ' : '';
  if (genere === 'F') return `Sehr geehrte Frau ${t}${cognome}`;
  if (genere === 'M') return `Sehr geehrter Herr ${t}${cognome}`;
  return `Sehr geehrte Damen und Herren`;
}

function gaesteDE(erw, kinder) {
  const a = erw === 1 ? '1 Person' : `${erw} Personen`;
  if (!kinder) return a;
  return `${a}, davon ${kinder === 1 ? '1 Kind' : kinder + ' Kinder'}`;
}

/* Categorie Fidra (italiane) tradotte per l'ospite; i nomi propri restano. */
const MAPPA_KATEGORIECONFDE = {
  'singola senza balcone': 'Einzelzimmer ohne Balkon',
  'singola parco': 'Einzelzimmer mit Parkblick',
  'singola accessibile': 'Barrierefreies Einzelzimmer',
  'matrimoniale queen': 'Queen-Doppelzimmer',
  'doppia': 'Doppelzimmer',
  'junior suite accessibile': 'Barrierefreie Junior Suite',
  'uso singola': 'zur Alleinbenutzung'
};
function kategorieConfDE(nome) {
  let out = String(nome || '');
  const chiavi = Object.keys(MAPPA_KATEGORIECONFDE).sort((a, b) => b.length - a.length);
  for (const k of chiavi) {
    out = out.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), MAPPA_KATEGORIECONFDE[k]);
  }
  return out;
}

function numeroConferma(numeroOfferta) {
  return (numeroOfferta || '').replace(/^O/, 'C');
}

function eur(n, loc) {
  return (n || 0).toLocaleString(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ---------- righe camere, compatte ---------- */
function categoriaConferma(nome, lingua) {
  try {
    if (lingua === 'de') return kategorieConfDE(nome);
    if (lingua === 'en' && typeof categoryEN === 'function') return categoryEN(nome);
    if (lingua === 'fr' && typeof categorieFR === 'function') return categorieFR(nome);
  } catch (e) { /* file lingua non caricato: nome originale */ }
  return nome;
}

function camereConferma(camere, lingua, d) {
  const perPersona = lingua === 'de' ? 'pro Person' : 'a persona';
  const OSPITE = { it: ['ospite', 'ospiti'], de: ['Gast', 'Gäste'],
                   en: ['guest', 'guests'], fr: ['personne', 'personnes'] };
  const NR = { it: 'nr.', de: 'Nr.', en: 'No.', fr: 'n°' };
  return camere.map(c => {

const MONTHS_EN = ['January','February','March','April','May','June',
                   'July','August','September','October','November','December'];
const MON_EN = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };


/* Categorie Fidra (italiane) tradotte per l'ospite; i nomi propri restano. */
const MAPPA_CATEGORYEN = {
  'singola senza balcone': 'Single room without balcony',
  'singola parco': 'Single room with park view',
  'singola accessibile': 'Accessible single room',
  'matrimoniale queen': 'Queen room',
  'doppia': 'Twin room',
  'junior suite accessibile': 'Accessible junior suite',
  'uso singola': 'single occupancy'
};
function categoryEN(nome) {
  let out = String(nome || '');
  const chiavi = Object.keys(MAPPA_CATEGORYEN).sort((a, b) => b.length - a.length);
  for (const k of chiavi) {
    out = out.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), MAPPA_CATEGORYEN[k]);
  }
  return out;
}

function dateEN(giorno, meseAbbr, anno) {
  return `${giorno} ${MONTHS_EN[MON_EN[meseAbbr]]} ${anno}`;
}
function deadlineEN(s) {
  const m = (s || '').match(/(\d{1,2})\s+([A-Za-z]{3})\s+(20\d\d)/);
  return m ? dateEN(+m[1], m[2], +m[3]) : s;
}
function moneyEN(n) {
  return '€' + (n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function greetingEN(nomeCompleto, genere, titolo) {
  const p = (nomeCompleto || '').trim().split(/\s+/);
  const surname = p[0] || '';
  const t = titolo ? titolo + ' ' : '';
  if (genere === 'F') return `Dear Mrs ${t}${surname}`;
  if (genere === 'M') return `Dear Mr ${t}${surname}`;
  return `Dear Guest`;
}
function guestsEN(adulti, bambini) {
  const a = adulti === 1 ? '1 guest' : `${adulti} guests`;
  if (!bambini) return a;
  return `${a}, including ${bambini === 1 ? '1 child' : bambini + ' children'}`;
}

const MOIS_FR = ['janvier','février','mars','avril','mai','juin',

const MON_FR = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };


/* Categorie Fidra (italiane) tradotte per l'ospite; i nomi propri restano. */
const MAPPA_CATEGORIEFR = {
  'singola senza balcone': 'Chambre simple sans balcon',
  'singola parco': 'Chambre simple c&ocirc;t&eacute; parc',
  'singola accessibile': 'Chambre simple accessible',
  'matrimoniale queen': 'Chambre Queen',
  'doppia': 'Chambre &agrave; lits jumeaux',
  'junior suite accessibile': 'Junior suite accessible',
  'uso singola': '&agrave; usage individuel'
};
function categorieFR(nome) {
  let out = String(nome || '');
  const chiavi = Object.keys(MAPPA_CATEGORIEFR).sort((a, b) => b.length - a.length);
  for (const k of chiavi) {
    out = out.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), MAPPA_CATEGORIEFR[k]);
  }
  return out;
}

function dateFR(giorno, meseAbbr, anno) {
  const g = giorno === 1 ? '1er' : giorno;
  return `${g} ${MOIS_FR[MON_FR[meseAbbr]]} ${anno}`;
}
function echeanceFR(s) {
  const m = (s || '').match(/(\d{1,2})\s+([A-Za-z]{3})\s+(20\d\d)/);
  return m ? dateFR(+m[1], m[2], +m[3]) : s;
}
function argentFR(n) {
  return (n || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';

function politesseFR(nomeCompleto, genere, titolo) {
  const p = (nomeCompleto || '').trim().split(/\s+/);
  const nom = p[0] || '';
  const t = titolo ? titolo + ' ' : '';
  if (genere === 'F') return `Chère Madame ${t}${nom}`;
  if (genere === 'M') return `Cher Monsieur ${t}${nom}`;
  return `Madame, Monsieur`;
}

  const a = adulti === 1 ? '1 personne' : `${adulti} personnes`;

/* la scadenza "9 Aug 2026" è già passata? */
function scadutaExtra(s) {
  const m = (s || '').match(/(\d{1,2})\s+([A-Za-z]{3})\s+(20\d\d)/);
  if (!m) return false;
  const MN = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
               Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
  const d = new Date(+m[3], MN[m[2]] ?? 0, +m[1], 23, 59, 59);
  return d < new Date();
}

/* in italiano davanti a 8 e 11 la preposizione si elide: all'11, dall'8, l'11 */
function elidiIT(prep, data) {
  const g = parseInt(String(data), 10);
  if (g === 8 || g === 11) {
    if (prep === 'al') return `all'${data}`;
    if (prep === 'dal') return `dall'${data}`;
    if (prep === 'il') return `l'${data}`;
  }
  return `${prep} ${data}`;
}

};
const NOTTI_EXTRA = {
  it: (n) => n === 1 ? '1 notte' : `${n} notti`,
  de: (n) => n === 1 ? '1 Nacht' : `${n} N\u00e4chte`,
  en: (n) => n === 1 ? '1 night' : `${n} nights`,
  fr: (n) => n === 1 ? '1 nuit' : `${n} nuits`
};

function costruisciSollecitoBase(d, opzioni, lingua) {
  const o = opzioni || {};
  const t = SOLLECITO_T[lingua] || SOLLECITO_T.it;
  const arrivo = dataExtra(d.giornoArrivo, d.mese, d.anno, lingua);
  const partenza = dataExtra(d.giornoPartenza, d.mesePartenza || d.mese, d.annoPartenza || d.anno, lingua);
  const scad = scadenzaExtra(d.scadenza, lingua);
  const morta = scadutaExtra(d.scadenza);
  const notti = NOTTI_EXTRA[lingua](d.notti);
  const ospiti = OSPITI_EXTRA[lingua](d.adulti + (d.bambini || 0));

  const pagamento = morta ? '' : `
  <tr><td style="padding:18px 36px 0 36px;">
    ${d.linkPagamento ? `<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 10px 0;"><tr>
      <td align="center" bgcolor="#E8751A" style="border-radius:5px;">
        <a href="${d.linkPagamento}" style="display:inline-block;padding:12px 30px;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#FFFFFF;text-decoration:none;font-weight:bold;">${t.bottone}</a>
      </td>
    </tr></table>` : ''}
    <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:21px;color:#55524B;">
      ${(d.linkPagamento ? t.pagamento : t.pagamentoSolo)(d.accontoFmt, d.numeroOfferta)}
    </p>
  </td></tr>`;

  const corpo = `
  <tr><td style="padding:16px 36px 0 36px;">
    <p style="margin:0 0 14px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#2A2E2B;">${salutoExtra(d, o, lingua)},</p>
    <h1 style="margin:0 0 10px 0;font-family:Georgia,'Times New Roman',serif;font-size:25px;line-height:31px;font-weight:normal;color:#2A2E2B;">
      ${morta ? t.h1Morta : t.h1Viva(scad)}
    </h1>
    <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#55524B;">
      ${periodiDiversi(d) ? t.introDiversi(d.camere.length, ospiti, d.totaleFmt) : t.intro(arrivo, partenza, notti, ospiti, d.totaleFmt)}
    </p>
  </td></tr>

  <tr><td style="padding:18px 36px 0 36px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E3F0F1;">
      <tr>
        <td width="6" style="background-color:#1E7F88;font-size:0;line-height:0;">&nbsp;</td>
        <td style="padding:16px 20px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:23px;color:#3C6266;">
          ${morta ? t.boxMorta(scad) : t.boxViva(scad)}
        </td>
      </tr>
    </table>
  </td></tr>
${pagamento}
  <tr><td style="padding:18px 36px 0 36px;">
    <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#55524B;">${t.congedo}</p>
  </td></tr>`;

  return corniceExtra(t.banda(d.numeroOfferta), corpo, o, lingua);
}

function oggettoSollecitoBase(d, lingua) {
  const t = SOLLECITO_T[lingua] || SOLLECITO_T.it;
  const arrivo = dataExtra(d.giornoArrivo, d.mese, d.anno, lingua);
  return scadutaExtra(d.scadenza) ? t.oggMorta(arrivo) : t.oggViva(scadenzaExtra(d.scadenza, lingua), arrivo);
}

function costruisciSollecitoIT(d, o) { return costruisciSollecitoBase(d, o, 'it'); }
function costruisciSollecitoDE(d, o) { return costruisciSollecitoBase(d, o, 'de'); }
function costruisciSollecitoEN(d, o) { return costruisciSollecitoBase(d, o, 'en'); }
function costruisciSollecitoFR(d, o) { return costruisciSollecitoBase(d, o, 'fr'); }
function oggettoSollecitoIT(d) { return oggettoSollecitoBase(d, 'it'); }
function oggettoSollecitoDE(d) { return oggettoSollecitoBase(d, 'de'); }
function oggettoSollecitoEN(d) { return oggettoSollecitoBase(d, 'en'); }

      ['Chambre d&apos;appoint', '60,00 &euro;, disponible de 9h00 &agrave; 18h30 : lit &agrave; la fran&ccedil;aise, salle de bain avec douche, TV, coffre-fort, climatisation et Wi-Fi. &Agrave; r&eacute;server par e-mail apr&egrave;s l&apos;achat du billet'],
      ['&Agrave; la piscine', 'Bonnet et chaussons de bain obligatoires'],
      ['Massages et soins', 'Sur r&eacute;servation : mieux vaut les fixer avec le billet, les meilleurs horaires partent vite'],
      ['Golf Academy', 'Le&ccedil;ons sur r&eacute;servation sur notre practice de 15 000 m&sup2; &agrave; c&ocirc;t&eacute; des piscines thermales : postes semi-couverts, putting green, pitching green et bunker'],
      ['Amis &agrave; quatre pattes', 'Les chiens ne sont malheureusement pas admis dans le parc ni aux piscines thermales']
    ],
    ogg: 'Day Spa — informations et tarifs · H&ocirc;tel Terme Leonardo'
  }
};

function costruisciDaySpaBase(d, opzioni, lingua) {
  const o = opzioni || {};
  const t = DAYSPA_T[lingua] || DAYSPA_T.it;
  const link = DAYSPA_LINK[lingua] || DAYSPA_LINK.it;

  const corpo = `
  <tr><td style="padding:16px 36px 0 36px;">
    <p style="margin:0 0 14px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#2A2E2B;">${salutoExtra(d, o, lingua)},</p>
    <h1 style="margin:0 0 10px 0;font-family:Georgia,'Times New Roman',serif;font-size:25px;line-height:31px;font-weight:normal;color:#2A2E2B;">${t.h1}</h1>
    <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#55524B;">${t.intro}</p>
  </td></tr>

  <tr><td style="padding:18px 36px 0 36px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E3F0F1;">
      <tr>
        <td width="6" style="background-color:#1E7F88;font-size:0;line-height:0;">&nbsp;</td>
        <td style="padding:18px 20px 20px 22px;">
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#1E7F88;padding-bottom:8px;">${t.prezziTitolo}</div>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#3C6266;">
            ${t.prezzi.map(([q, p]) => `<tr><td style="padding:0 10px 6px 0;">${q}</td><td align="right" style="padding:0 0 6px 0;white-space:nowrap;"><strong style="color:#0F5C64;">${p}</strong></td></tr>`).join('')}
          </table>
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#5C7F83;padding-top:6px;">${t.prezziNota}</div>
        </td>
      </tr>
    </table>
  </td></tr>

  <tr><td style="padding:20px 36px 0 36px;">
    <h2 style="margin:0 0 8px 0;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:24px;font-weight:normal;color:#2A2E2B;">${t.prenotaTitolo}</h2>
    <p style="margin:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#55524B;">${t.prenotaTesto}${t.linkNota}</p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
      <td align="center" bgcolor="#E8751A" style="border-radius:5px;">
        <a href="${link}" style="display:inline-block;padding:12px 30px;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#FFFFFF;text-decoration:none;font-weight:bold;">${t.prenotaBottone}</a>
      </td>
    </tr></table>
    <p style="margin:10px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#7B756A;">${t.prenotaNota}</p>
  </td></tr>

  <tr><td style="padding:20px 36px 0 36px;">
    <h2 style="margin:0 0 8px 0;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:24px;font-weight:normal;color:#2A2E2B;">${t.compresoTitolo}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#55524B;">
      ${t.compreso.map(x => `<tr><td valign="top" width="16" style="padding:0 6px 7px 0;color:#1E7F88;">&#10003;</td><td style="padding:0 0 7px 0;">${x}</td></tr>`).join('')}
    </table>
  </td></tr>

  <tr><td style="padding:14px 36px 0 36px;">
    <h2 style="margin:0 0 8px 0;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:24px;font-weight:normal;color:#2A2E2B;">${t.tavolaTitolo}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      ${t.tavola.map(([tit, testo], i) => `${i ? '<tr><td height="8" style="font-size:0;line-height:0;">&nbsp;</td></tr>' : ''}
      <tr><td style="padding:12px 16px;background-color:#FAF8F4;border-left:3px solid #7A8450;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#55524B;">
        <strong style="color:#2A2E2B;">${tit}</strong><br /><span style="color:#7B756A;font-size:13px;">${testo}</span>
      </td></tr>`).join('')}
    </table>
  </td></tr>

  <tr><td style="padding:20px 36px 0 36px;">
    <h2 style="margin:0 0 10px 0;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:24px;font-weight:normal;color:#2A2E2B;">${t.sapereTitolo}</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#55524B;">
      ${t.sapere.map(([k, v]) => `<tr><td width="150" valign="top" style="padding:0 12px 10px 0;color:#8C8578;">${k}</td><td valign="top" style="padding:0 0 10px 0;">${v}</td></tr>`).join('')}
    </table>
  </td></tr>`;

  return corniceExtra(t.banda, corpo, o, lingua);
}

function costruisciDaySpaIT(d, o) { return costruisciDaySpaBase(d, o, 'it'); }
function costruisciDaySpaDE(d, o) { return costruisciDaySpaBase(d, o, 'de'); }
function costruisciDaySpaEN(d, o) { return costruisciDaySpaBase(d, o, 'en'); }
function costruisciDaySpaFR(d, o) { return costruisciDaySpaBase(d, o, 'fr'); }
function oggettoDaySpaIT() { return DAYSPA_T.it.ogg; }
function oggettoDaySpaDE() { return DAYSPA_T.de.ogg; }
function oggettoDaySpaEN() { return DAYSPA_T.en.ogg; }
function oggettoDaySpaFR() { return DAYSPA_T.fr.ogg.replace(/&ocirc;/g, 'ô'); }


</script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let DATI = null;
  try {
    const grezzo = location.hash.slice(1);
    if (grezzo) DATI = JSON.parse(decodeURIComponent(escape(atob(grezzo))));
  } catch (e) { DATI = null; }

  if (!DATI || !DATI.intestatario && !DATI.camere) {
    $('app').innerHTML = '<div class="box">Questa pagina si apre dal segnalibro ' +
      '<strong>&#129534; Documenti Leonardo</strong>, con una prenotazione aperta in Fidra: ' +
      'il segnalibro legge la prenotazione e la porta qui.<div class="sub">' +
      'Nessun dato viene inviato a questo sito: viaggia solo dentro il tuo browser.</div></div>';
    return;
  }

  const MODELLI = {
    offerta:  { it:[costruisciEmail, oggetto],       de:[costruisciEmailDE, betreffDE],
                en:[costruisciEmailEN, subjectEN],   fr:[costruisciEmailFR, objetFR] },
    conferma: { it:[costruisciConferma, oggettoConferma],   de:[costruisciConfermaDE, betreffBestaetigung],
                en:[costruisciConfermaEN, subjectConfirmEN], fr:[costruisciConfermaFR, objetConfirmFR] },
    sollecito: { it:[costruisciSollecitoIT, oggettoSollecitoIT], de:[costruisciSollecitoDE, oggettoSollecitoDE],
                 en:[costruisciSollecitoEN, oggettoSollecitoEN], fr:[costruisciSollecitoFR, oggettoSollecitoFR] },
    dayspa:   { it:[costruisciDaySpaIT, oggettoDaySpaIT], de:[costruisciDaySpaDE, oggettoDaySpaDE],
                en:[costruisciDaySpaEN, oggettoDaySpaEN], fr:[costruisciDaySpaFR, oggettoDaySpaFR] }
  };

  const d = DATI;
  const pf = d.profilo || {};
  const genPre = pf.genere === 'M' ? 'M' : pf.genere === 'F' ? 'F' : 'N';
  const lngPre = ['it', 'de', 'en', 'fr'].includes(pf.lingua) ? pf.lingua : 'it';
  const dovuta = d.caparraDovuta || d.acconto || 0;
  const mostraAnnunciato = (d.caparraVersata || 0) === 0 && dovuta > 0;

  let h = '';
  if (d.mancanti && d.mancanti.length) {
    h += '<div class="errore"><strong>Attenzione, dalla pagina mancano:</strong> ' +
      d.mancanti.map(esc).join(' &middot; ') + '. Controlla il risultato con cura.</div>';
  }
  h += '<div class="box riep"><strong>' + esc(d.intestatario || '?') + '</strong>' +
    (d.numeroOfferta ? ' &middot; ' + esc(d.numeroOfferta) : '') +
    (d.stato ? ' &middot; ' + esc(d.stato) : '') + '<br />' +
    (d.notti ? d.notti + ' notti, dal ' + d.giornoArrivo + ' ' + esc(d.mese) +
      ' al ' + d.giornoPartenza + ' ' + esc(d.mesePartenza || d.mese) + ' ' + (d.annoPartenza || d.anno || '') : '') +
    (d.nCamere ? ' &middot; ' + d.nCamere + (d.nCamere === 1 ? ' camera' : ' camere') : '') +
    (d.totaleFmt ? ' &middot; totale ' + esc(d.totaleFmt) + ' &euro;' : '') + '</div>';

  h += '<h3>Documento</h3>' +
    '<label><input type="radio" name="doc" value="offerta" checked /> Offerta</label>' +
    '<label><input type="radio" name="doc" value="conferma" /> Conferma</label>' +
    '<label><input type="radio" name="doc" value="sollecito" /> Sollecito offerta</label>' +
    '<label><input type="radio" name="doc" value="dayspa" /> Info Day Spa</label>';

  if (mostraAnnunciato) {
    h += '<div class="box" id="boxAnnunciato" style="display:none;">Caparra a 0,00 &euro; in Fidra, acconto previsto ' +
      (dovuta).toLocaleString('it-IT', { minimumFractionDigits: 2 }) + ' &euro;. Cosa scrivo?' +
      '<label><input type="radio" name="accontoScelta" value="annunciato" checked /> Bonifico annunciato (ho la copia)</label>' +
      '<label><input type="radio" name="accontoScelta" value="zero" /> Davvero nessun acconto</label></div>';
  }

  h += '<h3>Come rivolgersi</h3>' +
    '<label><input type="radio" name="gen" value="F"' + (genPre === 'F' ? ' checked' : '') + ' /> Femminile</label>' +
    '<label><input type="radio" name="gen" value="M"' + (genPre === 'M' ? ' checked' : '') + ' /> Maschile</label>' +
    '<label><input type="radio" name="gen" value="N"' + (genPre === 'N' ? ' checked' : '') + ' /> Neutro</label>' +
    '<h3>Lingua</h3>' +
    ['it', 'de', 'en', 'fr'].map(l =>
      '<label><input type="radio" name="lng" value="' + l + '"' + (l === lngPre ? ' checked' : '') + ' /> ' +
      ({ it: 'Italiano', de: 'Deutsch', en: 'English', fr: 'Fran\u00e7ais' })[l] + '</label>').join('') +
    '<h3>Opzioni</h3>' +
    '<label><input type="checkbox" id="optCure" /> Riquadro cure termali</label>' +
    '<label><input type="checkbox" id="optCane" /> Ospite con cane</label>' +
    '<label><input type="checkbox" id="optPromo" /> Promo fedelt\u00e0</label>' +
    '<label><input type="checkbox" id="optFedelta" /> Sconto fedelt\u00e0</label>' +
    '<h3>Dettaglio del soggiorno (facoltativo)</h3>' +
    '<textarea id="dettaglio" placeholder="Una riga per voce, entra nell\'email come elenco"></textarea>' +
    '<h3>Firma</h3>' +
    '<input type="text" id="firma" />' +
    '<button id="copia">Copia l\'email</button>' +
    '<button class="sec" id="apriOutlook">Apri Outlook Web (destinatario e oggetto pronti)</button>' +
    '<div class="esito" id="esito"></div>' +
    '<div class="sub">L\'email si incolla nel corpo del messaggio con Ctrl+V. ' +
    'Rileggi sempre prima di inviare.</div>';

  $('app').innerHTML = h;
  $('firma').value = localStorage.getItem('leo_firma') || 'La Reception';
  $('firma').addEventListener('change', () => localStorage.setItem('leo_firma', $('firma').value));

  const aggiornaAnnunciato = () => {
    const b = $('boxAnnunciato');
    if (b) b.style.display =
      document.querySelector('input[name=doc]:checked').value === 'conferma' ? '' : 'none';
  };
  document.querySelectorAll('input[name=doc]').forEach(r => r.addEventListener('change', aggiornaAnnunciato));
  aggiornaAnnunciato();

  function genera() {
    const doc = document.querySelector('input[name=doc]:checked').value;
    const lingua = document.querySelector('input[name=lng]:checked').value;
    const opzioni = {
      genere: document.querySelector('input[name=gen]:checked').value,
      cure: $('optCure').checked, cane: $('optCane').checked,
      promo: $('optPromo').checked, fedelta: $('optFedelta').checked,
      dettaglio: $('dettaglio').value || '',
      firma: $('firma').value || 'La Reception',
      accontoAnnunciato: document.querySelector('input[name=accontoScelta]:checked') ?
        document.querySelector('input[name=accontoScelta]:checked').value === 'annunciato' : false
    };
    const coppia = MODELLI[doc][lingua] || MODELLI[doc].it;
    return { html: coppia[0](d, opzioni), ogg: coppia[1](d), doc, lingua };
  }

  $('copia').addEventListener('click', async () => {
    try {
      const { html, ogg } = genera();
      const voce = new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([html.replace(/<[^>]+>/g, ' ')], { type: 'text/plain' })
      });
      await navigator.clipboard.write([voce]);
      $('esito').innerHTML = '&#10003; Email copiata. Oggetto: <strong>' + esc(ogg) + '</strong>';
    } catch (e) {
      $('esito').textContent = 'Non sono riuscito a generare: ' + e.message;
    }
  });

  $('apriOutlook').addEventListener('click', async () => {
    try {
      const { html, ogg } = genera();
      const voce = new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([html.replace(/<[^>]+>/g, ' ')], { type: 'text/plain' })
      });
      await navigator.clipboard.write([voce]);
      const url = 'https://outlook.office.com/mail/deeplink/compose?to=' +
        encodeURIComponent(d.email || '') + '&subject=' + encodeURIComponent(ogg);
      window.open(url, '_blank');
      $('esito').innerHTML = '&#10003; Copiata; in Outlook premi Ctrl+V nel corpo. Oggetto: <strong>' + esc(ogg) + '</strong>';
    } catch (e) {
      $('esito').textContent = 'Non sono riuscito: ' + e.message;
    }
  });
})();
</script>
</body>
</html>
