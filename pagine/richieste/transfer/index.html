<style>
:root{
  --verde:#1A3626; --verde-medio:#3C5346; --acqua:#8FC4BC; --acqua-chiara:#E4F0EA;
  --oro:#C9A961; --crema:#F9F6F0; --grigio:#7B756A; --allarme:#C0392B;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--crema);color:#2A2E2B;
  font:15px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.testata{background:var(--acqua-chiara);padding:34px 20px 30px;text-align:center;position:relative;}
/* la lingua e' una scelta che si fa una volta: sta in un angolo, non in
   mezzo al percorso. Una select vera e non un menu finto: sui telefoni
   apre il selettore di sistema. */
.sceltaLingua{position:absolute;top:12px;right:12px;}
.sceltaLingua select{width:auto;margin:0;padding:6px 26px 6px 9px;font-size:14px;
  border-radius:8px;border:1px solid rgba(26,54,38,.15);background:rgba(255,255,255,.8);
  color:var(--verde-medio);cursor:pointer;}
.testata img{width:210px;max-width:60%;height:auto;display:block;margin:0 auto;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:34px;line-height:1.2;color:var(--verde);margin:20px 0 8px;}
.occhiello{font-size:11px;letter-spacing:3px;color:var(--oro);text-transform:uppercase;}
.sotto{color:var(--verde-medio);max-width:560px;margin:0 auto;}
main{max-width:640px;margin:0 auto;padding:26px 18px 60px;}
.riquadro{background:#fff;border:1px solid #E5E0D8;border-radius:14px;
  padding:22px;margin-bottom:18px;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:23px;
  color:var(--verde);margin:0 0 4px;}
.guida{color:var(--grigio);font-size:13.5px;margin-bottom:16px;}
/* niente maiuscoletto: le etichette si leggono come frasi, non come
   voci di un modulo da sportello */
label{display:block;font-size:13.5px;
  color:var(--verde-medio);font-weight:500;margin-top:15px;}
input,select,textarea{width:100%;margin-top:6px;padding:12px 13px;font:15px inherit;
  border:1px solid #DCD6CB;border-radius:9px;background:#FCFBF8;color:#2A2E2B;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acqua);border-color:transparent;}
textarea{min-height:84px;resize:vertical;}
.due{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.due{grid-template-columns:1fr;}}
.scelte{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.scelte button{padding:13px;border:1.5px solid #DCD6CB;background:#fff;border-radius:10px;
  cursor:pointer;font:600 14px inherit;color:var(--verde-medio);}
.scelte button.attivo{border-color:var(--verde);color:var(--verde);background:var(--acqua-chiara);}
/* Le dodici destinazioni piu' richieste, fuori dalla tendina. Nove ospiti
   su dieci vanno in uno di quei posti: oggi devono aprire un elenco di 191
   voci per trovarlo. */
.mete{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.meta{border:1px solid #DCD6CB;border-radius:999px;padding:8px 14px;font:14px inherit;
  background:#fff;color:#2A2E2B;cursor:pointer;line-height:1.25;}
.meta:hover{border-color:var(--oro);}
.meta[aria-pressed="true"]{background:var(--verde);color:var(--crema);border-color:var(--verde);}
.altre{margin-top:11px;background:none;border:0;padding:0;cursor:pointer;font:13.5px inherit;
  color:var(--verde-medio);text-decoration:underline;text-decoration-color:var(--oro);
  text-underline-offset:3px;}
.spunta{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:14px;
  color:var(--verde-medio);cursor:pointer;}
.spunta input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;}
.avviso{background:#FFF6E8;border-left:4px solid var(--oro);padding:13px 15px;
  border-radius:6px;font-size:13.5px;color:#6B4A22;margin-bottom:18px;line-height:1.6;}
.noto{background:var(--acqua-chiara);border-left:4px solid var(--acqua);padding:13px 15px;
  border-radius:6px;font-size:13.5px;color:var(--verde-medio);margin-bottom:16px;}
.invia{width:100%;margin-top:22px;padding:16px;border:0;border-radius:999px;
  background:var(--verde);color:var(--crema);font:600 16px inherit;cursor:pointer;}
.invia:disabled{background:#B9BDB6;cursor:default;}
/* L'ASTERISCO E IL CAMPO VUOTO: stessa lista del controllo prima
   dell'invio (comune/obbligatori.js), stesso aspetto della pagina delle
   richieste. Il colore non e' l'unico segno — c'e' l'asterisco
   sull'etichetta e il nome del campo dentro il messaggio. */
.obb{color:var(--allarme);font-weight:700;}
/* la destinazione si sceglie fra le pastiglie: quando manca si segna il
   loro riquadro, perche la <select> vera sta dentro un box chiuso */
.mete.vuoto{outline:2px solid var(--allarme);outline-offset:6px;border-radius:10px;}
.legenda{color:var(--grigio);font-size:12.5px;margin-top:16px;text-align:right;}
input.vuoto,select.vuoto,textarea.vuoto{border-color:var(--allarme);background:#FDF0EE;}
input.vuoto:focus,select.vuoto:focus,textarea.vuoto:focus{outline:2px solid var(--allarme);outline-offset:1px;}
.errore{margin-top:14px;background:#FDF0EE;border-left:4px solid var(--allarme);
  padding:13px 15px;border-radius:6px;color:#7A2E24;font-size:14px;line-height:1.6;}
.fatta{text-align:center;padding:40px 22px;}
.fatta .rif{font-family:"Courier New",monospace;font-size:20px;color:var(--verde);
  letter-spacing:1px;margin-top:10px;}
.pie{text-align:center;color:var(--grigio);font-size:12.5px;padding:0 18px 40px;}
.pie a{color:var(--verde-medio);}
</style>
</head>

/* IDEM PERCORSO ASSOLUTO: i parametri che i pulsanti delle email della
   reception scrivono nell'indirizzo (rif, nome, email, tel, arrivo,
   partenza, adulti, lang) — vedi il commento in cima a ospite-url.js per
   il perche' e il contratto (ripulisce, non fa escaping: tocca comunque
   a `esc()` qui sotto, come per ogni altro campo di questa pagina). */
import { normalizzaLingua, parametriOspite } from '/comune/ospite-url.js';
import { mancanti, segnaEtichette, segnaVuoti, nomiMancanti } from '/comune/obbligatori.js';
/* La regola della navetta condivisa: quando si offre e cosa dice. Sta in un

const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const qs = new URLSearchParams(location.search);
const TOKEN = qs.get('t') || '';
/* Il ripiego per chi non ha un token: dati dell'ospite letti dall'indirizzo
   stesso, come li scrivono i pulsanti delle email della reception. ORDINE
   DI FIDUCIA: OSPITE (dal token, sotto in precompila()) resta la fonte
   vera quando risponde e scavalca questi valori campo per campo
   (`OSPITE?.nome || DA_URL.nome`), mai il contrario — i parametri qui
   riempiono solo quello che il token non ha dato (il telefono, per
   esempio, non lo da' mai: vedi supabase/functions/richieste/index.ts,
   azione precompila). */
const DA_URL = parametriOspite(location.search);
/* `qs.get('l')` qui sotto, e piu' avanti in precompila(), resta la query
   VERA e non normalizzata: serve a capire se l'ospite ha scelto la lingua
   di persona, cosi' il token che risponde con una lingua nota continua a
   vincere su `lang=` (dati di Fidra, un ripiego) esattamente come gia'
   vince sul browser. Solo il primo valore di LNG usa la query
   normalizzata, che copia `lang=` su `l` quando `l` manca. */
const LNG_QUERY = new URLSearchParams(normalizzaLingua(location.search)).get('l');
let LNG = ['it','de','en','fr'].includes(LNG_QUERY) ? LNG_QUERY

const BANDIERE = { it:'🇮🇹', de:'🇩🇪', en:'🇬🇧', fr:'🇫🇷' };

let VERSO = 'arrivo';
/* Auto privata o navetta condivisa. Parte da privata: e' quello che
   succedeva prima che la scelta esistesse, e chi non guarda deve continuare
   a ottenere il servizio di sempre. */
let COLLETTIVO = false;

/* La data della corsa secondo il verso: il transfer di ARRIVO cade il
   giorno del check-in, quello di PARTENZA il giorno del check-out. I due
   valori arrivano dai pulsanti nelle offerte della reception (vedi
   ospite-url.js); se non ci sono, il campo resta vuoto come prima. */
const dataPerVerso = () => (VERSO === 'partenza' ? DA_URL.partenza : DA_URL.arrivo) || '';
/* l'ultima data scritta DA NOI: serve a distinguerla da una scritta
   dall'ospite, che non va mai sovrascritta */
let nostra = '';
let OSPITE = null;      /* dati dal token, se c'e' */
let INVIANDO = false;

function testata() {
  const t = T[LNG];
  document.documentElement.lang = LNG;
  $('tOcchiello').textContent = t.occhiello;
  $('tTitolo').textContent = t.titolo;
  $('tSotto').textContent = t.sotto;
  $('tLingue').innerHTML = '<select id="selLingua" aria-label="Lingua">' +
    ['it','de','en','fr'].map(l =>
      '<option value="' + l + '"' + (l === LNG ? ' selected' : '') + '>' +
        BANDIERE[l] + ' ' + l.toUpperCase() + '</option>').join('') + '</select>';
  $('selLingua').onchange = (e) => {

     QUELLO CHE SI VEDE E QUELLO CHE PARTE SONO DIVERSI, ed e' voluto:

     "Golf Montecchia⛳"). Su una pastiglia si notano; nella richiesta invece
     deve arrivare il valore ESATTO, o i tassisti ricevono una destinazione
     che nel loro sistema non esiste. Si ripulisce solo l'etichetta. */
  const perVedere = (v) => v.replace(/[🌀-🫿☀-➿️]/gu, '')
    .replace(/\s{2,}/g, ' ').trim();

  const primoGruppo = $('fLuogo').querySelector('optgroup');
  $('mete').innerHTML = [...(primoGruppo ? primoGruppo.children : [])]
    .map((o) => `<button type="button" class="meta" aria-pressed="false"
      data-valore="${esc(o.value)}">${esc(perVedere(o.value))}</button>`).join('');

  /* la tendina resta l'unico campo letto da invia(): le pastiglie non fanno
     altro che scriverci dentro il valore esatto. Un campo solo, una fonte
     sola — e la validazione del server (luogoValido) non cambia di una riga. */
  $('mete').addEventListener('click', (e) => {
    const p = e.target.closest('.meta');
    if (!p) return;
    for (const altra of $('mete').querySelectorAll('.meta')) {
      altra.setAttribute('aria-pressed', String(altra === p));
    }
    $('fLuogo').value = p.dataset.valore;
  });

  $('bAltre').onclick = () => {
    const box = $('boxAltre');
    const apro = box.style.display === 'none';
    box.style.display = apro ? 'block' : 'none';
    $('bAltre').textContent = apro ? t.tornaMete : t.altreMete;
    /* chi apre l'elenco completo sta cercando altro: la pastiglia scelta
       prima non deve restare accesa, o si vedrebbero due scelte insieme */
    if (apro) for (const p of $('mete').querySelectorAll('.meta')) p.setAttribute('aria-pressed', 'false');
  };
  /* scegliendo dalla tendina si spengono le pastiglie, per lo stesso motivo */
  $('fLuogo').addEventListener('change', () => {
    const scelto = $('fLuogo').value;
    for (const p of $('mete').querySelectorAll('.meta')) {
      p.setAttribute('aria-pressed', String(p.dataset.valore === scelto));
    }
  });

  /* LA NAVETTA. Si ricalcola a ogni cambiamento di meta, passeggeri,
     giorno e ora, perche' tutti e quattro entrano nella regola.

     SE LE CONDIZIONI CADONO LA SCELTA TORNA A PRIVATA: l'ospite sceglie la
     navetta in tre, poi diventano quattro e il pulsante sparisce — senza
     questo azzeramento la richiesta viaggerebbe marcata «condivisa» con una
     scelta che lui non ha piu' davanti agli occhi. */
  const aggiornaNavetta = () => {
    const n = navetta({
      luogo: $('fLuogo').value, pax: $('fPax').value,
      quando: $('fQuando').value, ora: $('fOra').value,
      /* il verso conta: in partenza il campo dell'ora contiene l'ora del
         VOLO, e la corsa parte tre ore prima — la fascia 8-20 si misura
         sulla corsa, non sul volo */
      verso: VERSO,
    }, new Date());
    $('boxServizio').style.display = n ? 'block' : 'none';
    if (!n) { COLLETTIVO = false; }
    else {
      $('navettaNota').textContent =
        n.nota === 'stessoPrezzo' ? t.navettaStessoPrezzo : t.navettaCostaMeno;
    }
    $('bPrivata').classList.toggle('attivo', !COLLETTIVO);
    $('bNavetta').classList.toggle('attivo', COLLETTIVO);
  };
  /* IL CONTESTO degli obbligatori: la destinazione decide se il volo serve
     (chi va a Golf Frassanelle non ne ha uno), la spunta decide se servono
     giorno e ora del ritorno. Si ridisegna a ogni cambiamento, perche'
     segnaEtichette sa anche TOGLIERE la stella. */
  const contesto = () => ({ luogo: $('fLuogo').value, ritorno: $('fRitorno').checked });
  const aggiornaObbligatori = () => segnaEtichette('transfer', document, contesto());

  /* LE TRE ORE PRIMA DEL VOLO. Con la navetta in partenza il campo dell'ora
     chiede l'ORA DEL VOLO, non quella del ritiro: e' quella che l'ospite
     conosce. Il ritiro lo calcoliamo noi e glielo scriviamo sotto — e se il
     volo e' di notte, il ritiro cade il GIORNO PRIMA, che detto male manda
     una persona ad aspettare la sera sbagliata. */
  const conNavettaInPartenza = () => COLLETTIVO && VERSO === 'partenza';

  /* il giorno prima di una data ISO, senza fusi: mezzogiorno per non
     inciampare nell'ora legale */
  const giornoPrimaDi = (iso) => {
    const d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() - 1);
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
  };

  const aggiornaRitiro = () => {
    const attivo = conNavettaInPartenza();
    $('etiOra').firstChild.nodeValue = attivo ? t.oraVolo : t.ora;
    const r = attivo ? ritiroPerVolo($('fOra').value) : null;
    if (!r) { $('notaRitiro').textContent = ''; return; }
    $('notaRitiro').textContent = r.giornoPrima && $('fQuando').value
      ? t.ritiroGiornoPrima(giornoPrimaDi($('fQuando').value), r.ora)
      : t.ritiroAlle(r.ora);
  };

  const scegliServizio = (c) => { COLLETTIVO = c; aggiornaNavetta(); aggiornaRitiro(); };
  $('bPrivata').onclick = () => scegliServizio(false);
  $('bNavetta').onclick = () => scegliServizio(true);
  for (const id of ['fLuogo', 'fPax', 'fQuando', 'fOra']) {
    $(id).addEventListener('change', aggiornaNavetta);
    $(id).addEventListener('input', aggiornaNavetta);
  }
  $('mete').addEventListener('click', () => { aggiornaNavetta(); aggiornaObbligatori(); });
  $('fLuogo').addEventListener('change', aggiornaObbligatori);
  $('fOra').addEventListener('input', aggiornaRitiro);
  $('fRitorno').addEventListener('change', () => {
    $('boxRitorno').style.display = $('fRitorno').checked ? 'block' : 'none';
    aggiornaObbligatori();
  });

  /* le etichette dei gruppi si traducono qui: nel modello sono segnaposto */
  for (const g of $('fLuogo').querySelectorAll('optgroup')) {
    if (g.label === '__COMUNI__') g.label = t.comuni;
    if (g.label === '__TUTTE__') g.label = t.tutte;
  }

  const scegli = (v) => {
    VERSO = v;
    $('bArrivo').classList.toggle('attivo', v === 'arrivo');
    $('bPartenza').classList.toggle('attivo', v === 'partenza');
    /* cambiando verso cambia il senso dell'ora: in partenza con la navetta
       il campo diventa l'ora del volo, e la fascia si misura sulla corsa */
    aggiornaNavetta();
    aggiornaRitiro();
    /* La data segue il verso: il transfer di ARRIVO cade il giorno del
       check-in, quello di PARTENZA il giorno del check-out. Chi arriva
       dall'email della reception ha tutte e due le date nell'indirizzo,
       quindi il campo si riempie da solo e cambia quando cambia il verso.

       MA SOLO SE L'OSPITE NON L'HA GIA' CORRETTA. `nostra` tiene l'ultimo
       valore che abbiamo scritto noi: se il campo contiene ancora quello,
       e' rimasto come l'avevamo messo e possiamo sostituirlo; se contiene
       altro, l'ha scritto lui e non si tocca. Senza questo controllo, un
       ospite che corregge la data e poi tocca «Partenza» per curiosita' si
       vedrebbe cancellare quello che aveva appena scritto. */
    const campo = $('fQuando');
    if (campo && (campo.value === '' || campo.value === nostra)) {
      nostra = dataPerVerso();
      campo.value = nostra;
    }
  };
  $('bArrivo').onclick = () => scegli('arrivo');
  $('bPartenza').onclick = () => scegli('partenza');
  segnaEtichette('transfer', document,
    { luogo: $('fLuogo').value, ritorno: $('fRitorno').checked });
  $('bInvia').onclick = invia;

  /* la data che il modello ha appena scritto e' NOSTRA: senza ricordarla,
     al primo tocco su «Partenza» la pagina crederebbe che l'abbia messa
     l'ospite e non la aggiornerebbe mai */
  nostra = dataPerVerso();

  /* #fQuando e' ricreato qui a ogni disegno di modulo(): riattivarlo in
     questo punto, non solo al primo caricamento. */
  attivaDate();

  /* chi arriva dall'email della reception ha gia' meta e date nell'indirizzo:
     la navetta deve essere gia' al posto giusto, non comparire al primo tocco */
  aggiornaNavetta();
}

/* Giorno e ora della corsa come la prenoteremo dai tassisti, piu' l'ora del
   volo da cui nascono.

   Con la navetta in partenza il campo dell'ora contiene l'ORA DEL VOLO —
   e' quella che l'ospite conosce — ma la corsa parte tre ore prima. Se il
   volo e' di notte il ritiro cade il GIORNO PRIMA, e allora arretra anche
   la data: senza, si prenoterebbe un taxi per il giorno sbagliato.

   Fuori da quel caso non cambia niente: quello che l'ospite ha scritto e'
   gia' l'ora del ritiro, come dice la guida in cima al riquadro. */
function corsaVera() {
  const quando = v('fQuando');
  const scritta = v('fOra');
  if (!(COLLETTIVO && VERSO === 'partenza')) return { quando, ora: scritta };

  const r = ritiroPerVolo(scritta);
  if (!r) return { quando, ora: scritta };

  let giorno = quando;
  if (r.giornoPrima && quando) {
    const d = new Date(quando + 'T12:00:00');
    d.setDate(d.getDate() - 1);
    giorno = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  return { quando: giorno, ora: r.ora, ora_volo: scritta };
}

async function invia() {
  const t = T[LNG];
  if (INVIANDO) return;
  /* il telefono e' obbligatorio quanto nome ed email: il server lo impone
     da quando esiste un solo modo per raggiungere l'ospite se la corsa va
     spostata, ed e' quello. Il controllo qui evita che l'ospite scopra il
     rifiuto solo dopo aver premuto invia.
     Quali campi siano obbligatori lo dice /comune/obbligatori.js, la stessa
     lista da cui nasce l'asterisco: il messaggio prima li elencava TUTTI e
     SEMPRE («destinazione, giorno, ora, nome, email e telefono»), anche
     quando ne mancava uno solo, e chi lo leggeva doveva ricontrollarli a
     uno a uno. */
  const contestoOra = { luogo: v('fLuogo'), ritorno: $('fRitorno').checked };
  const vuoti = mancanti('transfer', (id) => ($(id) ? $(id).value : ''), contestoOra);
  if (vuoti.length) {
    $('esito').innerHTML = `<div class="errore">${esc(t.mancaChe(nomiMancanti(vuoti, t)))}</div>`;
    segnaVuoti('transfer', vuoti, document, contestoOra);
    return;
  }
  if (!$('fPrivacy').checked) {
    $('esito').innerHTML = `<div class="errore">${esc(t.privacyManca)}</div>`;
    const spunta = $('fPrivacy');
    if (spunta) {
      spunta.scrollIntoView({ block: 'center', behavior: 'smooth' });
      spunta.focus({ preventScroll: true });
    }
    return;
  }
  INVIANDO = true;
  $('bInvia').disabled = true;
  $('bInvia').textContent = t.invio;
  $('esito').innerHTML = '';
  try {
    const r = await fetch(FUNZIONE, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        tipo: 'transfer',
        nome: v('fNome'), email: v('fEmail'), telefono: v('fTel'),
        privacy_presa_atto: $('fPrivacy').checked,
        lingua: LNG, token: TOKEN, origine: location.href,
        dati: {
          /* giorno e ora NON si prendono dai campi: li da' corsaVera(), che
             con la navetta in partenza traduce l'ora del volo nell'ora del
             ritiro — e se il volo e' di notte arretra anche la data */
          ...corsaVera(),
          pax: Number(v('fPax') || 2),
          verso: VERSO, luogo: v('fLuogo'), volo: v('fVolo'), collettivo: COLLETTIVO,
          ritorno_quando: v('fRitornoQuando'), ritorno_ora: v('fRitornoOra'),
          ritorno: $('fRitorno').checked, note: v('fNote'),
        },
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      /* qualunque intoppo lascia un modo di arrivare a noi: mai un falso
         "inviata", che e' il difetto che aveva il vecchio form del sito */
      console.error('richiesta non registrata:', r.status, d);
      throw new Error('non registrata');
    }
    grazie(d.numero || '');
  } catch (e) {
    console.error(e);
    INVIANDO = false;
    $('bInvia').disabled = false;
    $('bInvia').textContent = t.invia;
    $('esito').innerHTML = `<div class="errore">${esc(t.ripiego)}</div>`;
  }
}

function grazie(numero) {
  const t = T[LNG];
  $('app').innerHTML = `<div class="riquadro fatta">
    <h2>${esc(t.grazieTit)}</h2>
    <p style="color:var(--verde-medio);">${esc(t.grazieTxt)}</p>
    ${numero ? `<div class="rif">${esc(numero)}</div>
      <div class="guida" style="margin-top:4px;">${esc(t.rif)}</div>` : ''}
    <p style="margin-top:22px;"><a href="?l=${LNG}">${esc(t.ancora)}</a></p>
  </div>`;
}

/* Se l'ospite arriva da una nostra email porta un token: nome, contatti e
   soggiorno li sappiamo gia'. Un token scaduto o inventato non blocca
   niente, si ricade sul modulo vuoto. */
async function precompila() {
  if (!TOKEN) return;
  try {
    const r = await fetch(`${FUNZIONE}?a=precompila&t=${encodeURIComponent(TOKEN)}`);
    const d = await r.json();
    if (d && d.noto && d.ospite) {
      OSPITE = d.ospite;
      if (['it','de','en','fr'].includes(OSPITE.lingua) && !qs.get('l')) LNG = OSPITE.lingua;
    }
  } catch (e) { console.error('precompilazione non riuscita', e); }
}

await precompila();
testata();
modulo();
</script>
