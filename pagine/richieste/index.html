<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1A3626" />
<title>Richieste — Hotel Terme Leonardo</title>
<link rel="icon" href="/buoni/img/logo-quadrato.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
:root{--verde:#1A3626;--verde-medio:#3C5346;--acqua:#8FC4BC;--acqua-chiara:#E4F0EA;
  --oro:#C9A961;--crema:#F9F6F0;--grigio:#7B756A;--allarme:#C0392B;}
*{box-sizing:border-box;}
body{margin:0;background:var(--crema);color:#2A2E2B;
  font:15px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.testata{background:var(--acqua-chiara);padding:34px 20px 30px;text-align:center;position:relative;}
/* la lingua e' una scelta che si fa una volta: sta in un angolo, non in
   mezzo al percorso. Una select vera e non un menu finto: sui telefoni
   apre il selettore di sistema, che si usa meglio di qualunque tendina
   disegnata a mano */
.sceltaLingua{position:absolute;top:12px;right:12px;}
.sceltaLingua select{width:auto;margin:0;padding:6px 26px 6px 9px;font-size:14px;
  border-radius:8px;border:1px solid rgba(26,54,38,.15);background:rgba(255,255,255,.8);
  color:var(--verde-medio);cursor:pointer;}
.testata img{width:210px;max-width:60%;height:auto;display:block;margin:0 auto;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:34px;
  line-height:1.2;color:var(--verde);margin:20px 0 8px;}
.occhiello{font-size:11px;letter-spacing:3px;color:var(--oro);text-transform:uppercase;}
.sotto{color:var(--verde-medio);max-width:560px;margin:0 auto;}
main{max-width:640px;margin:0 auto;padding:26px 18px 60px;}
.riquadro{background:#fff;border:1px solid #E5E0D8;border-radius:14px;padding:22px;margin-bottom:18px;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:23px;
  color:var(--verde);margin:0 0 4px;}
.guida{color:var(--grigio);font-size:13.5px;margin-bottom:16px;}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--verde-medio);font-weight:600;margin-top:14px;}
input,select,textarea{width:100%;margin-top:6px;padding:12px 13px;font:15px inherit;
  border:1px solid #DCD6CB;border-radius:9px;background:#FCFBF8;color:#2A2E2B;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acqua);border-color:transparent;}
textarea{min-height:80px;resize:vertical;}
.due{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.due{grid-template-columns:1fr;}}
.spunta{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:14.5px;
  color:var(--verde-medio);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;}
.spunta input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;}
.avviso{background:#FFF6E8;border-left:4px solid var(--oro);padding:13px 15px;border-radius:6px;
  font-size:13.5px;color:#6B4A22;margin-bottom:18px;line-height:1.6;}
.noto{background:var(--acqua-chiara);border-left:4px solid var(--acqua);padding:13px 15px;
  border-radius:6px;font-size:13.5px;color:var(--verde-medio);margin-bottom:16px;}
.invia{width:100%;margin-top:22px;padding:16px;border:0;border-radius:999px;
  background:var(--verde);color:var(--crema);font:600 16px inherit;cursor:pointer;}
.invia:disabled{background:#B9BDB6;cursor:default;}
.errore{margin-top:14px;background:#FDF0EE;border-left:4px solid var(--allarme);padding:13px 15px;
  border-radius:6px;color:#7A2E24;font-size:14px;line-height:1.6;}
.fatta{text-align:center;padding:40px 22px;}
.fatta .rif{font-family:"Courier New",monospace;font-size:20px;color:var(--verde);
  letter-spacing:1px;margin-top:10px;}
.pie{text-align:center;color:var(--grigio);font-size:12.5px;padding:0 18px 40px;}
.pie a{color:var(--verde-medio);}
</style>
</head>

<div class="testata">
  <div class="sceltaLingua" id="tLingue"></div>
  <img src="/buoni/img/logo.svg" alt="Hotel Terme Leonardo" />
  <div class="occhiello" style="margin-top:22px;" id="tOcchiello"></div>
  <h1 id="tTitolo"></h1>
  <p class="sotto" id="tSotto"></p>
  
</div>
<main id="app"></main>
<div class="pie" id="tPie"></div>

const BANDIERE = { it:'🇮🇹', de:'🇩🇪', en:'🇬🇧', fr:'🇫🇷' };

const oggiISO = () => new Date().toISOString().slice(0,10);
let OSPITE = null;
let INVIANDO = false;

function testata() {
  const t = T[LNG], s = t[TIPO];
  document.documentElement.lang = LNG;
  document.title = `${s.titolo} — Hotel Terme Leonardo`;
  $('tOcchiello').textContent = s.occhiello;
  $('tTitolo').textContent = s.titolo;
  $('tSotto').textContent = s.sotto;
  $('tLingue').innerHTML = '<select id="selLingua" aria-label="Lingua">' +
    ['it','de','en','fr'].map(l =>
      '<option value="' + l + '"' + (l === LNG ? ' selected' : '') + '>' +
        BANDIERE[l] + ' ' + l.toUpperCase() + '</option>').join('') + '</select>';
  $('selLingua').onchange = (e) => {
    location.search = '?tipo=' + TIPO + '&l=' + e.target.value +
      (TOKEN ? '&t=' + encodeURIComponent(TOKEN) : '');
  };
  $('tPie').innerHTML = `Hotel Terme Leonardo &middot; Via Monteortone 46, Abano Terme &middot;
    <a href="tel:+390499939200">+39 049 9939200</a> &middot;
    <a href="mailto:info@termeleonardo.com">info@termeleonardo.com</a>`;
}

function campiTipo(t) {
  if (TIPO === 'greenfee') return `
    <label for="fCircolo">${esc(t.circolo)}</label>
    <select id="fCircolo">${CIRCOLI.map(([v,n]) =>
      `<option value="${v}">${esc(n)}</option>`).join('')}</select>
    <div class="due">
      <div><label for="fData">${esc(t.quando)}</label>
        <input type="date" id="fData" min="${oggiISO()}" /></div>
      <div><label for="fOra">${esc(t.ora)}</label><input type="time" id="fOra" /></div>
    </div>
    <div class="due">
      <div><label for="fGiocatori">${esc(t.giocatori)}</label>
        <input type="number" id="fGiocatori" min="1" max="4" value="2" /></div>
      <div><label for="fPercorso">${esc(t.percorso)}</label>
        <input type="text" id="fPercorso" placeholder="${esc(t.percorsoPh)}" /></div>
    </div>
    <label>${esc(t.noleggi)}</label>
    <label class="spunta"><input type="checkbox" id="fGolfcar" /><span>${esc(t.golfcar)}</span></label>
    <label class="spunta"><input type="checkbox" id="fCarrello" /><span>${esc(t.carrello)}</span></label>
    <label class="spunta"><input type="checkbox" id="fCarrelloE" /><span>${esc(t.carrelloE)}</span></label>
    <label class="spunta"><input type="checkbox" id="fSacca" /><span>${esc(t.sacca)}</span></label>
    <label for="fTessera">${esc(t.tessera)}</label>
    <input type="text" id="fTessera" placeholder="${esc(t.tesseraPh)}" />
    <label class="spunta" style="margin-top:18px;"><input type="checkbox" id="fTaxi" />
      <span>${esc(t.taxi)}</span></label>
    <div id="boxTaxi" style="display:none;">
      <div class="due">
        <div><label for="fTaxiOra">${esc(t.taxiOra)}</label><input type="time" id="fTaxiOra" /></div>
        <div><label class="spunta" style="margin-top:26px;">
          <input type="checkbox" id="fTaxiRitorno" /><span>${esc(t.taxiRitorno)}</span></label></div>
      </div>
    </div>`;

  if (TIPO === 'maestro') return `
    <div class="due">
      <div><label for="fData">${esc(t.quando)}</label>
        <input type="date" id="fData" min="${oggiISO()}" /></div>
      <div><label for="fOra">${esc(t.ora)}</label><input type="time" id="fOra" /></div>
    </div>
    <div class="due">
      <div><label for="fPersone">${esc(t.persone)}</label>
        <input type="number" id="fPersone" min="1" max="4" value="1" /></div>
      <div><label for="fLivello">${esc(t.livello)}</label>
        <select id="fLivello">
          <option value="">${esc(t.liv0)}</option>
          <option value="principiante">${esc(t.liv1)}</option>
          <option value="intermedio">${esc(t.liv2)}</option>
          <option value="esperto">${esc(t.liv3)}</option>
        </select></div>
    </div>`;

  return `
    <label>${esc(t.quali)}</label>
    <div class="guida" style="margin-top:4px;">${esc(t.qualiGuida)}</div>
    ${TRATTAMENTI.map((v,i) => `<label class="spunta">
      <input type="checkbox" class="voce" value="${esc(v)}" id="v${i}" /><span>${esc(v)}</span></label>`).join('')}
    <div class="due" style="margin-top:16px;">
      <div><label for="fGiorno">${esc(t.giorno)}</label>
        <input type="date" id="fGiorno" min="${oggiISO()}" /></div>
      <div><label for="fFascia">${esc(t.fascia)}</label>
        <select id="fFascia">
          <option value="indifferente">${esc(t.indifferente)}</option>
          <option value="mattina">${esc(t.mattina)}</option>
          <option value="pomeriggio">${esc(t.pomeriggio)}</option>
        </select></div>
    </div>`;
}

function modulo() {
  const t = T[LNG];
  $('app').innerHTML = `
    <div class="avviso">${t.avviso}</div>
    ${OSPITE ? `<div class="noto">${esc(t.noto(OSPITE.nome || ''))}</div>` : ''}
    <div class="riquadro">${campiTipo(t)}</div>
    <div class="riquadro">
      <h2>${esc(t.chi)}</h2><div class="guida">${esc(t.guidaChi)}</div>
      <label for="fNome">${esc(t.nome)}</label>
      <input type="text" id="fNome" autocomplete="name" value="${esc(OSPITE?.nome || '')}" />
      <div class="due">
        <div><label for="fEmail">${esc(t.email)}</label>
          <input type="email" id="fEmail" autocomplete="email" value="${esc(OSPITE?.email || '')}" /></div>
        <div><label for="fTel">${esc(t.tel)}</label>
          <input type="tel" id="fTel" autocomplete="tel" /></div>
      </div>
      <label for="fNote">${esc(t.note)}</label>
      <textarea id="fNote" placeholder="${esc(t.notePh)}"></textarea>

      <label class="spunta"><input type="checkbox" id="fPrivacy" />
        <span>${esc(t.privacy)} &mdash;
          <a href="https://www.termeleonardo.com/${LNG}/privacy" target="_blank"
            rel="noopener noreferrer">${esc(t.privacyLink)}</a></span></label>
    </div>
    <button class="invia" id="bInvia">${esc(t.invia)}</button>
    <div id="esito"></div>`;

  const taxi = $('fTaxi');
  if (taxi) taxi.onchange = () => {
    $('boxTaxi').style.display = taxi.checked ? 'block' : 'none';
  };
  $('bInvia').onclick = invia;
}

function raccogli() {
  const v = (id) => ($(id) ? $(id).value.trim() : '');
  const c = (id) => ($(id) ? $(id).checked : false);
  if (TIPO === 'greenfee') return {
    circolo: v('fCircolo'), data: v('fData'), ora: v('fOra'),
    giocatori: Number(v('fGiocatori') || 1), percorso: v('fPercorso'),
    golfcar: c('fGolfcar'), carrello: c('fCarrello'),
    carrello_elettrico: c('fCarrelloE'), sacca: c('fSacca'),
    tessera: v('fTessera'), note: v('fNote'),
    taxi: c('fTaxi'), taxi_ora: v('fTaxiOra'), taxi_ritorno: c('fTaxiRitorno'),
  };
  if (TIPO === 'maestro') return {
    data: v('fData'), ora: v('fOra'),
    persone: Number(v('fPersone') || 1), livello: v('fLivello'), note: v('fNote'),
  };
  return {
    voci: [...document.querySelectorAll('.voce:checked')].map(e => e.value),
    giorno: v('fGiorno'), fascia: v('fFascia'), note: v('fNote'),
  };
}

/* il controllo qui serve solo a dare un messaggio gentile: quello vero lo
   fa il server, perche' il browser si aggira */
function completo() {
  const v = (id) => ($(id) ? $(id).value.trim() : '');
  if (!v('fNome') || !v('fEmail')) return false;
  if (TIPO === 'trattamenti') return !!v('fGiorno') && document.querySelectorAll('.voce:checked').length > 0;
  return !!v('fData') && !!v('fOra');
}

async function invia() {
  const t = T[LNG];
  if (INVIANDO) return;
  if (!completo()) {
    $('esito').innerHTML = `<div class="errore">${esc(t.manca)}</div>`;
    return;
  }
  if (!$('fPrivacy').checked) {
    $('esito').innerHTML = `<div class="errore">${esc(t.privacyManca)}</div>`;
    return;
  }
  INVIANDO = true;
  $('bInvia').disabled = true;
  $('bInvia').textContent = t.invio;
  $('esito').innerHTML = '';
  try {
    const r = await fetch(FUNZIONE, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        tipo: TIPO,
        nome: $('fNome').value.trim(), email: $('fEmail').value.trim(),
        telefono: $('fTel').value.trim(),
        privacy_presa_atto: $('fPrivacy').checked,
        lingua: LNG, token: TOKEN, origine: location.href,
        dati: raccogli(),
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { console.error('non registrata:', r.status, d); throw new Error('ko'); }
    grazie(d.numero || '');
  } catch (e) {
    console.error(e);
    INVIANDO = false;
    $('bInvia').disabled = false;
    $('bInvia').textContent = t.invia;
    $('esito').innerHTML = `<div class="errore">${esc(t.ripiego)}</div>`;
  }
}

function grazie(numero) {
  const t = T[LNG];
  $('app').innerHTML = `<div class="riquadro fatta">
    <h2>${esc(t.grazieTit)}</h2>
    <p style="color:var(--verde-medio);">${esc(t.grazieTxt)}</p>
    ${numero ? `<div class="rif">${esc(numero)}</div>
      <div class="guida" style="margin-top:4px;">${esc(t.rif)}</div>` : ''}
    <p style="margin-top:22px;"><a href="?tipo=${TIPO}&l=${LNG}">${esc(t.ancora)}</a></p>
  </div>`;
}

async function precompila() {
  if (!TOKEN) return;
  try {
    const r = await fetch(`${FUNZIONE}?a=precompila&t=${encodeURIComponent(TOKEN)}`);
    const d = await r.json();
    if (d && d.noto && d.ospite) {
      OSPITE = d.ospite;
      if (['it','de','en','fr'].includes(OSPITE.lingua) && !qs.get('l')) LNG = OSPITE.lingua;
    }
  } catch (e) { console.error('precompilazione non riuscita', e); }
}

await precompila();
testata();
modulo();
</script>
</body>
</html>
