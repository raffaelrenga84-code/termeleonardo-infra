<head>
<meta charset="utf-8" />

<title>Richieste — Hotel Terme Leonardo</title>
<link rel="icon" href="/buoni/img/logo-quadrato.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
:root{--verde:#1A3626;--verde-medio:#3C5346;--acqua:#8FC4BC;--acqua-chiara:#E4F0EA;
  --oro:#C9A961;--crema:#F9F6F0;--grigio:#7B756A;--allarme:#C0392B;}
*{box-sizing:border-box;}
body{margin:0;background:var(--crema);color:#2A2E2B;
  font:15px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.testata{background:var(--acqua-chiara);padding:34px 20px 30px;text-align:center;position:relative;}
/* la lingua e' una scelta che si fa una volta: sta in un angolo, non in
   mezzo al percorso. Una select vera e non un menu finto: sui telefoni
   apre il selettore di sistema, che si usa meglio di qualunque tendina
   disegnata a mano */
.sceltaLingua{position:absolute;top:12px;right:12px;}
.sceltaLingua select{width:auto;margin:0;padding:6px 26px 6px 9px;font-size:14px;
  border-radius:8px;border:1px solid rgba(26,54,38,.15);background:rgba(255,255,255,.8);
  color:var(--verde-medio);cursor:pointer;}
.testata img{width:210px;max-width:60%;height:auto;display:block;margin:0 auto;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:34px;
  line-height:1.2;color:var(--verde);margin:20px 0 8px;}
.occhiello{font-size:11px;letter-spacing:3px;color:var(--oro);text-transform:uppercase;}
.sotto{color:var(--verde-medio);max-width:560px;margin:0 auto;}
main{max-width:640px;margin:0 auto;padding:26px 18px 60px;}
.riquadro{background:#fff;border:1px solid #E5E0D8;border-radius:14px;padding:22px;margin-bottom:18px;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:23px;
  color:var(--verde);margin:0 0 4px;}
.guida{color:var(--grigio);font-size:13.5px;margin-bottom:16px;}
/* niente maiuscoletto: le etichette si leggono come frasi, non come
   voci di un modulo da sportello */
label{display:block;font-size:13.5px;
  color:var(--verde-medio);font-weight:500;margin-top:15px;}
input,select,textarea{width:100%;margin-top:6px;padding:12px 13px;font:15px inherit;
  border:1px solid #DCD6CB;border-radius:9px;background:#FCFBF8;color:#2A2E2B;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acqua);border-color:transparent;}
textarea{min-height:80px;resize:vertical;}
.due{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.due{grid-template-columns:1fr;}}
.spunta{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:14.5px;
  color:var(--verde-medio);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;}
.spunta input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;}
.avviso{background:#FFF6E8;border-left:4px solid var(--oro);padding:13px 15px;border-radius:6px;
  font-size:13.5px;color:#6B4A22;margin-bottom:18px;line-height:1.6;}
.noto{background:var(--acqua-chiara);border-left:4px solid var(--acqua);padding:13px 15px;
  border-radius:6px;font-size:13.5px;color:var(--verde-medio);margin-bottom:16px;}
.invia{width:100%;margin-top:22px;padding:16px;border:0;border-radius:999px;
  background:var(--verde);color:var(--crema);font:600 16px inherit;cursor:pointer;}
.invia:disabled{background:#B9BDB6;cursor:default;}
.errore{margin-top:14px;background:#FDF0EE;border-left:4px solid var(--allarme);padding:13px 15px;
  border-radius:6px;color:#7A2E24;font-size:14px;line-height:1.6;}
.fatta{text-align:center;padding:40px 22px;}
.fatta .rif{font-family:"Courier New",monospace;font-size:20px;color:var(--verde);
  letter-spacing:1px;margin-top:10px;}
.pie{text-align:center;color:var(--grigio);font-size:12.5px;padding:0 18px 40px;}
.pie a{color:var(--verde-medio);}

/* -------- percorso guidato dei trattamenti --------
   Stessa idea dell'anteprima approvata (docs/anteprime/2026-08-15-menu-
   trattamenti.html): prima si sceglie una categoria, poi solo le voci di
   quella. Nomi di classe distinti (suffisso Tratt) per non toccare nessuna
   regola gia' in uso da greenfee/maestro. */
.domandaTratt{font:600 16px/1.3 inherit;color:var(--verde);margin:16px 0 10px;}
.stradeTratt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;}
.stradaTratt{border:1px solid #DCD6CB;border-radius:9px;padding:12px 13px;cursor:pointer;
  background:#FCFBF8;text-align:left;font-family:inherit;color:#2A2E2B;}
.stradaTratt:hover{border-color:var(--oro);background:var(--acqua-chiara);}
.stradaTratt[aria-pressed="true"]{border-color:var(--verde);background:var(--acqua-chiara);}
.stradaTratt .stTratt{font-weight:600;color:var(--verde);display:block;font-size:14.5px;}
.stradaTratt .sqTratt{font-size:12px;color:var(--grigio);margin-top:3px;display:block;}
/* il cuore e' lo stesso segno del listino stampato, non un'icona inventata */
.stradaTratt.consiglioTratt{border-color:var(--oro);}
.stradaTratt.consiglioTratt .stTratt::after{content:" ♥";color:var(--oro);font-size:12px;}

.risultatoTratt{margin-top:16px;}
.vuotoTratt{color:var(--grigio);font-size:14px;font-style:italic;margin:6px 0;}
.titoloGruppoTratt{font:600 15px inherit;color:var(--verde);margin:0 0 8px;}

.rigaTratt{display:block;}
.vociTratt{display:flex;align-items:center;gap:9px;padding:9px 4px;border-radius:6px;cursor:pointer;}
.vociTratt:hover{background:var(--acqua-chiara);}
.vociTratt>input{width:18px;height:18px;margin:0;flex:0 0 auto;accent-color:var(--verde);}
.vociTratt .nomeTratt{flex:1 1 auto;font-size:14.5px;color:#2A2E2B;}
.vociTratt .durataTratt{color:var(--grigio);font-size:12.5px;white-space:nowrap;}
.vociTratt .prezzoTratt{font-weight:600;color:var(--verde);white-space:nowrap;
  font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
.filettoTratt{flex:1 1 auto;border-bottom:1px dotted #DCD6CB;min-width:10px;}

/* bersaglio di 30px anche se il segno che si vede e' piccolo: su un
   telefono un'icona piu' piccola e' un pulsante che non si riesce a
   premere — segnalato nella specifica di design */
.infoTratt{flex:0 0 auto;width:30px;height:30px;border:0;background:transparent;
  color:var(--oro);cursor:pointer;font:italic 700 14px/1 Georgia,serif;
  border-radius:50%;padding:0;}
.infoTratt:hover{background:var(--acqua-chiara);color:var(--verde);}
.infoTratt[aria-expanded="true"]{background:var(--verde);color:var(--crema);}
.spiegaTratt{display:block;margin:-2px 4px 10px 43px;padding:9px 12px;
  background:var(--acqua-chiara);border-radius:6px;font-size:13.5px;
  color:var(--verde-medio);max-width:56ch;}

.pienoTratt{margin-top:16px;padding-top:14px;border-top:1px solid #E5E0D8;
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.pienoTratt .contoTratt{color:var(--grigio);font-size:13.5px;}
.pienoTratt .sommaTratt{font:600 17px inherit;color:var(--verde);font-variant-numeric:tabular-nums;}
.capMsgTratt{margin:10px 0 0;background:#FFF6E8;border-left:4px solid var(--oro);
  padding:10px 13px;border-radius:6px;font-size:13px;color:#6B4A22;line-height:1.5;}
</style>
</head>

/* ---------- il periodo del soggiorno, quando lo sappiamo ----------
   Chi arriva da un pulsante nell'offerta della reception porta le date del
   suo soggiorno nell'indirizzo. Un trattamento, una lezione o una partenza
   di golf FUORI da quel periodo non ha senso: l'ospite non c'e'.

   Non si precompila un giorno — sceglierlo al posto suo sarebbe indovinare
   — ma si stringono i limiti del calendario a quei giorni. Cosi' il mese
   sbagliato non si puo' proprio scegliere, che e' l'errore piu' comune su
   un campo data, e la reception non riceve richieste per date impossibili.

   `min` e' la piu' TARDA fra oggi e l'arrivo: un soggiorno gia' cominciato
   non deve riaprire i giorni passati. Se le date non ci sono, i limiti
   restano quelli di prima e non cambia niente per nessuno. */
const DAL = DA_URL.arrivo && DA_URL.arrivo > oggiISO() ? DA_URL.arrivo : oggiISO();
const AL = DA_URL.partenza || '';
const limitiSoggiorno = () => `min="${esc(DAL)}"` + (AL ? ` max="${esc(AL)}"` : '');

/* ---------------- trattamenti: percorso guidato ----------------
   Le voci scelte si tengono per INDICE nell'array TRATTAMENTI (stabile: non
   si riordina mai a runtime), in un Set che sopravvive al passaggio da un
   gruppo all'altro. Senza questo, ogni volta che si cambia "strada" il
   pannello viene ridisegnato da capo e le caselle spuntate nel gruppo
   precedente sparirebbero insieme al DOM che le conteneva: si potrebbe
   scegliere un trattamento per gruppo soltanto, non uno o due per gruppo
   fino a un totale di otto. */
let SCELTI_TRATT = new Set();
const TRATT_MAX = 8;

function percorsiTratt(t) {
  const gruppo = (id, nome, tag, voci) => ({ id, nome, tag, voci });
  return [
    gruppo('cuore', t.tratt.cuoreNome, t.tratt.cuoreTag, TRATTAMENTI.filter((v) => v.cuore)),
    ...ORDINE_GRUPPI.map((id) => gruppo(
      id, t.tratt[id + 'Nome'], t.tratt[id + 'Tag'],
      TRATTAMENTI.filter((v) => v.gruppo === id),
    )),
  ];
}

function disegnaStradeTratt(t, percorsi, attivo) {
  $('stradeTratt').innerHTML = percorsi.map((p, i) => `
    <button type="button" class="stradaTratt${i === 0 ? ' consiglioTratt' : ''}"
      aria-pressed="${i === attivo}" data-i="${i}">
      <span class="stTratt">${esc(p.nome)}</span><span class="sqTratt">${esc(p.tag)}</span>
    </button>`).join('');
}

function disegnaRisultatoTratt(t, percorsi, attivo) {
  if (attivo < 0) {
    $('risultatoTratt').innerHTML = `<p class="vuotoTratt">${esc(t.tratt.vuoto)}</p>`;
    return;
  }
  const p = percorsi[attivo];
  $('risultatoTratt').innerHTML = `<p class="titoloGruppoTratt">${esc(p.nome)}</p>` +
    p.voci.map((v) => {
      const i = TRATTAMENTI.indexOf(v);
      return `
      <span class="rigaTratt">
        <label class="vociTratt">
          <input type="checkbox" class="voce" value="${esc(nomeCompleto(v))}"
            data-i="${i}"${SCELTI_TRATT.has(i) ? ' checked' : ''} />
          <span class="nomeTratt">${esc(v.nome)}</span>
          ${v.durata ? `<span class="durataTratt">${esc(v.durata)}</span>` : ''}
          ${v.chiave ? `<button type="button" class="infoTratt" aria-expanded="false"
              aria-label="${esc(t.tratt.info(v.nome))}" data-k="${esc(v.chiave)}"
              data-id="spiegaTratt${i}">i</button>` : ''}
          <span class="filettoTratt"></span>
          <span class="prezzoTratt">${esc(prezzoTesto(v))}</span>
        </label>
        <span class="spiegaTratt" id="spiegaTratt${i}" hidden></span>
      </span>`;
    }).join('');
}

function contaTratt(t) {
  const n = SCELTI_TRATT.size;
  $('contoTratt').textContent = n === 0 ? t.tratt.nessuna : n === 1 ? t.tratt.una : t.tratt.molte(n);
  let somma = 0;
  for (const i of SCELTI_TRATT) somma += TRATTAMENTI[i].prezzo;
  $('sommaTratt').textContent = somma ? somma + ' €' : '';
}

/* Chiamata una sola volta per disegno di modulo() (come attivaDate()):
   modulo() ricrea #app da zero a ogni chiamata, quindi non c'e' rischio di
   attaccare due volte lo stesso ascoltatore. */
function attivaTrattamenti(t) {
  const percorsi = percorsiTratt(t);
  let attivo = -1;
  disegnaStradeTratt(t, percorsi, attivo);
  disegnaRisultatoTratt(t, percorsi, attivo);
  contaTratt(t);

  $('percorsoTratt').addEventListener('click', (e) => {
    const info = e.target.closest('.infoTratt');
    if (info) {
      e.preventDefault();
      const box = document.getElementById(info.dataset.id);
      const aperto = info.getAttribute('aria-expanded') === 'true';
      /* una spiegazione aperta per volta: due o tre righe ciascuna, tenerne
         aperte piu' di una allunga il pannello piu' di quanto serva */
      document.querySelectorAll('#risultatoTratt .infoTratt[aria-expanded="true"]').forEach((altro) => {
        if (altro === info) return;
        altro.setAttribute('aria-expanded', 'false');
        const altraBox = document.getElementById(altro.dataset.id);
        if (altraBox) altraBox.hidden = true;
      });
      info.setAttribute('aria-expanded', String(!aperto));
      box.hidden = aperto;
      /* la chiave arriva da TRATTAMENTI, dati nostri e non dall'esterno:
         indicizzare SPIEGAZIONI[LNG][chiave] qui e' sicuro. LNG invece e'
         gia' passato da linguaScelta(), che lo valida contro l'elenco
         chiuso delle quattro lingue prima che arrivi fin qui. */
      if (!aperto) box.textContent = SPIEGAZIONI[LNG][info.dataset.k] || '';
      return;
    }
    const strada = e.target.closest('.stradaTratt');
    if (!strada) return;
    attivo = Number(strada.dataset.i);
    disegnaStradeTratt(t, percorsi, attivo);
    disegnaRisultatoTratt(t, percorsi, attivo);
  });

  $('percorsoTratt').addEventListener('change', (e) => {
    if (!e.target.matches('.voce')) return;
    const i = Number(e.target.dataset.i);
    if (e.target.checked) {
      /* il tetto si ferma QUI, prima dell'invio: tipi.ts rifiuta piu' di
         otto voci lato server, ma un rifiuto dopo aver compilato tutto il
         resto del modulo e' il tipo di sorpresa che questo progetto ha
         gia' imparato a evitare (vedi date.js, partenzaCoerente) */
      if (SCELTI_TRATT.size >= TRATT_MAX) {
        e.target.checked = false;
        $('capMsgTratt').textContent = t.tratt.massimo;
        $('capMsgTratt').hidden = false;
        return;
      }
      SCELTI_TRATT.add(i);
    } else {
      SCELTI_TRATT.delete(i);
    }
    $('capMsgTratt').hidden = true;
    contaTratt(t);
  });
}

  const t = T[LNG];
  $('app').innerHTML = `

    ${OSPITE ? `<div class="noto">${esc(t.noto(OSPITE.nome || ''))}</div>` : ''}

      <h2>${esc(t.chi)}</h2><div class="guida">${esc(t.guidaChi)}</div>
      <label for="fNome">${esc(t.nome)}</label>
      <input type="text" id="fNome" autocomplete="name" value="${esc(OSPITE?.nome || DA_URL.nome)}" />
      <div class="due">
        <div><label for="fEmail">${esc(t.email)}</label>
          <input type="email" id="fEmail" autocomplete="email" value="${esc(OSPITE?.email || DA_URL.email)}" /></div>
        <div><label for="fTel">${esc(t.tel)}</label>
          <!-- niente OSPITE?.tel: il token non lo restituisce mai, vedi il
               commento su DA_URL piu' in alto -->
          <input type="tel" id="fTel" autocomplete="tel" value="${esc(DA_URL.tel)}" /></div>
      </div>
      <label for="fNote">${esc(t.note)}</label>
      <!-- il riferimento dell'offerta va nelle note, con un'etichetta
           chiara: e' li' che lo ritrova la reception, non e' un campo del
           modulo (vedi il commento in cima a ospite-url.js) -->
      <textarea id="fNote" placeholder="${esc(t.notePh)}">${DA_URL.rif ? esc(t.rifOfferta(DA_URL.rif)) : ''}</textarea>

      <label class="spunta"><input type="checkbox" id="fPrivacy" />
        <span>${esc(t.privacy)} &mdash;
          <a href="https://www.termeleonardo.com/${LNG}/privacy" target="_blank"
            rel="noopener noreferrer">${esc(t.privacyLink)}</a></span></label>
    </div>
    <button class="invia" id="bInvia">${esc(t.invia)}</button>
    <div id="esito"></div>`;

  const taxi = $('fTaxi');
  if (taxi) taxi.onchange = () => {
    $('boxTaxi').style.display = taxi.checked ? 'block' : 'none';
  };

  /* I noleggi si aprono come il taxi. La differenza sta nella chiusura:
     `fNoleggi` non viene mandato al server — quello che parte sono le
     quattro caselle dentro. Se restassero spuntate dopo aver richiuso il
     riquadro, l'ospite chiederebbe una golf car che non vede piu' e che
     credeva di aver tolto, e in reception arriverebbe un noleggio da
     preparare per niente. Chiudendo si azzerano. */
  const noleggi = $('fNoleggi');
  if (noleggi) noleggi.onchange = () => {
    const box = $('boxNoleggi');
    box.style.display = noleggi.checked ? 'block' : 'none';
    if (!noleggi.checked) {
      for (const c of box.querySelectorAll('input[type="checkbox"]')) c.checked = false;
    }
  };
  $('bInvia').onclick = invia;

  /* i campi data (#fData o #fGiorno, secondo il tipo) sono ricreati qui a
     ogni disegno di modulo(): riattivarli in questo punto, non solo al
     primo caricamento. */
  attivaDate();
  if (TIPO === 'trattamenti') attivaTrattamenti(t);
}

function raccogli() {
  const v = (id) => ($(id) ? $(id).value.trim() : '');
  const c = (id) => ($(id) ? $(id).checked : false);
  if (TIPO === 'greenfee') return {
    circolo: v('fCircolo'), data: v('fData'), ora: v('fOra'),
    giocatori: Number(v('fGiocatori') || 1), percorso: v('fPercorso'),
    golfcar: c('fGolfcar'), carrello: c('fCarrello'),
    carrello_elettrico: c('fCarrelloE'), sacca: c('fSacca'),
    tessera: v('fTessera'), note: v('fNote'),
    taxi: c('fTaxi'), taxi_ora: v('fTaxiOra'), taxi_ritorno: c('fTaxiRitorno'),
  };
  if (TIPO === 'maestro') return {
    data: v('fData'), ora: v('fOra'),
    persone: Number(v('fPersone') || 1), livello: v('fLivello'), note: v('fNote'),
  };
  /* NON `[...document.querySelectorAll('.voce:checked')]`: #risultatoTratt
     contiene solo le voci del gruppo attualmente aperto, le altre sono
     state ridisegnate via al primo cambio di "strada". Leggendo solo il DOM
     una richiesta con un trattamento dai piu' richiesti e uno dai massaggi
     ne avrebbe mandato solo uno al server — il conteggio a schermo ne
     avrebbe mostrati due, la reception ne avrebbe ricevuto uno. SCELTI_TRATT
     e' la fonte vera, sopravvive al cambio di gruppo: vedi il commento sopra
     attivaTrattamenti(). */
  return {
    voci: [...SCELTI_TRATT].map((i) => nomeCompleto(TRATTAMENTI[i])),
    giorno: v('fGiorno'), fascia: v('fFascia'), note: v('fNote'),
  };
}

/* il controllo qui serve solo a dare un messaggio gentile: quello vero lo
   fa il server, perche' il browser si aggira. Il telefono e' obbligatorio
   come nome ed email: ognuna di queste richieste e' un appuntamento che si
   puo' spostare, e per spostarlo bisogna poter chiamare. */
function completo() {
  const v = (id) => ($(id) ? $(id).value.trim() : '');
  if (!v('fNome') || !v('fEmail') || !v('fTel')) return false;
  if (TIPO === 'trattamenti') return !!v('fGiorno') && SCELTI_TRATT.size > 0;
  return !!v('fData') && !!v('fOra');
}

async function invia() {
  const t = T[LNG];
  if (INVIANDO) return;
  if (!completo()) {
    $('esito').innerHTML = `<div class="errore">${esc(t.manca)}</div>`;
    return;
  }
  if (!$('fPrivacy').checked) {
    $('esito').innerHTML = `<div class="errore">${esc(t.privacyManca)}</div>`;
    return;
  }
  INVIANDO = true;
  $('bInvia').disabled = true;
  $('bInvia').textContent = t.invio;
  $('esito').innerHTML = '';
  try {
    const r = await fetch(FUNZIONE, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        tipo: TIPO,
        nome: $('fNome').value.trim(), email: $('fEmail').value.trim(),
        telefono: $('fTel').value.trim(),
        privacy_presa_atto: $('fPrivacy').checked,
        lingua: LNG, token: TOKEN, origine: location.href,
        dati: raccogli(),
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { console.error('non registrata:', r.status, d); throw new Error('ko'); }
    grazie(d.numero || '');
  } catch (e) {
    console.error(e);
    INVIANDO = false;
    $('bInvia').disabled = false;
    $('bInvia').textContent = t.invia;
    $('esito').innerHTML = `<div class="errore">${esc(t.ripiego)}</div>`;
  }
}

function grazie(numero) {
  const t = T[LNG];
  $('app').innerHTML = `<div class="riquadro fatta">
    <h2>${esc(t.grazieTit)}</h2>
    <p style="color:var(--verde-medio);">${esc(t.grazieTxt)}</p>
    ${numero ? `<div class="rif">${esc(numero)}</div>
      <div class="guida" style="margin-top:4px;">${esc(t.rif)}</div>` : ''}
    <p style="margin-top:22px;"><a href="?tipo=${TIPO}&l=${LNG}">${esc(t.ancora)}</a></p>
  </div>`;
}

async function precompila() {
  if (!TOKEN) return;
  try {
    const r = await fetch(`${FUNZIONE}?a=precompila&t=${encodeURIComponent(TOKEN)}`);
    const d = await r.json();
    if (d && d.noto && d.ospite) {
      OSPITE = d.ospite;
      if (['it','de','en','fr'].includes(OSPITE.lingua) && !qs.get('l')) LNG = OSPITE.lingua;
    }
  } catch (e) { console.error('precompilazione non riuscita', e); }
}

await precompila();
testata();
modulo();
</script>
</body>
</html>
