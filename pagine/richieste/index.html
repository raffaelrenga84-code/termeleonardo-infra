<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1A3626" />
<!-- NOINDEX. Questa pagina sola serve SEDICI indirizzi: trattamenti, green
     fee, maestro di golf e day spa, per quattro lingue, attraverso le
     riscritture di hoteltermeleonardo.com. Tutti portano questo stesso
     titolo e nessuna description: per un motore sono sedici risultati
     identici che non dicono cosa offrono. E uno di quegli indirizzi e'
     /it/day-spa, cioe' la parola con cui il pubblico locale cerca, mentre
     la pagina vera — milleduecento parole — sta su termeleonardo.com.
     Un modulo di richiesta e' un passaggio, non un approdo.
     «follow» e non «nofollow»: i collegamenti verso il sito dell'hotel
     restano buoni. La regola sta in pagine/indicizzazione.test.ts. -->
<meta name="robots" content="noindex, follow" />
<title>Richieste — Hotel Terme Leonardo</title>
<link rel="icon" href="/buoni/img/logo-quadrato.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
:root{--verde:#1A3626;--verde-medio:#3C5346;--acqua:#8FC4BC;--acqua-chiara:#E4F0EA;
  --oro:#C9A961;--crema:#F9F6F0;--grigio:#7B756A;--allarme:#C0392B;}
*{box-sizing:border-box;}
body{margin:0;background:var(--crema);color:#2A2E2B;
  font:15px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.testata{background:var(--acqua-chiara);padding:34px 20px 30px;text-align:center;position:relative;}
/* la lingua e' una scelta che si fa una volta: sta in un angolo, non in
   mezzo al percorso. Una select vera e non un menu finto: sui telefoni
   apre il selettore di sistema, che si usa meglio di qualunque tendina
   disegnata a mano */
.sceltaLingua{position:absolute;top:12px;right:12px;}
.sceltaLingua select{width:auto;margin:0;padding:6px 26px 6px 9px;font-size:14px;
  border-radius:8px;border:1px solid rgba(26,54,38,.15);background:rgba(255,255,255,.8);
  color:var(--verde-medio);cursor:pointer;}
.testata img{width:210px;max-width:60%;height:auto;display:block;margin:0 auto;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:34px;
  line-height:1.2;color:var(--verde);margin:20px 0 8px;}
.occhiello{font-size:11px;letter-spacing:3px;color:var(--oro);text-transform:uppercase;}
.sotto{color:var(--verde-medio);max-width:560px;margin:0 auto;}
main{max-width:640px;margin:0 auto;padding:26px 18px 60px;}
.riquadro{background:#fff;border:1px solid #E5E0D8;border-radius:14px;padding:22px;margin-bottom:18px;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:23px;
  color:var(--verde);margin:0 0 4px;}
.guida{color:var(--grigio);font-size:13.5px;margin-bottom:16px;}
/* niente maiuscoletto: le etichette si leggono come frasi, non come
   voci di un modulo da sportello */
label{display:block;font-size:13.5px;
  color:var(--verde-medio);font-weight:500;margin-top:15px;}
input,select,textarea{width:100%;margin-top:6px;padding:12px 13px;font:15px inherit;
  border:1px solid #DCD6CB;border-radius:9px;background:#FCFBF8;color:#2A2E2B;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acqua);border-color:transparent;}
textarea{min-height:80px;resize:vertical;}
.due{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.due{grid-template-columns:1fr;}}
.spunta{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:14.5px;
  color:var(--verde-medio);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;}
.spunta input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;}
.avviso{background:#FFF6E8;border-left:4px solid var(--oro);padding:13px 15px;border-radius:6px;
  font-size:13.5px;color:#6B4A22;margin-bottom:18px;line-height:1.6;}
.noto{background:var(--acqua-chiara);border-left:4px solid var(--acqua);padding:13px 15px;
  border-radius:6px;font-size:13.5px;color:var(--verde-medio);margin-bottom:16px;}
.invia{width:100%;margin-top:22px;padding:16px;border:0;border-radius:999px;
  background:var(--verde);color:var(--crema);font:600 16px inherit;cursor:pointer;}
.invia:disabled{background:#B9BDB6;cursor:default;}
/* L'ASTERISCO E IL CAMPO VUOTO. Le due cose nascono dalla stessa lista
   (comune/obbligatori.js): l'asterisco lo mette segnaEtichette(), il
   bordo rosso lo mette segnalaMancanti(). Il colore non basta da solo —
   c'e' anche l'asterisco sull'etichetta e il nome del campo scritto nel
   messaggio, perche' chi non distingue il rosso deve poter capire lo
   stesso quale campo riprendere. */
.obb{color:var(--allarme);font-weight:700;}
.legenda{color:var(--grigio);font-size:12.5px;margin-top:16px;text-align:right;}
input.vuoto,select.vuoto,textarea.vuoto{border-color:var(--allarme);background:#FDF0EE;}
input.vuoto:focus,select.vuoto:focus,textarea.vuoto:focus{outline:2px solid var(--allarme);outline-offset:1px;}
.errore{margin-top:14px;background:#FDF0EE;border-left:4px solid var(--allarme);padding:13px 15px;
  border-radius:6px;color:#7A2E24;font-size:14px;line-height:1.6;}
.fatta{text-align:center;padding:40px 22px;}
.fatta .rif{font-family:"Courier New",monospace;font-size:20px;color:var(--verde);
  letter-spacing:1px;margin-top:10px;}
.pie{text-align:center;color:var(--grigio);font-size:12.5px;padding:0 18px 40px;}
.pie a{color:var(--verde-medio);}

/* -------- percorso guidato dei trattamenti --------
   Stessa idea dell'anteprima approvata (docs/anteprime/2026-08-15-menu-
   trattamenti.html): prima si sceglie una categoria, poi solo le voci di
   quella. Nomi di classe distinti (suffisso Tratt) per non toccare nessuna
   regola gia' in uso da greenfee/maestro. */
.domandaTratt{font:600 16px/1.3 inherit;color:var(--verde);margin:16px 0 10px;}
.stradeTratt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;}
.stradaTratt{border:1px solid #DCD6CB;border-radius:9px;padding:12px 13px;cursor:pointer;
  background:#FCFBF8;text-align:left;font-family:inherit;color:#2A2E2B;}
.stradaTratt:hover{border-color:var(--oro);background:var(--acqua-chiara);}
.stradaTratt[aria-pressed="true"]{border-color:var(--verde);background:var(--acqua-chiara);}
.stradaTratt .stTratt{font-weight:600;color:var(--verde);display:block;font-size:14.5px;}
.stradaTratt .sqTratt{font-size:12px;color:var(--grigio);margin-top:3px;display:block;}
/* il cuore e' lo stesso segno del listino stampato, non un'icona inventata */
.stradaTratt.consiglioTratt{border-color:var(--oro);}
.stradaTratt.consiglioTratt .stTratt::after{content:" ♥";color:var(--oro);font-size:12px;}

.risultatoTratt{margin-top:16px;}
.vuotoTratt{color:var(--grigio);font-size:14px;font-style:italic;margin:6px 0;}
.titoloGruppoTratt{font:600 15px inherit;color:var(--verde);margin:0 0 8px;}

.rigaTratt{display:block;}
.vociTratt{display:flex;align-items:center;gap:9px;padding:9px 4px;border-radius:6px;cursor:pointer;}
.vociTratt:hover{background:var(--acqua-chiara);}
.vociTratt>input{width:18px;height:18px;margin:0;flex:0 0 auto;accent-color:var(--verde);}
.vociTratt .nomeTratt{flex:1 1 auto;font-size:14.5px;color:#2A2E2B;}
.vociTratt .durataTratt{color:var(--grigio);font-size:12.5px;white-space:nowrap;}
.vociTratt .prezzoTratt{font-weight:600;color:var(--verde);white-space:nowrap;
  font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
.filettoTratt{flex:1 1 auto;border-bottom:1px dotted #DCD6CB;min-width:10px;}

/* bersaglio di 30px anche se il segno che si vede e' piccolo: su un
   telefono un'icona piu' piccola e' un pulsante che non si riesce a
   premere — segnalato nella specifica di design */
.infoTratt{flex:0 0 auto;width:30px;height:30px;border:0;background:transparent;
  color:var(--oro);cursor:pointer;font:italic 700 14px/1 Georgia,serif;
  border-radius:50%;padding:0;}
.infoTratt:hover{background:var(--acqua-chiara);color:var(--verde);}
.infoTratt[aria-expanded="true"]{background:var(--verde);color:var(--crema);}
.spiegaTratt{display:block;margin:-2px 4px 10px 43px;padding:9px 12px;
  background:var(--acqua-chiara);border-radius:6px;font-size:13.5px;
  color:var(--verde-medio);max-width:56ch;}

.pienoTratt{margin-top:16px;padding-top:14px;border-top:1px solid #E5E0D8;
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.pienoTratt .contoTratt{color:var(--grigio);font-size:13.5px;}
.pienoTratt .sommaTratt{font:600 17px inherit;color:var(--verde);font-variant-numeric:tabular-nums;}
.capMsgTratt{margin:10px 0 0;background:#FFF6E8;border-left:4px solid var(--oro);
  padding:10px 13px;border-radius:6px;font-size:13px;color:#6B4A22;line-height:1.5;}

/* -------- il riquadro del buono regalo --------
   Nessuna di queste regole tocca qualcosa che esiste gia': si applicano
   solo a elementi che nascono quando l'indirizzo porta un ?buono=. Senza
   quel parametro la pagina non ne disegna nessuno. */
/* L'INVITO A USARE UN BUONO. Stessa famiglia del riquadro del buono vero —
   il filo d'oro a sinistra — ma senza il suo peso: qui il buono non c'e'
   ancora, c'e' solo la domanda. Il pulsante e' vuoto e non pieno, perche'
   non e' l'azione della pagina: quella resta «Invia la richiesta». */
.invitoBuono{border-left:4px solid var(--oro);}
.invitoBuono .apri{width:100%;padding:13px 18px;border:1px solid var(--verde);
  border-radius:999px;background:#fff;color:var(--verde);font:600 15px inherit;
  cursor:pointer;white-space:nowrap;}
.invitoBuono .apri:hover{background:var(--verde);color:var(--crema);}
/* il campo del codice si legge lettera per lettera: chi lo confronta con un
   foglio stampato deve poter dire se e' una O o uno zero */
.invitoBuono #fBuonoCodice{font-family:"Courier New",monospace;letter-spacing:.5px;
  text-transform:uppercase;}
.buono{background:#fff;border:1px solid #E5E0D8;border-left:4px solid var(--oro);
  border-radius:10px;padding:15px 17px;margin-bottom:18px;}
.buono .titBuono{font:600 15px inherit;color:var(--verde);margin:0;}
/* l'etichetta non e' decorazione: «numero» e «codice» sono due cose diverse
   (vedi la specifica), e una stringa monospaziata senza etichetta non dice
   quale delle due si sta guardando */
.buono .numBuono{font-size:13px;color:var(--grigio);margin:2px 0 0;}
.buono .numBuono .codBuono{font-family:"Courier New",monospace;letter-spacing:1px;
  color:var(--verde-medio);}
.buono .comprendeBuono{margin:10px 0 0;font-size:13.5px;color:var(--verde-medio);}
.buono ul{margin:4px 0 0;padding-left:20px;}
.buono li{margin:2px 0;}
.buono .scadeBuono{color:var(--grigio);font-size:13px;margin:10px 0 0;}
/* il buono che non si puo' usare: stesso segno d'allarme dei messaggi di
   errore del modulo, perche' e' la stessa cosa — qualcosa da sistemare
   prima di arrivare, non un dettaglio decorativo */
.buonoNo{background:#FDF0EE;border-left:4px solid var(--allarme);padding:13px 15px;
  border-radius:6px;color:#7A2E24;font-size:14px;line-height:1.6;margin-bottom:18px;}
/* nessuno di questi casi blocca l'invio, ma l'ospite non puo' saperlo: chi
   legge «questo codice non risulta» e si ferma li' e' un ospite perso in
   silenzio, e la reception non lo viene mai a sapere */
.buonoNo .puoInviareBuono{display:block;margin-top:6px;font-weight:600;}
.diffBuono{margin:10px 0 0;background:var(--acqua-chiara);border-left:4px solid var(--acqua);
  padding:10px 13px;border-radius:6px;font-size:13.5px;color:var(--verde-medio);line-height:1.5;}

/* -------- la riga della disponibilita' del Day Spa --------
   Suffisso Dayspa come si e' fatto col percorso dei trattamenti: nessuna
   di queste regole tocca un elemento che esiste gia', e senza il modulo
   Day Spa nella pagina non c'e' niente che le raccolga.
   NON e' rossa nemmeno quando dice «esaurito»: nessuno dei cinque stati
   blocca l'invio — la richiesta parte comunque e la reception verifica —
   e il rosso di .errore su questa pagina vuol dire «non puo' andare
   avanti», che qui sarebbe falso. */
.dispDayspa{margin:10px 0 0;padding:10px 13px;border-radius:6px;font-size:13.5px;
  line-height:1.5;background:var(--acqua-chiara);border-left:4px solid var(--acqua);
  color:var(--verde-medio);}
.dispDayspa[data-stato="disponibile"]{border-left-color:var(--verde);}
.dispDayspa[data-stato="esaurito"],
.dispDayspa[data-stato="chiuso"]{background:#FFF6E8;border-left-color:var(--oro);color:#6B4A22;}
</style>
</head>
<body>
<div class="testata">
  <div class="sceltaLingua" id="tLingue"></div>
  <a href="https://www.hoteltermeleonardo.com/" target="_blank" rel="noopener noreferrer"
    title="Vai al sito dell'hotel">
    <img src="/buoni/img/logo.svg" alt="Hotel Terme Leonardo" /></a>
  <div class="occhiello" style="margin-top:22px;" id="tOcchiello"></div>
  <h1 id="tTitolo"></h1>
  <p class="sotto" id="tSotto"></p>
  
</div>
<main id="app"></main>
<div class="pie" id="tPie"></div>

<script type="module">
'use strict';
/* Una pagina sola per green fee, maestro e trattamenti: tre file quasi
   identici divergerebbero come e' gia' successo con l'anteprima del buono.
   Il tipo arriva dall'indirizzo. */

/* PERCORSO ASSOLUTO, non relativo: `/comune/date.js`. Un percorso relativo
   si risolve contro l'indirizzo che vede l'ospite, non contro la cartella
   del file, e sotto un indirizzo tradotto la pagina resta bianca — vedi il
   commento in prenota/index.html e in date.js per il dettaglio. */
import { oggiISO, attivaDate, primoGiornoUtileTrattamenti } from '/comune/date.js';
/* Tipo e lingua vanno letti anche dal PERCORSO, non solo dalla query: sotto
   un indirizzo tradotto come /it/trattamenti la query della riscrittura non
   arriva alla pagina, e leggendo solo location.search questa pagina apriva
   il modulo dei green fee a chi aveva chiesto i trattamenti. */
import { indirizzoPerLingua, linguaScelta, tipoScelto } from '/comune/percorso.js';
/* IDEM PERCORSO ASSOLUTO: i parametri che i pulsanti delle email della
   reception scrivono nell'indirizzo (rif, nome, email, tel, arrivo,
   partenza, adulti, lang) — vedi il commento in cima a ospite-url.js per
   il perche' e il contratto (ripulisce, non fa escaping: tocca comunque
   a `esc()` qui sotto). */
import { normalizzaLingua, parametriOspite } from '/comune/ospite-url.js';
/* IDEM PERCORSO ASSOLUTO: i 36 trattamenti, i loro gruppi e le spiegazioni
   della ⓘ vivono in un modulo solo (vedi il commento in cima a
   trattamenti.js) — non si riscrivono qui dentro, altrimenti sarebbe il
   quarto elenco che diverge dagli altri tre. */
import { nomeCompleto, ORDINE_GRUPPI, prezzoTesto, SPIEGAZIONI, TRATTAMENTI } from '/comune/trattamenti.js';
/* IDEM PERCORSO ASSOLUTO: il codice del buono letto dall'indirizzo e il
   conto della differenza fra quanto copre il buono e quanto costa la
   scelta. Il conto e' una SECONDA COPIA di quello del server (vive in
   Deno, da qui non si importa): buono-url.test.ts confronta le due su
   ogni caso, cosi' una divergenza diventa rossa invece di far leggere
   all'ospite una cifra sulla pagina e sentirne un'altra alla cassa. */
import { codiceDaUrl, normalizzaCodice, coperturaBuono, differenzaBuono, contieneDaySpa, buonoUsabileSu } from '/comune/buono-url.js';
import { mancanti, segnaEtichette, segnaVuoti, nomiMancanti } from '/comune/obbligatori.js';

const FUNZIONE = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/richieste';
/* i buoni stanno su un'altra funzione: ?a=verifica e' una LETTURA pubblica
   che dice validita' e contenuto e nessun dato personale (vedi l'azione in
   supabase/functions/buoni/index.ts). Non riscuote niente: il buono lo
   scala la reception al banco, col QR. */
const FUNZIONE_BUONI = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/buoni';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const qs = new URLSearchParams(location.search);
const TOKEN = qs.get('t') || '';
const TIPI = ['greenfee','maestro','trattamenti','dayspa'];
const TIPO = tipoScelto(location.search, location.pathname, TIPI, 'greenfee');
/* normalizzaLingua copia `lang=` su `l` SOLO quando `l` manca: la `qs` qui
   sopra resta la query VERA, non tocca. Serve piu' sotto, in precompila():
   il token che risponde con una lingua nota deve vincere su `lang=` (dati
   di Fidra, un ripiego) esattamente come gia' vince sul browser — per
   questo il controllo la' e' `!qs.get('l')` e non `!LNG_QUERY`. */
let LNG = linguaScelta(normalizzaLingua(location.search), location.pathname, navigator.language);

/* Il ripiego per chi non ha un token: dati dell'ospite letti dall'indirizzo
   stesso, come li scrivono i pulsanti delle email della reception
   («Richiedi trattamenti e massaggi» eccetera). ORDINE DI FIDUCIA: OSPITE
   (dal token, sotto in precompila()) resta la fonte vera quando risponde e
   scavalca questi valori campo per campo (`OSPITE?.nome || DA_URL.nome`),
   mai il contrario — i parametri qui riempiono solo quello che il token
   non ha dato. Il telefono, per esempio, non lo da' mai: l'endpoint di
   precompilazione non lo restituisce (vedi supabase/functions/richieste/
   index.ts, azione precompila). */
const DA_URL = parametriOspite(location.search);

/* ---------- il buono regalo, quando l'indirizzo ne porta uno ----------
   CODICE_BUONO e' l'interruttore di tutto il pezzo dei buoni. Quando e'
   vuoto — cioe' per chiunque apra il modulo come ha sempre fatto — non
   parte nessuna chiamata in piu', non si disegna nessun riquadro e la
   pagina e' identica a quella di ieri: il buono e' un caso particolare
   che si innesta, non una riscrittura del modulo.
   codiceDaUrl ripulisce gia' il valore (maiuscole, solo lettere, cifre e
   trattini, al massimo 40 caratteri): quello che non e' un codice non
   arriva nemmeno alla chiamata. */
const CODICE_BUONO = codiceDaUrl(location.search);
/* la risposta di ?a=verifica quando il buono e' VALIDO, altrimenti null */
let BUONO = null;
/* quale delle vie d'uscita mostrare: '' quando non ce n'e' nessuna da
   mostrare — sia perche' il buono e' valido, sia perche' la verifica non
   ha risposto affatto (li' si tace e si mostra il modulo normale) */
let BUONO_KO = '';
/* la data che serve al messaggio: la scadenza, o il giorno della
   riscossione se il buono risulta gia' usato */
let BUONO_DATA = '';
/* quanti euro di quel buono questo modulo puo' dire di coprire — null
   quando non lo si puo' dire, e allora della differenza non si parla
   affatto (vedi coperturaBuono in buono-url.js) */
let COPERTURA = null;
/* cosa contiene il buono, da ripetere nelle note quando il modulo non lo sa
   rappresentare: '' quando non c'e' niente da aggiungere */
let CONTENUTO_DA_DIRE = '';

const CIRCOLI = [
  ['montecchia', 'Golf della Montecchia — Selvazzano Dentro · 27 buche, par 72'],
  ['padova', 'Golf Club Padova — Valsanzibio di Galzignano · 27 buche'],
  ['frassanelle', 'Golf Club Frassanelle — Rovolon · 18 buche'],
];

const T = {
  it:{ lingua:'Italiano',
    greenfee:{ occhiello:'GOLF NEI DINTORNI', titolo:'Una partenza sui Colli Euganei',
      sotto:'Siamo convenzionati con tre circoli a pochi minuti dall’hotel. Ci dica quando vuole giocare: prenotiamo noi la partenza, e se vuole anche il taxi per arrivarci.' },
    maestro:{ occhiello:'LEZIONE DI GOLF', titolo:'Una lezione col nostro maestro',
      sotto:'Sul campo pratica dell’hotel, da soli o in piccolo gruppo. Anche se non ha mai tenuto un ferro in mano.' },
    trattamenti:{ occhiello:'MASSAGGI E TRATTAMENTI', titolo:'Prenoti prima di arrivare',
      sotto:'I trattamenti più richiesti si esauriscono presto: chiedendoli ora troverà l’ora che preferisce già libera.' },
    /* «Day Spa» resta in inglese anche qui, come sul buono e sul listino:
       e' il nome con cui l'hotel vende l'ingresso, non una parola da
       tradurre. Il contenuto (piscine, grotte, zona relax) e' quello
       elencato in pagine/buoni/buono.js, COMPRENDE.dayspa. */
    dayspa:{ occhiello:'INGRESSO DAY SPA', titolo:'Una giornata alle piscine termali',

const BANDIERE = { it:'🇮🇹', de:'🇩🇪', en:'🇬🇧', fr:'🇫🇷' };

let OSPITE = null;
let INVIANDO = false;

/* ---------- il periodo del soggiorno, quando lo sappiamo ----------
   Chi arriva da un pulsante nell'offerta della reception porta le date del
   suo soggiorno nell'indirizzo. Un trattamento, una lezione o una partenza
   di golf FUORI da quel periodo non ha senso: l'ospite non c'e'.

   Non si precompila un giorno — sceglierlo al posto suo sarebbe indovinare
   — ma si stringono i limiti del calendario a quei giorni. Cosi' il mese
   sbagliato non si puo' proprio scegliere, che e' l'errore piu' comune su
   un campo data, e la reception non riceve richieste per date impossibili.

   `min` e' la piu' TARDA fra oggi e l'arrivo: un soggiorno gia' cominciato
   non deve riaprire i giorni passati. Se le date non ci sono, i limiti
   restano quelli di prima e non cambia niente per nessuno. */
const DAL = DA_URL.arrivo && DA_URL.arrivo > oggiISO() ? DA_URL.arrivo : oggiISO();
const AL = DA_URL.partenza || '';
const limitiSoggiorno = () => `min="${esc(DAL)}"` + (AL ? ` max="${esc(AL)}"` : '');

/* Un parametro dentro un indirizzo che puo' gia' avere una query o no, senza
   doppioni: serve al cambio di lingua qui sotto. Valore vuoto, niente da
   aggiungere. */
function conParametro(dove, chiave, valore) {
  if (!valore) return dove;
  const [base, query] = String(dove).split('?');
  const q = new URLSearchParams(query || '');
  q.set(chiave, valore);
  return `${base}?${q.toString()}`;
}

function testata() {
  const t = T[LNG], s = t[TIPO];
  document.documentElement.lang = LNG;
  document.title = `${s.titolo} — Hotel Terme Leonardo`;
  $('tOcchiello').textContent = s.occhiello;
  $('tTitolo').textContent = s.titolo;
  $('tSotto').textContent = s.sotto;
  $('tLingue').innerHTML = '<select id="selLingua" aria-label="Lingua">' +
    ['it','de','en','fr'].map(l =>
      '<option value="' + l + '"' + (l === LNG ? ' selected' : '') + '>' +
        BANDIERE[l] + ' ' + l.toUpperCase() + '</option>').join('') + '</select>';
  $('selLingua').onchange = (e) => {
    /* su un indirizzo tradotto si resta tradotti: cambiando lingua l'ospite
       non deve vedere la barra tornare a un indirizzo tecnico */
    let dove = indirizzoPerLingua(location.pathname, location.search, TIPO, e.target.value);
    /* Sotto un indirizzo tradotto indirizzoPerLingua torna /de/behandlungen
       e basta: la query non sopravvive al cambio di lingua, e quello che
       serve va riattaccato a mano — come si e' sempre fatto col token.
       Da oggi anche il BUONO: un ospite tedesco che atterra sulla pagina
       italiana e sceglie il tedesco perdeva il codice e si ritrovava il
       modulo semplice, senza che niente glielo dicesse. Col riferimento
       dell'offerta succedeva lo stesso, ed e' un giro solo di chiave.
       `set` e non un `+=`: sugli indirizzi NON tradotti la query c'e' gia'
       tutta, e appenderla di nuovo lascerebbe due `t=` uguali nella barra
       (succedeva gia' prima di questa modifica). */
    dove = conParametro(dove, 't', TOKEN);
    dove = conParametro(dove, 'buono', CODICE_BUONO);
    dove = conParametro(dove, 'rif', DA_URL.rif);
    location.href = dove;
  };
  $('tPie').innerHTML = `Hotel Terme Leonardo &middot; Via Monteortone, 46, 35037 Monteortone di Abano Terme (PD) &middot;
    <a href="tel:+390499939200">+39 049 9939200</a> &middot;
    <a href="mailto:info@termeleonardo.com">info@termeleonardo.com</a> &middot;
    <a href="https://www.hoteltermeleonardo.com/" target="_blank" rel="noopener noreferrer">hoteltermeleonardo.com</a>`;
}

      <p class="capMsgTratt" id="capMsgTratt" hidden></p>${COPERTURA !== null ? `

    ${BUONO && contieneDaySpa(BUONO) ? '<p class="dispDayspa" id="dispDayspa" aria-live="polite" hidden></p>' : ''}`;

/* ---------------- trattamenti: percorso guidato ----------------
   Le voci scelte si tengono per INDICE nell'array TRATTAMENTI (stabile: non
   si riordina mai a runtime), in un Set che sopravvive al passaggio da un
   gruppo all'altro. Senza questo, ogni volta che si cambia "strada" il
   pannello viene ridisegnato da capo e le caselle spuntate nel gruppo
   precedente sparirebbero insieme al DOM che le conteneva: si potrebbe
   scegliere un trattamento per gruppo soltanto, non uno o due per gruppo
   fino a un totale di otto. */
let SCELTI_TRATT = new Set();
const TRATT_MAX = 8;

function percorsiTratt(t) {
  const gruppo = (id, nome, tag, voci) => ({ id, nome, tag, voci });
  return [
    gruppo('cuore', t.tratt.cuoreNome, t.tratt.cuoreTag, TRATTAMENTI.filter((v) => v.cuore)),
    ...ORDINE_GRUPPI.map((id) => gruppo(
      id, t.tratt[id + 'Nome'], t.tratt[id + 'Tag'],
      TRATTAMENTI.filter((v) => v.gruppo === id),
    )),
  ];
}

function disegnaStradeTratt(t, percorsi, attivo) {
  $('stradeTratt').innerHTML = percorsi.map((p, i) => `
    <button type="button" class="stradaTratt${i === 0 ? ' consiglioTratt' : ''}"
      aria-pressed="${i === attivo}" data-i="${i}">
      <span class="stTratt">${esc(p.nome)}</span><span class="sqTratt">${esc(p.tag)}</span>
    </button>`).join('');
}

function disegnaRisultatoTratt(t, percorsi, attivo) {
  if (attivo < 0) {
    $('risultatoTratt').innerHTML = `<p class="vuotoTratt">${esc(t.tratt.vuoto)}</p>`;
    return;
  }
  const p = percorsi[attivo];
  $('risultatoTratt').innerHTML = `<p class="titoloGruppoTratt">${esc(p.nome)}</p>` +
    p.voci.map((v) => {
      const i = TRATTAMENTI.indexOf(v);
      return `
      <span class="rigaTratt">
        <label class="vociTratt">
          <input type="checkbox" class="voce" value="${esc(nomeCompleto(v))}"
            data-i="${i}"${SCELTI_TRATT.has(i) ? ' checked' : ''} />
          <span class="nomeTratt">${esc(v.nome)}</span>
          ${v.durata ? `<span class="durataTratt">${esc(v.durata)}</span>` : ''}
          ${v.chiave ? `<button type="button" class="infoTratt" aria-expanded="false"
              aria-label="${esc(t.tratt.info(v.nome))}" data-k="${esc(v.chiave)}"
              data-id="spiegaTratt${i}">i</button>` : ''}
          <span class="filettoTratt"></span>
          <span class="prezzoTratt">${esc(prezzoTesto(v))}</span>
        </label>
        <span class="spiegaTratt" id="spiegaTratt${i}" hidden></span>
      </span>`;
    }).join('');
}

function contaTratt(t) {
  const n = SCELTI_TRATT.size;
  $('contoTratt').textContent = n === 0 ? t.tratt.nessuna : n === 1 ? t.tratt.una : t.tratt.molte(n);
  let somma = 0;
  for (const i of SCELTI_TRATT) somma += TRATTAMENTI[i].prezzo;
  $('sommaTratt').textContent = somma ? somma + ' €' : '';
  /* stesso punto, stesso momento: se c'e' un buono, qui cambia anche la
     differenza. Senza buono aggiornaDifferenza() esce subito. */
  aggiornaDifferenza(t);
}

/* Chiamata una sola volta per disegno di modulo() (come attivaDate()):
   modulo() ricrea #app da zero a ogni chiamata, quindi non c'e' rischio di
   attaccare due volte lo stesso ascoltatore. */
function attivaTrattamenti(t) {
  const percorsi = percorsiTratt(t);
  /* Il gruppo da aprire: quello che contiene la prima voce gia' spuntata
     dal buono. Senza buono non c'e' niente di spuntato e il risultato e'
     -1, cioe' esattamente il "Scelga una categoria qui sopra" di sempre.
     Con un buono, invece, lasciare il pannello chiuso farebbe leggere
     «1 trattamento scelto» senza far vedere QUALE. */
  let attivo = percorsi.findIndex((p) => p.voci.some((v) => SCELTI_TRATT.has(TRATTAMENTI.indexOf(v))));
  disegnaStradeTratt(t, percorsi, attivo);
  disegnaRisultatoTratt(t, percorsi, attivo);
  contaTratt(t);

  $('percorsoTratt').addEventListener('click', (e) => {
    const info = e.target.closest('.infoTratt');
    if (info) {
      e.preventDefault();
      const box = document.getElementById(info.dataset.id);
      const aperto = info.getAttribute('aria-expanded') === 'true';
      /* una spiegazione aperta per volta: due o tre righe ciascuna, tenerne
         aperte piu' di una allunga il pannello piu' di quanto serva */
      document.querySelectorAll('#risultatoTratt .infoTratt[aria-expanded="true"]').forEach((altro) => {
        if (altro === info) return;
        altro.setAttribute('aria-expanded', 'false');
        const altraBox = document.getElementById(altro.dataset.id);
        if (altraBox) altraBox.hidden = true;
      });
      info.setAttribute('aria-expanded', String(!aperto));
      box.hidden = aperto;
      /* la chiave arriva da TRATTAMENTI, dati nostri e non dall'esterno:
         indicizzare SPIEGAZIONI[LNG][chiave] qui e' sicuro. LNG invece e'
         gia' passato da linguaScelta(), che lo valida contro l'elenco
         chiuso delle quattro lingue prima che arrivi fin qui. */
      if (!aperto) box.textContent = SPIEGAZIONI[LNG][info.dataset.k] || '';
      return;
    }
    const strada = e.target.closest('.stradaTratt');
    if (!strada) return;
    attivo = Number(strada.dataset.i);
    disegnaStradeTratt(t, percorsi, attivo);
    disegnaRisultatoTratt(t, percorsi, attivo);
  });

  $('percorsoTratt').addEventListener('change', (e) => {
    if (!e.target.matches('.voce')) return;
    const i = Number(e.target.dataset.i);
    if (e.target.checked) {
      /* il tetto si ferma QUI, prima dell'invio: tipi.ts rifiuta piu' di
         otto voci lato server, ma un rifiuto dopo aver compilato tutto il
         resto del modulo e' il tipo di sorpresa che questo progetto ha
         gia' imparato a evitare (vedi date.js, partenzaCoerente) */
      if (SCELTI_TRATT.size >= TRATT_MAX) {
        e.target.checked = false;
        $('capMsgTratt').textContent = t.tratt.massimo;
        $('capMsgTratt').hidden = false;
        return;
      }
      SCELTI_TRATT.add(i);
    } else {
      SCELTI_TRATT.delete(i);
    }
    $('capMsgTratt').hidden = true;
    contaTratt(t);
  });
}

/* ---------------- il buono regalo ----------------
   Tutto questo pezzo vive dietro CODICE_BUONO: senza ?buono= nell'indirizzo
   verificaBuono() esce subito (nessuna chiamata), riquadroBuono() torna
   stringa vuota e notePrecompilate() scrive esattamente quello che scriveva
   prima. Non c'e' nessun percorso in cui il modulo di sempre cambi.

   OGNI valore che finisce nel markup passa da esc(): il contenuto del buono
   arriva da una risposta di rete e si tratta come ostile, anche se la
   risposta viene dal nostro server. */

/* La data come la legge un ospite, nella sua lingua. Torna '' se non c'e'
   una data vera: i messaggi qui sotto sanno cavarsela senza (un buono
   scaduto resta scaduto anche se la colonna e' vuota). `riscosso_il` e' un
   istante, non un giorno: si tiene solo la parte della data. LNG e' gia'
   validato contro le quattro lingue da linguaScelta(). */
function dataBuono(v) {
  const s = String(v ?? '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
  const d = new Date(s + 'T12:00:00');
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString(LNG, { day: 'numeric', month: 'long', year: 'numeric' });
}

/* Sei secondi, e non e' un numero a caso.
   Questa chiamata sta PRIMA del disegno del modulo: finche' non finisce,
   chi arriva col buono guarda una pagina bianca. Un errore restituito
   (500, 404, connessione rifiutata) il `catch` lo prende subito, ma la
   forma piu' comune di «non risponde» e' l'altra — la connessione che si
   apre e poi tace: rete mobile in galleria, portale captivo di un hotel,
   funzione che si impianta. Quella non rigetta MAI, e senza un limite la
   pagina resterebbe bianca per sempre.
   Il numero viene da una misura, non da una sensazione: il 17 agosto 2026
   `?a=verifica` ha risposto in 1422 ms a freddo (prima chiamata, funzione
   da svegliare) e fra 202 e 320 ms a caldo. Sei secondi sono quattro volte
   la partenza a freddo — larghi abbastanza da non buttare via una risposta
   lenta ma buona — e restano sotto la soglia oltre la quale una pagina
   bianca viene letta come rotta e si chiude. Scaduti quelli, il riquadro
   si perde ma il modulo si vede: meglio una richiesta senza riquadro che
   nessuna richiesta. */
const ATTESA_VERIFICA = 6000;

/* Il segnale che ferma l'attesa — con un ripiego, perche' senza il riquadro
   sparirebbe SEMPRE su dei telefoni veri.
   `AbortSignal.timeout` e' arrivato su Safari e Safari iOS solo con la 16:
   su un iPhone rimasto alla 15 — che e' esattamente il telefono di chi si
   vede regalare un buono dai figli — chiamarlo solleva un TypeError, e un
   TypeError dentro la chiamata vorrebbe dire nessun riquadro MAI, non
   «nessun riquadro quando la rete tace». Un degrado silenzioso e totale al
   posto di uno morbido e raro.
   Dove non c'e', si fa a mano: un AbortController e un setTimeout sono la
   stessa cosa scritta piu' lunga, e ci sono da molto prima. `ferma()` spegne
   il timer quando la risposta arriva in tempo, cosi' non resta acceso un
   conto alla rovescia che non serve piu' a nessuno. */
function segnaleConScadenza(ms) {
  if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
    return { signal: AbortSignal.timeout(ms), ferma: () => {} };
  }
  if (typeof AbortController !== 'function') return { signal: undefined, ferma: () => {} };
  const c = new AbortController();
  const id = setTimeout(() => c.abort(), ms);
  return { signal: c.signal, ferma: () => clearTimeout(id) };
}

async function verificaBuono() {
  if (!CODICE_BUONO) return;
  /* IL CANCELLO. Su green fee, maestro, transfer e soggiorno un buono non
     paga niente — il listino e' tutto spa — e verificarlo comunque faceva
     danno: con BUONO valorizzato, avvisoInCima() toglie la promessa del
     prezzo, che e' la frase per chi il prezzo l'ha gia' pagato. Su un green
     fee si legge come «e' gia' a posto», e non lo e'.
     Uscendo qui, BUONO resta null e l'avviso resta quello giusto. */
  if (!buonoUsabileSu(TIPO)) return;
  const { signal, ferma } = segnaleConScadenza(ATTESA_VERIFICA);
  try {
    const r = await fetch(`${FUNZIONE_BUONI}?a=verifica&codice=${encodeURIComponent(CODICE_BUONO)}`,
      { signal });
    const d = await r.json();
    /* un 404 qui NON e' un guasto: e' la risposta vera per "non trovato",
       e si legge come tutte le altre. Quello che non si sa leggere (nessun
       campo `valido`) si tratta invece come "non ha risposto". */
    if (!d || typeof d.valido !== 'boolean') {
      console.error('verifica del buono illeggibile', r.status, d);
      return;
    }
    if (d.valido) { BUONO = d; return; }
    BUONO_DATA = d.stato === 'riscosso' ? d.riscosso_il : d.scade_il;
    BUONO_KO = d.motivo === 'non trovato' ? 'nonTrovato'
      : d.stato === 'scaduto' ? 'scaduto'
      : d.stato === 'riscosso' ? 'riscosso'
      : d.stato === 'attesa' ? 'attesa'
      /* 'annullato', o uno stato che questa pagina non conosce ancora: si
         dice che non e' utilizzabile e si invita a scrivere, mai a
         indovinare il motivo */
      : 'altro';
  } catch (e) {
    /* la verifica non ha risposto affatto — errore, oppure i sei secondi
       scaduti: nessun riquadro, modulo normale, codice nelle note. Meglio
       una richiesta senza riquadro che nessuna richiesta. */
    console.error('verifica del buono non riuscita', e);
  } finally {
    ferma();
  }
}

function messaggioBuonoKo(t) {
  const b = t.buono, d = dataBuono(BUONO_DATA);
  if (BUONO_KO === 'nonTrovato') return b.nonTrovato;
  if (BUONO_KO === 'scaduto') return b.scaduto(d);
  if (BUONO_KO === 'riscosso') return b.riscosso(d);
  if (BUONO_KO === 'attesa') return b.attesa;
  return b.altro;
}

/* LA PRIMA FRASE CHE SI LEGGE, e cosa promette.

   Col buono valido, del denaro parla il riquadro qui sotto: copre tutto,
   copre in parte e la differenza si paga all'arrivo, oppure avanza. L'avviso
   in cima non deve dire una terza cosa — e soprattutto non deve promettere
   di confermare un PREZZO a chi l'ha gia' pagato, o a chi se l'e' visto
   regalare da qualcun altro. Nel migliore dei casi e' un dubbio piantato
   dove non serviva.

   BUONO e' null quando il buono non e' valido — scaduto, gia' riscosso, non
   trovato, o verifica che non ha risposto affatto: li' il prezzo torna
   davvero da confermare, e la frase resta quella di sempre. */
function avvisoInCima(t) {
  if (BUONO) return TIPO === 'dayspa' ? t.avvisoBuonoDayspa : t.avvisoBuono;
  return TIPO === 'dayspa' ? t.avvisoDayspa : t.avviso;
}

/* L'INVITO A USARE IL BUONO, per chi il codice ce l'ha ma non nell'indirizzo.

   Il foglio A4 stampa l'indirizzo senza codice — di proposito: si digita da
   un foglio di carta, e ogni carattere in piu' e' un carattere in piu' da
   sbagliare. Prima di questo invito, chi lo digitava arrivava su un modulo
   dove il buono non si poteva nominare.

   Chi scrive il codice qui NON prende una seconda strada: si torna allo
   stesso indirizzo con `?buono=` dentro, e da li' gira esattamente il codice
   che gira gia' — verifica, riquadro, preselezione, note precompilate,
   cambio lingua che si porta dietro il codice. Una ricarica in piu' costa
   meno di due percorsi da tenere allineati. */
function invitoBuono(t) {
  if (CODICE_BUONO) return '';
  /* chiedere un buono dove non serve a niente e' far digitare un codice per
     poi non poterne fare nulla */
  if (!buonoUsabileSu(TIPO)) return '';
  return `
    <div class="riquadro invitoBuono">
      <h2>${esc(t.buono.invitoTit)}</h2>
      <div class="guida">${esc(t.buono.invitoGuida)}</div>
      <div class="due">
        <div><label for="fBuonoCodice">${esc(t.buono.codice)}</label>
          <input type="text" id="fBuonoCodice" autocomplete="off" spellcheck="false"
            inputmode="latin" placeholder="LEO-XXXX-XXXX" /></div>
        <div style="display:flex;align-items:flex-end;">
          <button type="button" class="apri" id="bBuonoApri">${esc(t.buono.invitoApri)}</button></div>
      </div>
      <div id="esitoBuonoMano"></div>
    </div>`;
}

/* Il campo accetta anche il codice incollato con dentro l'indirizzo intero
   (succede: si copia il link dall'email invece del solo codice). */
function apriColBuono(t) {
  const scritto = $('fBuonoCodice').value;
  const codice = normalizzaCodice(scritto) || codiceDaUrl((String(scritto).split('?')[1] || ''));
  if (!codice) {
    $('esitoBuonoMano').innerHTML = `<div class="errore">${esc(t.buono.invitoVuoto)}</div>`;
    $('fBuonoCodice').focus();
    return;
  }
  location.href = conParametro(location.href, 'buono', codice);
}

function riquadroBuono(t) {
  /* stesso cancello di verificaBuono(): senza, un codice nell'indirizzo
     disegnerebbe un riquadro su un modulo che col buono non c'entra */
  if (!buonoUsabileSu(TIPO)) return '';
  /* nessuna di queste vie d'uscita blocca l'invio — ma l'ospite non ha modo
     di saperlo, e chi si ferma davanti al riquadro rosso non ce lo viene a
     dire: glielo si scrive */
  if (BUONO_KO) {
    return `<div class="buonoNo">${esc(messaggioBuonoKo(t))}
      <span class="puoInviareBuono">${esc(t.buono.puoInviare)}</span></div>`;
  }
  if (!BUONO) return '';
  /* il contenuto: una riga per voce, come lo compone il server
     (componiDescrizione in buoni/acquista.ts). Il riquadro le elenca
     TUTTE — un buono puo' contenere due cose, per esempio un ingresso Day
     Spa e un massaggio, e chi legge deve vederle entrambe. */
  const righe = String(BUONO.descrizione ?? '').split('\n').map((s) => s.trim()).filter(Boolean);
  const scad = dataBuono(BUONO.scade_il);
  /* Si mostra il CODICE, con la sua etichetta. La specifica parla di
     mostrare il «numero» (BR-2026-0001) perche' chi non lo riconosce si
     ferma prima di compilare, ma ?a=verifica non restituisce `numero` e la
     specifica stessa dice che quell'azione non va allargata: il codice
     soddisfa lo stesso bisogno — e' quello che l'ospite ha davanti sul
     foglio e nell'email. L'etichetta non e' un ornamento: «numero» e
     «codice» sono due cose diverse, e una stringa monospaziata da sola non
     direbbe quale delle due sta leggendo.
     Niente `BUONO.numero || …`: sarebbe codice che oggi non gira e che
     nessuno ha provato, e il giorno in cui qualcuno aggiungesse `numero`
     alla select() del server questo riquadro cambierebbe da solo sotto gli
     occhi dell'ospite, mostrandogli la cosa che NON ha in mano. Se un
     domani si vorra' il numero, lo si decide qui, apposta. */
  return `<div class="buono">
      <p class="titBuono">${esc(t.buono.titolo)}</p>
      <p class="numBuono">${esc(t.buono.codice)}: <span class="codBuono">${esc(CODICE_BUONO)}</span></p>
      ${righe.length ? `<p class="comprendeBuono">${esc(t.buono.comprende)}</p>
      <ul>${righe.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
      ${scad ? `<p class="scadeBuono">${esc(t.buono.scade(scad))}</p>` : ''}
    </div>`;
}

/* Le voci del buono sono id del LISTINO dei buoni regalo; ogni voce di
   trattamenti.js dichiara il proprio (`regalabile`). Si spuntano quelle, e
   restano MODIFICABILI: chi ha un buono da 65 € e vuole un trattamento da
   80 lo sceglie e paga la differenza — bloccarlo impedirebbe una vendita
   che si farebbe volentieri (specifica).

   La preselezione e la copertura escono dalla STESSA chiamata
   (coperturaBuono, in buono-url.js): sono due facce della stessa domanda —
   «cosa di questo buono sa rappresentare il modulo?» — e calcolarle in due
   punti diversi vorrebbe dire lasciarle divergere. Quando la risposta e'
   «non tutto» (un ingresso Day Spa, una quantita' di due), COPERTURA resta
   null e la riga della differenza non viene nemmeno disegnata: vedi il
   commento sopra coperturaBuono per il perche' un numero sbagliato li'
   sarebbe peggio di nessun numero. */
function preselezionaDalBuono() {
  if (!BUONO) return;
  /* I due moduli che un buono puo' aprire, e nessun altro: la regola della
     specifica §4-bis e' «se c'e' almeno un trattamento → trattamenti,
     altrimenti → Day Spa». Sul Day Spa non c'e' niente da spuntare e
     nessuna differenza da mostrare, ma la NOTA per la reception serve
     uguale — vedi `mancante` qui sotto. */
  if (TIPO !== 'trattamenti' && TIPO !== 'dayspa') return;
  /* Valori predefiniti nella destrutturazione, e non per pignoleria: l'HTML
     e il modulo /comune/buono-url.js sono due file che il browser tiene in
     cache PER CONTO LORO. Nella finestra di una pubblicazione puo' capitare
     una pagina nuova con un modulo vecchio: se quello non conoscesse ancora
     un campo, un `c.campo.length` diretto solleverebbe e lascerebbe la
     pagina BIANCA — questa pagina e' un modulo ES, e li' un errore non si
     ferma alla riga sbagliata, porta via tutto il resto. Con i predefiniti
     si perde al massimo un avviso in console.
     (Non e' teoria: mi e' successo in prova, con una copia rimasta
     indietro, e la pagina era bianca esattamente cosi'.) */
  const { copre = null, indici: dalBuono = [], ignorate = [], ripetute = [], sconosciute = [] } =
    coperturaBuono(BUONO, TRATTAMENTI) || {};
  if (sconosciute.length) {
    /* non si perde in silenzio: se un domani il LISTINO dei buoni prendesse
       una voce nuova e nessuno la collegasse a trattamenti.js, quel buono
       arriverebbe qui e non preselezionerebbe niente. Il test
       «ogni voce del LISTINO … si puo preselezionare» lo impedisce a monte;
       questo avviso serve per quello che il test non vede — un buono
       vecchio, un id tolto dal listino dopo la vendita.
       `sconosciute` e NON `ignorate`: fra le ignorate ci sono gli ingressi
       Day Spa, che una casella qui non ce l'hanno per costruzione. Con
       `ignorate` un normale buono Day Spa a una voce, aperto sul suo
       modulo, faceva suonare l'avviso A OGNI caricamento — e un avviso che
       suona sempre non e' piu' distinguibile da quello vero. */
    console.warn('voci del buono senza trattamento corrispondente su questo modulo:',
      sconosciute.join(', '));
  }
  /* ---- quello che QUESTO modulo non sa rappresentare ----
     La domanda e' la stessa nei due moduli — «di questo buono, cosa non si
     vede da qui?» — ma guarda cose opposte, perche' i due moduli
     rappresentano cose opposte.

     · Sui TRATTAMENTI si spuntano i massaggi: manca quello che NON e' un
       trattamento (`ignorate`), e il caso vero e' la specifica §4-bis —
       un ingresso Day Spa piu' un massaggio. Sono una visita sola, quindi
       una richiesta sola: si compila il modulo dei trattamenti, ma senza
       questa nota la richiesta arriva in reception nominando solo il
       massaggio e l'ingresso sparisce.

     · Sul DAY SPA si chiede un ingresso: manca l'opposto, cioe' i
       trattamenti (`dalBuono`) — lo stesso buono aperto di la' arrivava
       in reception senza dire che comprende anche il massaggio. E manca
       tutto quello che sta oltre un ingresso solo: piu' di una voce, o
       una quantita' maggiore di uno.

     · `ripetute` vale per tutti e due: le caselle dei trattamenti non
       hanno una quantita', e il campo `persone` del Day Spa lo lascia
       decidere all'ospite, non al buono. Senza la nota — «2 × Massaggio
       Hot Stone (55 min)» — in reception preparerebbero un turno invece di
       due.

     Buco noto, della stessa dimensione di prima: sul modulo Day Spa una
     voce sola che non fosse ne' un trattamento ne' un ingresso — cioe' un
     tipo di voce che il LISTINO oggi non ha — non verrebbe detta. A
     segnalarla resta il console.warn qui sopra. */
  const quanteVoci = Array.isArray(BUONO.voci) ? BUONO.voci.length : 0;
  const mancante = ripetute.length > 0 || (TIPO === 'dayspa'
    ? (dalBuono.length > 0 || quanteVoci > 1)
    : ignorate.length > 0);
  if (mancante) {
    /* I ritorni a capo diventano ' · ' come fa gia' il server quando deve
       mettere la descrizione su una riga sola (vedi product_data[name] in
       buoni/index.ts). La nota elenca TUTTO il contenuto del buono e non
       solo il pezzo mancante: e' la stessa cosa che l'ospite vede nel
       riquadro in cima, e chi legge in reception ha davanti il buono
       intero senza doverlo ricostruire. */
    CONTENUTO_DA_DIRE = String(BUONO.descrizione ?? '').split('\n')
      .map((r) => r.trim()).filter(Boolean).join(' · ');
  }
  /* da qui in giu' e' roba del solo modulo dei trattamenti: spuntare le
     caselle e dire quanto il buono copre. Sul Day Spa non c'e' niente da
     spuntare, e COPERTURA resta null — la riga della differenza non esiste
     nemmeno nel markup di quel modulo. */
  if (TIPO !== 'trattamenti') return;
  let indici = dalBuono;
  if (indici.length > TRATT_MAX) {
    /* oggi irraggiungibile (il listino ammette al massimo due voci per
       buono), ma scartare in silenzio delle voci pagate non e' una porta da
       lasciare aperta: si prende quello che ci sta, si dice che si e'
       tagliato, e la copertura diventa indicibile perche' il modulo non
       rappresenta piu' tutto il buono. */
    console.warn('il buono contiene', indici.length, 'trattamenti: il modulo ne tiene',
      TRATT_MAX, '— la differenza non viene mostrata');
    indici = indici.slice(0, TRATT_MAX);
    COPERTURA = null;
  } else {
    COPERTURA = copre;
  }
  for (const i of indici) SCELTI_TRATT.add(i);
}

/* La differenza, aggiornata mentre l'ospite cambia scelta: la chiama
   contaTratt(), cioe' lo stesso punto che aggiorna il conto e la somma. */
function aggiornaDifferenza(t) {
  const box = $('diffBuono');
  if (!box || COPERTURA === null) return;
  let scelto = 0;
  for (const i of SCELTI_TRATT) scelto += TRATTAMENTI[i].prezzo;
  /* COPERTURA, non BUONO.valore: `valore` e' la somma di TUTTO il buono, e
     comprende anche quello che su questo modulo non si sceglie (un ingresso
     Day Spa) o non si sa rappresentare (una quantita' di due). Vedi
     coperturaBuono in buono-url.js. */
  const e = differenzaBuono(COPERTURA, scelto);
  /* 'ignoto' vuol dire "non lo sappiamo", e in quel caso `copre` e `scelto`
     valgono 0: stamparli farebbe leggere «0 €» dove la verita' e' che il
     conto non si puo' fare (nessun trattamento ancora scelto, o un buono
     senza valore). Si tace — rilievo gia' segnalato sul compito 1. */
  if (e.tipo === 'ignoto') { box.hidden = true; box.textContent = ''; return; }
  box.textContent = e.tipo === 'differenza' ? t.buono.differenza(e.copre, e.scelto, e.differenza)
    : e.tipo === 'residuo' ? t.buono.residuo(e.copre, e.scelto)
    : t.buono.copre(e.copre);
  box.hidden = false;
}

/* Le note gia' scritte: il riferimento dell'offerta (da sempre) e il codice
   del buono, ognuno con l'etichetta italiana piu' la traduzione — e' li'
   che li ritrova la reception, e la nota la legge una persona.
   Il codice ci finisce SEMPRE che l'indirizzo ne porti uno: anche se la
   verifica non ha risposto, anche se il buono non risulta valido. Meglio
   una richiesta senza riquadro che nessuna richiesta. */
function notePrecompilate(t) {
  const righe = [];
  if (DA_URL.rif) righe.push(t.rifOfferta(DA_URL.rif));
  /* Se il sito quel codice l'ha gia' cercato e non l'ha trovato, la nota lo
     dice. Senza, in reception arriva un codice identico a uno valido: lo
     cercherebbero a mano, non lo troverebbero, e telefonerebbero all'ospite
     — la telefonata che questo modulo esiste per evitare, solo spostata a
     valle e a carico dell'hotel. Negli altri casi (scaduto, riscosso, in
     attesa, o verifica che non ha risposto) il buono ESISTE e la reception
     lo trova: li' il codice basta cosi' com'e'. */
  if (CODICE_BUONO) {
    righe.push(BUONO_KO === 'nonTrovato'
      ? t.buono.notaNonTrovato(CODICE_BUONO)
      : t.buono.nota(CODICE_BUONO));
    if (CONTENUTO_DA_DIRE) righe.push(t.buono.notaContenuto(CONTENUTO_DA_DIRE));
  }
  return righe.join('\n');
}

/* ---------------- la disponibilita' del Day Spa ----------------
   Vive tutta dietro il modulo dayspa: senza quel tipo #dispDayspa non
   esiste, nessun ascoltatore viene attaccato e non parte nessuna chiamata.
   Per gli altri sei tipi questa parte non gira mai.

   IL PONTE DICE UNA PAROLA SOLA. `?a=dayspa` restituisce `{ stato: … }` e
   nient'altro: mai i posti residui (specifica del 17 agosto). Le decisioni
   — hotel chiuso, prenotazioni non ancora aperte oltre i sette giorni,
   libero o pieno — le prende il SERVER, in dayspa-disponibilita.ts. Qui
   non si ricopia niente di quel ragionamento: una seconda copia
   dell'orizzonte di sette giorni sarebbe il difetto che questo progetto ha
   gia' pagato quattro volte coi listini, e il giorno che l'orizzonte
   cambiasse la pagina direbbe una cosa e il server un'altra.

   NIENTE QUI BLOCCA L'INVIO. Nemmeno «esaurito»: la richiesta si manda
   comunque e la reception verifica. Per questo il controllo prima
   dell'invio non guarda nemmeno lo stato — la riga informa e basta. */
const STATI_DAYSPA = ['disponibile', 'esaurito', 'non-aperte', 'chiuso', 'ignoto'];

/* Sei secondi, lo stesso numero e per la stessa ragione di
   ATTESA_VERIFICA: la forma piu' comune di «non risponde» e' la
   connessione che si apre e poi tace, e quella non rigetta mai.
   La differenza e' che qui la pagina e' GIA' disegnata e l'ospite puo'
   compilare tutto il resto mentre aspetta: scaduti i sei secondi si dice
   «al momento non riesco a verificare», che e' la verita', e si va avanti.
   `segnaleConScadenza` e' lo stesso ripiego dei buoni (AbortController a
   mano dove AbortSignal.timeout non c'e', cioe' su iOS prima della 16). */
const ATTESA_DAYSPA = 6000;

/* Quale domanda e' l'ultima partita. Chi cambia data due volte di fila
   fa partire due chiamate, e non e' detto che tornino nell'ordine in cui
   sono uscite: senza questo contatore la risposta VECCHIA arriverebbe per
   ultima e scriverebbe la sua riga sopra quella giusta — l'ospite
   leggerebbe la disponibilita' di una data che non ha piu' scelto. */
let CHIAMATA_DAYSPA = 0;

/* Quattrocento millisecondi di attesa PRIMA di chiedere, e non e' un
   numero a caso.

   IL PROBLEMA. Su un `input[type=number]` Chromium lancia un `change` a
   OGNI scatto della freccetta: portare le persone da 1 a 8 con la tastiera
   sono sette eventi, e senza freno sarebbero sette chiamate al ponte.
   CHIAMATA_DAYSPA qui sotto impedisce che una risposta stantia scriva la
   riga sbagliata, ma non toglie una sola chiamata dalla rete — e ognuna,
   dall'altra parte, e' una fetch NON cachata verso il sito vero
   dell'hotel. Il freno IP dell'azione (TETTO_DAYSPA, 60 ogni 5 minuti) e'
   stato dimensionato quando questa pagina non esisteva ancora: dietro il
   wifi dell'hotel o un CGNAT, sette chiamate per gesto lo rendono
   raggiungibile da ospiti veri.

   IL NUMERO. Deve stare fra due cose misurabili.
   · Sotto: piu' lungo dell'intervallo fra due scatti dello STESSO gesto.
     La ripetizione automatica del tasto su questa macchina e' impostata a
     KeyboardSpeed 31 (HKCU\Control Panel\Keyboard), cioe' circa 30 scatti
     al secondo — 33 ms l'uno dall'altro; e sette tocchi dati a mano stanno
     dentro i 150-200 ms. 400 ms li ingloba tutti, e infatti la misura fa
     scendere il gesto 1→8 da sette chiamate a una.
   · Sopra: piu' corto dell'attesa che si nota. Il ponte stesso ci mette il
     suo (`?a=verifica`, l'azione sorella misurata il 17 agosto, rispondeva
     in 202-320 ms a caldo): 400 ms raddoppiano scarsi un'attesa che c'era
     gia', e restano lontani dal secondo oltre il quale una pagina sembra
     ferma.

   Non ho scelto l'altra strada possibile — chiedere solo se il valore e'
   davvero cambiato — perche' NON avrebbe chiuso niente: da 1 a 8 il valore
   cambia sette volte davvero, e sarebbero rimaste sette chiamate. */
const ATTESA_PRIMA_DI_CHIEDERE = 400;
let TIMER_DAYSPA = 0;

/* Il punto in cui entrano gli ascoltatori: non chiede, PRENOTA la domanda.
   Ogni gesto nuovo cancella quella prenotata e ne mette un'altra, cosi'
   parte solo l'ultima — la sola a cui l'ospite tenga davvero. */
function programmaDisponibilita(t) {
  clearTimeout(TIMER_DAYSPA);
  const box = $('dispDayspa');
  if (!box) return;
  /* Campo data svuotato: si torna a non dire niente, SUBITO e senza
     chiedere niente a nessuno — non c'e' motivo di far aspettare 400 ms
     per cancellare una riga. L'incremento butta via la risposta di una
     domanda ancora in volo, che altrimenti riscriverebbe la riga appena
     tolta. */
  const giorno = $('fGiorno') ? $('fGiorno').value.trim() : '';
  if (!giorno) {
    CHIAMATA_DAYSPA += 1;
    box.hidden = true;
    box.textContent = '';
    box.removeAttribute('data-stato');
    return;
  }
  TIMER_DAYSPA = setTimeout(() => chiediDisponibilita(t), ATTESA_PRIMA_DI_CHIEDERE);
}

async function chiediDisponibilita(t) {
  const box = $('dispDayspa');
  if (!box) return;
  /* si rileggono i campi ADESSO, non quando il gesto e' cominciato: fra
     l'uno e l'altro ci sono i 400 ms, e quello che conta e' cosa c'e'
     scritto alla fine */
  const giorno = $('fGiorno') ? $('fGiorno').value.trim() : '';
  if (!giorno) return;
  const persone = $('fPersone') ? $('fPersone').value.trim() : '';
  const mia = ++CHIAMATA_DAYSPA;
  const { signal, ferma } = segnaleConScadenza(ATTESA_DAYSPA);
  /* si parte da 'ignoto' e si sale solo se il ponte risponde qualcosa che
     si sa leggere: qualunque altra strada — 400, 429 del freno, un guasto,
     i sei secondi scaduti, o la funzione vecchia che ancora risponde
     «azione sconosciuta» perche' ?a=dayspa non e' pubblicato — finisce
     qui, e «non riesco a verificare» e' esatto in tutti quei casi */
  let stato = 'ignoto';
  try {
    const r = await fetch(`${FUNZIONE}?a=dayspa&giorno=${encodeURIComponent(giorno)}` +
      `&persone=${encodeURIComponent(persone || '1')}`, { signal });
    const d = await r.json();
    /* si accetta solo una delle cinque parole note. Il valore arriva dalla
       rete e finisce a indicizzare T[LNG].disp: senza questo controllo una
       risposta storta sceglierebbe una chiave qualsiasi (o una ereditata
       da Object.prototype) e la riga uscirebbe vuota o con «undefined» */
    if (d && STATI_DAYSPA.includes(d.stato)) stato = d.stato;
    else console.error('disponibilita day spa illeggibile', r.status, d);
  } catch (e) {
    console.error('disponibilita day spa non riuscita', e);
  } finally {
    ferma();
  }
  /* nel frattempo l'ospite ha cambiato ancora: questa risposta parla di
     una data che non e' piu' quella nel campo, e si butta */
  if (mia !== CHIAMATA_DAYSPA) return;
  box.dataset.stato = stato;
  box.textContent = t.disp[stato];
  box.hidden = false;
}

/* Come attivaTrattamenti: chiamata una volta per disegno di modulo(), che
   ricrea #app da zero — nessun rischio di due ascoltatori sullo stesso
   campo.
   Anche `persone` e non solo il giorno: il ponte gira quel numero all'API
   dell'hotel, e in sei si puo' essere pieni dove in uno c'era posto.
   Lasciare la riga com'era dopo aver cambiato il numero vorrebbe dire
   mostrare la risposta a una domanda che l'ospite non ha piu' fatto. */
function attivaDayspa(t) {
  const giorno = $('fGiorno');
  if (!giorno) return;
  giorno.addEventListener('change', () => programmaDisponibilita(t));
  const persone = $('fPersone');
  /* `if (persone)` guarda che il CAMPO esista, non che il giorno sia
     scelto: quello lo controlla programmaDisponibilita(), che col campo
     data vuoto esce senza chiedere niente. Cambiare le persone prima di
     aver scelto il giorno quindi non fa partire nessuna chiamata. */
  if (persone) persone.addEventListener('change', () => programmaDisponibilita(t));
}

function modulo() {
  const t = T[LNG];
  $('app').innerHTML = `
    <div class="avviso">${avvisoInCima(t)}</div>
    ${riquadroBuono(t)}${invitoBuono(t)}${OSPITE ? `<div class="noto">${esc(t.noto(OSPITE.nome || ''))}</div>` : ''}
    <div class="riquadro">${campiTipo(t)}</div>
    <div class="riquadro">
      <h2>${esc(t.chi)}</h2><div class="guida">${esc(t.guidaChi)}</div>
      <label for="fNome">${esc(t.nome)}</label>
      <input type="text" id="fNome" autocomplete="name" value="${esc(OSPITE?.nome || DA_URL.nome)}" />
      <div class="due">
        <div><label for="fEmail">${esc(t.email)}</label>
          <input type="email" id="fEmail" autocomplete="email" value="${esc(OSPITE?.email || DA_URL.email)}" /></div>
        <div><label for="fTel">${esc(t.tel)}</label>
          <!-- niente OSPITE?.tel: il token non lo restituisce mai, vedi il
               commento su DA_URL piu' in alto -->
          <input type="tel" id="fTel" autocomplete="tel" value="${esc(DA_URL.tel)}" /></div>
      </div>
      <label for="fNote">${esc(t.note)}</label>
      <!-- il riferimento dell'offerta e il codice del buono vanno nelle
           note, con un'etichetta chiara: e' li' che li ritrova la
           reception, non sono campi del modulo (vedi il commento in cima a
           ospite-url.js e notePrecompilate qui sopra) -->
      <textarea id="fNote" placeholder="${esc(t.notePh)}">${esc(notePrecompilate(t))}</textarea>

      <label class="spunta"><input type="checkbox" id="fPrivacy" />
        <span>${esc(t.privacy)} &mdash;
          <a href="https://www.termeleonardo.com/${LNG}/privacy" target="_blank"
            rel="noopener noreferrer">${esc(t.privacyLink)}</a></span></label>
    </div>
    <div class="legenda">${esc(t.legenda)}</div>
    <button class="invia" id="bInvia">${esc(t.invia)}</button>
    <div id="esito"></div>`;

  const taxi = $('fTaxi');
  if (taxi) taxi.onchange = () => {
    $('boxTaxi').style.display = taxi.checked ? 'block' : 'none';
  };

  /* I noleggi si aprono come il taxi. La differenza sta nella chiusura:
     `fNoleggi` non viene mandato al server — quello che parte sono le
     quattro caselle dentro. Se restassero spuntate dopo aver richiuso il
     riquadro, l'ospite chiederebbe una golf car che non vede piu' e che
     credeva di aver tolto, e in reception arriverebbe un noleggio da
     preparare per niente. Chiudendo si azzerano. */
  const noleggi = $('fNoleggi');
  if (noleggi) noleggi.onchange = () => {
    const box = $('boxNoleggi');
    box.style.display = noleggi.checked ? 'block' : 'none';
    if (!noleggi.checked) {
      for (const c of box.querySelectorAll('input[type="checkbox"]')) c.checked = false;
    }
  };
  segnaEtichette(TIPO, document);
  $('bInvia').onclick = invia;
  /* l'invito c'e' solo quando il codice non e' gia' nell'indirizzo */
  if ($('bBuonoApri')) {
    $('bBuonoApri').onclick = () => apriColBuono(t);
    $('fBuonoCodice').addEventListener('keydown', (e) => {
      /* Invio dentro un campo di testo: chi digita da un foglio finisce col
         tasto Invio, non cercando il pulsante col mouse. */
      if (e.key === 'Enter') { e.preventDefault(); apriColBuono(t); }
    });
  }

  /* i campi data (#fData o #fGiorno, secondo il tipo) sono ricreati qui a
     ogni disegno di modulo(): riattivarli in questo punto, non solo al
     primo caricamento. */
  attivaDate();
  if (TIPO === 'trattamenti') attivaTrattamenti(t);
  /* La disponibilità della piscina serve al Day Spa e ai trattamenti con un
     buono che comprende anche un ingresso: in quel secondo caso il riquadro
     esiste nel markup, e senza di lui attivaDayspa() non farebbe niente. */
  if (TIPO === 'dayspa' || $('dispDayspa')) attivaDayspa(t);

  /* L'AVVISO DELLE 48 ORE, sui soli trattamenti. Si aggiorna mentre l'ospite
     sceglie: scoprire il preavviso corto dopo aver compilato tutto sarebbe
     lo stesso difetto che questa riga esiste per evitare. Il campo NON ha un
     `min` che impedisca la scelta — la richiesta è legittima e va accettata. */
  if (TIPO === 'trattamenti') {
    const box = $('avvisoPreavviso');
    const giorno = $('fGiorno');
    const guarda = () => {
      if (!box || !giorno) return;
      const scelto = giorno.value.trim();
      const corto = !!scelto && scelto < primoGiornoUtileTrattamenti();
      box.hidden = !corto;
      box.textContent = corto ? t.pocoPreavviso : '';
      if (corto) box.setAttribute('data-stato', 'esaurito');
      else box.removeAttribute('data-stato');
    };
    if (giorno) giorno.addEventListener('change', guarda);
    guarda();
  }
}

function raccogli() {
  const v = (id) => ($(id) ? $(id).value.trim() : '');
  const c = (id) => ($(id) ? $(id).checked : false);
  if (TIPO === 'greenfee') return {
    circolo: v('fCircolo'), data: v('fData'), ora: v('fOra'),
    giocatori: Number(v('fGiocatori') || 1), percorso: v('fPercorso'),
    golfcar: c('fGolfcar'), carrello: c('fCarrello'),
    carrello_elettrico: c('fCarrelloE'), sacca: c('fSacca'),
    tessera: v('fTessera'), note: v('fNote'),
    taxi: c('fTaxi'), taxi_ora: v('fTaxiOra'), taxi_ritorno: c('fTaxiRitorno'),
  };
  if (TIPO === 'maestro') return {
    data: v('fData'), ora: v('fOra'),
    persone: Number(v('fPersone') || 1), livello: v('fLivello'), note: v('fNote'),
  };
  /* i tre nomi sono quelli che validaDayspa si aspetta (tipi.ts): `giorno`
     e non `data`, come per i trattamenti — e' il giorno dell'ingresso, non
     un appuntamento a un'ora */
  if (TIPO === 'dayspa') return {
    giorno: v('fGiorno'), persone: Number(v('fPersone') || 1), note: v('fNote'),
  };
  /* NON `[...document.querySelectorAll('.voce:checked')]`: #risultatoTratt
     contiene solo le voci del gruppo attualmente aperto, le altre sono
     state ridisegnate via al primo cambio di "strada". Leggendo solo il DOM
     una richiesta con un trattamento dai piu' richiesti e uno dai massaggi
     ne avrebbe mandato solo uno al server — il conteggio a schermo ne
     avrebbe mostrati due, la reception ne avrebbe ricevuto uno. SCELTI_TRATT
     e' la fonte vera, sopravvive al cambio di gruppo: vedi il commento sopra
     attivaTrattamenti(). */
  return {
    voci: [...SCELTI_TRATT].map((i) => nomeCompleto(TRATTAMENTI[i])),
    giorno: v('fGiorno'), fascia: v('fFascia'), ora: v('fOraTratt'), note: v('fNote'),
  };
}

/* CHI STA COMPILANDO DEVE VEDERE DOVE MANCA, non solo che manca.

   Prima c'era un `completo()` che rispondeva sì o no, e in fondo al modulo
   compariva «Compili i campi obbligatori». Su un green fee, che di campi ne
   ha dodici, l'ospite leggeva che qualcosa non andava e non sapeva cosa:
   nessun asterisco sulle etichette, nessun segno sul campo vuoto, e il
   messaggio accanto al pulsante «Invia» — che puo' essere fuori schermo
   rispetto al punto dove doveva tornare. Chi non trova l'errore non
   riprova.

   L'elenco dei campi obbligatori sta in /comune/obbligatori.js, e da li'
   nascono DUE cose: l'asterisco sull'etichetta e questo controllo. Non
   possono divergere perche' sono la stessa lista.

   Questo controllo non e' una difesa: quella la fa il server (valida.ts),
   perche' il browser si aggira. Serve a non far perdere tempo a chi sta
   compilando in buona fede. */
function segnalaMancanti(t, vuoti) {
  $('esito').innerHTML = `<div class="errore">${esc(t.mancaChe(nomiMancanti(vuoti, t)))}</div>`;
  segnaVuoti(TIPO, vuoti, document);
}

async function invia() {
  const t = T[LNG];
  if (INVIANDO) return;
  const vuoti = mancanti(TIPO, (id) => ($(id) ? $(id).value : ''));
  if (vuoti.length) { segnalaMancanti(t, vuoti); return; }
  /* i trattamenti non sono un campo vuoto ma una scelta non fatta: il
     messaggio deve dire quello, non «compili i campi» */
  if (TIPO === 'trattamenti' && SCELTI_TRATT.size === 0) {
    $('esito').innerHTML = `<div class="errore">${esc(t.sceltaManca)}</div>`;
    const elenco = $('risultatoTratt');
    if (elenco) elenco.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  if (!$('fPrivacy').checked) {
    $('esito').innerHTML = `<div class="errore">${esc(t.privacyManca)}</div>`;
    const spunta = $('fPrivacy');
    if (spunta) { spunta.scrollIntoView({ block: 'center', behavior: 'smooth' }); spunta.focus({ preventScroll: true }); }
    return;
  }
  INVIANDO = true;
  $('bInvia').disabled = true;
  $('bInvia').textContent = t.invio;
  $('esito').innerHTML = '';
  try {
    const r = await fetch(FUNZIONE, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        tipo: TIPO,
        nome: $('fNome').value.trim(), email: $('fEmail').value.trim(),
        telefono: $('fTel').value.trim(),
        privacy_presa_atto: $('fPrivacy').checked,
        lingua: LNG, token: TOKEN, origine: location.href,
        dati: raccogli(),
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { console.error('non registrata:', r.status, d); throw new Error('ko'); }
    grazie(d.numero || '');
  } catch (e) {
    console.error(e);
    INVIANDO = false;
    $('bInvia').disabled = false;
    $('bInvia').textContent = t.invia;
    $('esito').innerHTML = `<div class="errore">${esc(t.ripiego)}</div>`;
  }
}

function grazie(numero) {
  const t = T[LNG];
  $('app').innerHTML = `<div class="riquadro fatta">
    <h2>${esc(t.grazieTit)}</h2>
    <p style="color:var(--verde-medio);">${esc(t.grazieTxt)}</p>
    ${numero ? `<div class="rif">${esc(numero)}</div>
      <div class="guida" style="margin-top:4px;">${esc(t.rif)}</div>` : ''}
    <p style="margin-top:22px;"><a href="?tipo=${TIPO}&l=${LNG}">${esc(t.ancora)}</a></p>
  </div>`;
}

async function precompila() {
  if (!TOKEN) return;
  try {
    const r = await fetch(`${FUNZIONE}?a=precompila&t=${encodeURIComponent(TOKEN)}`);
    const d = await r.json();
    if (d && d.noto && d.ospite) {
      OSPITE = d.ospite;
      if (['it','de','en','fr'].includes(OSPITE.lingua) && !qs.get('l')) LNG = OSPITE.lingua;
    }
  } catch (e) { console.error('precompilazione non riuscita', e); }
}

await precompila();
/* prima di disegnare il modulo: il riquadro e la voce preselezionata fanno
   parte del PRIMO disegno, non di un secondo che farebbe saltare la pagina
   sotto gli occhi. Senza ?buono= nell'indirizzo queste due righe non fanno
   niente e non costano nemmeno una chiamata. */
await verificaBuono();
preselezionaDalBuono();
testata();
modulo();
</script>
</body>
