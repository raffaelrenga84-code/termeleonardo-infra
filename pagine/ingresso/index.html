<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#1A3626" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="/ingresso/icona-192.png" />
<meta name="robots" content="noindex, nofollow" />
<title>Ingresso Day Spa — Hotel Terme Leonardo</title>
<!-- si installa sul tablet dello sportello come un'app a tutto schermo -->
<!-- il manifest dipende da chi apre la pagina: lo sportello (/ingresso/)
     o il totem (/ingresso-totem), che deve reinstallarsi a tutto schermo sul
     suo indirizzo. Chrome legge il collegamento appena la pagina si apre:
     cambiarlo dopo, dal modulo, non serviva (5 settembre 2026). -->
<script>
  (function () {
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = location.search.indexOf('privacy=1') >= 0 ? '/ingresso/privacy.webmanifest' : location.pathname.indexOf('ingresso-totem') >= 0 ? '/ingresso/totem.webmanifest' : '/ingresso/manifest.webmanifest';
    document.head.appendChild(l);
  })();
</script>
<link rel="icon" href="/buoni/img/logo-quadrato.svg" type="image/svg+xml" />
<style>
/* LO SPORTELLO DEL DAY SPA. Una pagina per il tablet della reception, con
   tre cose e basta: il lettore (a tastiera o fotocamera), l'esito grande,
   gli arrivi del giorno. Niente schede, niente link fuori. Il cancello e'
   il server: qui si mostra e si segna, con l'accesso dell'hotel. */
:root{--verde:#1A3626;--verde-medio:#3C5346;--acqua:#8FC4BC;--acqua-chiara:#E4F0EA;--oro:#C9A961;--bronzo:#8A6A38;
  --crema:#F9F6F0;--grigio:#7B756A;--allarme:#C0392B;--pietra:#EDE7DC;}
*{box-sizing:border-box;}
body{margin:0;background:var(--crema);color:#2A2E2B;font:17px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
header{background:var(--verde);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
header img{height:30px;width:auto;filter:brightness(0) invert(1);}
header .chi{font-size:14px;opacity:.85;}
header button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px;}
.riquadro{background:#fff;border:1px solid var(--pietra);border-radius:14px;padding:16px;margin-bottom:14px;}
label{display:block;font-size:14px;color:var(--verde-medio);font-weight:600;margin-top:10px;}
input{width:100%;margin-top:6px;padding:14px;font:inherit;border:1px solid #DCD6CB;border-radius:10px;background:#FCFBF8;}
input:focus{outline:3px solid var(--acqua);border-color:transparent;}
#codice{font-family:ui-monospace,Menlo,monospace;font-size:24px;text-transform:uppercase;letter-spacing:2px;}
.bottone{width:100%;margin-top:12px;padding:16px;border:0;border-radius:12px;background:var(--verde);color:#fff;font:600 18px inherit;cursor:pointer;}
.bottone.sec{background:#fff;color:var(--verde);border:2px solid var(--verde);}
.bottone:disabled{opacity:.5;}
video{display:block;width:100%;max-height:46vh;object-fit:cover;border-radius:12px;margin-top:10px;background:#000;}
/* l'esito: grande, verde o rosso, si legge da un metro */
.esitoGrande{font-size:26px;line-height:1.25;padding:18px;border-radius:14px;margin:12px 0;}
.esitoGrande.ok{background:#E6F0EC;color:var(--verde);}
.esitoGrande.no{background:#FBE9E7;color:#8C2F28;}
.esitoGrande small{display:block;font-size:15px;margin-top:6px;opacity:.85;}
.esitoGrande.attesa{background:var(--pietra);color:var(--grigio);font-size:18px;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:24px;color:var(--verde);margin:0 0 6px;}
.mini{font-size:13px;color:var(--grigio);}
.errore{color:var(--allarme);}
.fasciaTit{font-weight:600;color:var(--verde);margin:12px 0 6px;font-size:15px;}
.riga{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #F0EBE1;}
.riga .nome{font-weight:600;}
.riga .dett{font-size:13px;color:var(--grigio);}
.riga .presenti{display:flex;align-items:center;gap:6px;}
.riga .presenti input{width:64px;margin:0;padding:10px;text-align:center;font-size:18px;}
.riga .presenti button{padding:10px 12px;border-radius:10px;border:1px solid var(--verde);background:#fff;color:var(--verde);font:inherit;font-size:14px;cursor:pointer;}
.riga.pieno .nome::after{content:" \2713";color:var(--verde);}
.avviso{padding:10px 13px;border-radius:8px;background:#FFF6E8;border-left:3px solid var(--oro);color:#6B4A22;font-size:14px;margin-bottom:10px;}
/* il totem: una schermata sola, grande, che si legge in piedi */
body.totem main{max-width:820px;padding-top:40px;}
.totemRiposo{text-align:center;padding:48px 24px;min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.totemRiposo.ok{background:#E6F0EC;border-color:var(--verde);}
.totemRiposo.no{background:#FBE9E7;border-color:#8C2F28;}
.totemTitolo{font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;line-height:1.15;color:var(--verde);}
.totemRiposo.no .totemTitolo{color:#8C2F28;}
.totemTesto{font-size:22px;color:var(--verde-medio);margin:0;}
.totemCampo{position:absolute;opacity:0;width:1px;height:1px;}
.totemLingue{font-size:17px;line-height:1.45;color:var(--verde-medio);margin:0;}
.totemFig{width:min(64vw,330px);height:auto;margin:6px auto;display:block;}
.totemFig .tel{animation:avvicina 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes avvicina{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@media (prefers-reduced-motion: reduce){.totemFig .tel{animation:none;}}
/* il conto camera al totem */
.totemRiposo.conto{text-align:left;min-height:0;gap:14px;}
.conto .totemTitolo{text-align:center;}
.contoRighe{max-height:46vh;overflow:auto;border:1px solid #E3DED4;border-radius:8px;background:#fff;}
.contoTab{width:100%;border-collapse:collapse;font-size:17px;}
.contoTab th,.contoTab td{padding:8px 10px;border-bottom:1px solid #EEE9DF;text-align:left;vertical-align:top;}
.contoTab th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--verde-medio);position:sticky;top:0;background:#fff;}
.contoTab .imp{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.contoTotali{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap;font-size:18px;color:var(--verde-medio);}
.contoTotali .grande{font-size:24px;color:var(--verde);}
.contoApp ul{margin:4px 0 0;padding-left:18px;font-size:16px;}
.contoChiudi{font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--verde);background:#fff;color:var(--verde);cursor:pointer;}
.contoChiudi.grande{font-size:24px;font-weight:600;padding:16px 44px;background:var(--verde);color:#fff;border-color:var(--verde);}
.contoPie{text-align:center;margin-top:6px;}
.contoTimer{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.contoBarra{flex:1;height:10px;border-radius:5px;background:var(--allarme);width:100%;transition:width 60s linear;}
.contoSecondi{min-width:64px;text-align:right;font:700 28px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--allarme);font-variant-numeric:tabular-nums;}
.contoSecondi.ultimi{animation:lampeggia 1s steps(2,start) infinite;}
/* «La sua opinione» sul totem */
.opinioneApri{margin:10px auto 0;font-size:20px;padding:14px 28px;}
.totemRiposo.opinione{min-height:0;gap:16px;}
.opLingue{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;width:100%;margin:0 auto;}
.opLingue .grande{width:100%;}
.opStelle{display:flex;justify-content:center;gap:8px;}
.opStelle button{font-size:64px;line-height:1;background:none;border:0;color:#D9D2C3;cursor:pointer;padding:4px;}
.opStelle button.piena{color:var(--oro,#C9A961);}
/* un voto per reparto: nome a sinistra, cinque stelle a destra */
.opReparti{display:flex;flex-direction:column;gap:4px;max-width:620px;width:100%;margin:0 auto;}
.opReparto{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:12px;}
.opReparto:nth-child(odd){background:#fff;}
.opRepNome{font-size:19px;color:var(--verde-medio);text-align:left;}
.opRepStelle{display:flex;gap:2px;}
.opRepStelle button{font-size:34px;line-height:1;background:none;border:0;color:#D9D2C3;cursor:pointer;padding:2px 3px;}
.opRepStelle button.piena{color:var(--oro,#C9A961);}
.opTemi{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:560px;margin:0 auto;}
.opTemi button{font:inherit;font-size:20px;padding:14px 20px;border-radius:999px;border:2px solid var(--verde);background:#fff;color:var(--verde);cursor:pointer;}
.opTemi button.scelto{background:var(--verde);color:#fff;}
.opCampo{width:100%;max-width:560px;margin:0 auto;font:inherit;font-size:20px;padding:12px;border:1px solid #DCD6CB;border-radius:12px;display:block;}
.opBarra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;}
.opBarraDx{display:flex;gap:10px;}
.opQr{width:min(50vw,260px);height:auto;margin:6px auto;display:block;border:1px solid var(--pietra);border-radius:12px;padding:8px;background:#fff;}
/* IL CONSENSO PRIVACY, IN UNA SCHERMATA SOLA. «Non riusciamo a farci
   stare tutto senza che il cliente debba scrollare» (la proprieta', 4
   settembre 2026): l'altezza e' quella dello schermo, le misure crescono e
   calano con lui (clamp su vh), e su un iPad orizzontale le tre frasi
   stanno a sinistra e la firma a destra. Se proprio non entra, a scorrere
   e' solo la colonna delle frasi, mai la pagina. */
.totemRiposo.privacy{text-align:left;gap:clamp(6px,1.2vh,14px);padding:clamp(10px,2vh,22px);
  min-height:0;overflow:hidden;justify-content:flex-start;}
.totemRiposo.privacy .totemTitolo{text-align:center;font-size:clamp(20px,3.4vh,32px);}
.totemRiposo.privacy .totemTesto{font-size:clamp(15px,2.3vh,21px);text-align:center;}
/* la pagina intera e' alta quanto lo schermo e non scorre: la firma deve
   restare sotto gli occhi anche su un iPad in verticale */
body.privacyAperta{overflow:hidden;}
body.privacyAperta main{max-width:none;padding:0;height:calc(100dvh - 52px);}
body.privacyAperta .riquadro{margin:0;border:0;border-radius:0;height:100%;}
.pvCorpo{flex:1;min-height:0;display:grid;gap:clamp(8px,1.4vh,14px);grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;}
.pvFrasi{display:flex;flex-direction:column;gap:clamp(6px,1.1vh,12px);min-height:0;overflow:auto;}
.pvLato{display:flex;flex-direction:column;gap:clamp(4px,0.8vh,10px);min-height:0;}
@media (min-width:800px){.pvCorpo{grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(0,1fr);}}
.privacy .mini{font-size:clamp(11px,1.55vh,13px);line-height:1.35;}
.privacy .totemLingue{font-size:clamp(13px,1.9vh,17px);}
.totemRiposo.privacy.chiusa{text-align:center;min-height:52vh;justify-content:center;gap:20px;}
.totemRiposo.privacy.chiusa .contoChiudi{margin:0 auto;}
.opLingueBarra{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.opLingueBarra button{font:inherit;font-size:clamp(13px,1.9vh,17px);padding:clamp(6px,1.2vh,12px) 6px;border-radius:12px;border:2px solid var(--pietra);background:#fff;color:var(--verde-medio);cursor:pointer;}
.opLingueBarra button.attiva{background:var(--verde);color:#fff;border-color:var(--verde);font-weight:600;}
.pvFrase{border:2px solid var(--pietra);border-radius:14px;padding:clamp(8px,1.5vh,14px) clamp(10px,1.6vh,16px);background:#fff;transition:background .15s,border-color .15s;}
.pvFrase.sceltaSi{background:#EDF6F1;border-color:#2E7D5B;}
.pvFrase.sceltaNo{background:#FCEFED;border-color:#8C2F28;}
.pvFrase p{margin:0 0 clamp(6px,1.1vh,12px);font-size:clamp(13px,2vh,18px);line-height:1.35;}
.pvNum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;font:600 15px system-ui,sans-serif;margin-right:10px;vertical-align:1px;}
.pvScelta{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pvScelta button{font:inherit;font-size:clamp(14px,2.1vh,19px);padding:clamp(9px,1.7vh,16px) 8px;border-radius:12px;border:2px solid var(--pietra);background:#fff;color:#4B5350;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.pvSegno{font-size:clamp(16px,2.4vh,22px);line-height:1;}
.pvScelta button[data-si="1"]{border-color:#9FCBB5;color:#2E7D5B;}
.pvScelta button[data-si="0"]{border-color:#E3B4AE;color:#8C2F28;}
.pvScelta button.si{background:#2E7D5B;border-color:#2E7D5B;color:#fff;font-weight:600;}
.pvScelta button.no{background:#8C2F28;border-color:#8C2F28;color:#fff;font-weight:600;}
.pvSintesi{font-size:14px;line-height:1.5;color:#4B5350;background:#fff;border:1px solid var(--pietra);border-radius:12px;padding:12px;}
.pvFirma{position:relative;flex:1;min-height:0;display:flex;}
.pvEmail{width:100%;font-size:clamp(14px,2vh,17px);padding:clamp(8px,1.4vh,12px);margin:0;}
.pvFirmaScritta{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:clamp(12px,1.7vh,15px);color:var(--grigio);pointer-events:none;}
.pvFirmaScritta::before{content:"";display:block;width:62%;margin:0 auto 6px;border-bottom:1px solid #C9C2B5;}
.pvTesta{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.pvTesta .totemTitolo{text-align:left;}
.pvNorma{margin:2px 0 0;font-size:clamp(11px,1.6vh,14px);color:var(--verde-medio);}
.pvFirma canvas{display:block;width:100%;height:100%;min-height:clamp(90px,16vh,220px);background:#fff;border:2px dashed var(--verde);border-radius:12px;touch-action:none;}
.pvFirma .contoChiudi{position:absolute;right:10px;top:10px;}
.pvElenco{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.pvVoce{font:inherit;font-size:20px;text-align:left;padding:16px;border-radius:12px;border:2px solid var(--acqua);background:var(--acqua-chiara);cursor:pointer;}
.pvVoce b{color:var(--verde);}
/* L'iPad Air della reception ha iOS 12: Safari 12 non conosce clamp(), ne'
   dvh, ne' lo spazio «gap» fra elementi in fila, e butta via quelle righe.
   Qui le stesse misure in fisso, cosi' il modulo si vede lo stesso; chi sa
   leggere clamp salta tutto il blocco (4 settembre 2026). */
@supports not (width: clamp(1px, 1vw, 2px)) {
  body.privacyAperta main{height:calc(100vh - 52px);}
  .totemRiposo.privacy{padding:16px;}
  .totemRiposo.privacy > * + *{margin-top:10px;}
  .totemRiposo.privacy .totemTitolo{font-size:26px;}
  .totemRiposo.privacy .totemTesto{font-size:18px;}
  .privacy .mini{font-size:12px;}
  .privacy .totemLingue{font-size:15px;}
  .opLingueBarra button{font-size:15px;padding:9px 6px;}
  .pvFrasi > * + *,.pvLato > * + *{margin-top:8px;}
  .pvFrase{padding:11px 13px;}
  .pvFrase p{margin:0 0 9px;font-size:16px;}
  .pvScelta button{font-size:17px;padding:12px 8px;}
  .pvSegno{font-size:19px;}
  .pvEmail{font-size:16px;padding:10px;}
  .pvFirmaScritta{font-size:13px;}
  .pvNorma{font-size:12px;}
  .pvFirma canvas{min-height:150px;}
}
.pvAspetta{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;color:var(--verde);margin:0;}
.pvPallino{width:14px;height:14px;border-radius:50%;background:var(--oro);animation:lampeggia 1.4s steps(2,start) infinite;}
@media (prefers-reduced-motion: reduce){.pvPallino{animation:none;}}
body.totem main{max-width:900px;}
@keyframes lampeggia{to{opacity:.25;}}
@media (prefers-reduced-motion: reduce){.contoSecondi.ultimi{animation:none;}}
</style>
</head>
<body>
<header>
  <img src="/buoni/img/logo.svg" alt="Hotel Terme Leonardo" />
  <span class="chi" id="chiSono">Ingresso Day Spa</span>
  <button type="button" id="esci" hidden>esci</button>
</header>
<main id="app"></main>

<script>
/* RETE DI SICUREZZA. Scritta apposta in JavaScript vecchio, senza niente
   che un iPad del 2013 non capisca: parte sempre, anche quando il modulo
   qui sotto non parte. Se lo schermo resta bianco — un browser troppo
   vecchio per una parola nuova, un file che non arriva — al posto del
   bianco compare il motivo, e la reception puo' dirlo a chi segue il
   sistema invece di guardare una pagina muta (4 settembre 2026). */
(function () {
  var detto = false;
  function dillo(motivo) {
    if (detto) return;
    detto = true;
    var a = document.getElementById('app');
    if (!a) return;
    a.innerHTML = '<div class="riquadro"><h2 style="margin-top:0;">Questo schermo non riesce ad aprire la pagina</h2>'
      + '<p>' + String(motivo || 'motivo sconosciuto').replace(/[<>&]/g, ' ') + '</p>'
      + '<p style="font-size:14px;color:#7B756A;">Provi a ricaricare. Se resta cosi’, questo tablet e’ troppo vecchio per la pagina: ne usi un altro e lo dica a chi segue il sistema.</p>'
      + '<button type="button" style="font:inherit;padding:12px 18px;border-radius:10px;border:0;background:#1A3626;color:#fff;" onclick="location.reload()">Ricarica</button></div>';
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window) return;   /* un'immagine che manca non e' questo */
    dillo(e && e.message ? e.message : 'errore nella pagina');
  }, true);
  setTimeout(function () {
    var a = document.getElementById('app');
    if (a && !a.innerHTML.replace(/\s/g, '')) dillo('la pagina non si e’ avviata');
  }, 8000);
})();
</script>

const FUNZIONE = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/dayspa';
/* la verifica pubblica dei buoni regalo, per il totem */
const FUNZIONE_BUONI = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/buoni';
/* il consenso privacy (4 settembre 2026): al totem con la tessera, sugli

const FUNZIONE_PRIVACY = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/privacy';
const SOLO_PRIVACY = new URLSearchParams(location.search).get('privacy') === '1';
/* quali domande fa il modulo lo decide il server (?a=testi): cosi' se un

let SCELTE_PRIVACY = ['conservazione', 'marketing'];
async function chiamaPrivacy(qs, opz = {}) {
  const r = await fetch(FUNZIONE_PRIVACY + qs, { ...opz, headers: { 'content-type': 'application/json', 'x-totem-key': TOTEM || '', ...(opz.headers || {}) } });

const FASCE = { giornaliero: 'Giornaliero 9:00–18:30', serale: 'Serale 18:00–22:30' };

   12 e Safari 12 non conosce ?? ne' ?. — un solo simbolo di quelli e non

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const oggiISO = () => {
  const d = new Date(); const due = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
};
const dataIT = (iso) => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) : '';

let SB = null, TOKEN = '', OPERATORE = '';
/* MODALITA' TOTEM (?totem=<chiave del dispositivo>): la convalida fai da te
   in hall, come il totem di Fidra per il conto camera. Nessun accesso:
   la chiave apre nel server una cosa sola, segnare i presenti del QR
   letto, solo per oggi. Il totem e' pubblico: mai l'elenco del giorno. */
/* Due modi per essere il totem: ?totem=<chiave>, oppure l'indirizzo
   /ingresso-totem, che Vercel serve solo dall'IP fisso dell'hotel: allora
   la chiave non serve, la funzione riconosce l'IP (TOTEM_IP). */
const TOTEM = new URLSearchParams(location.search).get('totem') || (location.pathname.includes('ingresso-totem') ? 'ip' : '');

async function chiama(qs, opz = {}) {
  const testa = TOTEM ? { 'x-totem-key': TOTEM } : { authorization: 'Bearer ' + TOKEN };
  const r = await fetch(FUNZIONE + qs, { ...opz, headers: { 'content-type': 'application/json', ...testa, ...(opz.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { await esci(false); throw new Error(j.errore || 'sessione scaduta'); }
  if (!r.ok) throw new Error(j.errore || ('errore ' + r.status));
  return j;
}

async function esci(chiedi = true) {
  /* uscire e' l'unico gesto che porta via dallo sportello: si chiede */
  if (chiedi && !confirm('Uscire dallo sportello? Per rientrare servono email e password.')) return;
  try { if (SB) await SB.auth.signOut(); } catch (e) { /* gia' fuori */ }
  TOKEN = ''; OPERATORE = '';
  chiediAccesso('');
}

function chiediAccesso(messaggio) {
  $('chiSono').textContent = 'Ingresso Day Spa';
  $('esci').hidden = true;
  $('app').innerHTML = `<div class="riquadro" style="max-width:420px;margin:30px auto;">
    <h2>Accesso reception</h2>
    <label>Email dell'hotel</label><input type="email" id="kMail" placeholder="reception@termeleonardo.com" autocomplete="username" />
    <label>Password</label><input type="password" id="kPwd" autocomplete="current-password" />
    <button class="bottone" id="kEntra">Entra</button>
    <div class="mini" id="kEsito" style="padding-top:10px;">${messaggio ? `<span class="errore">${esc(messaggio)}</span>` : ''}</div></div>`;
  const entra = async () => {
    const email = $('kMail').value.trim(), pwd = $('kPwd').value;
    if (!email || !pwd) { $('kEsito').innerHTML = '<span class="errore">Servono email e password.</span>'; return; }
    $('kEntra').disabled = true;
    try {
      const { data, error } = await SB.auth.signInWithPassword({ email, password: pwd });
      if (error) throw new Error('Email o password non validi.');
      TOKEN = data.session.access_token;
      OPERATORE = (data.user.user_metadata || {}).nome || email.split('@')[0];
      sportello();
    } catch (e) {
      $('kEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
      $('kEntra').disabled = false;
    }
  };
  $('kEntra').onclick = entra;
  $('kPwd').onkeydown = (ev) => { if (ev.key === 'Enter') entra(); };
}

function totem() {
  /* l'iPad dedicato alla privacy non si chiama Day Spa: chi lo prende in
     mano deve leggere cosa fa questo schermo (la proprieta', 4 settembre
     2026) */
  $('chiSono').textContent = SOLO_PRIVACY ? 'Privacy' : 'Day Spa';
  if (SOLO_PRIVACY) document.title = 'Privacy — Hotel Terme Leonardo';
  $('esci').hidden = true;
  document.body.classList.add('totem');
  /* i tempi di chiusura: un tocco ovunque sullo schermo di esito o sul
     conto li azzera e torna al riposo, cosi' nessuno cerca la X */
  let timerRiposo = null, orologioConto = null;
  const riposo = () => {
    /* Totem e iPad restano accesi per giorni con la stessa pagina in
       pancia. Se e' vecchia di mezz'ora si ricarica QUI, tornando al
       riposo: mai davanti a un ospite, e le modifiche arrivano da sole
       senza andare a toccare i dispositivi (4 settembre 2026). */
    if (Date.now() - CARICATA_IL > AGGIORNA_DOPO_MS) { location.reload(); return; }
    clearTimeout(timerRiposo); clearInterval(orologioConto);
    /* sugli iPad (?privacy=1) il riposo e' l'elenco dei consensi in attesa */
    if (SOLO_PRIVACY) { document.onclick = null; privacy(true); return; }
    document.body.classList.remove('privacyAperta');
    $('app').innerHTML = `<div class="riquadro totemRiposo">
      <div class="totemTitolo">Benvenuto</div>
      <div class="totemLingue">Welcome · Willkommen · Bienvenue</div>
      ${FIGURA_QR}
      <p class="totemTesto">Appoggi al lettore il QR del biglietto o del buono regalo, oppure la tessera della camera per vedere il conto.</p>
      <p class="totemLingue">Hold the QR code of your ticket or gift voucher up to the reader, or your room key card to see your bill.<br>
        Halten Sie den QR-Code Ihres Tickets oder Gutscheins vor den Leser, oder Ihre Zimmerkarte für Ihre Rechnung.<br>
        Présentez au lecteur le QR code de votre billet ou bon cadeau, ou votre carte de chambre pour voir votre note.</p>
      <p class="mini">Per ogni altra cosa c'è la reception, qui accanto. · For anything else, the reception desk is right here.</p>
      <button type="button" id="opinioneApri" class="contoChiudi grande opinioneApri">La sua opinione · Your feedback · Ihre Meinung · Votre avis</button>
      <button type="button" id="privacyApri" class="contoChiudi opinioneApri">Privacy · Datenschutz · Confidentialité</button>
      <input id="codiceTotem" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="none" data-lpignore="true" data-1p-ignore data-bwignore aria-label="codice" class="totemCampo" /></div>`;
    const campo = $('codiceTotem');
    campo.onkeydown = (ev) => {
      if (ev.key !== 'Enter') return;
      const letto = campo.value;
      campo.value = '';
      if (letto.trim()) convalida(letto);
    };
    campo.focus();
    /* «La sua opinione»: il tocco sul pulsante non deve arrivare al
       «tocco ovunque» qui sotto, che chiuderebbe subito il percorso */
    $('opinioneApri').onclick = (ev) => { ev.stopPropagation(); opinione(); };
    $('privacyApri').onclick = (ev) => { ev.stopPropagation(); privacy(false); };
    /* qualunque tocco sullo schermo riporta il fuoco al campo: il lettore
       scrive li' e da nessun'altra parte */
    document.onclick = () => {
      const c = $('codiceTotem');
      if (c) { c.focus(); return; }
      riposo();
    };
  };
  const schermo = (classe, titolo, testo, lingue, sotto) => {
    $('app').innerHTML = `<div class="riquadro totemRiposo ${classe}">
      <div class="totemTitolo">${titolo}</div>
      ${testo ? `<p class="totemTesto">${testo}</p>` : ''}
      ${lingue ? `<p class="totemLingue">${lingue}</p>` : ''}
      ${sotto ? `<p class="mini">${sotto}</p>` : ''}</div>`;
  };
  /* il conto camera: lo chiede la nostra funzione a Fidra e qui arriva il
     riassunto; resta 60 secondi come sul totem di hldv, o finche' si tocca
     «Chiudi». Le parole sono nella lingua che Fidra conosce dell'ospite. */
  const mostraConto = (c) => {
    const e = etichetteConto(c.lingua);
    const righe = c.righe.map((r) => `<tr><td>${escT(r.quantita)}</td><td>${escT(r.descrizione)}</td><td class="imp">€ ${escT(r.totale)}</td></tr>`).join('');
    const app = c.appuntamenti.map((a) => `<li>${escT(a.quando)} · ${escT(a.tipo)}${a.operatore ? ' · ' + escT(a.operatore) : ''}${a.fatto ? ' ✓' : ''}</li>`).join('');
    $('app').innerHTML = `<div class="riquadro totemRiposo conto">
      <div class="contoTimer" aria-hidden="true"><div class="contoBarra" id="contoBarra"></div><span class="contoSecondi" id="contoSecondi">60</span></div>
      <div class="totemTitolo">${escT(e.camera)} ${escT(c.camera)}</div>
      <div class="contoRighe"><table class="contoTab"><thead><tr><th>N.</th><th>${escT(e.descrizione)}</th><th class="imp">${escT(e.totale)}</th></tr></thead><tbody>${righe}</tbody></table></div>
      <div class="contoTotali"><span>${escT(e.lordo)} <b>€ ${escT(c.lordo)}</b></span><span>${escT(e.acconto)} <b>€ ${escT(c.acconto)}</b></span><span class="grande">${escT(e.daPagare)} <b>€ ${escT(c.daPagare)}</b></span></div>
      ${app ? `<div class="contoApp"><b>${escT(e.appuntamenti)}</b><ul>${app}</ul></div>` : ''}
      <div class="contoPie"><button type="button" id="contoChiudi" class="contoChiudi grande">${escT(e.chiudi)}</button>
        <p class="totemLingue">${escT(e.tocca)}</p></div></div>`;
    /* la barra parte piena e si consuma in 60 secondi: e' il tempo che si
       vede, non un numero piccolo in fondo («timer piu' visibile, sopra, in
       rosso», la proprieta', 5 settembre 2026) */
    requestAnimationFrame(() => { const b = $('contoBarra'); if (b) b.style.width = '0%'; });
    let secondi = 60;
    orologioConto = setInterval(() => {
      secondi -= 1;
      const s = $('contoSecondi');
      if (!s) { clearInterval(orologioConto); return; }
      s.textContent = String(secondi);
      if (secondi <= 10) s.classList.add('ultimi');
      if (secondi <= 0) riposo();
    }, 1000);
    $('contoChiudi').onclick = riposo;
  };
  /* ---------- «La sua opinione» (4 settembre 2026) ----------
     Stelle, temi, commento, chi e': anonima, o con la camera passando la
     tessera. Le parole vengono da opinione.js nella lingua scelta. Il
     «tocco ovunque» del riposo qui e' spento e si riaccende al riposo;
     sessanta secondi senza tocchi e si torna al riposo da soli. */
  const OPINIONE_RIPOSO_MS = 60 * 1000;
  /* Nome e numero di camera non restano sullo schermo: un minuto senza
     tocchi e la pagina torna al riposo, sul totem come sull'iPad («se uno
     non compila dovrebbe scomparire dopo 60 secondi, altrimenti qualcuno
     legge nome e numero di camera», la proprieta', 4 settembre 2026). */
  const PRIVACY_RIPOSO_MS = 60 * 1000;
/* da quanto e' aperta questa pagina, e ogni quanto vale la pena rileggerla */
const CARICATA_IL = Date.now();
const AGGIORNA_DOPO_MS = 30 * 60 * 1000;
  const opinione = () => {
    document.onclick = null;
    const st = { lingua: 'it', stelle: 0, temi: new Set(), voti: {}, commento: '', tessera: null };
    let t = testiOpinione('it');
    const tocco = () => { clearTimeout(timerRiposo); timerRiposo = setTimeout(riposo, OPINIONE_RIPOSO_MS); };
    const vetro = (dentro, classe = '') => {
      $('app').onclick = null;
      $('app').innerHTML = `<div class="riquadro totemRiposo opinione ${classe}">${dentro}</div>`;
      tocco();
    };
    const barra = (indietro, avanti, salta) => `<div class="opBarra">
        ${indietro ? `<button type="button" class="contoChiudi" id="opIndietro">‹ ${escT(t.indietro)}</button>` : '<span></span>'}
        <span class="opBarraDx">${salta ? `<button type="button" class="contoChiudi" id="opSalta">${escT(t.salta)}</button>` : ''}
        ${avanti ? `<button type="button" class="contoChiudi grande" id="opAvanti">${escT(t.avanti)} ›</button>` : ''}</span></div>`;
    const lega = (indietro, avanti, salta) => {
      const b = $('opIndietro'); if (b) b.onclick = indietro;
      const a = $('opAvanti'); if (a) a.onclick = avanti;
      const s = $('opSalta'); if (s) s.onclick = salta;
    };
    const lingua = () => {
      vetro(`<div class="totemTitolo">La sua opinione</div>
        <div class="opLingue">${[['it', 'Italiano'], ['en', 'English'], ['de', 'Deutsch'], ['fr', 'Français']].map(([l, n]) => `<button type="button" class="contoChiudi grande" data-l="${l}">${n}</button>`).join('')}</div>
        ${barra(true, false, false)}`);
      document.querySelectorAll('[data-l]').forEach((b) => b.onclick = () => { st.lingua = b.dataset.l; t = testiOpinione(st.lingua); stelle(); });
      lega(riposo);
    };
    const stelle = () => {
      vetro(`<div class="totemTitolo">${escT(t.stelleTitolo)}</div><p class="totemLingue">${escT(t.stelleSotto)}</p>
        <div class="opStelle">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-s="${n}" class="${st.stelle >= n ? 'piena' : ''}" aria-label="${n}">★</button>`).join('')}</div>
        ${barra(true, false, false)}`);
      document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { st.stelle = Number(b.dataset.s); reparti(); });
      lega(lingua);
    };
    /* Un voto per reparto, come sul foglio che gli ospiti compilano da
       sempre: un voto solo dice poco, sette dicono dove intervenire («e'
       molto spoglia, e' veramente una recensione generale», la proprieta',
       4 settembre 2026). Tutti facoltativi: si tocca dove si vuole. */
    const reparti = () => {
      vetro(`<div class="totemTitolo">${escT(t.repartiTitolo)}</div><p class="totemLingue">${escT(t.repartiSotto)}</p>
        <div class="opReparti">${TEMI_OPINIONE.map((k) => `<div class="opReparto"><span class="opRepNome">${escT(t.temi[k])}</span>
          <span class="opRepStelle" data-r="${k}">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-v="${n}" class="${(st.voti[k] || 0) >= n ? 'piena' : ''}" aria-label="${n}">★</button>`).join('')}</span></div>`).join('')}</div>
        ${barra(true, true, true)}`);
      document.querySelectorAll('.opRepStelle').forEach((riga) => riga.querySelectorAll('button').forEach((b) => b.onclick = () => {
        const k = riga.dataset.r, v = Number(b.dataset.v);
        st.voti[k] = st.voti[k] === v ? 0 : v;
        if (!st.voti[k]) delete st.voti[k];
        riga.querySelectorAll('button').forEach((x) => x.classList.toggle('piena', (st.voti[k] || 0) >= Number(x.dataset.v)));
        tocco();
      }));
      lega(stelle, commento, () => { st.voti = {}; commento(); });
    };
    const commento = () => {
      vetro(`<div class="totemTitolo">${escT(t.commentoTitolo)}</div><p class="totemLingue">${escT(t.commentoSotto)}</p>
        <textarea id="opCommento" class="opCampo" maxlength="500" rows="4">${escT(st.commento)}</textarea>
        ${barra(true, true, true)}`);
      const c = $('opCommento');
      c.oninput = tocco;
      c.focus();
      lega(() => { st.commento = c.value; reparti(); }, () => { st.commento = c.value.trim(); chi(); }, () => { st.commento = ''; chi(); });
    };
    const chi = () => {
      vetro(`<div class="totemTitolo">${escT(t.chiTitolo)}</div><p class="totemTesto">${escT(t.chiTessera)}</p>
        ${FIGURA_QR}
        <button type="button" class="contoChiudi grande" id="opAnonimo">${escT(t.chiAnonimo)}</button>
        <p class="mini">${escT(t.privacy)}</p>
        <input id="opTessera" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="none" data-lpignore="true" data-1p-ignore data-bwignore aria-label="tessera" class="totemCampo" />
        ${barra(true, false, false)}`);
      const campo = $('opTessera');
      campo.onkeydown = (ev) => {
        if (ev.key !== 'Enter') return;
        const letto = codiceLetto(campo.value);
        campo.value = '';
        if (tipoCodice(letto) === 'tessera') { st.tessera = letto; invia(); } else tocco();
      };
      campo.focus();
      /* i tocchi sullo sfondo riportano il fuoco al lettore, senza chiudere */
      $('app').onclick = (ev) => { if (!ev.target.closest('button')) campo.focus(); };
      $('opAnonimo').onclick = () => { st.tessera = null; invia(); };
      lega(commento);
    };
    const invia = async () => {
      vetro(`<div class="totemTitolo">${escT(t.invio)}</div>`);
      try {
        const j = await chiama('?a=opinione', { method: 'POST', body: JSON.stringify({ lingua: st.lingua, stelle: st.stelle, temi: [...st.temi], voti: st.voti, commento: st.commento, tessera: st.tessera }) });
        const qr = j.google ? `<p class="totemTesto">${escT(t.google)}</p><img class="opQr" alt="QR Google" src="${FUNZIONE}?a=qr-google" />` : '';
        vetro(`<div class="totemTitolo">✓ ${escT(t.grazie)}</div><p class="totemTesto">${escT(t.grazieTesto)}</p>${qr}`, 'ok');
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
        clearTimeout(timerRiposo); timerRiposo = setTimeout(riposo, j.google ? 20000 : 8000);
      } catch (e) {
        vetro(`<div class="totemTitolo">✗ ${escT(t.errore)}</div><p class="mini">${escT(e.message)}</p>`, 'no');
        clearTimeout(timerRiposo); timerRiposo = setTimeout(riposo, 10000);
      }
    };
    lingua();
  };

  /* ---------- il consenso privacy (4 settembre 2026) ----------
     Al totem: tessera → camera e consenso in attesa (messo dalla reception
     al check-in con l'estensione) → modulo compilato → tre scelte → firma
     col dito → conferma. Senza attesa si scrivono cognome e nome. Sugli
     iPad (?privacy=1) si parte dall'elenco delle attese. Le parole arrivano
     dalla funzione (?a=testi) con la versione, che si firma insieme. */
  const privacy = (daElenco = false) => {
    document.onclick = null;
    document.body.classList.add('privacyAperta');
    const st = { id: null, camera: null, cognome: '', nome: '', lingua: 'it', scelte: {}, versione: null };
    let T = null;
    const CAMERA = { it: 'camera', en: 'room', de: 'Zimmer', fr: 'chambre' };
    let rinfresco = null;
    /* un minuto senza tocchi e si chiude: sul totem torna il benvenuto,
       sull'iPad la schermata chiusa, dove non c'e' scritto nessun nome */
    const scaduta = () => { clearTimeout(rinfresco); if (SOLO_PRIVACY) chiusa(); else riposo(); };
    const tocco = () => { clearTimeout(timerRiposo); timerRiposo = setTimeout(scaduta, PRIVACY_RIPOSO_MS); };
    /* «conta» dice se disegnare vale come un tocco. Il rinfresco
       automatico dell'elenco NON vale: rimettendo il minuto ogni dieci
       secondi l'iPad non tornava mai alla schermata chiusa e restava li'
       coi nomi in vista («poi resta con questa aperta», la proprieta',
       4 settembre 2026). */
    const vetro = (dentro, classe = '', conta = true) => {
      clearTimeout(rinfresco);
      $('app').onclick = null;
      $('app').innerHTML = `<div class="riquadro totemRiposo opinione privacy ${classe}">${dentro}</div>`;
      if (conta) tocco();
    };
    /* La schermata chiusa dell'iPad: niente nomi, niente camere. Chiede
       ogni quindici secondi SOLO QUANTI consensi aspettano, e accende un
       pallino: la reception vede che ne e' arrivato uno senza che il nome
       compaia sullo schermo davanti a tutti. */
    const chiusa = (quanti = 0) => {
      clearTimeout(timerRiposo); clearTimeout(rinfresco);
      $('app').onclick = null;
      /* la clientela e' italiana, tedesca, inglese e francese: la
         schermata d'attesa parla tutte e quattro le lingue insieme, perche'
         qui non si sa ancora chi arrivera' (la proprieta', 4 settembre 2026) */
      $('app').innerHTML = `<div class="riquadro totemRiposo privacy chiusa">
        <div class="totemTitolo">Privacy</div>
        <p class="totemLingue">Consenso al trattamento dei dati personali<br>Einwilligung zur Verarbeitung Ihrer Daten<br>Consent to the processing of your data<br>Consentement au traitement de vos données</p>
        ${quanti ? `<p class="pvAspetta"><span class="pvPallino"></span>${quanti === 1 ? 'Un consenso aspetta' : quanti + ' consensi aspettano'}</p>` : '<p class="mini">Nessuno in attesa. La reception preme «Privacy all’iPad» sulla prenotazione in Fidra.</p>'}
        <button type="button" class="contoChiudi grande" id="pvComincia">Cominci qui · Bitte hier beginnen · Start here · Commencez ici</button></div>`;
      $('pvComincia').onclick = () => elenco();
      rinfresco = setTimeout(async () => {
        try { const j = await chiamaPrivacy('?a=quante'); chiusa(Number(j.attese) || 0); }
        catch (e) { chiusa(quanti); }
      }, 15000);
    };
    const testi = async (lingua) => {
      const j = await chiamaPrivacy(`?a=testi&lingua=${encodeURIComponent(lingua)}`);
      st.lingua = j.testi && lingua ? lingua : 'it';
      st.versione = j.versione;
      if (Array.isArray(j.scelte) && j.scelte.length) SCELTE_PRIVACY = j.scelte;
      T = j.testi;
      return T;
    };
    /* la lingua indovinata puo' sbagliare: i quattro nomi stanno in alto,
       grandi, e si cambia con un tocco («la lingua non e' corretta, questo
       e' un cliente tedesco», la proprieta', 4 settembre 2026) */
    const lingue = () => `<div class="opLingueBarra">${[['it', 'Italiano'], ['en', 'English'], ['de', 'Deutsch'], ['fr', 'Français']].map(([l, n]) => `<button type="button" data-pl="${l}" class="${l === st.lingua ? 'attiva' : ''}">${n}</button>`).join('')}</div>`;
    const legaLingue = (poi) => document.querySelectorAll('[data-pl]').forEach((b) => b.onclick = async () => { await testi(b.dataset.pl); poi(); });
    const indietro = () => daElenco ? elenco() : tessera();

    /* al totem: la tessera, o il nome scritto a mano */
    /* In una camera possono esserci due persone, e ognuna firma il suo
       consenso: passata la tessera, se ce n'e' piu' d'una in attesa si
       chiede all'ospite quale e' lui (la proprieta', 4 settembre 2026). */
    const apriPer = async (a) => {
      st.id = a.id; st.cognome = a.cognome; st.nome = a.nome || ''; st.haEmail = !!a.ha_email;
      await testi(a.lingua || 'it');
      modulo();
    };
    const chiSei = (lista) => {
      vetro(`<div class="totemTitolo">Privacy</div>
        <p class="totemTesto">Chi è lei? · Who are you? · Wer sind Sie? · Qui êtes-vous ?</p>
        <div class="pvElenco">${lista.map((a) => `<button type="button" class="pvVoce" data-id="${escT(a.id)}"><b>${escT(a.cognome)} ${escT(a.nome || '')}</b></button>`).join('')}</div>
        <div class="opBarra"><button type="button" class="contoChiudi" id="pvIndietro">‹</button><span></span></div>`);
      document.querySelectorAll('.pvVoce').forEach((b) => b.onclick = () => {
        const a = lista.find((x) => String(x.id) === b.dataset.id);
        if (a) apriPer(a);
      });
      $('pvIndietro').onclick = riposo;
    };

    const tessera = async () => {
      if (!T) await testi('it');
      vetro(`<div class="totemTitolo">Privacy</div>
        <p class="totemTesto">Consenso al trattamento dei dati · Datenschutz · Consent · Confidentialité</p>
        <p class="totemTesto">${escT(T.passiTessera)}</p>
        <p class="totemLingue">Hold your room key card up to the reader · Halten Sie Ihre Zimmerkarte vor den Leser · Présentez votre carte de chambre au lecteur</p>
        ${FIGURA_QR}
        <button type="button" class="contoChiudi" id="pvNome">${escT(T.chiediNome)} · What is your name? · Wie heißen Sie?</button>
        <input id="pvTessera" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="none" data-lpignore="true" data-1p-ignore data-bwignore aria-label="tessera" class="totemCampo" />
        <div class="opBarra"><button type="button" class="contoChiudi" id="pvIndietro">‹</button><span></span></div>`);
      const campo = $('pvTessera');
      campo.onkeydown = async (ev) => {
        if (ev.key !== 'Enter') return;
        const letto = codiceLetto(campo.value);
        campo.value = '';
        if (tipoCodice(letto) !== 'tessera') { tocco(); return; }
        vetro(`<div class="totemTitolo">…</div>`);
        try {
          const j = await chiamaPrivacy(`?a=tessera&codice=${encodeURIComponent(letto)}`);
          st.camera = j.camera; st.scelte = {};
          const lista = j.attese || (j.attesa ? [j.attesa] : []);
          if (lista.length > 1) chiSei(lista);
          else if (lista.length === 1) await apriPer(lista[0]);
          else chiediNome();
        } catch (e) { chiediNome(T.tesseraIgnota); }
      };
      campo.focus();
      $('app').onclick = (ev) => { if (!ev.target.closest('button')) campo.focus(); };
      $('pvNome').onclick = () => { st.scelte = {}; chiediNome(); };
      $('pvIndietro').onclick = riposo;
    };
    const chiediNome = (avviso = '') => {
      vetro(`${lingue()}<div class="totemTitolo">${escT(T.chiediNome)}</div>${avviso ? `<p class="totemTesto">${escT(avviso)}</p>` : ''}
        <input id="pvCognome" class="opCampo" placeholder="${escT(T.cognome)}" autocomplete="off" autocapitalize="words" value="${escT(st.cognome)}" />
        <input id="pvNomeCampo" class="opCampo" placeholder="${escT(T.nome)}" autocomplete="off" autocapitalize="words" value="${escT(st.nome)}" />
        ${st.camera ? '' : `<input id="pvCamera" class="opCampo" placeholder="${escT(CAMERA[st.lingua] || 'camera')}" inputmode="numeric" autocomplete="off" />`}
        <div class="opBarra"><button type="button" class="contoChiudi" id="pvIndietro">‹</button><span class="opBarraDx"><button type="button" class="contoChiudi grande" id="pvAvanti">${escT(T.avanti)} ›</button></span></div>`);
      legaLingue(() => chiediNome(avviso));
      ['pvCognome', 'pvNomeCampo', 'pvCamera'].forEach((id) => { const el = $(id); if (el) el.oninput = tocco; });
      $('pvCognome').focus();
      $('pvAvanti').onclick = () => {
        st.cognome = $('pvCognome').value.trim(); st.nome = $('pvNomeCampo').value.trim();
        if ($('pvCamera')) st.camera = $('pvCamera').value.trim() || null;
        if (!st.cognome) { $('pvCognome').focus(); return; }
        if (!st.camera) { $('pvCamera').focus(); return; }
        st.id = null; modulo();
      };
      $('pvIndietro').onclick = indietro;
    };

    /* sugli iPad: l'elenco delle attese, che si rinfresca da solo */
    const elenco = async (daSolo = false) => {
      if (!T) await testi('it');
      vetro(`<div class="totemTitolo">Privacy</div><p class="totemTesto">Consensi in attesa: tocchi l’ospite.</p>
        <p class="totemLingue">Tap the guest · Tippen Sie auf den Gast · Touchez le client</p>
        <div class="pvElenco" id="pvElenco"><p class="mini">…</p></div>
        <div class="opBarra"><span></span><span class="opBarraDx"><button type="button" class="contoChiudi" id="pvManuale">Senza check‑in: scrivi il nome</button><button type="button" class="contoChiudi" id="pvAggiorna">↻</button></span></div>`, '', !daSolo);
      try {
        const j = await chiamaPrivacy('?a=attese');
        $('pvElenco').innerHTML = j.attese.length
          ? j.attese.map((a) => `<button type="button" class="pvVoce" data-id="${escT(a.id)}"><b>${escT(CAMERA.it)} ${escT(a.camera)}</b> · ${escT(a.cognome)} ${escT(a.nome || '')} <span class="mini">${escT(String(a.lingua || 'it').toUpperCase())}</span></button>`).join('')
          : '<p class="mini">Nessun consenso in attesa. Al check‑in la reception preme «Privacy al totem» sulla prenotazione in Fidra.</p>';
        document.querySelectorAll('.pvVoce').forEach((b) => b.onclick = async () => {
          const a = j.attese.find((x) => x.id === b.dataset.id);
          st.id = a.id; st.camera = a.camera; st.cognome = a.cognome; st.nome = a.nome || ''; st.scelte = {}; st.haEmail = !!a.ha_email;
          await testi(a.lingua || 'it'); modulo();
        });
      } catch (e) { $('pvElenco').innerHTML = `<p class="mini errore">${escT(e.message)}</p>`; }
      $('pvManuale').onclick = () => { st.camera = null; st.cognome = ''; st.nome = ''; st.scelte = {}; chiediNome(); };
      $('pvAggiorna').onclick = () => elenco();
      /* l'elenco si rinfresca da solo ogni dieci secondi: la reception
         preme «Privacy al totem» in Fidra e l'ospite compare qui senza
         che nessuno debba toccare niente */
      clearTimeout(rinfresco);
      rinfresco = setTimeout(() => elenco(true), 10000);
    };

    /* il modulo: tre frasi, due pulsanti ciascuna, niente preimpostato; la firma col dito */
    const modulo = () => {
      /* la testa come nel modulo che gli ospiti conoscono: titolo con la
         norma sotto, e il pulsante che manda in alto a destra, sempre in
         vista senza cercarlo in fondo */
      vetro(`<div class="pvTesta">
          <div><div class="totemTitolo">${escT(T.titolo)}</div><p class="pvNorma">${escT(T.norma)}</p></div>
          <button type="button" class="contoChiudi grande" id="pvConferma">${escT(T.conferma)} ➤</button>
        </div>
        ${lingue()}
        <p class="totemTesto">${escT(T.saluto)}, <b>${escT((st.cognome + ' ' + st.nome).trim())}</b>${st.camera ? ` · ${escT(CAMERA[st.lingua] || 'camera')} ${escT(st.camera)}` : ''}</p>
        <div class="pvCorpo"><div class="pvFrasi">
        ${SCELTE_PRIVACY.map((k, i) => `<div class="pvFrase ${st.scelte[k] === true ? 'sceltaSi' : st.scelte[k] === false ? 'sceltaNo' : ''}" data-frase="${k}"><p><span class="pvNum">${i + 1}</span>${escT(T.scelte[k])}</p>
          <div class="pvScelta" data-k="${k}"><button type="button" data-si="1" class="${st.scelte[k] === true ? 'si' : ''}"><span class="pvSegno">✓</span>${escT(T.autorizzo)}</button><button type="button" data-si="0" class="${st.scelte[k] === false ? 'no' : ''}"><span class="pvSegno">✕</span>${escT(T.nonAutorizzo)}</button></div></div>`).join('')}
        </div><div class="pvLato">
        <p class="mini">${escT(T.informativa)} <button type="button" class="contoChiudi" id="pvLeggi">${escT(T.leggi)}</button> · ${escT(T.revoca)}</p>
        <div id="pvSintesi" hidden class="pvSintesi">${escT(T.sintesi)}</div>
        ${st.haEmail ? '' : `<input id="pvEmail" type="email" class="totemCampo pvEmail" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="${escT(T.emailEtichetta)}" aria-label="${escT(T.emailEtichetta)}" />`}
        <div class="pvFirma"><canvas id="pvCanvas" width="700" height="220"></canvas>
          <span class="pvFirmaScritta">${escT(T.firmaQui)}</span>
          <button type="button" class="contoChiudi" id="pvCancella">${escT(T.cancella)}</button></div>
        <div class="esito errore" id="pvEsito"></div>
        </div></div>
        <div class="opBarra"><button type="button" class="contoChiudi" id="pvIndietro">‹</button><span class="opBarraDx"></span></div>`);
      legaLingue(modulo);
      document.querySelectorAll('.pvScelta').forEach((s) => s.querySelectorAll('button').forEach((b) => b.onclick = () => {
        const k = s.dataset.k;
        st.scelte[k] = b.dataset.si === '1';
        s.querySelectorAll('button').forEach((x) => { x.classList.toggle('si', x.dataset.si === '1' && st.scelte[k] === true); x.classList.toggle('no', x.dataset.si === '0' && st.scelte[k] === false); });
        const riquadro = document.querySelector(`[data-frase="${k}"]`);
        if (riquadro) { riquadro.classList.toggle('sceltaSi', st.scelte[k] === true); riquadro.classList.toggle('sceltaNo', st.scelte[k] === false); }
        $('pvEsito').textContent = ''; tocco();
      }));
      $('pvLeggi').onclick = () => { $('pvSintesi').hidden = !$('pvSintesi').hidden; tocco(); };
      const cv = $('pvCanvas'), ctx = cv.getContext('2d');
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1A3626';
      let giu = false, tratti = 0;
      const punto = (ev) => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) * cv.width / r.width, (ev.clientY - r.top) * cv.height / r.height]; };
      cv.addEventListener('pointerdown', (ev) => { giu = true; const [x, y] = punto(ev); ctx.beginPath(); ctx.moveTo(x, y); cv.setPointerCapture(ev.pointerId); tocco(); });
      cv.addEventListener('pointermove', (ev) => { if (!giu) return; const [x, y] = punto(ev); ctx.lineTo(x, y); ctx.stroke(); tratti++; });
      const su = () => { giu = false; };
      cv.addEventListener('pointerup', su); cv.addEventListener('pointercancel', su);
      $('pvCancella').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); tratti = 0; tocco(); };
      $('pvIndietro').onclick = indietro;
      $('pvConferma').onclick = async () => {
        if (SCELTE_PRIVACY.some((k) => typeof st.scelte[k] !== 'boolean')) { $('pvEsito').textContent = T.mancaScelte; return; }
        if (tratti < 5) { $('pvEsito').textContent = T.mancaFirma; return; }
        $('pvConferma').disabled = true;
        try {
          await chiamaPrivacy('?a=firma', { method: 'POST', body: JSON.stringify({
            id: st.id, camera: st.camera, cognome: st.cognome, nome: st.nome, lingua: st.lingua,
            scelte: st.scelte, firma: cv.toDataURL('image/png'), versione: st.versione, fonte: SOLO_PRIVACY ? 'ipad' : 'totem',
            email: ($('pvEmail') || {}).value || null,
          }) });
          vetro(`<div class="totemTitolo">✓ ${escT(T.grazie)}</div><p class="totemTesto">${escT(T.grazieTesto)}</p>`, 'ok');
          if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
          clearTimeout(timerRiposo); timerRiposo = setTimeout(riposo, 6000);
        } catch (e) { $('pvEsito').textContent = `${T.errore} (${e.message})`; $('pvConferma').disabled = false; }
      };
    };
    if (daElenco) chiusa(); else tessera();
  };

  const ALLA_RECEPTION = 'Please ask at the reception desk, right here.<br>Bitte wenden Sie sich an die Rezeption, gleich nebenan.<br>Veuillez vous adresser à la réception, juste à côté.';
  const convalida = async (letto) => {
    const codice = codiceLetto(letto);
    const tipo = tipoCodice(codice);
    schermo('', 'Un momento…', '', 'One moment · Einen Moment · Un instant');
    let durata = 8000;
    try {
      if (tipo === 'dayspa') {
        const j = await chiama('?a=presenti', { method: 'POST', body: JSON.stringify({ codice }) });
        const p = j.prenotazione;
        schermo('ok', `✓ Benvenuti, ${escT(p.nome)}`,
          `${p.persone === 1 ? '1 persona' : `${p.persone} persone`} · buona giornata alle terme.`,
          'Welcome! Enjoy your day at the thermal pools.<br>Willkommen! Einen schönen Tag im Thermalbad.<br>Bienvenue ! Bonne journée aux thermes.',
          'Cuffia obbligatoria in piscina, in vendita alla reception · Swim cap required, on sale at the reception · Badekappe Pflicht, an der Rezeption erhältlich.');
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      } else if (tipo === 'buono') {
        /* la verifica dei buoni e' pubblica: niente chiave, niente token */
        const r = await fetch(`${FUNZIONE_BUONI}?a=verifica&codice=${encodeURIComponent(codice)}`);
        if (!r.ok && r.status !== 404) throw new Error('la verifica del buono non risponde');
        const m = messaggioBuono(await r.json());
        schermo(m.classe, `${m.classe === 'ok' ? '✓' : '✗'} ${escT(m.titolo)}`, escT(m.testo), m.tradotto.map(escT).join('<br>'), escT(m.sotto));
        if (m.classe !== 'ok') durata = 10000;
      } else if (tipo === 'tessera') {
        const j = await chiama(`?a=conto&codice=${encodeURIComponent(codice)}`);
        mostraConto(j.conto);
        return;
      } else {
        durata = 10000;
        schermo('no', '✗ Codice non riconosciuto', 'Non è un biglietto Day Spa né un buono regalo.',
          'This code is not a Day Spa ticket nor a gift voucher.<br>Dieser Code ist weder ein Day-Spa-Ticket noch ein Gutschein.<br>Ce code n’est ni un billet Day Spa ni un bon cadeau.',
          'Si rivolga alla reception, qui accanto.');
      }
    } catch (e) {
      durata = 10000;
      schermo('no', '✗ Non riesco a leggere questo codice', escT(e.message), ALLA_RECEPTION, 'Si rivolga alla reception, qui accanto.');
    }
    timerRiposo = setTimeout(riposo, durata);
  };
  (async () => { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) { /* niente */ } })();
  riposo();
}

/* ---------- lo sportello ---------- */
function sportello() {
  $('chiSono').textContent = `${OPERATORE} · ${dataIT(oggiISO())}`;
  $('esci').hidden = false;
  $('app').innerHTML = `
    <div class="riquadro">
      <label for="codice">Il QR dell'ospite, o il numero della prenotazione</label>
      <input id="codice" placeholder="inquadri o digiti" autocomplete="off" />
      <button type="button" class="bottone sec" id="cam">Scansiona con la fotocamera</button>
      <video id="video" hidden playsinline muted></video>
      <div id="esito"><div class="esitoGrande attesa">In attesa di un codice…</div></div>
    </div>
    <div class="riquadro">
      <h2>Arrivi di oggi</h2>
      <div class="mini" id="riassunto">Carico…</div>
      <div id="elenco"></div>
    </div>`;

  const mostra = (classe, testo, sotto) => {
    $('esito').innerHTML = `<div class="esitoGrande ${classe}">${testo}${sotto ? `<small>${sotto}</small>` : ''}</div>`;
  };

  /* segna i presenti; senza `presenti` il server mette tutte le persone,
     che e' il caso normale del QR mostrato allo sportello */
  const segna = async (corpo) => {
    mostra('attesa', 'Un momento…');
    try {
      const j = await chiama('?a=presenti', { method: 'POST', body: JSON.stringify(corpo) });
      const p = j.prenotazione;
      if (j.oggi) {
        mostra('ok', `✓ ${esc(p.nome)} · presenti ${p.presenti} su ${p.persone}`, `${esc(FASCE[p.fascia] || p.fascia)} · ${esc(p.numero)}`);
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      } else {
        mostra('no', `✗ ${esc(p.nome)}: la prenotazione è per ${esc(dataIT(p.giorno))}, non per oggi`, `presenti segnati ${p.presenti} su ${p.persone} · ${esc(p.numero)}`);
        if (navigator.vibrate) navigator.vibrate(300);
      }
      carica();
    } catch (e) {
      mostra('no', `✗ ${esc(e.message)}`);
      if (navigator.vibrate) navigator.vibrate(300);
    }
  };

  const leggiTesto = (v) => {
    const t = v.trim().toUpperCase();
    if (!t) return;
    segna(/^DS-\d{4}-\d+$/.test(t) ? { numero: t } : { codice: t });
  };

  /* il lettore a tastiera digita e preme Invio */
  $('codice').onkeydown = (ev) => {
    if (ev.key !== 'Enter') return;
    leggiTesto($('codice').value);
    $('codice').value = '';
  };

  /* l'elenco del giorno, per fascia, con i presenti modificabili a mano */
  const carica = async () => {
    try {
      const j = await chiama('?a=oggi&giorno=' + oggiISO());
      const pren = (j.prenotazioni || []).filter((p) => p.stato === 'pagata');
      const fasce = j.fasce || [];
      const attesi = pren.reduce((t, p) => t + p.persone, 0);
      const presenti = pren.reduce((t, p) => t + (p.presenti || 0), 0);
      $('riassunto').textContent = pren.length
        ? `${pren.length} prenotazioni · ${presenti} presenti su ${attesi} attesi`
        : 'Nessuna prenotazione per oggi.';
      $('elenco').innerHTML = Object.keys(FASCE).map((fascia) => {
        const righe = pren.filter((p) => p.fascia === fascia);
        if (!righe.length) return '';
        const f = fasce.find((x) => x.fascia === fascia);
        return `<div class="fasciaTit">${esc(FASCE[fascia])}${f ? ` · posti ${f.venduti}/${f.posti}` : ''}</div>` +
          righe.map((p) => `<div class="riga${p.presenti >= p.persone ? ' pieno' : ''}">
            <div><div class="nome">${esc(p.nome)}</div>
              <div class="dett">${p.persone} ${p.persone === 1 ? 'persona' : 'persone'} · ${esc(p.numero)}${p.prova ? ' · prova' : ''}${p.note ? ` · <span class="errore">${esc(p.note)}</span>` : ''}</div></div>
            <div class="presenti"><input type="number" min="0" max="${p.persone}" value="${p.presenti || 0}" data-numero="${esc(p.numero)}" aria-label="presenti" />
              <button type="button" data-segna="${esc(p.numero)}">Segna</button></div>
          </div>`).join('');
      }).join('');
      document.querySelectorAll('[data-segna]').forEach((b) => b.onclick = () => {
        const inp = document.querySelector(`input[data-numero="${b.dataset.segna}"]`);
        segna({ numero: b.dataset.segna, presenti: Number(inp.value) });
      });
    } catch (e) {
      $('riassunto').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
    }
  };
  carica();
  const orologio = setInterval(() => { if (!document.body.contains($('elenco'))) { clearInterval(orologio); return; } carica(); }, OGNI_QUANTO);

  /* LA FOTOCAMERA: la posteriore inquadra il QR sul telefono dell'ospite.
     BarcodeDetector dove c'e' (Chrome, Android), altrimenti jsQR dalla
     copia locale (Safari su iPad). Lo schermo resta acceso finche' e'
     aperta; lo stesso codice letto due volte di seguito si segna una volta. */
  let flusso = null, blocco = null, fermo = true;
  const chiudiCam = async () => {
    fermo = true;
    if (flusso) { flusso.getTracks().forEach((t) => t.stop()); flusso = null; }
    if (blocco) { try { await blocco.release(); } catch (e) { /* gia' rilasciato */ } blocco = null; }
    $('video').hidden = true; $('video').srcObject = null;
    $('cam').textContent = 'Scansiona con la fotocamera';
  };
  const apriCam = async () => {
    if (!fermo) { chiudiCam(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mostra('no', 'Questo browser non dà accesso alla fotocamera.'); return; }
    const video = $('video');
    try {
      flusso = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (e) { mostra('no', `Fotocamera non disponibile: ${esc(e.message)}`); return; }
    video.srcObject = flusso; video.hidden = false; await video.play();
    fermo = false;
    $('cam').textContent = 'Ferma la fotocamera';
    try { if (navigator.wakeLock) blocco = await navigator.wakeLock.request('screen'); } catch (e) { /* lo schermo si spegne come sempre */ }
    let leggi;
    if ('BarcodeDetector' in window) {
      const rilevatore = new window.BarcodeDetector({ formats: ['qr_code'] });
      leggi = async () => { const r = await rilevatore.detect(video); return r.length ? String(r[0].rawValue || '') : ''; };
    } else {
      if (!window.jsQR) {
        await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = '/comune/jsqr.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
      }
      const tela = document.createElement('canvas');
      const ctx = tela.getContext('2d', { willReadFrequently: true });
      leggi = async () => {
        if (!video.videoWidth) return '';
        tela.width = video.videoWidth; tela.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, tela.width, tela.height);
        const r = window.jsQR(img.data, img.width, img.height);
        return r ? String(r.data || '') : '';
      };
    }
    let ultimo = '', ultimoQuando = 0;
    const giro = async () => {
      if (fermo) return;
      try {
        const testo = (await leggi()).trim().toUpperCase();
        if (testo && (testo !== ultimo || Date.now() - ultimoQuando > 4000)) {
          ultimo = testo; ultimoQuando = Date.now();
          leggiTesto(testo);
        }
      } catch (e) { /* un fotogramma perso non e' un errore */ }
      setTimeout(giro, 250);
    };
    giro();
  };
  $('cam').onclick = apriCam;
  /* lo schermo resta acceso anche senza fotocamera, finche' la pagina e' aperta */
  (async () => { try { if (navigator.wakeLock && !blocco) blocco = await navigator.wakeLock.request('screen'); } catch (e) { /* niente */ } })();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && navigator.wakeLock && !blocco) { try { blocco = await navigator.wakeLock.request('screen'); } catch (e) { /* niente */ } }
  });
  /* il fuoco al campo: il lettore a tastiera scrive qui senza toccare niente */
  $('codice').focus();
}

$('esci').onclick = () => esci(true);

(async () => {
  if (TOTEM) {
    totem();
    return;
  }
  try {
    const lib = await import(LIBRERIA_ACCESSO);
    SB = lib.createClient(SUPABASE_URL, SUPABASE_ANON);
  } catch (e) { $('app').innerHTML = '<div class="riquadro">Non riesco a caricare il sistema di accesso. Ricarichi la pagina.</div>'; return; }
  const { data } = await SB.auth.getSession();
  if (data && data.session) {
    TOKEN = data.session.access_token;
    OPERATORE = (data.session.user.user_metadata || {}).nome || data.session.user.email.split('@')[0];
    sportello();
    return;
  }
  chiediAccesso('');
})();
</script>
