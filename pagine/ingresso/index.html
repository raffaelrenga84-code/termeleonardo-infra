<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#1A3626" />
<meta name="robots" content="noindex, nofollow" />
<title>Ingresso Day Spa — Hotel Terme Leonardo</title>
<!-- si installa sul tablet dello sportello come un'app a tutto schermo -->
<link rel="manifest" href="/ingresso/manifest.webmanifest" />
<link rel="icon" href="/buoni/img/logo-quadrato.svg" type="image/svg+xml" />
<style>
/* LO SPORTELLO DEL DAY SPA. Una pagina per il tablet della reception, con
   tre cose e basta: il lettore (a tastiera o fotocamera), l'esito grande,
   gli arrivi del giorno. Niente schede, niente link fuori. Il cancello e'
   il server: qui si mostra e si segna, con l'accesso dell'hotel. */
:root{--verde:#1A3626;--verde-medio:#3C5346;--acqua:#8FC4BC;--acqua-chiara:#E4F0EA;--oro:#C9A961;--bronzo:#8A6A38;
  --crema:#F9F6F0;--grigio:#7B756A;--allarme:#C0392B;--pietra:#EDE7DC;}
*{box-sizing:border-box;}
body{margin:0;background:var(--crema);color:#2A2E2B;font:17px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
header{background:var(--verde);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
header img{height:30px;width:auto;filter:brightness(0) invert(1);}
header .chi{font-size:14px;opacity:.85;}
header button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px;}
.riquadro{background:#fff;border:1px solid var(--pietra);border-radius:14px;padding:16px;margin-bottom:14px;}
label{display:block;font-size:14px;color:var(--verde-medio);font-weight:600;margin-top:10px;}
input{width:100%;margin-top:6px;padding:14px;font:inherit;border:1px solid #DCD6CB;border-radius:10px;background:#FCFBF8;}
input:focus{outline:3px solid var(--acqua);border-color:transparent;}
#codice{font-family:ui-monospace,Menlo,monospace;font-size:24px;text-transform:uppercase;letter-spacing:2px;}
.bottone{width:100%;margin-top:12px;padding:16px;border:0;border-radius:12px;background:var(--verde);color:#fff;font:600 18px inherit;cursor:pointer;}
.bottone.sec{background:#fff;color:var(--verde);border:2px solid var(--verde);}
.bottone:disabled{opacity:.5;}
video{display:block;width:100%;max-height:46vh;object-fit:cover;border-radius:12px;margin-top:10px;background:#000;}
/* l'esito: grande, verde o rosso, si legge da un metro */
.esitoGrande{font-size:26px;line-height:1.25;padding:18px;border-radius:14px;margin:12px 0;}
.esitoGrande.ok{background:#E6F0EC;color:var(--verde);}
.esitoGrande.no{background:#FBE9E7;color:#8C2F28;}
.esitoGrande small{display:block;font-size:15px;margin-top:6px;opacity:.85;}
.esitoGrande.attesa{background:var(--pietra);color:var(--grigio);font-size:18px;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:24px;color:var(--verde);margin:0 0 6px;}
.mini{font-size:13px;color:var(--grigio);}
.errore{color:var(--allarme);}
.fasciaTit{font-weight:600;color:var(--verde);margin:12px 0 6px;font-size:15px;}
.riga{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #F0EBE1;}
.riga .nome{font-weight:600;}
.riga .dett{font-size:13px;color:var(--grigio);}
.riga .presenti{display:flex;align-items:center;gap:6px;}
.riga .presenti input{width:64px;margin:0;padding:10px;text-align:center;font-size:18px;}
.riga .presenti button{padding:10px 12px;border-radius:10px;border:1px solid var(--verde);background:#fff;color:var(--verde);font:inherit;font-size:14px;cursor:pointer;}
.riga.pieno .nome::after{content:" \2713";color:var(--verde);}
.avviso{padding:10px 13px;border-radius:8px;background:#FFF6E8;border-left:3px solid var(--oro);color:#6B4A22;font-size:14px;margin-bottom:10px;}
/* il totem: una schermata sola, grande, che si legge in piedi */
body.totem main{max-width:820px;padding-top:40px;}
.totemRiposo{text-align:center;padding:48px 24px;min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.totemRiposo.ok{background:#E6F0EC;border-color:var(--verde);}
.totemRiposo.no{background:#FBE9E7;border-color:#8C2F28;}
.totemTitolo{font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;line-height:1.15;color:var(--verde);}
.totemRiposo.no .totemTitolo{color:#8C2F28;}
.totemTesto{font-size:22px;color:var(--verde-medio);margin:0;}
.totemCampo{position:absolute;opacity:0;width:1px;height:1px;}
.totemLingue{font-size:17px;line-height:1.45;color:var(--verde-medio);margin:0;}
.totemFig{width:min(64vw,330px);height:auto;margin:6px auto;display:block;}
.totemFig .tel{animation:avvicina 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes avvicina{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@media (prefers-reduced-motion: reduce){.totemFig .tel{animation:none;}}
/* il conto camera al totem */
.totemRiposo.conto{text-align:left;min-height:0;gap:14px;}
.conto .totemTitolo{text-align:center;}
.contoRighe{max-height:46vh;overflow:auto;border:1px solid #E3DED4;border-radius:8px;background:#fff;}
.contoTab{width:100%;border-collapse:collapse;font-size:17px;}
.contoTab th,.contoTab td{padding:8px 10px;border-bottom:1px solid #EEE9DF;text-align:left;vertical-align:top;}
.contoTab th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--verde-medio);position:sticky;top:0;background:#fff;}
.contoTab .imp{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.contoTotali{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap;font-size:18px;color:var(--verde-medio);}
.contoTotali .grande{font-size:24px;color:var(--verde);}
.contoApp ul{margin:4px 0 0;padding-left:18px;font-size:16px;}
.contoChiudi{font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--verde);background:#fff;color:var(--verde);cursor:pointer;}
.contoChiudi.grande{font-size:24px;font-weight:600;padding:16px 44px;background:var(--verde);color:#fff;border-color:var(--verde);}
.contoPie{text-align:center;margin-top:6px;}
</style>
</head>
<body>
<header>
  <img src="/buoni/img/logo.svg" alt="Hotel Terme Leonardo" />
  <span class="chi" id="chiSono">Ingresso Day Spa</span>
  <button type="button" id="esci" hidden>esci</button>
</header>
<main id="app"></main>

<script type="module">
'use strict';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { codiceLetto, etichetteConto, messaggioBuono, tipoCodice } from '/ingresso/lettura.js';

const SUPABASE_URL = 'https://mvuiuwakuseockotlcnp.supabase.co';
/* chiave pubblica ("anon"): serve solo per l'accesso e non da' accesso ai
   dati, che restano protetti dalla funzione */
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12dWl1d2FrdXNlb2Nrb3RsY25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzUwMzYsImV4cCI6MjA5OTk1MTAzNn0.CtYh0IMhsfvvL19i_v6ZiQXaBOxF27yKlKz9m36kaHk';
const FUNZIONE = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/dayspa';
/* la verifica pubblica dei buoni regalo, per il totem */
const FUNZIONE_BUONI = 'https://mvuiuwakuseockotlcnp.supabase.co/functions/v1/buoni';
const FASCE = { giornaliero: 'Giornaliero 9:00–18:30', serale: 'Serale 18:00–22:30' };
const OGNI_QUANTO = 20000; // l'elenco si rilegge da solo: due tablet vedono la stessa cosa

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const oggiISO = () => {
  const d = new Date(); const due = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
};
const dataIT = (iso) => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) : '';

let SB = null, TOKEN = '', OPERATORE = '';
/* MODALITA' TOTEM (?totem=<chiave del dispositivo>): la convalida fai da te
   in hall, come il totem di Fidra per il conto camera. Nessun accesso:
   la chiave apre nel server una cosa sola, segnare i presenti del QR
   letto, solo per oggi. Il totem e' pubblico: mai l'elenco del giorno. */
/* Due modi per essere il totem: ?totem=<chiave>, oppure l'indirizzo
   /ingresso-totem, che Vercel serve solo dall'IP fisso dell'hotel: allora
   la chiave non serve, la funzione riconosce l'IP (TOTEM_IP). */
const TOTEM = new URLSearchParams(location.search).get('totem') || (location.pathname.includes('ingresso-totem') ? 'ip' : '');

async function chiama(qs, opz = {}) {
  const testa = TOTEM ? { 'x-totem-key': TOTEM } : { authorization: 'Bearer ' + TOKEN };
  const r = await fetch(FUNZIONE + qs, { ...opz, headers: { 'content-type': 'application/json', ...testa, ...(opz.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { await esci(false); throw new Error(j.errore || 'sessione scaduta'); }
  if (!r.ok) throw new Error(j.errore || ('errore ' + r.status));
  return j;
}

async function esci(chiedi = true) {
  /* uscire e' l'unico gesto che porta via dallo sportello: si chiede */
  if (chiedi && !confirm('Uscire dallo sportello? Per rientrare servono email e password.')) return;
  try { if (SB) await SB.auth.signOut(); } catch (e) { /* gia' fuori */ }
  TOKEN = ''; OPERATORE = '';
  chiediAccesso('');
}

/* ---------- accesso, lo stesso del back office ---------- */
function chiediAccesso(messaggio) {
  $('chiSono').textContent = 'Ingresso Day Spa';
  $('esci').hidden = true;
  $('app').innerHTML = `<div class="riquadro" style="max-width:420px;margin:30px auto;">
    <h2>Accesso reception</h2>
    <label>Email dell'hotel</label><input type="email" id="kMail" placeholder="reception@termeleonardo.com" autocomplete="username" />
    <label>Password</label><input type="password" id="kPwd" autocomplete="current-password" />
    <button class="bottone" id="kEntra">Entra</button>
    <div class="mini" id="kEsito" style="padding-top:10px;">${messaggio ? `<span class="errore">${esc(messaggio)}</span>` : ''}</div></div>`;
  const entra = async () => {
    const email = $('kMail').value.trim(), pwd = $('kPwd').value;
    if (!email || !pwd) { $('kEsito').innerHTML = '<span class="errore">Servono email e password.</span>'; return; }
    $('kEntra').disabled = true;
    try {
      const { data, error } = await SB.auth.signInWithPassword({ email, password: pwd });
      if (error) throw new Error('Email o password non validi.');
      TOKEN = data.session.access_token;
      OPERATORE = data.user.user_metadata?.nome || email.split('@')[0];
      sportello();
    } catch (e) {
      $('kEsito').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
      $('kEntra').disabled = false;
    }
  };
  $('kEntra').onclick = entra;
  $('kPwd').onkeydown = (ev) => { if (ev.key === 'Enter') entra(); };
}

/* ---------- il totem in hall ---------- */
/* Il totem e' in hall, davanti a ospiti di ogni lingua che, si sa, non
   leggono: per questo la schermata di riposo e' soprattutto un disegno
   (il telefono col QR davanti al lettore) e le parole ci sono in
   italiano grande e in inglese, tedesco e francese sotto. Legge due
   cose: il biglietto del Day Spa (segna i presenti) e il buono regalo
   (dice solo se vale: si riscuote alla reception). */
const FIGURA_QR = `<svg class="totemFig" viewBox="0 0 330 230" aria-hidden="true">
  <polygon points="238,110 170,62 170,168 238,130" fill="#C9A961" opacity=".35"/>
  <g class="carta">
    <rect x="6" y="150" width="96" height="62" rx="8" fill="#fff" stroke="#1F3A2E" stroke-width="5"/>
    <g fill="#1F3A2E">
      <rect x="18" y="164" width="3" height="30"/><rect x="24" y="164" width="2" height="30"/><rect x="29" y="164" width="4" height="30"/>
      <rect x="36" y="164" width="2" height="30"/><rect x="41" y="164" width="3" height="30"/><rect x="47" y="164" width="5" height="30"/>
      <rect x="55" y="164" width="2" height="30"/><rect x="60" y="164" width="3" height="30"/><rect x="66" y="164" width="2" height="30"/>
      <rect x="71" y="164" width="4" height="30"/><rect x="78" y="164" width="2" height="30"/><rect x="83" y="164" width="3" height="30"/>
    </g>
  </g>
  <g class="tel">
    <rect x="42" y="18" width="116" height="196" rx="18" fill="#fff" stroke="#1F3A2E" stroke-width="6"/>
    <rect x="86" y="30" width="28" height="5" rx="2.5" fill="#1F3A2E"/>
    <g fill="#1F3A2E">
      <rect x="62" y="58" width="24" height="24"/><rect x="68" y="64" width="12" height="12" fill="#fff"/>
      <rect x="114" y="58" width="24" height="24"/><rect x="120" y="64" width="12" height="12" fill="#fff"/>
      <rect x="62" y="110" width="24" height="24"/><rect x="68" y="116" width="12" height="12" fill="#fff"/>
      <rect x="92" y="58" width="6" height="6"/><rect x="104" y="64" width="6" height="6"/><rect x="92" y="70" width="6" height="6"/>
      <rect x="62" y="88" width="6" height="6"/><rect x="74" y="94" width="6" height="6"/><rect x="86" y="88" width="6" height="6"/>
      <rect x="98" y="94" width="6" height="6"/><rect x="110" y="88" width="6" height="6"/><rect x="122" y="94" width="6" height="6"/>
      <rect x="134" y="88" width="6" height="6"/><rect x="92" y="106" width="6" height="6"/><rect x="104" y="112" width="6" height="6"/>
      <rect x="116" y="106" width="12" height="6"/><rect x="132" y="112" width="6" height="6"/><rect x="92" y="122" width="6" height="12"/>
      <rect x="104" y="128" width="12" height="6"/><rect x="122" y="122" width="6" height="6"/><rect x="134" y="128" width="6" height="6"/>
      <rect x="62" y="146" width="6" height="6"/><rect x="74" y="152" width="12" height="6"/><rect x="92" y="146" width="6" height="6"/>
      <rect x="104" y="152" width="6" height="6"/><rect x="116" y="146" width="6" height="6"/><rect x="128" y="152" width="12" height="6"/>
    </g>
    <rect x="90" y="188" width="20" height="20" rx="10" fill="none" stroke="#1F3A2E" stroke-width="4"/>
  </g>
  <path d="M168 116 H222" stroke="#1F3A2E" stroke-width="6" stroke-linecap="round"/>
  <polygon points="218,102 240,116 218,130" fill="#1F3A2E"/>
  <rect x="244" y="78" width="72" height="78" rx="12" fill="#1F3A2E"/>
  <rect x="256" y="96" width="48" height="42" rx="6" fill="#0E1F17"/>
  <circle cx="280" cy="117" r="11" fill="#C9A961"/><circle cx="280" cy="117" r="5" fill="#0E1F17"/>
</svg>`;
const escT = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function totem() {
  $('chiSono').textContent = 'Day Spa';
  $('esci').hidden = true;
  document.body.classList.add('totem');
  /* i tempi di chiusura: un tocco ovunque sullo schermo di esito o sul
     conto li azzera e torna al riposo, cosi' nessuno cerca la X */
  let timerRiposo = null, orologioConto = null;
  const riposo = () => {
    clearTimeout(timerRiposo); clearInterval(orologioConto);
    $('app').innerHTML = `<div class="riquadro totemRiposo">
      <div class="totemTitolo">Benvenuto</div>
      <div class="totemLingue">Welcome · Willkommen · Bienvenue</div>
      ${FIGURA_QR}
      <p class="totemTesto">Appoggi al lettore il QR del biglietto o del buono regalo, oppure la tessera della camera per vedere il conto.</p>
      <p class="totemLingue">Hold the QR code of your ticket or gift voucher up to the reader, or your room key card to see your bill.<br>
        Halten Sie den QR-Code Ihres Tickets oder Gutscheins vor den Leser, oder Ihre Zimmerkarte für Ihre Rechnung.<br>
        Présentez au lecteur le QR code de votre billet ou bon cadeau, ou votre carte de chambre pour voir votre note.</p>
      <p class="mini">Per ogni altra cosa c'è la reception, qui accanto. · For anything else, the reception desk is right here.</p>
      <input id="codiceTotem" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="none" data-lpignore="true" data-1p-ignore data-bwignore aria-label="codice" class="totemCampo" /></div>`;
    const campo = $('codiceTotem');
    campo.onkeydown = (ev) => {
      if (ev.key !== 'Enter') return;
      const letto = campo.value;
      campo.value = '';
      if (letto.trim()) convalida(letto);
    };
    campo.focus();
    /* qualunque tocco sullo schermo riporta il fuoco al campo: il lettore
       scrive li' e da nessun'altra parte */
    document.onclick = () => {
      const c = $('codiceTotem');
      if (c) { c.focus(); return; }
      riposo();
    };
  };
  const schermo = (classe, titolo, testo, lingue, sotto) => {
    $('app').innerHTML = `<div class="riquadro totemRiposo ${classe}">
      <div class="totemTitolo">${titolo}</div>
      ${testo ? `<p class="totemTesto">${testo}</p>` : ''}
      ${lingue ? `<p class="totemLingue">${lingue}</p>` : ''}
      ${sotto ? `<p class="mini">${sotto}</p>` : ''}</div>`;
  };
  /* il conto camera: lo chiede la nostra funzione a Fidra e qui arriva il
     riassunto; resta 60 secondi come sul totem di hldv, o finche' si tocca
     «Chiudi». Le parole sono nella lingua che Fidra conosce dell'ospite. */
  const mostraConto = (c) => {
    const e = etichetteConto(c.lingua);
    const righe = c.righe.map((r) => `<tr><td>${escT(r.quantita)}</td><td>${escT(r.descrizione)}</td><td class="imp">€ ${escT(r.totale)}</td></tr>`).join('');
    const app = c.appuntamenti.map((a) => `<li>${escT(a.quando)} · ${escT(a.tipo)}${a.operatore ? ' · ' + escT(a.operatore) : ''}${a.fatto ? ' ✓' : ''}</li>`).join('');
    $('app').innerHTML = `<div class="riquadro totemRiposo conto">
      <div class="totemTitolo">${escT(e.camera)} ${escT(c.camera)}</div>
      <div class="contoRighe"><table class="contoTab"><thead><tr><th>N.</th><th>${escT(e.descrizione)}</th><th class="imp">${escT(e.totale)}</th></tr></thead><tbody>${righe}</tbody></table></div>
      <div class="contoTotali"><span>${escT(e.lordo)} <b>€ ${escT(c.lordo)}</b></span><span>${escT(e.acconto)} <b>€ ${escT(c.acconto)}</b></span><span class="grande">${escT(e.daPagare)} <b>€ ${escT(c.daPagare)}</b></span></div>
      ${app ? `<div class="contoApp"><b>${escT(e.appuntamenti)}</b><ul>${app}</ul></div>` : ''}
      <div class="contoPie"><button type="button" id="contoChiudi" class="contoChiudi grande">${escT(e.chiudi)}</button>
        <p class="totemLingue">${escT(e.tocca)} · ${escT(e.chiude)} <span id="contoSecondi">60</span> s</p></div></div>`;
    let secondi = 60;
    orologioConto = setInterval(() => {
      secondi -= 1;
      const s = $('contoSecondi');
      if (!s) { clearInterval(orologioConto); return; }
      s.textContent = String(secondi);
      if (secondi <= 0) riposo();
    }, 1000);
    $('contoChiudi').onclick = riposo;
  };
  const ALLA_RECEPTION = 'Please ask at the reception desk, right here.<br>Bitte wenden Sie sich an die Rezeption, gleich nebenan.<br>Veuillez vous adresser à la réception, juste à côté.';
  const convalida = async (letto) => {
    const codice = codiceLetto(letto);
    const tipo = tipoCodice(codice);
    schermo('', 'Un momento…', '', 'One moment · Einen Moment · Un instant');
    let durata = 8000;
    try {
      if (tipo === 'dayspa') {
        const j = await chiama('?a=presenti', { method: 'POST', body: JSON.stringify({ codice }) });
        const p = j.prenotazione;
        schermo('ok', `✓ Benvenuti, ${escT(p.nome)}`,
          `${p.persone === 1 ? '1 persona' : `${p.persone} persone`} · buona giornata alle terme.`,
          'Welcome! Enjoy your day at the thermal pools.<br>Willkommen! Einen schönen Tag im Thermalbad.<br>Bienvenue ! Bonne journée aux thermes.',
          'Cuffia obbligatoria in piscina, in vendita alla reception · Swim cap required, on sale at the reception · Badekappe Pflicht, an der Rezeption erhältlich.');
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      } else if (tipo === 'buono') {
        /* la verifica dei buoni e' pubblica: niente chiave, niente token */
        const r = await fetch(`${FUNZIONE_BUONI}?a=verifica&codice=${encodeURIComponent(codice)}`);
        if (!r.ok && r.status !== 404) throw new Error('la verifica del buono non risponde');
        const m = messaggioBuono(await r.json());
        schermo(m.classe, `${m.classe === 'ok' ? '✓' : '✗'} ${escT(m.titolo)}`, escT(m.testo), m.tradotto.map(escT).join('<br>'), escT(m.sotto));
        if (m.classe !== 'ok') durata = 10000;
      } else if (tipo === 'tessera') {
        const j = await chiama(`?a=conto&codice=${encodeURIComponent(codice)}`);
        mostraConto(j.conto);
        return;
      } else {
        durata = 10000;
        schermo('no', '✗ Codice non riconosciuto', 'Non è un biglietto Day Spa né un buono regalo.',
          'This code is not a Day Spa ticket nor a gift voucher.<br>Dieser Code ist weder ein Day-Spa-Ticket noch ein Gutschein.<br>Ce code n’est ni un billet Day Spa ni un bon cadeau.',
          'Si rivolga alla reception, qui accanto.');
      }
    } catch (e) {
      durata = 10000;
      schermo('no', '✗ Non riesco a leggere questo codice', escT(e.message), ALLA_RECEPTION, 'Si rivolga alla reception, qui accanto.');
    }
    timerRiposo = setTimeout(riposo, durata);
  };
  (async () => { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) { /* niente */ } })();
  riposo();
}

/* ---------- lo sportello ---------- */
function sportello() {
  $('chiSono').textContent = `${OPERATORE} · ${dataIT(oggiISO())}`;
  $('esci').hidden = false;
  $('app').innerHTML = `
    <div class="riquadro">
      <label for="codice">Il QR dell'ospite, o il numero della prenotazione</label>
      <input id="codice" placeholder="inquadri o digiti" autocomplete="off" />
      <button type="button" class="bottone sec" id="cam">Scansiona con la fotocamera</button>
      <video id="video" hidden playsinline muted></video>
      <div id="esito"><div class="esitoGrande attesa">In attesa di un codice…</div></div>
    </div>
    <div class="riquadro">
      <h2>Arrivi di oggi</h2>
      <div class="mini" id="riassunto">Carico…</div>
      <div id="elenco"></div>
    </div>`;

  const mostra = (classe, testo, sotto) => {
    $('esito').innerHTML = `<div class="esitoGrande ${classe}">${testo}${sotto ? `<small>${sotto}</small>` : ''}</div>`;
  };

  /* segna i presenti; senza `presenti` il server mette tutte le persone,
     che e' il caso normale del QR mostrato allo sportello */
  const segna = async (corpo) => {
    mostra('attesa', 'Un momento…');
    try {
      const j = await chiama('?a=presenti', { method: 'POST', body: JSON.stringify(corpo) });
      const p = j.prenotazione;
      if (j.oggi) {
        mostra('ok', `✓ ${esc(p.nome)} · presenti ${p.presenti} su ${p.persone}`, `${esc(FASCE[p.fascia] || p.fascia)} · ${esc(p.numero)}`);
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      } else {
        mostra('no', `✗ ${esc(p.nome)}: la prenotazione è per ${esc(dataIT(p.giorno))}, non per oggi`, `presenti segnati ${p.presenti} su ${p.persone} · ${esc(p.numero)}`);
        if (navigator.vibrate) navigator.vibrate(300);
      }
      carica();
    } catch (e) {
      mostra('no', `✗ ${esc(e.message)}`);
      if (navigator.vibrate) navigator.vibrate(300);
    }
  };

  const leggiTesto = (v) => {
    const t = v.trim().toUpperCase();
    if (!t) return;
    segna(/^DS-\d{4}-\d+$/.test(t) ? { numero: t } : { codice: t });
  };

  /* il lettore a tastiera digita e preme Invio */
  $('codice').onkeydown = (ev) => {
    if (ev.key !== 'Enter') return;
    leggiTesto($('codice').value);
    $('codice').value = '';
  };

  /* l'elenco del giorno, per fascia, con i presenti modificabili a mano */
  const carica = async () => {
    try {
      const j = await chiama('?a=oggi&giorno=' + oggiISO());
      const pren = (j.prenotazioni || []).filter((p) => p.stato === 'pagata');
      const fasce = j.fasce || [];
      const attesi = pren.reduce((t, p) => t + p.persone, 0);
      const presenti = pren.reduce((t, p) => t + (p.presenti || 0), 0);
      $('riassunto').textContent = pren.length
        ? `${pren.length} prenotazioni · ${presenti} presenti su ${attesi} attesi`
        : 'Nessuna prenotazione per oggi.';
      $('elenco').innerHTML = Object.keys(FASCE).map((fascia) => {
        const righe = pren.filter((p) => p.fascia === fascia);
        if (!righe.length) return '';
        const f = fasce.find((x) => x.fascia === fascia);
        return `<div class="fasciaTit">${esc(FASCE[fascia])}${f ? ` · posti ${f.venduti}/${f.posti}` : ''}</div>` +
          righe.map((p) => `<div class="riga${p.presenti >= p.persone ? ' pieno' : ''}">
            <div><div class="nome">${esc(p.nome)}</div>
              <div class="dett">${p.persone} ${p.persone === 1 ? 'persona' : 'persone'} · ${esc(p.numero)}${p.prova ? ' · prova' : ''}${p.note ? ` · <span class="errore">${esc(p.note)}</span>` : ''}</div></div>
            <div class="presenti"><input type="number" min="0" max="${p.persone}" value="${p.presenti || 0}" data-numero="${esc(p.numero)}" aria-label="presenti" />
              <button type="button" data-segna="${esc(p.numero)}">Segna</button></div>
          </div>`).join('');
      }).join('');
      document.querySelectorAll('[data-segna]').forEach((b) => b.onclick = () => {
        const inp = document.querySelector(`input[data-numero="${b.dataset.segna}"]`);
        segna({ numero: b.dataset.segna, presenti: Number(inp.value) });
      });
    } catch (e) {
      $('riassunto').innerHTML = `<span class="errore">${esc(e.message)}</span>`;
    }
  };
  carica();
  const orologio = setInterval(() => { if (!document.body.contains($('elenco'))) { clearInterval(orologio); return; } carica(); }, OGNI_QUANTO);

  /* LA FOTOCAMERA: la posteriore inquadra il QR sul telefono dell'ospite.
     BarcodeDetector dove c'e' (Chrome, Android), altrimenti jsQR dalla
     copia locale (Safari su iPad). Lo schermo resta acceso finche' e'
     aperta; lo stesso codice letto due volte di seguito si segna una volta. */
  let flusso = null, blocco = null, fermo = true;
  const chiudiCam = async () => {
    fermo = true;
    if (flusso) { flusso.getTracks().forEach((t) => t.stop()); flusso = null; }
    if (blocco) { try { await blocco.release(); } catch (e) { /* gia' rilasciato */ } blocco = null; }
    $('video').hidden = true; $('video').srcObject = null;
    $('cam').textContent = 'Scansiona con la fotocamera';
  };
  const apriCam = async () => {
    if (!fermo) { chiudiCam(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mostra('no', 'Questo browser non dà accesso alla fotocamera.'); return; }
    const video = $('video');
    try {
      flusso = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (e) { mostra('no', `Fotocamera non disponibile: ${esc(e.message)}`); return; }
    video.srcObject = flusso; video.hidden = false; await video.play();
    fermo = false;
    $('cam').textContent = 'Ferma la fotocamera';
    try { if (navigator.wakeLock) blocco = await navigator.wakeLock.request('screen'); } catch (e) { /* lo schermo si spegne come sempre */ }
    let leggi;
    if ('BarcodeDetector' in window) {
      const rilevatore = new window.BarcodeDetector({ formats: ['qr_code'] });
      leggi = async () => { const r = await rilevatore.detect(video); return r.length ? String(r[0].rawValue || '') : ''; };
    } else {
      if (!window.jsQR) {
        await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = '/comune/jsqr.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
      }
      const tela = document.createElement('canvas');
      const ctx = tela.getContext('2d', { willReadFrequently: true });
      leggi = async () => {
        if (!video.videoWidth) return '';
        tela.width = video.videoWidth; tela.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, tela.width, tela.height);
        const r = window.jsQR(img.data, img.width, img.height);
        return r ? String(r.data || '') : '';
      };
    }
    let ultimo = '', ultimoQuando = 0;
    const giro = async () => {
      if (fermo) return;
      try {
        const testo = (await leggi()).trim().toUpperCase();
        if (testo && (testo !== ultimo || Date.now() - ultimoQuando > 4000)) {
          ultimo = testo; ultimoQuando = Date.now();
          leggiTesto(testo);
        }
      } catch (e) { /* un fotogramma perso non e' un errore */ }
      setTimeout(giro, 250);
    };
    giro();
  };
  $('cam').onclick = apriCam;
  /* lo schermo resta acceso anche senza fotocamera, finche' la pagina e' aperta */
  (async () => { try { if (navigator.wakeLock && !blocco) blocco = await navigator.wakeLock.request('screen'); } catch (e) { /* niente */ } })();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && navigator.wakeLock && !blocco) { try { blocco = await navigator.wakeLock.request('screen'); } catch (e) { /* niente */ } }
  });
  /* il fuoco al campo: il lettore a tastiera scrive qui senza toccare niente */
  $('codice').focus();
}

$('esci').onclick = () => esci(true);

(async () => {
  if (TOTEM) {
    /* installata come app dal totem, la pagina deve riaprirsi sul totem e a
       tutto schermo: manifest suo, senza barra di Chrome ne' X della scheda
       (gli ospiti la premevano per chiudere il conto, 4 settembre 2026) */
    const m = document.querySelector('link[rel="manifest"]');
    if (m) m.href = '/ingresso/totem.webmanifest';
    totem();
    return;
  }
  try { SB = createClient(SUPABASE_URL, SUPABASE_ANON); }
  catch (e) { $('app').innerHTML = '<div class="riquadro">Non riesco a caricare il sistema di accesso. Ricarichi la pagina.</div>'; return; }
  const { data } = await SB.auth.getSession();
  if (data?.session) {
    TOKEN = data.session.access_token;
    OPERATORE = data.session.user.user_metadata?.nome || data.session.user.email.split('@')[0];
    sportello();
    return;
  }
  chiediAccesso('');
})();
</script>
