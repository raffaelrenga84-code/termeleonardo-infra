<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Prepara il suo arrivo — Hotel Terme Leonardo</title>
<style>
  :root{
    --acqua:#1E7F88; --acqua-scura:#0F5C64; --acqua-chiara:#E3F0F1;
    --pietra:#EDE7DC; --carta:#FAF8F4; --inchiostro:#2A2E2B;
    --grigio:#7B756A; --arancio:#E8751A; --oliva:#7A8450; --allarme:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--carta);color:var(--inchiostro);
       font:16px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
  .fascia{height:6px;background:linear-gradient(90deg,var(--acqua-scura),var(--acqua) 45%,#6FB1B8);}
  header{background:#fff;border-bottom:1px solid var(--pietra);padding:26px 20px 22px;text-align:center;}
  header img{height:56px;}
  header .sotto{font-size:11px;letter-spacing:4px;color:var(--grigio);margin-top:8px;}
  main{max-width:640px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:27px;
     line-height:1.25;color:var(--inchiostro);margin:10px 0 6px;}
  .sotto-titolo{color:var(--grigio);font-size:15px;margin-bottom:22px;}
  .lingue{text-align:right;padding:10px 0 0;}
  .lingue button{border:1px solid var(--pietra);background:#fff;color:var(--grigio);
     font:12px Arial;padding:5px 9px;border-radius:4px;cursor:pointer;margin-left:4px;}
  .lingue button.attiva{background:var(--acqua);border-color:var(--acqua);color:#fff;}
  .scheda{background:#fff;border:1px solid var(--pietra);border-radius:8px;
     padding:20px;margin-bottom:16px;}
  .soggiorno{border-left:4px solid var(--acqua);}
  .soggiorno .nome{font-family:Georgia,serif;font-size:21px;color:var(--inchiostro);}
  .soggiorno .date{color:var(--acqua-scura);font-size:15px;margin-top:4px;}
  .soggiorno .dett{color:var(--grigio);font-size:14px;margin-top:2px;}
  h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acqua);
     font-weight:600;margin:0 0 14px;}
  label{display:block;font-size:13px;color:var(--grigio);margin:12px 0 5px;}
  input[type=text],input[type=tel],input[type=email],input[type=number],
  input[type=datetime-local],select,textarea{
     width:100%;padding:12px;border:1px solid #D8D2C4;border-radius:6px;
     font:16px Arial;color:var(--inchiostro);background:#fff;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--acqua);outline-offset:1px;}
  .due{display:flex;gap:12px;}
  .due>div{flex:1;}
  .interruttore{display:flex;align-items:center;gap:12px;cursor:pointer;
     font-size:16px;color:var(--inchiostro);margin:0;}
  .interruttore input{width:22px;height:22px;accent-color:var(--acqua);flex:none;}
  .ripiega{display:none;margin-top:6px;}
  .aperta .ripiega{display:block;}
  .spunte label{display:flex;align-items:center;gap:12px;font-size:16px;
     color:var(--inchiostro);margin:12px 0;cursor:pointer;}
  .spunte input{width:22px;height:22px;accent-color:var(--acqua);flex:none;}
  .persona{display:flex;gap:10px;margin-top:8px;}
  .persona input:first-child{flex:3;}
  .persona input:last-child{flex:1;}
  .aggiungi{background:none;border:none;color:var(--acqua);font:14px Arial;
     cursor:pointer;padding:10px 0 0;}
  .invia{display:block;width:100%;background:var(--arancio);color:#fff;border:none;
     border-radius:6px;padding:16px;font:600 17px Arial;cursor:pointer;margin-top:8px;}
  .invia:disabled{background:#CFCABF;}
  .nota-invio{text-align:center;color:var(--grigio);font-size:13px;margin-top:12px;}
  .esito-errore{background:#FDEDEC;border-left:4px solid var(--allarme);color:#922B21;
     padding:12px 14px;border-radius:0 6px 6px 0;margin-top:14px;font-size:15px;display:none;}
  .stato{max-width:520px;margin:60px auto;text-align:center;padding:0 20px;}
  .stato .segno{font-size:44px;color:var(--acqua);}
  .stato h1{margin-top:14px;}
  .stato p{color:var(--grigio);margin-top:10px;font-size:16px;}
  footer{text-align:center;color:var(--grigio);font-size:12px;letter-spacing:1px;
     padding:30px 20px 40px;border-top:1px solid var(--pietra);background:#fff;}
  footer .marchio{font-family:Georgia,serif;font-size:14px;letter-spacing:5px;
     color:var(--inchiostro);margin-bottom:6px;}
  @media (prefers-reduced-motion:no-preference){
    .scheda{animation:sale .35s ease both;}
    @keyframes sale{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  }
</style>
</head>

const MESI = {
 it:['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],
 de:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
 en:['January','February','March','April','May','June','July','August','September','October','November','December'],
 fr:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre']
};

let LINGUA = 'it', DATI = null, TOKEN = null;
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dataBella(iso, lingua){
  const d = new Date(iso + 'T00:00');
  const g = d.getDate(), m = MESI[lingua][d.getMonth()], a = d.getFullYear();
  if (lingua === 'en') return `${g} ${m} ${a}`;
  if (lingua === 'de') return `${g}. ${m} ${a}`;
  return `${g} ${m} ${a}`;
}

function stato(titolo, testo, segno){
  app.innerHTML = `<div class="stato"><div class="segno">${segno}</div>
    <h1>${esc(titolo)}</h1><p>${esc(testo)}</p></div>`;
}

function selettoreLingue(){
  return `<div class="lingue">${['it','de','en','fr'].map(l =>
    `<button type="button" data-l="${l}" class="${l===LINGUA?'attiva':''}">${l.toUpperCase()}</button>`).join('')}</div>`;
}

  <!-- CURE TERMALI. Compare SOLO a chi ha le cure: a chi viene per due

       Segreteria Cure dopo la visita medica, e qualunque cosa somigli a una
       prenotazione qui sarebbe una promessa che non possiamo mantenere. -->
  ${DATI.cure ? `<div class="scheda spunte" id="schedaFanghi">
    <h2>${t.fanghiT}</h2>
    <div class="sotto-titolo">${t.fanghiD}</div>
    ${t.fanghiOpz.map((o,i)=>`<label><input type="radio" name="fanghi" class="fanghi" data-i="${i}" /> ${o}</label>`).join('')}
    <div class="nota-invio" style="text-align:left;margin-top:8px;">${t.fanghiNota}</div>
  </div>` : ''}

  <div class="scheda">
    <h2>${t.noteT}</h2>
    <textarea id="note" rows="4" maxlength="1000" placeholder="${t.notePh}"></textarea>
  </div>

  <button class="invia" id="invia">${t.invia}</button>
  <div class="nota-invio">${t.inviaNota}</div>
  <div class="esito-errore" id="erroreInvio">${t.erroreInvio}</div>`;

  document.querySelectorAll('.lingue button').forEach(b =>
    b.addEventListener('click', () => { LINGUA = b.dataset.l; modulo(); }));
  ['schedaFatt','schedaTr'].forEach(id => {
    const s = document.getElementById(id);
    s.querySelector('input[type=checkbox]').addEventListener('change', e =>
      s.classList.toggle('aperta', e.target.checked));
  });
  const box = document.getElementById('persone');
  const t2 = T[LINGUA];
  function rigaPersona(){
    if (box.children.length >= 6) return;
    const d = document.createElement('div');
    d.className = 'persona';
    d.innerHTML = `<input type="text" placeholder="${t2.nome}" maxlength="80" />
                   <input type="text" placeholder="${t2.eta}" maxlength="10" />`;
    box.appendChild(d);
  }
  document.getElementById('piuPersona').addEventListener('click', rigaPersona);
  document.getElementById('invia').addEventListener('click', invia);
}

async function invia(){
  const t = T[LINGUA];
  const b = document.getElementById('invia');
  b.disabled = true; b.textContent = t.attendere;
  document.getElementById('erroreInvio').style.display = 'none';
  const v = id => document.getElementById(id)?.value?.trim() || null;
  const fatt = document.getElementById('fattura').checked;
  const tr = document.getElementById('transfer').checked;
  const corpo = {
    ora_arrivo: v('ora'), mezzo: v('mezzo'),
    persone_extra: [...document.querySelectorAll('.persona')].map(p => ({
      nome: p.children[0].value.trim(), eta: p.children[1].value.trim()
    })).filter(p => p.nome),
    fattura: fatt,
    fatt_ragione: fatt ? v('fRagione') : null,
    fatt_indirizzo: fatt ? v('fIndirizzo') : null,
    fatt_piva: fatt ? v('fPiva') : null,
    fatt_cf: fatt ? v('fCf') : null,
    fatt_sdi: fatt ? v('fSdi') : null,
    fatt_pec: fatt ? v('fPec') : null,
    transfer: tr,
    transfer_tipo: tr ? v('trTipo') : null,
    transfer_scalo: tr ? v('trScalo') : null,
    transfer_volo: tr ? v('trVolo') : null,
    transfer_quando: tr ? v('trQuando') : null,
    transfer_pax: tr ? (Number(v('trPax')) || null) : null,
    transfer_cell: tr ? v('trCell') : null,
    extra: [...document.querySelectorAll('.extra:checked')].map(c => T[LINGUA].extraOpz[+c.dataset.i]),
    /* i tre valori sono quelli che il server accetta (fanghi.ts, elenco
       chiuso): l'indice della scelta, non il testo tradotto */
    fanghi_desiderio: (()=>{
      const s = document.querySelector('.fanghi:checked');
      return s ? ['presto','tardi','indifferente'][+s.dataset.i] : null;
    })(),
    note: v('note')
  };
  try {
    const r = await fetch(`${FUNZIONE}?token=${encodeURIComponent(TOKEN)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo)
    });
    if (!r.ok) throw new Error('salvataggio');
    /* «abbiamo preso nota del suo desiderio», e nient'altro: nessun orario
       confermato, nessun turno. Compare solo a chi una preferenza l'ha
       davvero espressa. */
    const scelta = document.querySelector('.fanghi:checked');
    stato(t.grazieT, t.grazie + (scelta ? ' ' + t.fanghiPresoAtto : ''), '✓');
    window.scrollTo(0, 0);
  } catch (e) {
    document.getElementById('erroreInvio').style.display = 'block';
    b.disabled = false; b.textContent = t.invia;
  }
}

(async function avvia(){
  TOKEN = new URLSearchParams(location.search).get('t');
  if (!TOKEN) { stato(T.it.nonValidoT, T.it.nonValido, '·'); return; }
  try {
    const r = await fetch(`${FUNZIONE}?token=${encodeURIComponent(TOKEN)}`);
    if (r.status === 410) {
      const l = LINGUA; stato(T[l].scadutoT, T[l].scaduto, '·'); return;
    }
    if (!r.ok) { stato(T.it.nonValidoT, T.it.nonValido, '·'); return; }
    DATI = await r.json();
    LINGUA = ['it','de','en','fr'].includes(DATI.lingua) ? DATI.lingua : 'it';
    document.documentElement.lang = LINGUA;
    modulo();
  } catch (e) {
    stato(T.it.nonValidoT, T.it.nonValido, '·');
  }
})();
</script>
</body>
</html>
